<script>
// Haqi H5 protocol v1: independent pages remain usable without a parent.
(()=>{let context=null,written=false,finished=false,serial=0;const callbacks=new Map(),subCache=new Map(),uiCache=new Map(),pending=new Set(),uiNodes=new Map();
const isZh=loc=>!loc||/^zh\b/i.test(loc);
const send=data=>{if(context)parent.postMessage({channel:'haqi-hanzi',version:1,entryId:context.entryId,sessionId:context.sessionId,...data},context.origin);};
const refreshDom=()=>{for(const[el,zh]of uiNodes){if(!el?.isConnected){uiNodes.delete(el);continue;}const tr=!isZh(context?.locale)&&uiCache.get(zh);const next=(tr&&tr!==zh)?tr:zh;if(el.dataset.haqiKind==='seal'){const seal=el.querySelector('.seal');el.textContent=next;if(seal)el.prepend(seal);}else if(el.dataset.haqiKind==='tag'){const i1=document.createElement('i'),i2=document.createElement('i');el.replaceChildren(i1,document.createTextNode(next),i2);}else el.textContent=next;}document.querySelectorAll('[data-haqi-caption]').forEach(el=>renderCaption(el,el.dataset.haqiCaption));};
const flushPending=()=>{if(!context||!pending.size)return;const texts=[...pending];pending.clear();window.haqiHanziTranslate(texts);};
const ensureTexts=texts=>{const need=[];for(const t of texts){const s=typeof t==='string'?t.trim():'';if(s&&(!subCache.has(s)||!uiCache.has(s))&&!pending.has(s)){pending.add(s);need.push(s);}}if(need.length&&context)flushPending();};
const renderCaption=(el,zh)=>{if(!el)return;el.dataset.haqiCaption=zh||'';let sub=el.querySelector('.haqi-sub-trans');if(!zh||isZh(context?.subtitleLocale||context?.locale)){sub?.remove();return;}const tr=subCache.get(zh);if(!tr||tr===zh){sub?.remove();ensureTexts([zh]);return;}if(!sub){sub=document.createElement('span');sub.className='haqi-sub-trans';const host=el.querySelector('#capText')||el;if(host!==el&&host.parentNode===el)host.insertAdjacentElement('afterend',sub);else el.appendChild(sub);}sub.textContent=tr;};
const trackUi=(el,zh,kind='')=>{if(!el||!zh)return;if(kind)el.dataset.haqiKind=kind;uiNodes.set(el,zh);ensureTexts([zh]);};
const scanStatic=()=>{if(!document.body)return;document.querySelectorAll('#start,#replay,#mute,#demo,#action,#progress li,#note,.introBottom .mean,.introBottom .sub,.introBottom .meta').forEach(el=>{const zh=(el.textContent||'').trim();if(zh&&!uiNodes.has(el))trackUi(el,zh);});document.querySelectorAll('#brand,.brand').forEach(el=>{if(uiNodes.has(el))return;const clone=el.cloneNode(true);clone.querySelector?.('.seal')?.remove();const zh=(clone.textContent||'').trim();if(zh)trackUi(el,zh,'seal');});document.querySelectorAll('.introTop .tag,.tag').forEach(el=>{if(uiNodes.has(el))return;const zh=(el.textContent||'').trim();if(zh)trackUi(el,zh,'tag');});refreshDom();};
if(document.readyState==='loading')addEventListener('DOMContentLoaded',scanStatic,{once:true});else scanStatic();
window.haqiHanziWritten=()=>{written=true;send({type:'written'});};
window.haqiHanziComplete=()=>{if(!written){written=true;send({type:'written'});}finished=true;send({type:'completed'});};
window.haqiHanziPrefetch=texts=>ensureTexts(Array.isArray(texts)?texts:[texts]);
window.haqiHanziUi=(zh,el)=>{const s=typeof zh==='string'?zh.trim():'';if(!s)return zh;if(el)trackUi(el,s);else ensureTexts([s]);const tr=!isZh(context?.locale)&&uiCache.get(s);return(tr&&tr!==s)?tr:zh;};
window.haqiHanziCaption=(el,zh)=>{const s=typeof zh==='string'?zh.trim():'';if(s)ensureTexts([s]);renderCaption(el,s);};
window.haqiHanziTranslate=texts=>new Promise(resolve=>{const list=(Array.isArray(texts)?texts:[]).map(t=>typeof t==='string'?t.trim():'').filter(Boolean);if(!context||!list.length){resolve({});return;}const requestId=String(++serial);const timer=setTimeout(()=>{callbacks.delete(requestId);resolve({});},1500);callbacks.set(requestId,msg=>{clearTimeout(timer);const sub=msg?.translations||{},ui=msg?.uiTranslations||sub;for(const[k,v]of Object.entries(sub))if(typeof v==='string'&&v.trim())subCache.set(k,v.trim());for(const[k,v]of Object.entries(ui))if(typeof v==='string'&&v.trim())uiCache.set(k,v.trim());refreshDom();resolve(sub);});send({type:'translate',requestId,texts:list});});
addEventListener('message',event=>{const m=event.data;if(event.source!==parent||parent===window||m?.channel!=='haqi-hanzi'||m.version!==1)return;
if(m.type==='init'&&typeof m.sessionId==='string'&&typeof m.entryId==='string'){if(document.referrer&&event.origin!==new URL(document.referrer).origin)return;context={...m,origin:event.origin};scanStatic();flushPending();refreshDom();if(written)send({type:'written'});if(finished)send({type:'completed'});}
else if(context&&event.origin===context.origin&&m.sessionId===context.sessionId&&m.type==='translations'){callbacks.get(m.requestId)?.(m);callbacks.delete(m.requestId);}});
if(parent!==window)parent.postMessage({channel:'haqi-hanzi',version:1,type:'ready'},'*');})();
</script>

<script>

const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));

/* ---------- 虚拟时钟 ---------- */
class Cancelled extends Error {}

async function tween(ms, fn, tk, ez = ease.inOut) {

  if (ms <= 0) { fn(1); return; }
  const t0 = clock;
  for (;;) {
    await frame(tk);
    const t = clamp((clock - t0) / ms);

const bg = p => p.catch(e => { if (!(e instanceof Cancelled)) console.error(e); });

/* ---------- 声音：WebAudio 古琴、洞箫、玉磬与山涧清泉 ---------- */
const NOTE = { D3: 146.83, G3: 196, A3: 220, D4: 293.66, E4: 329.63, G4: 392, A4: 440, B4: 493.88, D5: 587.33, E5: 659.26, G5: 783.99, A5: 880 };
const PENTA = [NOTE.D4, NOTE.E4, NOTE.G4, NOTE.A4, NOTE.B4, NOTE.D5, NOTE.E5, NOTE.G5, NOTE.A5];
const Sound = {
  ctx: null, master: null, wet: null, noise: null, muted: false, padOn: false, padF: null, streamG: null,
  init() {

    const len = c.sampleRate * 2;
    const buf = c.createBuffer(1, len, c.sampleRate);
    const data = buf.getChannelData(0);
    const r = mulberry32(31);
    for (let i = 0; i < len; i++) data[i] = r() * 2 - 1;
    this.noise = buf;
  },
  setMuted(m) {
    this.muted = m;
    if (this.master && this.ctx) this.master.gain.setTargetAtTime(m ? 0 : 0.62, this.ctx.currentTime, 0.05);
  },
  out(node, wet = true) { if (!this.master) return; node.connect(this.master); if (wet && this.wet) node.connect(this.wet); },
  pluck(f, vol = 0.14, dur = 2.8) {
    const c = this.ctx; if (!c) return;
    const t = c.currentTime;
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    const lp = c.createBiquadFilter(); lp.type = 'lowpass';
    lp.frequency.setValueAtTime(f * 5.5, t);
    lp.frequency.exponentialRampToValueAtTime(f * 1.3, t + dur * 0.55);
    lp.connect(g); this.out(g);
    for (const [m, type, a] of [[1, 'triangle', 1], [2.002, 'sine', 0.36], [3.005, 'sine', 0.1]]) {
      const o = c.createOscillator(); o.type = type;
      o.frequency.setValueAtTime(f * m * 1.012, t);
      o.frequency.exponentialRampToValueAtTime(f * m, t + 0.16);
      const og = c.createGain(); og.gain.value = a;
      o.connect(og); og.connect(lp); o.start(t); o.stop(t + dur + 0.05);
    }
  },
  xiao(f, vol = 0.075, dur = 2.4) {
    const c = this.ctx; if (!c) return;
    const t = c.currentTime;
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + dur * 0.28);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = f * 3.2;
    const o1 = c.createOscillator(); o1.type = 'sine'; o1.frequency.setValueAtTime(f * 0.992, t);
    o1.frequency.linearRampToValueAtTime(f, t + 0.22);
    const o2 = c.createOscillator(); o2.type = 'triangle'; o2.frequency.value = f * 2;
    const g2 = c.createGain(); g2.gain.value = 0.18;
    const vib = c.createOscillator(); vib.frequency.value = 4.6;
    const vg = c.createGain(); vg.gain.value = f * 0.007;
    vib.connect(vg); vg.connect(o1.frequency);
    o1.connect(lp); o2.connect(g2); g2.connect(lp); lp.connect(g);
    this.out(g, true);
    o1.start(t); o2.start(t); vib.start(t);
    o1.stop(t + dur + 0.05); o2.stop(t + dur + 0.05); vib.stop(t + dur + 0.05);
    this.hiss(dur * 0.7, f * 2.4, vol * 0.16, 2.2, true);
  },
  bell(f, vol = 0.085, dur = 3.2) {
    const c = this.ctx; if (!c) return;
    const t = c.currentTime;
    for (const [m, a, dd] of [[1, 1, 1], [2.756, 0.3, 0.52], [5.4, 0.09, 0.25], [0.5, 0.22, 1.2]]) {
      const o = c.createOscillator(); o.type = 'sine'; o.frequency.value = f * m;
      const g = c.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol * a, t + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur * dd);
      o.connect(g); this.out(g); o.start(t); o.stop(t + dur * dd + 0.05);
    }
  },
  hiss(dur, freq, vol, q = 0.85, wet = false) {
    const c = this.ctx; if (!c || !this.noise) return;
    const t = c.currentTime;
    const s = c.createBufferSource(); s.buffer = this.noise;
    const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = freq; bp.Q.value = q;
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + Math.min(0.09, dur * 0.3));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(bp); bp.connect(g); this.out(g, wet);
    s.start(t, rand() * 1.4); s.stop(t + dur + 0.05);
  },
  stream(k) {
    const c = this.ctx; if (!c || !this.noise) return;
    if (!this.streamG) {
      const s = c.createBufferSource(); s.buffer = this.noise; s.loop = true;
      const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 680; bp.Q.value = 0.7;
      this.streamG = c.createGain(); this.streamG.gain.value = 0;
      s.connect(bp); bp.connect(this.streamG); this.out(this.streamG, false); s.start();
    }
    this.streamG.gain.setTargetAtTime(0.045 * k, c.currentTime, 0.7);
  },
  pad() {
    const c = this.ctx; if (!c || this.padOn) return;
    this.padOn = true;
    const g = c.createGain(); g.gain.value = 0;
    g.gain.setTargetAtTime(0.038, c.currentTime, 2.4);
    this.padF = c.createBiquadFilter(); this.padF.type = 'lowpass'; this.padF.frequency.value = 380;
    const lfo = c.createOscillator(); lfo.frequency.value = 0.07;
    const lg = c.createGain(); lg.gain.value = 0.01;
    lfo.connect(lg); lg.connect(g.gain); lfo.start();
    for (const [f, type] of [[NOTE.D3 / 2, 'sine'], [NOTE.D3, 'triangle'], [NOTE.A3, 'sine'], [NOTE.G3 * 1.003, 'sine']]) {
      const o = c.createOscillator(); o.type = type; o.frequency.value = f;
      o.connect(this.padF); o.start();
    }
    this.padF.connect(g); g.connect(this.master);
  },
  warm(k) { if (this.padF && this.ctx) this.padF.frequency.setTargetAtTime(360 + 1100 * k, this.ctx.currentTime, 1.4); },
};

function densify(pts, step) {
  const out = [[pts[0][0], pts[0][1]]];
  for (let i = 1; i < pts.length; i++) {
    const a = pts[i - 1], b = pts[i];
    const n = Math.max(1, Math.ceil(Math.hypot(b[0] - a[0], b[1] - a[1]) / step));
    for (let k = 1; k <= n; k++) out.push([lerp(a[0], b[0], k / n), lerp(a[1], b[1], k / n)]);
  }
  return out;
}
function resamplePoly(pts, count = 64) {
  const d = [0];
  for (let i = 1; i < pts.length; i++) d.push(d[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
  const total = d[d.length - 1] || 1, out = [];
  let j = 0;
  for (let i = 0; i <= count; i++) {
    const target = total * i / count;
    while (j < d.length - 2 && d[j + 1] < target) j++;
    const seg = (d[j + 1] - d[j]) || 1, f = clamp((target - d[j]) / seg);
    out.push([lerp(pts[j][0], pts[j + 1][0], f), lerp(pts[j][1], pts[j + 1][1], f)]);
  }
  return out;
}
function bezierChain(segs) {
  const pts = [];
  for (const s of segs) {
    for (let i = 0; i <= 20; i++) {
      const t = i / 20, u = 1 - t;
      if (s.length === 4) {
        pts.push([
          u * u * u * s[0][0] + 3 * u * u * t * s[1][0] + 3 * u * t * t * s[2][0] + t * t * t * s[3][0],
          u * u * u * s[0][1] + 3 * u * u * t * s[1][1] + 3 * u * t * t * s[2][1] + t * t * t * s[3][1],
        ]);
      } else {
        pts.push([lerp(s[0][0], s[1][0], t), lerp(s[0][1], s[1][1], t)]);
      }
    }
  }
  return resamplePoly(pts, 64);
}

  let mid = mixCol('#7da3a8', '#6899a8', cool);
  let bot = mixCol('#ecd9b2', '#dce4d5', cool);

    bot = mixCol(bot, '#f4cf92', sunset * 0.9);

function drawSunAndRays() {
  setCam(ctx, 1);
  const cover = W.cloud.alpha * (1 - clamp(Math.abs(W.cloud.x - SUN.x) / 260));
  const pulse = reduceMotion ? 0.5 : 0.5 + 0.5 * Math.sin(clock * 0.0022);
  const glowR = SUN.r * (3.6 - cover * 1.1 + pulse * 0.25);

  // 太阳外晕
  const g = ctx.createRadialGradient(SUN.x, SUN.y, SUN.r * 0.2, SUN.x, SUN.y, glowR);
  g.addColorStop(0, `rgba(255,248,220,${(0.95 - cover * 0.35).toFixed(3)})`);
  g.addColorStop(0.32, `rgba(246,198,104,${(0.55 - cover * 0.22).toFixed(3)})`);

  if (cover > 0.08) {
    ctx.save();

    const rays = 9;
    for (let i = 0; i < rays; i++) {
      const baseA = 0.28 + (i / (rays - 1)) * (Math.PI - 0.56);
      const sway = reduceMotion ? 0 : Math.sin(clock * 0.0009 + i * 1.3) * 0.025;
      const a = baseA + sway;
      const len = 540 + (i % 3) * 110;
      const w0 = 14, w1 = 68 + (i % 2) * 24;
      const x0 = SUN.x + Math.cos(a) * 42, y0 = SUN.y + Math.sin(a) * 42;
      const x1 = SUN.x + Math.cos(a) * len, y1 = SUN.y + Math.sin(a) * len;
      const nx = -Math.sin(a), ny = Math.cos(a);
      const rg = ctx.createLinearGradient(x0, y0, x1, y1);
      rg.addColorStop(0, `rgba(255,238,184,${(0.28 * cover).toFixed(3)})`);
      rg.addColorStop(0.55, `rgba(244,214,138,${(0.11 * cover).toFixed(3)})`);
      rg.addColorStop(1, 'rgba(244,214,138,0)');
      ctx.fillStyle = rg;
      ctx.beginPath();
      ctx.moveTo(x0 - nx * w0, y0 - ny * w0);
      ctx.lineTo(x0 + nx * w0, y0 + ny * w0);
      ctx.lineTo(x1 + nx * w1, y1 + ny * w1);
      ctx.lineTo(x1 - nx * w1, y1 - ny * w1);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }

  // 赤金日轮
  const dg = ctx.createRadialGradient(SUN.x - 14, SUN.y - 14, 4, SUN.x, SUN.y, SUN.r);
  dg.addColorStop(0, '#fffdf2');
  dg.addColorStop(0.58, '#f8d278');
  dg.addColorStop(1, '#de8b42');
  ctx.fillStyle = dg;
  ctx.beginPath(); ctx.arc(SUN.x, SUN.y, SUN.r, 0, TAU); ctx.fill();
}

/* ---------- 绘制：北宋青绿金碧群山、三叠飞瀑、听云亭、山花与小芸 ---------- */
function traceSmoothRidge(pts, base) {
  ctx.beginPath();
  ctx.moveTo(pts[0][0], base);
  ctx.lineTo(pts[0][0], pts[0][1]);
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i], b = pts[i + 1];
    const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
    ctx.quadraticCurveTo(a[0], a[1], mx, my);
  }
  const last = pts[pts.length - 1];
  ctx.lineTo(last[0], last[1]);
  ctx.lineTo(last[0], base);
  ctx.closePath();
}

function drawPeaks() {
  const cool = 1 - W.heat;
  PEAKS.forEach((L, idx) => {
    setCam(ctx, L.px);
    let minY = 9999;
    for (const p of L.pts) if (p[1] < minY) minY = p[1];
    const g = ctx.createLinearGradient(0, minY, 0, L.base);
    g.addColorStop(0, mixCol(L.crest, '#163b56', cool * 0.5));
    g.addColorStop(0.46, mixCol(L.body, '#2b6b5c', cool * 0.45));
    g.addColorStop(0.86, L.foot);
    g.addColorStop(1, 'rgba(218,205,176,0.92)');
    traceSmoothRidge(L.pts, L.base);
    ctx.fillStyle = g;
    ctx.fill();

    // 皴法折带纹理与石青暗面
    ctx.save();
    ctx.clip();
    for (let i = 1; i < L.pts.length - 1; i++) {
      const p = L.pts[i], prev = L.pts[i - 1], next = L.pts[i + 1];
      if (p[1] < prev[1] && p[1] < next[1]) {
        const sg = ctx.createLinearGradient(p[0] - 90, p[1], p[0] + 130, p[1] + 220);
        sg.addColorStop(0, 'rgba(24,58,82,0.38)');
        sg.addColorStop(1, 'rgba(24,58,82,0)');
        ctx.fillStyle = sg;
        ctx.beginPath();
        ctx.moveTo(p[0], p[1]);
        ctx.lineTo(p[0] + 155, p[1] + 230);
        ctx.lineTo(p[0] - 18, p[1] + 230);
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = 'rgba(26,46,52,0.24)';
        ctx.lineWidth = 1.6;
        for (let k = 1; k <= 3; k++) {
          ctx.beginPath();
          ctx.moveTo(p[0] - k * 12, p[1] + k * 24);
          ctx.quadraticCurveTo(p[0] - k * 28, p[1] + k * 62, p[0] - k * 8, p[1] + k * 105);
          ctx.stroke();
        }
      }
    }
    // 行云清凉投影掠过山峦
    if (W.cloud.alpha > 0.1) {
      const sx = (W.cloud.x + 110) * L.px + CV.x * (1 - L.px);
      const cg = ctx.createRadialGradient(sx, minY + 180, 30, sx, minY + 180, 420);
      cg.addColorStop(0, `rgba(22,64,82,${(0.24 * W.cloud.alpha).toFixed(3)})`);
      cg.addColorStop(1, 'rgba(22,64,82,0)');
      ctx.fillStyle = cg;
      ctx.fillRect(0, minY, 3000, L.base - minY);
    }
    ctx.restore();

    // 泥金勾山脊（随日照微微流金）
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(L.pts[0][0], L.pts[0][1]);
    for (let i = 0; i < L.pts.length - 1; i++) {
      const a = L.pts[i], b = L.pts[i + 1];
      ctx.quadraticCurveTo(a[0], a[1], (a[0] + b[0]) / 2, (a[1] + b[1]) / 2);
    }
    const sunGlint = L.gold * (0.45 + 0.45 * W.heat);
    ctx.strokeStyle = `rgba(232,194,112,${sunGlint.toFixed(3)})`;
    ctx.lineWidth = 1.8 + idx * 0.4;
    ctx.stroke();
    ctx.restore();

    // 山腰浮岚薄霭
    const mg = ctx.createLinearGradient(0, L.base - 125, 0, L.base + 15);
    mg.addColorStop(0, 'rgba(242,238,225,0)');
    mg.addColorStop(0.65, `rgba(242,238,225,${(0.32 + idx * 0.08 + W.wordSea * 0.35).toFixed(3)})`);
    mg.addColorStop(1, 'rgba(242,238,225,0)');
    ctx.fillStyle = mg;
    ctx.fillRect(0, L.base - 130, 3000, 150);
  });
}

function drawValleyAndFalls() {
  setCam(ctx, 1);
  const cool = 1 - W.heat;

  // 远溪与碧潭水面
  const wg = ctx.createLinearGradient(420, 650, 1650, 820);
  wg.addColorStop(0, mixCol('#4f8f8c', '#3c838a', cool));
  wg.addColorStop(0.5, mixCol('#7ab2a8', '#68aba9', cool));
  wg.addColorStop(1, '#cbbda0');
  ctx.fillStyle = wg;
  ctx.beginPath();
  ctx.moveTo(320, 690);
  ctx.quadraticCurveTo(860, 650, 1480, 690);
  ctx.lineTo(1750, 860);
  ctx.lineTo(260, 860);
  ctx.closePath();
  ctx.fill();

  // 左侧松崖与三叠飞瀑
  const cliffG = ctx.createLinearGradient(460, 450, 740, 720);
  cliffG.addColorStop(0, '#244e5c');
  cliffG.addColorStop(0.55, '#467a62');
  cliffG.addColorStop(1, '#8c6943');
  ctx.fillStyle = cliffG;
  ctx.beginPath();
  ctx.moveTo(340, 720); ctx.lineTo(450, 495); ctx.lineTo(575, 455);
  ctx.lineTo(695, 515); ctx.lineTo(775, 690); ctx.closePath();
  ctx.fill();

  // 飞瀑银练动画
  const t = reduceMotion ? 0 : clock * 0.003;
  for (const [fx, fy, fw, fh] of [[578, 468, 26, 78], [596, 540, 34, 82], [612, 616, 44, 72]]) {
    const fg = ctx.createLinearGradient(fx, fy, fx, fy + fh);
    fg.addColorStop(0, 'rgba(252,250,242,0.92)');
    fg.addColorStop(0.7, 'rgba(214,235,234,0.82)');
    fg.addColorStop(1, 'rgba(214,235,234,0.2)');
    ctx.fillStyle = fg;
    ctx.beginPath();
    ctx.moveTo(fx - fw * 0.38, fy);
    ctx.quadraticCurveTo(fx - fw * 0.5, fy + fh * 0.5, fx - fw * 0.56, fy + fh);
    ctx.lineTo(fx + fw * 0.56, fy + fh);
    ctx.quadraticCurveTo(fx + fw * 0.5, fy + fh * 0.5, fx + fw * 0.38, fy);
    ctx.closePath();
    ctx.fill();

    ctx.strokeStyle = 'rgba(255,255,250,0.75)';
    ctx.lineWidth = 1.4;
    for (let s = -1; s <= 1; s++) {
      const off = ((t * 26 + s * 17) % fh);
      ctx.beginPath();
      ctx.moveTo(fx + s * fw * 0.22, fy + off * 0.3);
      ctx.lineTo(fx + s * fw * 0.28, Math.min(fy + fh, fy + off * 0.3 + 28));
      ctx.stroke();
    }
  }
  // 瀑底水雾泡沫
  for (let i = 0; i < 4; i++) {
    const r = 18 + i * 7 + (reduceMotion ? 0 : Math.sin(t * 1.4 + i) * 3);
    ctx.fillStyle = 'rgba(248,248,240,0.34)';
    ctx.beginPath(); ctx.arc(602 + i * 16, 686 + (i % 2) * 5, r, 0, TAU); ctx.fill();
  }

  // 潭面金波涟漪
  ctx.strokeStyle = `rgba(250,244,224,${(0.42 - cool * 0.1).toFixed(3)})`;
  ctx.lineWidth = 1.4;
  for (let i = 0; i < 6; i++) {
    const rx = 740 + i * 135 + (reduceMotion ? 0 : Math.sin(t + i) * 10);
    const ry = 695 + (i % 3) * 18;
    ctx.beginPath();
    ctx.moveTo(rx - 28, ry);
    ctx.quadraticCurveTo(rx, ry - 3, rx + 28, ry);
    ctx.stroke();
  }

  // 崖畔苍松（左崖迎客松）
  drawPine(510, 520, 1.05, 1);
  drawPine(1465, 635, 0.85, -1);

  // 右侧花台青绿山坡与听云亭基石
  const terG = ctx.createLinearGradient(1520, 620, 2320, 860);
  terG.addColorStop(0, mixCol('#4a8364', '#397661', cool));
  terG.addColorStop(0.52, mixCol('#7b8c58', '#60825d', cool));
  terG.addColorStop(1, '#8c6642');
  ctx.fillStyle = terG;
  ctx.beginPath();
  ctx.moveTo(1380, 860);
  ctx.quadraticCurveTo(1510, 650, 1660, 650);
  ctx.lineTo(2260, 655);
  ctx.quadraticCurveTo(2460, 675, 2640, 860);
  ctx.closePath();
  ctx.fill();

  // 泥金台缘勾线
  ctx.strokeStyle = `rgba(226,188,108,${(0.55 - cool * 0.18).toFixed(3)})`;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(1480, 705);
  ctx.quadraticCurveTo(1600, 650, 1760, 652);
  ctx.lineTo(2220, 656);
  ctx.stroke();

  drawPavilion(2115, 656, cool);
}

function drawPine(x, y, s, dir) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s * dir, s);
  ctx.strokeStyle = '#4e3726';
  ctx.lineWidth = 6; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(0, 42);
  ctx.quadraticCurveTo(-8, 12, 16, -8);
  ctx.quadraticCurveTo(42, -24, 72, -18);
  ctx.stroke();
  ctx.lineWidth = 3.5;
  ctx.beginPath();
  ctx.moveTo(12, -4); ctx.quadraticCurveTo(-10, -24, -28, -22);
  ctx.stroke();
  for (const [px, py, rx, ry] of [[68, -24, 34, 13], [36, -30, 28, 12], [-24, -28, 25, 11]]) {
    ctx.fillStyle = '#1f4f46';
    ctx.beginPath(); ctx.ellipse(px, py, rx, ry, 0, Math.PI, TAU); ctx.fill();
    ctx.fillStyle = '#387562';
    ctx.beginPath(); ctx.ellipse(px + 2, py - 2, rx * 0.82, ry * 0.72, 0, Math.PI, TAU); ctx.fill();

}

function drawPavilion(x, y, cool) {

  ctx.strokeStyle = '#75644d'; ctx.lineWidth = 1.4;
  ctx.strokeRect(-78, -12, 156, 14);
  // 朱漆立柱与美人靠栏杆
  ctx.strokeStyle = '#8f3526'; ctx.lineWidth = 5;

    ctx.beginPath(); ctx.moveTo(cx, -12); ctx.lineTo(cx, -92); ctx.stroke();
  }
  ctx.lineWidth = 2.6;
  ctx.beginPath(); ctx.moveTo(-58, -28); ctx.lineTo(58, -28); ctx.stroke();
  // 宋式飞檐歇山顶
  const rg = ctx.createLinearGradient(0, -148, 0, -88);
  rg.addColorStop(0, mixCol('#24485c', '#1c3e52', cool));

  ctx.fillStyle = rg;
  ctx.beginPath();
  ctx.moveTo(0, -148);
  ctx.quadraticCurveTo(46, -118, 98, -98);
  ctx.quadraticCurveTo(72, -88, 58, -90);

  ctx.quadraticCurveTo(-72, -88, -98, -98);

  ctx.fill();

  // 檐角微风丝幡

  ctx.strokeStyle = '#e7c682'; ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.moveTo(-88, -95);
  ctx.quadraticCurveTo(-96 - breeze * 18, -76, -92 - breeze * 28, -58);

/* ---------- 绘制：三株层瓣山花与小芸 ---------- */
function drawFlowers() {
  setCam(ctx, 1);
  const t = reduceMotion ? 0 : clock * 0.0024;
  for (const f of W.flowers) {
    const droop = f.tilt * (1 - smooth(f.perk));
    const sway = (reduceMotion ? 0 : Math.sin(t + f.swayPh) * 0.05) * (0.3 + 0.7 * f.perk);
    const ang = droop + sway;
    const hx = f.x + Math.sin(ang) * f.h;
    const hy = f.y - Math.cos(ang) * f.h;

    ctx.save();
    // 柔韧花茎
    ctx.strokeStyle = mixCol('#6d7d44', '#397454', f.perk);
    ctx.lineWidth = 3.4; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(f.x, f.y);
    ctx.quadraticCurveTo(f.x + Math.sin(ang) * f.h * 0.35, f.y - f.h * 0.55, hx, hy);
    ctx.stroke();

    // 对生叶片（炎热时下垂，清凉时舒展上扬）
    for (const side of [-1, 1]) {
      const lx = lerp(f.x, hx, 0.48), ly = lerp(f.y, hy, 0.48);
      const la = side * (0.55 + (1 - f.perk) * 0.48) + sway * 0.5;
      ctx.save();
      ctx.translate(lx, ly); ctx.rotate(la);
      ctx.fillStyle = mixCol('#758448', '#3c7c59', f.perk);
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(side * 16, -8, side * 26, 4);
      ctx.quadraticCurveTo(side * 12, 10, 0, 0);
      ctx.fill();
      ctx.restore();
    }

    // 多层花瓣（随 perk 逐瓣绽放）
    ctx.translate(hx, hy);
    ctx.rotate(ang * 0.65);
    const open = 0.52 + 0.48 * smooth(f.perk);
    const petals = 7;
    for (let i = 0; i < petals; i++) {
      const pa = (i / petals) * TAU + 0.2;
      ctx.save();
      ctx.rotate(pa);
      const len = 15 * open, wid = 7.5 * open;
      ctx.fillStyle = f.petal;
      ctx.beginPath();
      ctx.ellipse(0, -len * 0.62, wid, len * 0.65, 0, 0, TAU);
      ctx.fill();
      ctx.strokeStyle = 'rgba(120,60,50,0.22)';
      ctx.lineWidth = 0.8;
      ctx.stroke();
      ctx.restore();
    }
    ctx.fillStyle = f.core;
    ctx.beginPath(); ctx.arc(0, 0, 5.2 * open, 0, TAU); ctx.fill();
    ctx.restore();
  }
}

function drawChild() {
  setCam(ctx, 1);
  const C = W.child;
  const cool = 1 - W.heat;
  const bob = reduceMotion ? 0 : Math.sin(clock * 0.0026) * 1.4;
  ctx.save();
  ctx.translate(C.x, C.y);

  // 柔和地面脚影
  ctx.fillStyle = 'rgba(28,42,38,0.22)';
  ctx.beginPath(); ctx.ellipse(0, 2, 22, 6, 0, 0, TAU); ctx.fill();

  // 宋风交领襦裙（缥青上襦 + 素白长裙 + 朱砂系带）
  ctx.fillStyle = '#ece3ce';
  ctx.beginPath();
  ctx.moveTo(-16, -2); ctx.lineTo(-11, -52); ctx.lineTo(11, -52); ctx.lineTo(18, -2);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#4c807c';
  ctx.beginPath();
  ctx.moveTo(-13, -46); ctx.lineTo(-9, -82); ctx.lineTo(10, -82); ctx.lineTo(14, -46);
  ctx.closePath(); ctx.fill();
  // 朱砂腰带飘逸
  const breeze = reduceMotion ? 0 : Math.sin(clock * 0.0032) * (2 + cool * 6);
  ctx.strokeStyle = '#b54430'; ctx.lineWidth = 3.2; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-11, -50); ctx.lineTo(12, -50);
  ctx.moveTo(4, -50); ctx.quadraticCurveTo(14 + breeze, -36, 10 + breeze * 1.2, -22);
  ctx.stroke();

  // 手臂姿态：拭汗 / 挥袖唤云 / 仰望招手
  const wipeOsc = reduceMotion ? 0 : Math.sin(clock * 0.005) * 3 * C.wipe;
  const armAng = lerp(-0.5, -2.15, Math.max(C.reach, C.wave)) + (C.wipe > 0.2 ? -0.9 : 0);
  ctx.strokeStyle = '#5c908b'; ctx.lineWidth = 8; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-8, -74);
  if (C.wipe > 0.3 && C.reach < 0.2 && C.wave < 0.2) {
    ctx.quadraticCurveTo(-24, -84, -10, -96 + wipeOsc);
  } else {
    const waveOff = C.wave > 0.1 && !reduceMotion ? Math.sin(clock * 0.007) * 0.22 * C.wave : 0;
    const a = armAng + waveOff;
    ctx.lineTo(-8 + Math.cos(a) * 30, -74 + Math.sin(a) * 30);
  }
  ctx.stroke();

  // 头部与竹编遮阳笠
  ctx.save();
  ctx.translate(0, -94 + bob);
  ctx.rotate(-0.18 * C.lookUp + 0.1 * C.wipe);
  ctx.fillStyle = '#f2d3b3';
  ctx.beginPath(); ctx.arc(0, 0, 12.5, 0, TAU); ctx.fill();
  // 眉眼微笑
  ctx.strokeStyle = '#2b241e'; ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.arc(-4.5, -1, 2.2, Math.PI * 1.1, Math.PI * 1.9);
  if (cool > 0.45) ctx.arc(-4, 3.5, 3, 0.15, Math.PI - 0.15);
  ctx.stroke();
  // 竹笠
  ctx.fillStyle = '#d9bc82';
  ctx.beginPath();
  ctx.moveTo(-26, -4);
  ctx.quadraticCurveTo(0, -24, 26, -4);
  ctx.quadraticCurveTo(0, -8, -26, -4);
  ctx.fill();
  ctx.strokeStyle = '#8b6b3e'; ctx.lineWidth = 1.3; ctx.stroke();
  ctx.restore();

  ctx.restore();
}

/* ---------- 绘制：如意勾云法（层叠胡粉晕染 + 泥金淡墨双勾卷云纹） ---------- */
function drawRuyiCloud(cx, cy, scale, alpha, opts = {}) {
  if (alpha <= 0.005) return;
  const sunProx = opts.sunProx ?? 0;
  const morph = opts.morph ?? 0; // 0 = 自然如意云，1 = 收拢对齐云字卷尾
  const breathe = reduceMotion ? 0 : Math.sin(clock * 0.0018 + (opts.ph || 0)) * 3;

  ctx.save();
  ctx.translate(cx, cy + breathe);
  ctx.scale(scale, scale);
  ctx.globalAlpha = alpha;

  // 清凉内晕与迎光金边光晕
  if (sunProx > 0.05) {
    const rim = ctx.createRadialGradient(-20, -28, 12, 0, 0, 185);
    rim.addColorStop(0, `rgba(255,244,200,${(0.58 * sunProx).toFixed(3)})`);
    rim.addColorStop(0.55, `rgba(235,196,112,${(0.24 * sunProx).toFixed(3)})`);
    rim.addColorStop(1, 'rgba(235,196,112,0)');
    ctx.fillStyle = rim;
    ctx.beginPath(); ctx.arc(0, -6, 185, 0, TAU); ctx.fill();
  }

  // 多团胡粉与缥青柔和云体晕染
  const puffs = [
    [-92, 8, 56, 34], [-42, -16, 68, 44], [24, -20, 72, 46],
    [88, 6, 58, 36], [-18, 22, 78, 36], [42, 26, 64, 34],
  ];
  for (const [px, py, rx, ry] of puffs) {
    const mx = lerp(px, px * 0.65, morph), my = lerp(py, py * 0.7 + 16, morph);
    const pg = ctx.createLinearGradient(mx, my - ry, mx, my + ry);
    pg.addColorStop(0, '#fffdf6');
    pg.addColorStop(0.62, '#f2efe4');
    pg.addColorStop(1, mixCol('#d7e3e6', '#bed4dc', sunProx));
    ctx.fillStyle = pg;
    ctx.beginPath(); ctx.ellipse(mx, my, rx, ry, 0, 0, TAU); ctx.fill();
  }

  // 宋画勾云法：泥金与淡墨勾勒如意卷云纹（涡旋云头 + 舒展云尾）
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const drawScrolls = (col, wid, dy) => {
    ctx.strokeStyle = col;
    ctx.lineWidth = wid;
    ctx.beginPath();
    // 上缘三叠云弧
    ctx.moveTo(-132, 16 + dy);
    ctx.bezierCurveTo(-142, -14 + dy, -104, -30 + dy, -78, -14 + dy);
    ctx.bezierCurveTo(-66, -48 + dy, -12, -56 + dy, 12, -30 + dy);
    ctx.bezierCurveTo(36, -54 + dy, 92, -44 + dy, 102, -10 + dy);
    ctx.bezierCurveTo(132, -14 + dy, 146, 14 + dy, 118, 30 + dy);
    // 下部回旋如意云涡（天然呼应「云」下部的撇折与点！）

/* ---------- 溪谷轻烟、指尖丝带、白鹤与热浪/清露 ---------- */
function drawWispsAndRibbon() {
  setCam(ctx, 1);
  const t = reduceMotion ? 0 : clock * 0.0025;

  // 三缕山涧水气
  for (const w of W.wisps) {
    if (w.state === 'done') continue;
    const sway = reduceMotion ? 0 : Math.sin(t * 1.4 + w.ph) * 14 * (1 - w.t);
    const x = w.curX + sway, y = w.curY;
    ctx.save();
    ctx.globalAlpha = 1 - w.t * 0.25;
    // 升腾曲缕轻烟
    for (let k = 0; k < 3; k++) {
      const ox = (k - 1) * 14;
      const g = ctx.createLinearGradient(x + ox, y + 36, x + ox, y - 78);
      g.addColorStop(0, 'rgba(245,248,244,0)');
      g.addColorStop(0.45, 'rgba(248,250,244,0.78)');
      g.addColorStop(1, 'rgba(248,250,244,0)');
      ctx.strokeStyle = g;
      ctx.lineWidth = 8 - k * 1.6; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(x + ox, y + 32);
      ctx.bezierCurveTo(
        x + ox - 22 * Math.sin(t + k), y - 4,
        x + ox + 24 * Math.cos(t + k), y - 42,
        x + ox - 8, y - 78
      );
      ctx.stroke();
    }
    // 聚气互动脉冲金环
    if (W.mistUI > 0.02 && w.state === 'idle') {
      const p = reduceMotion ? 0.5 : 0.5 + 0.5 * Math.sin(clock * 0.004 + w.ph);
      ctx.strokeStyle = `rgba(246,216,136,${(W.mistUI * (0.45 + 0.4 * p)).toFixed(3)})`;
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(x, y - 16, 30 + p * 10, 0, TAU); ctx.fillStyle = `rgba(255,248,220,${(0.14 * W.mistUI).toFixed(3)})`;
      ctx.fill(); ctx.stroke();
    }
    ctx.restore();
  }

  // 指尖实时云气丝带
  if (W.ribbon.length > 1) {
    ctx.save();
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for (let i = 1; i < W.ribbon.length; i++) {
      const a = W.ribbon[i - 1], b = W.ribbon[i];
      const life = clamp(1 - (clock - b.t0) / 900);
      if (life <= 0) continue;
      ctx.strokeStyle = `rgba(252,249,238,${(life * 0.65).toFixed(3)})`;
      ctx.lineWidth = life * 18;
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      ctx.strokeStyle = `rgba(224,186,104,${(life * 0.45).toFixed(3)})`;
      ctx.lineWidth = life * 2.4;
      ctx.stroke();
    }
    ctx.restore();
  }

  // 遮日互动引导光弧
  if (W.shadeUI > 0.02) {
    const p = reduceMotion ? 0.5 : 0.5 + 0.5 * Math.sin(clock * 0.0038);
    ctx.save();
    ctx.globalAlpha = W.shadeUI;
    ctx.strokeStyle = 'rgba(255,238,182,0.72)';
    ctx.setLineDash([8, 8]); ctx.lineWidth = 2.4;
    ctx.beginPath();
    ctx.moveTo(W.cloud.x - 95, W.cloud.y);
    ctx.quadraticCurveTo((W.cloud.x + SUN.x) / 2, SUN.y - 36, SUN.x + 24, SUN.y + 24);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.strokeStyle = `rgba(255,236,170,${(0.45 + 0.4 * p).toFixed(3)})`;
    ctx.beginPath(); ctx.arc(SUN.x, SUN.y + 28, 42 + p * 12, 0, TAU); ctx.stroke();
    ctx.restore();
  }

  // 水汽微粒与清凉银露
  for (const p of W.puffs) {
    const u = clamp((clock - p.t0) / p.dur);
    const a = Math.sin(Math.PI * u) * 0.55;
    ctx.fillStyle = `rgba(250,249,240,${a.toFixed(3)})`;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (0.7 + 0.6 * u), 0, TAU); ctx.fill();
  }
  for (const d of W.dews) {
    const u = clamp((clock - d.t0) / d.dur);
    const a = Math.sin(Math.PI * u) * 0.85;
    ctx.fillStyle = `rgba(222,246,252,${a.toFixed(3)})`;
    ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, TAU); ctx.fill();
  }
}

/* ---------- 字形演进、书契载体、四笔描红与三组词意 ---------- */
function glyphCam() {
  setCam(ctx, 1);
  ctx.translate(GL.cx, GL.cy);
  ctx.scale(GL.s, GL.s);
  ctx.translate(-50, -50);
}
function toLocal(wx, wy) { return { x: (wx - GL.cx) / GL.s + 50, y: (wy - GL.cy) / GL.s + 50 }; }
function localToScreen(lx, ly) { return toScreen(GL.cx + (lx - 50) * GL.s, GL.cy + (ly - 50) * GL.s); }
function withMmah(fn) {
  ctx.save();
  ctx.scale(100 / 1024, 100 / 1024);
  ctx.translate(0, 900); ctx.scale(1, -1);
  fn();
  ctx.restore();
}
function strokePts(i) {
  const m = W.glyph.m;
  if (m <= 0) return OPTS[i];
  if (m >= 2) return KPTS[i];
  const [a, b, e] = m < 1 ? [OPTS[i], SPTS[i], ease.inOut(m)] : [SPTS[i], KPTS[i], ease.inOut(m - 1)];
  return a.map((p, j) => [lerp(p[0], b[j][0], e), lerp(p[1], b[j][1], e)]);
}
function strokeW(i, s) {
  const m = W.glyph.m;
  if (m <= 1) return lerp(2.6 * PROF.carve(s), 3.6 * PROF.seal(s), ease.inOut(clamp(m)));
  return lerp(3.6 * PROF.seal(s), KAI[i].w * PROF[KAI[i].p](s), ease.inOut(clamp(m - 1)));
}
function brush(c, i, upto) {
  if (upto <= 0.001) return;
  const pts = strokePts(i);
  const n = pts.length - 1, m = upto * n, mi = Math.floor(m);
  const P = pts.slice(0, mi + 1);
  if (mi < n && m > mi) { const a = pts[mi], b = pts[mi + 1], f = m - mi; P.push([lerp(a[0], b[0], f), lerp(a[1], b[1], f)]); }
  if (P.length < 2) return;
  const Lp = [], Rp = [];
  for (let j = 0; j < P.length; j++) {
    const a = P[Math.max(0, j - 1)], b = P[Math.min(P.length - 1, j + 1)];
    let tx = b[0] - a[0], ty = b[1] - a[1]; const l = Math.hypot(tx, ty) || 1; tx /= l; ty /= l;
    const s = Math.min(1, (j / (P.length - 1)) * (m / n));
    const w = strokeW(i, s) / 2;
    Lp.push([P[j][0] - ty * w, P[j][1] + tx * w]);
    Rp.push([P[j][0] + ty * w, P[j][1] - tx * w]);
  }
  c.beginPath(); c.moveTo(Lp[0][0], Lp[0][1]);
  for (const p of Lp) c.lineTo(p[0], p[1]);
  for (let j = Rp.length - 1; j >= 0; j--) c.lineTo(Rp[j][0], Rp[j][1]);
  c.closePath(); c.fill();
  const e0 = P[0], e1 = P[P.length - 1];
  c.beginPath();
  c.arc(e0[0], e0[1], strokeW(i, 0) / 2, 0, TAU);
  c.arc(e1[0], e1[1], strokeW(i, Math.min(1, m / n)) / 2, 0, TAU);
  c.fill();
}
function paintStroke(i, q) {
  if (q <= 0) return;
  const path = YUN_PATHS[i];
  if (q >= 1) { ctx.fill(path); return; }
  ctx.save();
  ctx.clip(path);
  ctx.lineWidth = 185; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.strokeStyle = ctx.fillStyle;
  const pts = MMD[i], count = (pts.length - 1) * q, k = Math.floor(count);
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (let j = 1; j <= k && j < pts.length; j++) ctx.lineTo(pts[j][0], pts[j][1]);
  if (k < pts.length - 1) {
    const a = pts[k], b = pts[k + 1], f = count - k;
    ctx.lineTo(lerp(a[0], b[0], f), lerp(a[1], b[1], f));
  }
  ctx.stroke();
  ctx.restore();
}

function drawBone(a) {
  ctx.save(); ctx.globalAlpha = a;
  ctx.beginPath();
  for (let i = 0; i <= 48; i++) {
    const t = i / 48 * TAU, r = 1 + 0.05 * Math.sin(3 * t + 1) + 0.04 * Math.sin(6 * t + 2);
    const x = 50 + Math.cos(t) * 66 * r, y = 50 + Math.sin(t) * 58 * r;
    if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y);
  }
  ctx.closePath();
  const g = ctx.createRadialGradient(40, 36, 6, 50, 50, 82);
  g.addColorStop(0, '#f5ebd2'); g.addColorStop(0.68, '#dec89e'); g.addColorStop(1, '#bfa171');
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = '#9b8156'; ctx.lineWidth = 0.9; ctx.stroke();
  // 龟甲卜兆裂纹
  ctx.strokeStyle = 'rgba(120,92,54,0.68)'; ctx.lineWidth = 0.65;
  for (const [x, y, s] of [[6, 36, 1], [94, 38, -1], [8, 68, 1], [92, 66, -1]]) {
    ctx.beginPath();
    ctx.moveTo(x, y - 6); ctx.lineTo(x, y + 6);
    ctx.moveTo(x, y - 1); ctx.lineTo(x + s * 6.5, y - 4.5);
    ctx.stroke();
  }
  ctx.restore();
}

function drawSlips(a) {
  ctx.save(); ctx.globalAlpha = a;
  for (const [x0, w, fade] of [[-24, 44, 0.45], [24, 52, 1], [80, 44, 0.45]]) {
    ctx.globalAlpha = a * fade;
    const g = ctx.createLinearGradient(x0, 0, x0 + w, 0);
    g.addColorStop(0, '#c8a96e'); g.addColorStop(0.32, '#e6d09c'); g.addColorStop(0.7, '#dec58c'); g.addColorStop(1, '#bd9c61');
    ctx.fillStyle = g; ctx.fillRect(x0, -8, w, 116);
    ctx.strokeStyle = 'rgba(112,82,36,0.42)'; ctx.lineWidth = 0.6;
    ctx.strokeRect(x0, -8, w, 116);
  }
  ctx.globalAlpha = a;
  ctx.strokeStyle = '#6c4b28'; ctx.lineWidth = 1.3;
  for (const y of [4, 96]) { ctx.beginPath(); ctx.moveTo(-26, y); ctx.lineTo(126, y + 0.8); ctx.stroke(); }
  ctx.restore();
}

function drawSilkPaper(a) {
  ctx.save(); ctx.globalAlpha = a;
  ctx.fillStyle = 'rgba(42,36,24,0.14)'; ctx.fillRect(-5, -4, 114, 114);
  ctx.fillStyle = '#faf4e6'; ctx.fillRect(-8, -8, 116, 116);

}

function drawLabels() {

function drawTraceUI() {
  const T = W.trace;
  if (!W.glyph.trace || T.stroke >= NS) return;
  const pts = MLD[T.stroke];
  ctx.save();
  ctx.globalAlpha = W.glyph.alpha;
  ctx.strokeStyle = 'rgba(181,68,48,0.88)'; ctx.lineWidth = 0.68; ctx.setLineDash([1.6, 1.7]);
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (const p of pts) ctx.lineTo(p[0], p[1]);
  ctx.stroke(); ctx.setLineDash([]);

  const a = pts[Math.max(0, pts.length - 3)], b = pts[pts.length - 1];

  ctx.beginPath();
  ctx.moveTo(b[0] + Math.cos(ang) * 2.5, b[1] + Math.sin(ang) * 2.5);

  ctx.lineTo(b[0] + Math.cos(ang - 2.5) * 2.3, b[1] + Math.sin(ang - 2.5) * 2.3);

  const [sx, sy] = pts[0];

  ctx.fillStyle = '#b54430';

    ctx.shadowColor = 'rgba(216,176,92,0.95)'; ctx.shadowBlur = 12 * DPR;

function drawStamp(a) {
  if (a <= 0.01) return;

}

const WORDS = [
  ['白云', '晴朗的蓝天上，飘着一朵朵白云。'],
  ['云彩', '傍晚的云彩，染上了金色和霞红。'],
  ['云海', '站在高山顶上，脚下是一片翻涌的云海。'],
];

function drawWords() {
  setCam(ctx, 1);
  const g = W.glyph;
  const y = GL.cy + GL.s * 60 + 50, size = portrait ? 38 : 44, gap = size * 1.45;
  ctx.font = `${size}px "Kaiti SC","STKaiti","KaiTi",serif`;
  ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  const shown = WORDS.map(([w]) => window.haqiHanziUi ? window.haqiHanziUi(w) : w);
  const widths = shown.map(s => ctx.measureText(s).width);
  let x = GL.cx - (widths.reduce((a, b) => a + b, 0) + gap * (shown.length - 1)) / 2;
  shown.forEach((s, i) => {
    const a = clamp(g.words - i) * g.alpha;
    if (a > 0) {
      const on = W.wordOn === i;
      ctx.globalAlpha = a * (on ? 1 : 0.52);
      ctx.fillStyle = on ? '#b54430' : '#2f2b24';
      ctx.fillText(s, x, y + (1 - clamp(g.words - i)) * 14);
    }
    x += widths[i] + gap;
  });
  ctx.globalAlpha = 1; ctx.textAlign = 'start';
}

function drawGlyph() {
  const g = W.glyph;
  if (g.alpha <= 0.001) return;
  const m = g.m;
  ctx.save();
  glyphCam();
  const bone = g.plate * (1 - smooth(m * 1.3));
  const slip = g.plate * smooth(m * 2.2 - 0.5) * (1 - smooth((m - 1.15) * 2.2));
  const paper = g.plate * smooth((m - 1.25) * 2.2);
  if (bone > 0.01) drawBone(g.alpha * bone);
  if (slip > 0.01) drawSlips(g.alpha * slip);
  if (paper > 0.01) drawSilkPaper(g.alpha * paper);

  if (g.ghost > 0.01) {
    ctx.save();
    ctx.globalAlpha = g.alpha * g.ghost;
    ctx.fillStyle = '#ddd0b6';
    withMmah(() => { for (let i = 0; i < NS; i++) if (g.prog[i] < 0.99) ctx.fill(YUN_PATHS[i]); });
    ctx.restore();
  }
  if (g.outline < 0.99) {
    ctx.save();
    const onSky = 1 - g.plate;
    ctx.globalAlpha = g.alpha * (1 - g.outline);
    ctx.fillStyle = onSky > 0.45 ? mixCol('#8a3822', '#f7df9c', onSky) : mixCol('#8a3822', '#1d2428', smooth(m));
    for (let i = 0; i < NS; i++) brush(ctx, i, g.prog[i]);
    ctx.restore();
  }
  if (g.outline > 0.01) {
    ctx.save();
    ctx.globalAlpha = g.alpha * g.outline;
    ctx.fillStyle = '#1d2428';
    withMmah(() => { for (let i = 0; i < NS; i++) paintStroke(i, g.prog[i]); });
    ctx.restore();
  }
  drawLabels();
  drawTraceUI();
  drawStamp(g.stamp);
  ctx.restore();
  if (g.words > 0.01) drawWords();
}

function drawVeil() {
  if (W.veil <= 0.001) return;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const c = toScreen(W.veilAt.x, W.veilAt.y);
  if (W.veilHole > 0.01) {
    const r0 = W.veilHole * CV.k * 175, r1 = r0 + Math.max(SW, SH) * 0.46;
    const g = ctx.createRadialGradient(c.x, c.y, r0, c.x, c.y, r1);
    g.addColorStop(0, 'rgba(238,228,205,0)');
    g.addColorStop(Math.min(0.999, 0.14 + 0.86 * (1 - W.veilHole)), `rgba(238,228,205,${W.veil})`);
    g.addColorStop(1, `rgba(238,228,205,${W.veil})`);
    ctx.fillStyle = g;
  } else {
    ctx.fillStyle = `rgba(238,228,205,${W.veil})`;
  }
  ctx.fillRect(0, 0, SW, SH);
}

/* ---------- 片头动态互动云卷与逐帧更新 ---------- */
let introPointer = null;
function updateParticles() {
  W.ribbon = W.ribbon.filter(p => clock - p.t0 < 920);
  for (const p of W.puffs) { p.y -= p.vy * DT * 0.04; p.x += Math.sin(clock * 0.002 + p.ph) * 0.25; }
  W.puffs = W.puffs.filter(p => clock - p.t0 < p.dur);
  for (const d of W.dews) { d.y += d.vy * DT * 0.025; }
  W.dews = W.dews.filter(d => clock - d.t0 < d.dur);
  for (const ec of W.extraClouds) { ec.x += ec.vx * DT * 0.016; }
  if (W.cranes[0].a > 0.01 && !reduceMotion) {
    W.cranes.forEach((c, i) => {
      const ang = clock * 0.00038 + i * 0.55;
      c.x = 1180 + Math.cos(ang) * (360 + i * 70);
      c.y = 395 + Math.sin(ang * 1.6) * 44 + i * 26;
    });
  }
  if (W.intro) {
    let tx = SUN.x + 120, ty = 315;
    if (introPointer) {
      const wp = toWorld(introPointer.x, introPointer.y);
      tx = clamp(wp.x, 980, 1840);
      ty = clamp(wp.y, 210, 440);
    } else if (!reduceMotion) {
      tx = SUN.x + Math.sin(clock * 0.0007) * 155;
      ty = 305 + Math.cos(clock * 0.0005) * 24;
    }
    const f = Math.min(1, DT / 220);
    W.cloud.alpha = 0.94;
    W.cloud.x += (tx - W.cloud.x) * f;
    W.cloud.y += (ty - W.cloud.y) * f;
    W.heat = clamp(Math.abs(W.cloud.x - SUN.x) / 280);
    W.flowers.forEach(fl => { fl.perk = 1 - W.heat * 0.75; });
  }
}

function render() {
  updateView();
  const w = cvs.width, h = cvs.height;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;

  drawSky();
  drawSunAndRays();
  drawPeaks();
  drawValleyAndFalls();
  drawHeatHaze();
  drawFlowers();
  drawChild();
  drawCranes();
  drawWispsAndRibbon();
  drawUpperStrata();

  setCam(ctx, 1);
  const sunProx = 1 - clamp(Math.hypot(W.cloud.x - SUN.x, W.cloud.y - SUN.y) / 340);
  drawRuyiCloud(W.cloud.x, W.cloud.y, W.cloud.s, W.cloud.alpha, { sunProx, morph: W.cloud.curl });
  for (const ec of W.extraClouds) {
    const age = clamp((clock - ec.t0) / 500);
    drawRuyiCloud(ec.x, ec.y, ec.s * (0.7 + 0.3 * age), age * 0.88, { sunProx: 0.45, ph: ec.ph });
  }

  drawVeil();
  drawGlyph();

  // 双丝古绢肌理叠印与绫裱暗晕
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = 'multiply'; ctx.globalAlpha = 0.88;
  ctx.drawImage(silkC, 0, 0);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  if (!vignette || vignette.w !== w || vignette.h !== h) {
    const g = ctx.createRadialGradient(w / 2, h * 0.45, Math.min(w, h) * 0.36, w / 2, h * 0.45, Math.hypot(w, h) * 0.64);
    g.addColorStop(0, 'rgba(38,28,16,0)');
    g.addColorStop(1, 'rgba(38,28,16,0.32)');
    vignette = { w, h, g };
  }
  ctx.fillStyle = vignette.g;
  ctx.fillRect(0, 0, w, h);
}

let last = null;
function loop(now) {
  requestAnimationFrame(loop);
  if (last == null) last = now;
  const dt = Math.min(50, Math.max(0, now - last));
  last = now;
  if (visible) {
    DT = dt;
    clock += dt;
    updateParticles();
    const list = waiters; waiters = [];
    for (const wt of list) { if (wt.tk.dead) wt.rej(new Cancelled()); else wt.res(clock); }
  }
  render();
}

/* ---------- 界面、字幕与多语言桥接 ---------- */
const ui = {
  cap: $('#caption'), capT: $('#capTitle'), capP: $('#capText'),
  hint: $('#hint'), action: $('#action'), demo: $('#demo'),
  prog: [...document.querySelectorAll('#progress li')],
};
const CHAR_MS = 65;
let capMinEnd = 0, capQ = Promise.resolve();
function span(cls, text) { const s = document.createElement('span'); if (cls) s.className = cls; s.textContent = text; return s; }
function showCaption(title, text) {
  ui.capT.textContent = window.haqiHanziUi ? window.haqiHanziUi(title, ui.capT) : title;
  ui.capP.replaceChildren(...[...text].map((c, i) => { const s = span('ch', c); s.style.setProperty('--i', i); return s; }));
  window.haqiHanziCaption?.(ui.cap, text);
  ui.cap.classList.remove('on'); void ui.cap.offsetWidth; ui.cap.classList.add('on');
}
async function caption(title, text, tk, hold = 0) {
  window.haqiHanziPrefetch?.([title, text]);
  while (clock < capMinEnd) await frame(tk);
  ui.cap.classList.remove('on');
  await wait(340, tk);
  showCaption(title, text);
  const n = [...text].length;
  capMinEnd = clock + (Math.max(reduceMotion ? 1350 : n * CHAR_MS + 1250, n * 145) + 560 + hold) * FAST;
}
async function captionDone(tk) { await capQ; while (clock < capMinEnd) await frame(tk); }
function say(title, text, tk) {
  capQ = capQ.then(() => caption(title, text, tk)).catch(e => { if (!(e instanceof Cancelled)) console.error(e); });
  return capQ;
}
function hint(text) {
  if (text) {
    const s = span('', '');
    s.textContent = window.haqiHanziUi ? window.haqiHanziUi(text, s) : text;
    ui.hint.replaceChildren(s); ui.hint.classList.add('on');
  } else {
    ui.hint.classList.remove('on');
  }
}
function progress(i) { ui.prog.forEach((li, j) => { li.classList.toggle('on', j === i); li.classList.toggle('done', j < i); }); }
function mode(m) { document.body.classList.remove('mist', 'shade', 'trace', 'sky'); if (m) document.body.classList.add(m); S.mode = m; }
function setPaperMode(on) { document.body.classList.toggle('paper', !!on); }
let actionFn = null;
function setAction(label, fn) {
  actionFn = fn;
  if (label) {
    ui.action.textContent = window.haqiHanziUi ? window.haqiHanziUi(label, ui.action) : label;
    ui.action.hidden = false;
  } else {
    ui.action.hidden = true;
  }
}

/* ---------- 指针与键盘输入 ---------- */
const S = { handler: null, mode: null, interactions: [], demo: null, finish: null };
let activePointer = null;
cvs.addEventListener('pointerdown', e => {
  if (!e.isPrimary || activePointer != null) return;
  const h = S.handler; if (!h || !h.down) return;
  activePointer = e.pointerId;
  try { cvs.setPointerCapture(e.pointerId); } catch { /* optional */ }
  e.preventDefault();
  h.down(toWorld(e.clientX, e.clientY), e);
});
cvs.addEventListener('pointermove', e => {
  const h = S.handler; if (!h) return;
  if (e.pointerId === activePointer && h.move) {
    const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
    for (const ev of evs.length ? evs : [e]) h.move(toWorld(ev.clientX, ev.clientY), ev);
  } else if (activePointer == null && h.hover && e.pointerType === 'mouse') {
    h.hover(toWorld(e.clientX, e.clientY));
  }
});
function pointerEnd(e, cancel) {
  if (e.pointerId !== activePointer) return;
  activePointer = null;
  const h = S.handler;
  if (h && h.up) h.up(toWorld(e.clientX, e.clientY), cancel);
}
cvs.addEventListener('pointerup', e => pointerEnd(e, false));
cvs.addEventListener('pointercancel', e => pointerEnd(e, true));
cvs.addEventListener('lostpointercapture', e => pointerEnd(e, true));
addEventListener('pointermove', e => { if (W.intro) introPointer = { x: e.clientX, y: e.clientY }; }, { passive: true });
addEventListener('keydown', e => {
  if ((e.code === 'Space' || e.code === 'Enter') && actionFn && !ui.action.hidden) {
    if (document.activeElement && document.activeElement.tagName === 'BUTTON') return;
    e.preventDefault();
    actionFn();
  }
});
ui.action.addEventListener('click', () => { if (actionFn) actionFn(); });
ui.demo.addEventListener('click', () => { if (S.demo) S.demo(); });

function publish(name) { window.__yun.scene = name; }

async function sMist(tk) {
  publish('sMist');
  progress(1);
  bg(camTo(VIEW.mist, 2400 * M, tk));
  bg(tween(900, t => { W.child.wipe = 1 - t; W.child.reach = t * 0.5; }, tk));
  await caption('聚气', '听——山谷里的溪水晒暖了，正升起一缕缕轻烟。', tk);
  await captionDone(tk);

  bg(tween(500, t => { W.mistUI = t; }, tk));
  hint('划过或点一缕溪谷轻烟，把水气聚上天空');
  let gathered = 0, lastInput = clock;
  const LINES = [
    '飞瀑升起一缕白气，悠悠飘向半空。',
    '碧潭的水气也醒了，打着旋儿往上飞。',
    '三缕山川水气聚在一起，结成了一朵如意白云！',
  ];

  const riseWisp = w => {
    if (w.state !== 'idle') return;
    w.state = 'rising';
    const idx = gathered++;
    Sound.pluck(w.note, 0.13, 2.4);
    Sound.hiss(1.1, 1200 + idx * 240, 0.03, 0.8, true);
    say('聚气', LINES[idx], tk);
    const sx = w.x, sy = w.y;
    for (let k = 0; k < 7; k++) {
      W.puffs.push({ x: sx + (rand() - 0.5) * 40, y: sy - k * 14, r: 9 + rand() * 10, vy: 1.5 + rand(), ph: rand() * TAU, t0: clock, dur: 1100 });
    }
    bg(tween(1500 * M, t => {
      w.t = t;
      const arc = Math.sin(Math.PI * t) * (idx === 0 ? -90 : idx === 2 ? 70 : -30);
      w.curX = lerp(sx, CLOUD_START.x - 120 + idx * 45, t) + arc;
      w.curY = lerp(sy, CLOUD_START.y + 10, ease.out(t));
      W.cloud.alpha = Math.max(W.cloud.alpha, (idx + t) / 3);
      W.cloud.x = CLOUD_START.x - 80 * (1 - W.cloud.alpha);
      W.cloud.s = 0.55 + 0.45 * W.cloud.alpha;
    }, tk).then(() => { w.state = 'done'; }));
  };

  const triggerNext = tag => {
    const next = W.wisps.find(w => w.state === 'idle');
    if (!next) return;
    if (!S.interactions.includes(tag)) S.interactions.push(tag);
    lastInput = clock;
    riseWisp(next);
  };

  setAction('唤起山谷云气', () => triggerNext('button'));
  mode('mist');

  const touchAt = p => {
    lastInput = clock;
    W.ribbon.push({ x: p.x, y: p.y, t0: clock });
    if (W.ribbon.length > 36) W.ribbon.shift();
    const tol = Math.max(85, 52 / CV.k);
    for (const w of W.wisps) {
      if (w.state === 'idle' && Math.hypot(p.x - w.x, p.y - (w.y - 18)) < tol) {
        if (!S.interactions.includes('user')) S.interactions.push('user');
        riseWisp(w);
      }
    }
  };
  S.handler = { down: touchAt, move: touchAt };

  while (W.wisps.some(w => w.state !== 'done')) {
    await frame(tk);
    if (gathered < 3 && (AUTO || clock - lastInput > 6500)) {
      triggerNext('auto');
      lastInput = AUTO ? clock - 6000 : clock;
    }
  }

  S.handler = null; mode(null); setAction(null); hint(null);
  bg(tween(450, t => { W.mistUI = 1 - t; }, tk));
  Sound.xiao(NOTE.A4, 0.08, 2.4);
  await captionDone(tk);
}

async function sShade(tk) {
  publish('sShade');
  progress(2);
  Sound.stream(0.35);
  bg(camTo(VIEW.shade, 2200 * M, tk));
  bg(tween(900, t => { W.child.reach = 0.85; W.child.lookUp = t; }, tk));
  await caption('凉荫', '白云软软地浮在半空。把它请过来，替花儿挡住烈日吧。', tk);
  await captionDone(tk);

  bg(tween(500, t => { W.shadeUI = t; }, tk));
  hint('拖动或轻点白云，把它请到太阳前面');
  let goalX = W.cloud.x, dragging = false, dragDx = 0, lastInput = clock, stageSaid = 0;

  const nudgeStep = tag => {
    lastInput = clock;
    if (!S.interactions.includes(tag)) S.interactions.push(tag);
    goalX = Math.max(CLOUD_TARGET.x, goalX - 165);
    Sound.hiss(0.7, 900, 0.025, 0.7, true);
    Sound.pluck(PENTA[Math.min(PENTA.length - 1, 2 + stageSaid)], 0.11, 2.2);
  };

  setAction('把云请过来', () => nudgeStep('button'));
  mode('shade');

  S.handler = {
    down(p) {
      lastInput = clock;
      if (!S.interactions.includes('user')) S.interactions.push('user');
      if (Math.hypot(p.x - W.cloud.x, p.y - W.cloud.y) < 210) {
        dragging = true;
        dragDx = W.cloud.x - p.x;
      } else {
        goalX = clamp(p.x, CLOUD_TARGET.x, CLOUD_START.x);
        if (goalX > W.cloud.x - 40) goalX = Math.max(CLOUD_TARGET.x, W.cloud.x - 165);
        Sound.hiss(0.6, 920, 0.024, 0.7, true);
      }
    },
    move(p) {
      if (!dragging) return;
      lastInput = clock;
      goalX = clamp(p.x + dragDx, CLOUD_TARGET.x, CLOUD_START.x);
    },
    up() { dragging = false; },
  };

  while (Math.abs(W.cloud.x - CLOUD_TARGET.x) > 14) {
    await frame(tk);
    if (AUTO || clock - lastInput > 6500) {
      nudgeStep('auto');
      lastInput = AUTO ? clock - 5900 : clock;
    }
    const f = Math.min(1, DT / (dragging ? 90 : 240));
    W.cloud.x += (goalX - W.cloud.x) * f;
    const prog = clamp((CLOUD_START.x - W.cloud.x) / (CLOUD_START.x - CLOUD_TARGET.x));
    W.cloud.y = lerp(CLOUD_START.y, CLOUD_TARGET.y, prog);
    W.heat = 1 - prog;

    // 三株山花随清凉云影依次舒展绽放
    W.flowers.forEach((fl, idx) => {
      const fp = clamp((prog - idx * 0.24) / 0.45);
      if (fp > 0.75 && !fl.bloomed) {
        fl.bloomed = true;
        Sound.bell(PENTA[4 + idx], 0.075, 2.4);
        for (let k = 0; k < 5; k++) {
          W.dews.push({ x: fl.x + (rand() - 0.5) * 44, y: fl.y - 52 - rand() * 32, r: 2.2 + rand() * 2, vy: 0.8 + rand(), t0: clock, dur: 1400 });
        }
      }
      fl.perk = fp;
    });

    if (stageSaid === 0 && prog > 0.35) {
      stageSaid = 1;
      say('凉荫', '白云镶上金边，清凉的云影掠过了青山。', tk);
    } else if (stageSaid === 1 && prog > 0.78) {
      stageSaid = 2;
      say('凉荫', '烈日挡住了，山花一朵接一朵抬起了头！', tk);
    }
  }

  W.cloud.x = CLOUD_TARGET.x; W.cloud.y = CLOUD_TARGET.y; W.heat = 0;
  W.flowers.forEach(fl => { fl.perk = 1; });
  S.handler = null; mode(null); setAction(null); hint(null);
  bg(tween(500, t => { W.shadeUI = 1 - t; W.child.reach = 0; W.child.wave = t; }, tk));
  bg(tween(1800 * M, t => { W.cranes[0].a = t; W.cranes[1].a = t * 0.9; }, tk));
  Sound.warm(0.85);
  Sound.xiao(NOTE.D5, 0.085, 2.8);
  await caption('凉荫', '白鹤乘着凉风飞过松崖，整座山谷都舒快起来。', tk, 400);
  await captionDone(tk);
}

  await captionDone(tk);
  showStroke();

  let samples = MLD[0], drag = null, lastInput = clock, demoing = false, completed = 0, invalidHint = 0;
  const finishStroke = () => {
    const i = W.trace.stroke;
    if (i >= NS) return;
    W.glyph.prog[i] = 1;
    Sound.pluck(PENTA[i + 2], 0.13, 2.1);
    W.trace.stroke++;
    W.trace.pen = null;
    completed++;
    if (W.trace.stroke < NS) { samples = MLD[W.trace.stroke]; showStroke(); }
  };
  S.finish = finishStroke;
  const tolLocal = () => Math.max(20, 48 / (CV.k * GL.s));

  S.handler = {
    down(p) {
      if (demoing || W.trace.stroke >= NS) return;
      lastInput = clock;
      const q = toLocal(p.x, p.y);
      const t = tolLocal();
      const lastPt = samples[samples.length - 1];
      const dEnd = Math.hypot(q.x - lastPt[0], q.y - lastPt[1]);
      let startIdx = -1, bestD = Infinity;
      const startLimit = Math.max(1, Math.floor(samples.length * 0.35));
      for (let j = 0; j < startLimit; j++) {
        const d = Math.hypot(q.x - samples[j][0], q.y - samples[j][1]);
        if (d < bestD) { bestD = d; startIdx = j; }
      }
      if (bestD > t * 1.75 || (bestD > dEnd * 1.15 && dEnd < t * 1.2)) {
        if (clock - invalidHint > 500) { hint('从这一笔的红点开始哦'); invalidHint = clock; }
        return;
      }
      drag = { idx: startIdx, fIdx: startIdx, lastQ: q };
      W.glyph.prog[W.trace.stroke] = drag.idx / (samples.length - 1);
      W.trace.pen = samples[drag.idx];
      Sound.hiss(0.24, 1650, 0.02);
    },
    move(p) {
      if (!drag) return;
      lastInput = clock;
      const q = toLocal(p.x, p.y);
      const t = tolLocal();
      const prev = drag.lastQ || q;
      const distMove = Math.hypot(q.x - prev.x, q.y - prev.y);
      const steps = Math.max(1, Math.min(8, Math.ceil(distMove / 4)));
      const lastIdx = samples.length - 1;
      for (let s = 1; s <= steps; s++) {
        const u = s / steps;
        const sx = lerp(prev.x, q.x, u), sy = lerp(prev.y, q.y, u);
        const win = Math.max(18, Math.ceil(lastIdx * 0.55));
        let best = drag.idx, bd = Infinity;
        for (let j = Math.max(0, drag.idx - 2); j <= Math.min(lastIdx, drag.idx + win); j++) {
          const d = Math.hypot(sx - samples[j][0], sy - samples[j][1]);
          if (d < bd) { bd = d; best = j; }
        }
        if (bd <= t * 1.35 && best >= drag.idx) {
          const a = samples[drag.idx], b = samples[best];
          const mvx = q.x - prev.x, mvy = q.y - prev.y;
          const svx = b[0] - a[0], svy = b[1] - a[1];
          if (best === drag.idx || distMove < 0.5 || (mvx * svx + mvy * svy) >= -0.25 * distMove * Math.hypot(svx, svy)) {
            drag.idx = best;
            drag.fIdx = Math.max(drag.fIdx || 0, best);
          }
        }
      }
      if (distMove > 0.4 && drag.idx < lastIdx) {
        const curIdx = Math.min(lastIdx - 1, drag.idx);
        const lookIdx = Math.min(lastIdx, curIdx + Math.max(6, Math.ceil(lastIdx * 0.18)));
        const tx = samples[lookIdx][0] - samples[curIdx][0];
        const ty = samples[lookIdx][1] - samples[curIdx][1];
        const tLen = Math.hypot(tx, ty) || 1;
        const mvx = q.x - prev.x, mvy = q.y - prev.y;
        const forwardProj = (mvx * tx + mvy * ty) / tLen;
        const curD = Math.hypot(q.x - samples[curIdx][0], q.y - samples[curIdx][1]);
        if (forwardProj > 0.15 && curD <= t * 2.6) {
          let totalLen = 0;
          for (let j = 1; j <= lastIdx; j++) totalLen += Math.hypot(samples[j][0] - samples[j - 1][0], samples[j][1] - samples[j - 1][1]);
          const avgSeg = Math.max(0.6, totalLen / lastIdx);
          drag.fIdx = Math.min(lastIdx, Math.max(drag.fIdx || drag.idx, drag.idx) + (forwardProj / avgSeg) * 1.25);
          drag.idx = Math.max(drag.idx, Math.floor(drag.fIdx));
        }
      }
      drag.lastQ = q;
      W.glyph.prog[W.trace.stroke] = drag.idx / lastIdx;
      W.trace.pen = samples[drag.idx];
    },
    up(p, cancel) {
      if (!drag) return;
      const d = drag; drag = null;
      W.trace.pen = null;
      const lastIdx = samples.length - 1;
      const needIdx = Math.min(lastIdx - 2, Math.max(3, Math.ceil(lastIdx * 0.56)));
      if (!cancel && d.idx >= needIdx) { finishStroke(); return; }
      const i = W.trace.stroke, from = W.glyph.prog[i];
      bg(tween(260, t => { if (W.trace.stroke === i) W.glyph.prog[i] = from * (1 - t); }, tk));
      if (clock - invalidHint > 400) { hint('把这一笔顺着方向写到箭头附近即可'); invalidHint = clock; }
    },
  };

  const demo = async () => {
    if (demoing || W.trace.stroke >= NS) return;
    demoing = true; ui.demo.disabled = true; drag = null;
    hint('看光点走过每一笔，你也可以跟着比画');
    while (W.trace.stroke < NS) {
      const i = W.trace.stroke, pts = MLD[i];
      W.glyph.prog[i] = 0;
      await tween(880 * M, t => { W.glyph.prog[i] = t; W.trace.pen = pts[Math.round(t * (pts.length - 1))]; }, tk, ease.sine);
      W.trace.pen = null;
      finishStroke();
      await wait(220, tk);
    }
  };
  S.demo = () => { S.interactions.push('demo'); bg(demo()); };
  mode('trace');
  ui.demo.hidden = false;
  if (AUTO) { S.interactions.push('auto'); bg(demo()); }

  let nudged = false;
  while (W.trace.stroke < NS) {
    await frame(tk);
    if (!demoing && !nudged && clock - lastInput > 14000) { hint('写不出来也没关系，点“看示范”'); nudged = true; }
    if (!demoing && completed === 0 && clock - lastInput > 26000) { S.interactions.push('auto'); bg(demo()); }
  }

  S.handler = null; S.demo = null; S.finish = null; mode(null); hint(null);
  ui.demo.hidden = true; ui.demo.disabled = false;
  W.glyph.trace = false;
  if (!S.interactions.includes('demo') && !S.interactions.includes('auto')) S.interactions.push('user');
  window.__yun.events.push('written');
  window.haqiHanziWritten?.();

  await tween(550, t => { W.glyph.ghost = 1 - t; }, tk);
  await tween(500, t => { W.glyph.stamp = t; }, tk, ease.out);
  Sound.bell(NOTE.D5, 0.095); Sound.bell(NOTE.A5, 0.05);
  await caption('写字', '写好了！云，白云的云。', tk);
  await captionDone(tk);
}

async function sWords(tk) {
  publish('sWords');
  progress(5);
  const g0 = { ...GL };
  await tween(1100 * M, t => {
    GL.cy = lerp(g0.cy, g0.cy - 28, t);
    GL.s = lerp(g0.s, 2.88, t);
    W.veil = lerp(0.95, 0.68, t);
  }, tk);

  for (let i = 0; i < WORDS.length; i++) {
    const pCap = caption(WORDS[i][0], WORDS[i][1], tk);
    await wait(340, tk);
    W.wordOn = i;
    Sound.pluck(PENTA[3 + i], 0.12);
    if (i === 1) bg(tween(900 * M, t => { W.wordMood = t; }, tk));
    if (i === 2) bg(tween(900 * M, t => { W.wordMood = 1 - t; W.wordSea = t; }, tk));
    bg(tween(600, t => { W.glyph.words = Math.max(W.glyph.words, i + t); }, tk, ease.out));
    await pCap;
    await captionDone(tk);
  }
  W.wordOn = -1;
}

async function sFinale(tk) {
  publish('sFinale');
  progress(6);
  setPaperMode(false);
  W.drift = 1;
  W.cloud = { alpha: 0, x: CLOUD_TARGET.x, y: CLOUD_TARGET.y, s: 1, strata: 0, curl: 0 };
  bg(camTo(VIEW.finale, 3600 * M, tk));
  await tween(2200 * M, t => {
    W.glyph.alpha = 1 - t;
    W.veil = 0.68 * (1 - t);
    W.wordSea = 1 - t;
    W.cloud.alpha = t * 0.96;
    W.child.wave = t;
  }, tk);
  W.glyph = { ...W.glyph, alpha: 0, words: 0 };
  Sound.stream(0.5); Sound.xiao(NOTE.A4, 0.08, 3);

  await caption('余韵', '云带来一片阴凉，花儿又抬起了头。', tk);
  await caption('余韵', '山川轻轻呼吸一口气，天上便有了一朵云。', tk, 550);
  await captionDone(tk);

  hint('点一点天空，亲手添一朵流云');
  mode('sky');
  setAction('再看一次', () => { Sound.init(); begin(); });
  S.handler = {
    down(p) {
      if (p.y > 540) return;
      W.extraClouds.push({
        x: clamp(p.x, 680, 2180),
        y: clamp(p.y, 185, 455),
        s: 0.52 + rand() * 0.34,
        vx: (rand() > 0.5 ? 1 : -1) * (0.45 + rand() * 0.55),
        t0: clock,
        ph: rand() * TAU,
      });
      if (W.extraClouds.length > 7) W.extraClouds.shift();
      Sound.pluck(PENTA[(rand() * PENTA.length) | 0], 0.1, 2.5);
      hint(null);
    },
  };

  window.__yun.finished = true;
  window.__yun.events.push('completed');
  window.haqiHanziComplete();
}

const SCENES = [sValley, sMist, sShade, sGlyph, sWrite, sWords, sFinale];

async function begin() {
  token.dead = true;
  const tk = token = { dead: false };
  capMinEnd = 0; capQ = Promise.resolve();
  waiters.forEach(w => w.rej(new Cancelled())); waiters = [];
  resetWorld();
  W.intro = false;
  setPaperMode(false);
  Object.assign(cam, VIEW.falls);
  S.handler = null; S.demo = null; S.finish = null; mode(null); setAction(null); hint(null);
  ui.demo.hidden = true; ui.demo.disabled = false;
  ui.cap.classList.remove('on');
  rand = mulberry32(20261111);
  S.interactions = [];
  Object.assign(window.__yun, { interactions: S.interactions, events: [], finished: false, state: W });
  try {
    for (const sc of SCENES) await sc(tk);
  } catch (e) {
    if (!(e instanceof Cancelled)) console.error(e);
  }
}

async function introPlay(tk) {
  W.intro = true;
  for (;;) await frame(tk);
}

resetWorld();
Object.assign(cam, VIEW.intro);
window.__yun = {
  scene: 'intro', interactions: [], events: [], finished: false, state: W,
  toScreen, localToScreen, medians: MLD,
  completeCurrentStroke() { S.finish?.(); },
};
resize();
updateView();
addEventListener('resize', () => { resize(); updateView(); });
document.addEventListener('visibilitychange', () => { visible = !document.hidden; last = null; });
requestAnimationFrame(loop);
const introTk = { dead: false };
bg(introPlay(introTk));
document.documentElement.dataset.fixtureReady = '1';

$('#start').addEventListener('click', () => {
  Sound.init(); Sound.pad();
  introTk.dead = true;
  $('#intro').classList.add('off');
  document.body.classList.add('started');
  begin();
});
$('#replay').addEventListener('click', () => { Sound.init(); begin(); });
$('#mute').addEventListener('click', e => {
  Sound.init();
  Sound.setMuted(!Sound.muted);
  const zh = Sound.muted ? '声音 关' : '声音 开';
  e.currentTarget.textContent = window.haqiHanziUi ? window.haqiHanziUi(zh, e.currentTarget) : zh;
});
addEventListener('pagehide', () => { token.dead = true; void Sound.ctx?.close().catch(() => {}); }, { once: true });
if (AUTO) $('#start').click();
})();
</script>

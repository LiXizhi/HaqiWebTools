<style>
:root{

html,body{margin:0;height:100%;overflow:hidden;background:var(--night)}
body{color:var(--cream);font-family:var(--serif);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;touch-action:manipulation}

#progress{position:fixed;top:max(16px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;list-style:none;

body.started #progress{opacity:1}
#progress li{position:relative;font-family:var(--kai);font-size:13px;color:#6f6a7c;letter-spacing:.08em;padding-top:12px;transition:color .6s;white-space:nowrap}
#progress li::before{content:"";position:absolute;top:0;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:#3a3a50;transition:background .6s,transform .6s,box-shadow .6s}

#progress li.on{color:var(--cream)}#progress li.on::before{background:var(--gold);transform:scale(1.6);box-shadow:0 0 10px 2px rgba(242,182,90,.6)}

#controls{position:fixed;right:max(14px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));display:flex;gap:8px;z-index:12;opacity:0;pointer-events:none;transition:opacity .6s}

#hint{position:fixed;left:16px;right:16px;margin:0 auto;width:fit-content;max-width:calc(100vw - 32px);box-sizing:border-box;

#caption{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translate(-50%,10px);

#intro{position:fixed;inset:0;z-index:20;pointer-events:none;transition:opacity 1s,transform 1s}

.tag{display:flex;align-items:center;gap:10px;font-family:var(--kai);font-size:clamp(15px,2.2vh,19px);letter-spacing:.3em;color:var(--gold)}
.tag i{display:block;width:clamp(24px,5vw,60px);height:1px;background:currentColor;opacity:.6}
.pinyin{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:clamp(30px,5.2vh,46px);line-height:1;color:var(--cream);letter-spacing:.06em}
.mean{font-family:var(--kai);font-size:clamp(17px,2.5vh,22px);letter-spacing:.2em;color:#e2d2ae}
.sub{font-family:var(--kai);font-size:clamp(15px,2.1vh,18px);color:#a99f92;letter-spacing:.14em;margin:2px 0 0;line-height:1.7}
.btn-main{pointer-events:auto;margin-top:8px;font-family:var(--kai);font-size:clamp(18px,2.6vh,22px);letter-spacing:.4em;padding:10px 24px 10px 32px;
  color:#fff3da;background:linear-gradient(#cf6f38,#a2421f);border:1px solid #e89356;border-radius:4px;cursor:pointer;
  box-shadow:0 6px 22px rgba(220,110,40,.35);transition:transform .2s;animation:btnGlow 2.6s ease-in-out infinite}
.btn-main:hover{transform:translateY(-2px)}
@keyframes btnGlow{50%{box-shadow:0 6px 22px rgba(220,110,40,.35),0 0 0 9px rgba(242,150,70,.1),0 0 44px rgba(255,150,60,.3)}}
.meta{font-size:12px;color:#7d7787;letter-spacing:.14em;margin:0}
.rise{opacity:0;transform:translateY(12px);animation:rise 1s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:var(--d,0s)}
@keyframes rise{to{opacity:1;transform:none}}
@media (max-height:540px){.sub,.meta{display:none}.introBottom{gap:4px}}

#note{position:fixed;left:max(16px,env(safe-area-inset-left));bottom:max(12px,env(safe-area-inset-bottom));font-size:11px;color:#5f5a6c;letter-spacing:.12em;z-index:4;pointer-events:none}
body.portrait #brand{display:none}
body.portrait #controls{top:max(44px,calc(env(safe-area-inset-top) + 34px))}
body.portrait #hint{top:max(92px,calc(env(safe-area-inset-top) + 82px))}
body.portrait #note{display:none}
body.portrait #capText{font-size:clamp(18px,4.8vw,22px);line-height:1.62}
body.portrait #progress li{font-size:11px}
@media (max-height:540px){#capText{font-size:17px;line-height:1.5}#caption{padding:8px 14px 6px}.actions{margin-top:6px}}
@media (prefers-reduced-motion: reduce){
  #intro,#caption{transition-duration:.4s}
  #hint.on,.btn-main{animation:none}
  #capText .ch{animation-duration:.25s;animation-delay:0s}
}

<script>
// Haqi H5 protocol v1: independent pages remain usable without a parent.
(()=>{let context=null,written=false,finished=false,serial=0;const callbacks=new Map(),subCache=new Map(),uiCache=new Map(),pending=new Set(),uiNodes=new Map();
const isZh=loc=>!loc||/^zh\b/i.test(loc);
const send=data=>{if(context)parent.postMessage({channel:'haqi-hanzi',version:1,entryId:context.entryId,sessionId:context.sessionId,...data},context.origin);};
const refreshDom=()=>{for(const[el,zh]of uiNodes){if(!el?.isConnected){uiNodes.delete(el);continue;}const tr=!isZh(context?.locale)&&uiCache.get(zh);const next=(tr&&tr!==zh)?tr:zh;if(el.dataset.haqiKind==='seal'){const seal=el.querySelector('.seal');el.textContent=next;if(seal)el.prepend(seal);}else if(el.dataset.haqiKind==='tag'){const i1=document.createElement('i'),i2=document.createElement('i');el.replaceChildren(i1,document.createTextNode(next),i2);}else el.textContent=next;}document.querySelectorAll('[data-haqi-caption]').forEach(el=>renderCaption(el,el.dataset.haqiCaption));};
const flushPending=()=>{if(!context||!pending.size)return;const texts=[...pending];pending.clear();window.haqiHanziTranslate(texts);};
const ensureTexts=texts=>{const need=[];for(const t of texts){const s=typeof t==='string'?t.trim():'';if(s&&(!subCache.has(s)||!uiCache.has(s))&&!pending.has(s)){pending.add(s);need.push(s);}}if(need.length&&context)flushPending();};
const renderCaption=(el,zh)=>{if(!el)return;el.dataset.haqiCaption=zh||'';let sub=el.querySelector('.haqi-sub-trans');if(!zh||isZh(context?.subtitleLocale||context?.locale)){sub?.remove();return;}const tr=subCache.get(zh);if(!tr||tr===zh){sub?.remove();ensureTexts([zh]);return;}if(!sub){sub=document.createElement('span');sub.className='haqi-sub-trans';const host=el.querySelector('#capText')||el;if(host!==el&&host.parentNode===el)host.insertAdjacentElement('afterend',sub);else el.appendChild(sub);}sub.textContent=tr;};
const trackUi=(el,zh,kind='')=>{if(!el||!zh)return;if(kind)el.dataset.haqiKind=kind;uiNodes.set(el,zh);ensureTexts([zh]);};
const scanStatic=()=>{if(!document.body)return;document.querySelectorAll('#start,#replay,#mute,#demo,#action,#progress li,#seasonBar button,#note,.introBottom .mean,.introBottom .sub,.introBottom .meta,.heading .eyebrow,.heading h1,.heading .deck,.edition,.colophon,#glyphLabel,#targets .svg-label').forEach(el=>{const zh=(el.textContent||'').trim();if(zh&&!uiNodes.has(el))trackUi(el,zh);});document.querySelectorAll('#brand,.brand').forEach(el=>{if(uiNodes.has(el))return;const clone=el.cloneNode(true);clone.querySelector?.('.seal')?.remove();const zh=(clone.textContent||'').trim();if(zh)trackUi(el,zh,'seal');});document.querySelectorAll('.introTop .tag,.tag').forEach(el=>{if(uiNodes.has(el))return;const zh=(el.textContent||'').trim();if(zh)trackUi(el,zh,'tag');});refreshDom();};
if(document.readyState==='loading')addEventListener('DOMContentLoaded',scanStatic,{once:true});else scanStatic();
window.haqiHanziWritten=()=>{written=true;send({type:'written'});};
window.haqiHanziComplete=()=>{if(!written){written=true;send({type:'written'});}finished=true;send({type:'completed'});};
window.haqiHanziPrefetch=texts=>ensureTexts(Array.isArray(texts)?texts:[texts]);
window.haqiHanziUi=(zh,el)=>{const s=typeof zh==='string'?zh.trim():'';if(!s)return zh;if(el)trackUi(el,s);else ensureTexts([s]);const tr=!isZh(context?.locale)&&uiCache.get(s);return(tr&&tr!==s)?tr:zh;};
window.haqiHanziCaption=(el,zh)=>{const s=typeof zh==='string'?zh.trim():'';if(s)ensureTexts([s]);renderCaption(el,s);};
window.haqiHanziTranslate=texts=>new Promise(resolve=>{const list=(Array.isArray(texts)?texts:[]).map(t=>typeof t==='string'?t.trim():'').filter(Boolean);if(!context||!list.length){resolve({});return;}const requestId=String(++serial);const timer=setTimeout(()=>{callbacks.delete(requestId);resolve({});},1500);callbacks.set(requestId,msg=>{clearTimeout(timer);const sub=msg?.translations||{},ui=msg?.uiTranslations||sub;for(const[k,v]of Object.entries(sub))if(typeof v==='string'&&v.trim())subCache.set(k,v.trim());for(const[k,v]of Object.entries(ui))if(typeof v==='string'&&v.trim())uiCache.set(k,v.trim());refreshDom();resolve(sub);});send({type:'translate',requestId,texts:list});});
addEventListener('message',event=>{const m=event.data;if(event.source!==parent||parent===window||m?.channel!=='haqi-hanzi'||m.version!==1)return;
if(m.type==='init'&&typeof m.sessionId==='string'&&typeof m.entryId==='string'){if(document.referrer&&event.origin!==new URL(document.referrer).origin)return;context={...m,origin:event.origin};scanStatic();flushPending();refreshDom();if(written)send({type:'written'});if(finished)send({type:'completed'});}
else if(context&&event.origin===context.origin&&m.sessionId===context.sessionId&&m.type==='translations'){callbacks.get(m.requestId)?.(m);callbacks.delete(m.requestId);}});
if(parent!==window)parent.postMessage({channel:'haqi-hanzi',version:1,type:'ready'},'*');})();
</script>

<script>
(() => {
'use strict';

const $ = s => document.querySelector(s);
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));

const ease = {
  inOut: t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2,

function mulberry32(a) {
  return () => {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;

}
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- 虚拟时钟：页面隐藏时暂停，回来不跳帧 ---------- */

function frame(tk) { return new Promise((res, rej) => waiters.push({ tk, res, rej })); }

const NOTE = { D3: 146.83, A3: 220, D4: 293.66, E4: 329.63, Fs4: 369.99, A4: 440, B4: 493.88, D5: 587.33, E5: 659.26, Fs5: 739.99, A5: 880 };

const Sound = {
  ctx: null, master: null, wet: null, noise: null, muted: false, padOn: false, breathG: null, padF: null,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }

  pluck(f, vol = 0.16, dur = 2.6) {

function frameW(v) { return portrait ? (v.pw ?? v.w * 0.62) : v.w; }

const STARS = [];
(() => {
  const r = mulberry32(99);

function buildSky() {

/* ---------- 人物：跪坐的阿禾、背柴的阿爸 ---------- */
function ik(sx, sy, tx, ty, l1, l2, bend) {
  let dx = tx - sx, dy = ty - sy;

  const maxd = l1 + l2 - 0.01;
  if (d > maxd) { dx *= maxd / d; dy *= maxd / d; d = maxd; }
  d = Math.max(d, 0.001);
  const a = Math.atan2(dy, dx);
  const ang = a + bend * Math.acos(clamp((l1 * l1 + d * d - l2 * l2) / (2 * l1 * d), -1, 1));
  return { ex: sx + Math.cos(ang) * l1, ey: sy + Math.sin(ang) * l1, hx: sx + dx, hy: sy + dy };

function line(c, pts, w, col) {

  for (let i = 2; i < pts.length; i += 2) c.lineTo(pts[i], pts[i + 1]);

function childGeom() {
  const x = CHILD_X, y = groundY(CHILD_X), L = W.child.lean;

  const head = { x: sh.x + 3 + L * 8, y: sh.y - 16 + L * 3 };
  return { x, y, sh, head };
}

  const g = childGeom();

  return liftPoint(W.child.lift);
}
function liftPoint(u) {

  const l0 = W.child.lean;
  await tween(1000 * M, t => { W.child.lean = lerp(l0, 0.9, t); W.child.hold = t; }, tk);
  await captionDone(tk);
  hint('把火盆往上拖，举过阿禾的头顶');
  setAction('举起火盆', () => { done = done || 'user'; });
  mode('drag');
  W.liftTarget = 1;
  let done = null, drag = null, idle = clock;
  const setU = u => { W.child.lift = clamp(u); W.child.lean = lerp(0.9, 0, smooth(W.child.lift)); W.reach = lerp(210, 300, W.child.lift); };
  const nearestU = p => { let best = 0, bd = Infinity; for (let i = 0; i <= 60; i++) { const q = liftPoint(i / 60); const d = Math.hypot(q.x - p.x, q.y - p.y); if (d < bd) { bd = d; best = i / 60; } } return best; };
  S.handler = {
    down(p) { drag = { start: p, u0: W.child.lift }; idle = clock; Sound.hiss(0.15, 700, 0.04); },
    move(p) {
      if (!drag) return; idle = clock;
      // 相对拖动：从任何位置往上推都行；靠近火盆时直接跟手
      const b = bowlPos();
      const dy = drag.start.y - p.y;
      const rel = clamp(drag.u0 + dy / 120);
      const near = Math.hypot(p.x - b.x, p.y - b.y) < 60 ? nearestU(p) : rel;
      setU(Math.max(rel, near * 0.5 + rel * 0.5));
    },
    up(p, cancel) { drag = null; idle = clock; if (!cancel && W.child.lift > 0.82) done = 'user'; },
  };
  while (!done) {
    await frame(tk);
    if (!drag && W.child.lift > 0) setU(W.child.lift - DT / 700);
    if (!drag && clock - idle > 10000) done = 'auto';
  }
  S.handler = null; mode(null); setAction(null); hint(null);
  S.interactions.push(done);
  W.liftTarget = 0;
  const u0 = W.child.lift;
  await tween((done === 'auto' ? 1600 : 500) * M, t => setU(lerp(u0, 1, t)), tk, ease.out);
  Sound.pluck(NOTE.D4, 0.2, 3.2); Sound.pluck(NOTE.A4, 0.14, 3.2); Sound.bell(NOTE.Fs5, 0.05);
  Sound.warm(0.7);
  bg(tween(2400 * M, t => { W.reach = lerp(300, 620, t); W.fire = lerp(0.62, 1, t); W.rim = lerp(0.32, 0.22, t); }, tk, ease.out));
  await caption('举火', '她把火盆高高举过头顶。', tk);
  await caption('举火', '火举得越高，光就照得越远。', tk);
  await captionDone(tk);
}

async function sPass(tk) {
  progress(3);
  await camTo(VIEW.wide, 4600 * M, tk);
  await caption('传光', '远远的山上，阿爸看见了一点光。', tk);
  await wait(1200, tk);
  W.father.face = -1;
  Sound.bell(NOTE.A4, 0.08);
  await caption('传光', '可山路太长，一盆火照不了那么远。', tk);
  await caption('传光', '村里人醒了，把火传进路边的石灯。', tk);
  await captionDone(tk);
  let src = (() => { const b = bowlPos(); return { x: b.x, y: b.y - 30 }; })();
  for (let i = 0; i < 3; i++) {
    const lamp = lanternLamp(i);
    const fx = portrait ? lamp.x - 90 : (src.x + lamp.x) / 2 + 80;
    await camTo({ x: fx, y: (src.y + lamp.y) / 2 + 30, w: 1250, h: 700, pw: 620 }, 1700 * M, tk);
    W.lanterns[i].ready = true;
    hint(`点亮第${'一二三'[i]}盏石灯`);
    let done = null;
    setAction('点亮石灯', () => { done = done || 'user'; });
    mode('sky');
    S.handler = {
      down(p) {
        const tol = Math.max(90, 46 / CV.k);
        if (Math.hypot(p.x - lamp.x, p.y - lamp.y) < tol) done = 'user';
        else hint(`点一点发光圆圈里的石灯`);
      },
    };
    const t0 = clock;
    while (!done) { await frame(tk); if (clock - t0 > 8000) done = 'auto'; }
    S.handler = null; mode(null); setAction(null); hint(null);
    S.interactions.push(done);
    W.lanterns[i].ready = false;
    Sound.hiss(0.9, 1800, 0.05, 0.6, true);
    await flySpark(src, { x: lamp.x, y: lamp.y }, 1100 * M, tk);
    Sound.bell([NOTE.D5, NOTE.E5, NOTE.A5][i], 0.11);
    Sound.pluck([NOTE.D4, NOTE.Fs4, NOTE.A4][i], 0.12);
    await tween(700 * M, t => { W.lanterns[i].lit = t; }, tk, ease.out);
    src = lamp;
  }
  Sound.warm(0.85);
  bg(camTo(VIEW.wide, 3200 * M, tk));
  await caption('传光', '一盏、两盏、三盏——光，连成了一条路。', tk);
  await captionDone(tk);
}

async function sHome(tk) {
  await caption('回家', '阿爸顺着光，一步一步走回了家。', tk);
  const x0 = W.father.x, x1 = CHILD_X + 92;
  const from = { x: cam.x, y: cam.y, w: cam.w, h: cam.h, pw: cam.pw, pcy: cam.pcy };
  await tween(11000 * M, t => {
    W.father.x = lerp(x0, x1, t);
    W.father.walk = Math.min(1, t * 8, (1 - t) * 10);
    const k = Math.min(1, t * 3);
    cam.x = lerp(from.x, clamp(W.father.x - 120, 900, 2700), k);
    cam.y = lerp(from.y, groundY(W.father.x) - 90, k);
    cam.w = lerp(from.w, 1500, k); cam.h = lerp(from.h, 820, k); cam.pw = lerp(from.pw, 760, k); cam.pcy = lerp(from.pcy, 0.52, k);
  }, tk, ease.lin);
  W.father.walk = 0;
  await camTo(VIEW.reunion, 1800 * M, tk);
  await tween(1200 * M, t => { W.father.reach = t; }, tk);
  Sound.pluck(NOTE.D4, 0.16, 3.4); Sound.pluck(NOTE.Fs4, 0.12, 3.4); Sound.pluck(NOTE.A4, 0.1, 3.4);
  await caption('回家', '“是你的光，把我领回来的。”', tk, 800);
  await captionDone(tk);
}

function spawnConverge() {
  const g = childGeom();
  const b = bowlPos();
  const list = [];
  const r = mulberry32(42);
  for (let i = 0; i < 6; i++) {
    for (let j = 0; j <= N; j += 3) {
      const [lx, ly] = OPTS[i][j];
      const fromFire = i < 4;
      const sx = fromFire ? b.x + (r() - 0.5) * 50 : g.x + (r() - 0.5) * 60;
      const sy = fromFire ? b.y - r() * 60 : g.y - 10 - r() * 80;
      list.push({ sx, sy, tx: GL.cx + (lx - 50) * GL.s, ty: GL.cy + (ly - 50) * GL.s, delay: r() * 900 + i * 120, dur: 1300 + r() * 600, s: 1.4 + r() * 2.2, curl: (r() - 0.5) * 120, t0: clock });
    }
  }
  W.converge = list;
}

async function sGlyph(tk) {
  progress(4);
  bg(camTo(VIEW.glyph, 2600 * M, tk));
  await caption('成字', '三千多年前，古人也见过这样的光。', tk);
  W.veilHole = 1;
  await tween(2000 * M, t => { W.father.alpha = 1 - t; W.veil = 0.88 * t; W.rim = 0.22 * (1 - t); }, tk);
  await caption('成字', '一个跪坐的人，头顶燃着火——他们把它刻成了字。', tk);
  Object.assign(GL, { cx: 830, cy: 545, s: 3.6 });
  W.glyph = { ...W.glyph, alpha: 1, morph: 0, prog: [0, 0, 0, 0, 0, 0], glow: 1, labels: 0 };
  spawnConverge();
  Sound.hiss(2.6, 3000, 0.04, 0.5, true);
  const fire0 = W.fire, reach0 = W.reach;
  await tween(3000 * M, t => {
    W.child.alpha = 1 - smooth(t * 1.4);
    W.fire = fire0 * (1 - smooth(t * 1.2)); W.reach = reach0 * (1 - smooth(t * 1.2));
    W.veilHole = 1 - smooth(t * 1.3);
    for (let i = 0; i < 6; i++) W.glyph.prog[i] = smooth((t - 0.38 - i * 0.07) / 0.3);
  }, tk, ease.lin);
  W.glyph.prog = [1, 1, 1, 1, 1, 1];
  W.converge = [];
  Sound.bell(NOTE.D5, 0.1); Sound.pluck(NOTE.A4, 0.12);
  await caption('甲骨文', '这就是甲骨文里的「光」：火，在人的上面。', tk);
  await caption('说文解字', '《说文解字》：“光，明也。从火在人上。”', tk, 600);
  await captionDone(tk);
  Sound.hiss(2.4, 1400, 0.035, 0.6, true);
  await tween(3200 * M, t => { W.glyph.morph = t; }, tk, ease.lin);
  Sound.bell(NOTE.A5, 0.07);
  bg(tween(800, t => { W.glyph.labels = t; W.glyph.split = t; }, tk));
  await caption('楷书', '上面的火，化作了四笔；下面的人，化作了“儿”。', tk, 600);
  await captionDone(tk);
  await tween(700, t => { W.glyph.labels = 1 - t; W.glyph.split = 1 - t; }, tk);
}

async function sWrite(tk) {
  progress(5);
  await caption('写字', '「光」一共六笔。跟着光点，写一写。', tk);
  await tween(900, t => { W.glyph.prog = W.glyph.prog.map(() => 1 - t); W.glyph.ghost = t; }, tk);
  W.glyph.prog = [0, 0, 0, 0, 0, 0];
  W.glyph.trace = true; W.trace = { stroke: 0, pen: null };
  W.drift = 0;
  const names = MODERN.map(s => s.name);
  const showStroke = () => {
    capMinEnd = 0;
    showCaption('写字', `第 ${W.trace.stroke + 1} 笔 · ${names[W.trace.stroke]}`);
    hint('从橙色光点起笔，顺着虚线写');
  };
  await captionDone(tk);
  showStroke();
  let samples = null, drag = null, lastInput = clock, demoing = false, completed = 0, invalidHint = 0;
  const prepare = () => { samples = MPTS[W.trace.stroke]; };
  prepare();
  const finishStroke = () => {
    const i = W.trace.stroke;
    W.glyph.prog[i] = 1;
    Sound.pluck(PENTA[i + 1], 0.13, 2);
    W.trace.stroke++;
    completed++;
    if (W.trace.stroke < 6) { prepare(); showStroke(); }
  };
  const tolLocal = () => Math.max(7, 22 / (CV.k * GL.s));
  S.handler = {
    down(p) {
      if (demoing) return;
      lastInput = clock;
      const q = toLocal(p.x, p.y);
      if (Math.hypot(q.x - samples[0][0], q.y - samples[0][1]) > tolLocal() * 1.3) { hint('从这一笔的橙色光点开始哦'); return; }
      drag = { idx: 0, bad: false };
      Sound.breath(true);
    },
    move(p) {
      if (!drag) return;
      lastInput = clock;
      const q = toLocal(p.x, p.y);
      let best = drag.idx, bd = Infinity;
      for (let j = Math.max(0, drag.idx - 3); j < Math.min(samples.length, drag.idx + 16); j++) {
        const d = Math.hypot(q.x - samples[j][0], q.y - samples[j][1]);
        if (d < bd) { bd = d; best = j; }
      }
      if (bd > tolLocal()) { drag.bad = true; return; }
      if (drag.bad) return;
      drag.idx = Math.max(drag.idx, best);
      W.glyph.prog[W.trace.stroke] = drag.idx / N;
    },
    up(p, cancel) {
      Sound.breath(false);
      if (!drag) return;
      const d = drag; drag = null;
      if (!cancel && !d.bad && d.idx >= N - 4) { finishStroke(); return; }
      const i = W.trace.stroke, from = W.glyph.prog[i];
      bg(tween(260, t => { if (W.trace.stroke === i) W.glyph.prog[i] = from * (1 - t); }, tk));
      if (clock - invalidHint > 400) { hint(d.bad ? '离虚线有点远了，从光点重新写这一笔' : '把这一笔写到箭头那里'); invalidHint = clock; }
    },
  };
  const demo = async () => {
    if (demoing || W.trace.stroke >= 6) return;
    demoing = true; ui.demo.disabled = true; drag = null;
    hint('看光点走过每一笔，你也可以跟着比画');
    while (W.trace.stroke < 6) {
      const i = W.trace.stroke;
      W.glyph.prog[i] = 0;
      await tween(900 * M, t => { W.glyph.prog[i] = t; const pts = MPTS[i]; W.trace.pen = pts[Math.round(t * N)]; }, tk, ease.sine);
      W.trace.pen = null;
      finishStroke();
      await wait(260, tk);
    }
  };
  S.demo = () => { S.interactions.push('demo'); bg(demo()); };
  mode('trace');
  ui.demo.hidden = false;
  lastInput = clock;
  let nudged = false;
  while (W.trace.stroke < 6) {
    await frame(tk);
    if (!demoing && !nudged && clock - lastInput > 14000) { hint('写不出来也没关系，点“看示范”'); nudged = true; }
    if (!demoing && completed === 0 && clock - lastInput > 26000) { S.interactions.push('auto'); bg(demo()); }
  }
  S.handler = null; S.demo = null; mode(null); hint(null);
  ui.demo.hidden = true; ui.demo.disabled = false;
  W.glyph.trace = false;
  if (!S.interactions.includes('demo') && !S.interactions.includes('auto')) S.interactions.push('user');
  window.haqiHanziWritten?.();
  await tween(600, t => { W.glyph.ghost = 1 - t; }, tk);
  Sound.bell(NOTE.D5, 0.1); Sound.bell(NOTE.A5, 0.06);
  await caption('写字', '写好了！光，光明的光。', tk);
  await captionDone(tk);
  W.drift = 1;
}

async function sWords(tk) {
  progress(6);
  const g0 = { ...GL };
  await tween(1600 * M, t => { GL.cy = lerp(g0.cy, 500, t); GL.s = lerp(g0.s, 3.0, t); W.glyph.rays = t; }, tk);
  for (let i = 0; i < 3; i++) {
    W.wordOn = i;
    Sound.pluck(PENTA[3 + i], 0.12);
    bg(tween(600, t => { W.glyph.words = Math.max(W.glyph.words, i + t); }, tk, ease.out));
    await caption(WORDS[i][0], WORDS[i][1], tk);
  }
  await captionDone(tk);
  W.wordOn = -1;
}

async function sFinale(tk) {
  progress(7);
  W.child.lean = 0; W.child.hold = 1; W.child.lift = 1; W.father.reach = 1;
  bg(camTo(VIEW.finale, 4200 * M, tk));
  await tween(2200 * M, t => {
    W.glyph.alpha = 1 - t; W.veil = 0.88 * (1 - t);
    W.child.alpha = t; W.father.alpha = t; W.fire = t; W.reach = 620 * t; W.rim = 0.12 * t;
  }, tk);
  W.glyph = { ...W.glyph, alpha: 0, words: 0, rays: 0 };
  Sound.warm(1);
  for (let i = 0; i < HUTS.length; i++) {
    const order = [2, 1, 0, 3][i];
    Sound.bell(PENTA[2 + i], 0.07);
    await tween(600 * M, t => { W.windows[order] = t; }, tk, ease.out);
    await wait(200, tk);
  }
  bg(tween(5000, t => { W.skyWarm = t; W.dark = lerp(0.9, 0.82, t); }, tk));
  await caption('尾声', '光，不会自己走进黑夜。', tk);
  const launch = (x, y) => {
    W.skyL.push({ x, y, vy: 34 + rand() * 18, age: 0, p: rand() * 6 });
    Sound.pluck(PENTA[(rand() * PENTA.length) | 0], 0.09, 2.4);
  };
  [[CHILD_X + 6, groundY(CHILD_X) - 170], [LANTERN_X[0], groundY(LANTERN_X[0]) - 140], [LANTERN_X[1], groundY(LANTERN_X[1]) - 140]].forEach(([x, y], i) => setTimeout(() => !tk.dead && launch(x, y), i * 1100));
  await caption('尾声', '总要有一个人，先把火举起来。', tk, 800);
  await captionDone(tk);
  hint('点一点夜空，放一盏孔明灯');
  mode('sky');
  setAction('再看一次', () => { Sound.init(); begin(); });
  S.handler = { down(p) { launch(p.x, p.y); hint(null); } };
  window.__guang.finished = true; window.haqiHanziComplete();
}

const SCENES = [sNight, sKindle, sLift, sPass, sHome, sGlyph, sWrite, sWords, sFinale];

async function begin() {
  token.dead = true;
  const tk = token = { dead: false };
  capMinEnd = 0;
  waiters.forEach(w => w.rej(new Cancelled())); waiters = [];
  resetWorld();
  Object.assign(cam, VIEW.intro);
  S.handler = null; S.demo = null; mode(null); setAction(null); hint(null);
  ui.demo.hidden = true; ui.demo.disabled = false;
  ui.cap.classList.remove('on');
  Sound.breath(false);
  rand = mulberry32(20261014);
  S.interactions = [];
  window.__guang = { interactions: S.interactions, scene: null, finished: false, toScreen, localToScreen, strokes: MPTS, liftPoint, lanternLamp, state: W };
  // 片头的大字留在夜空里，开场再慢慢淡去
  W.glyph.alpha = 1; W.glyph.prog = [1, 1, 1, 1, 1, 1]; W.glyph.morph = 1;
  try {
    for (const sc of SCENES) { window.__guang.scene = sc.name; await sc(tk); }
  } catch (e) {
    if (!(e instanceof Cancelled)) console.error(e);
  }
}

/* ---------- 片头：夜空里写出「光」 ---------- */
const intro = { tk: { dead: false } };
function placeIntro() {
  if (intro.tk.dead) return;
  const a = localToScreen(50, 0), b = localToScreen(50, 100);
  const box = $('#intro');
  box.style.setProperty('--gTop', `${a.y}px`);
  box.style.setProperty('--gBottom', `${b.y}px`);
}
async function introPlay(tk) {
  W.glyph.alpha = 1; W.glyph.morph = 1; W.glyph.prog = [0, 0, 0, 0, 0, 0];
  await wait(700, tk);
  for (let i = 0; i < 6; i++) {
    await tween(380 + MODERN[i].d.length * 9, t => { W.glyph.prog[i] = t; }, tk, ease.sine);
    await wait(90, tk);
  }
  for (;;) {
    await frame(tk);
    W.glyph.glow = 1 + 0.25 * Math.sin(clock / 700);
    if (W.child.alpha > 0 && rand() < DT / 260) spawnEmber(bowlPos().x, bowlPos().y - 2, 0.15);
  }
}

resetWorld();
Object.assign(cam, VIEW.intro);
window.__guang = { interactions: [], scene: 'intro', finished: false, toScreen, localToScreen, strokes: MPTS, liftPoint, lanternLamp, state: W };
resize();
updateView();
addEventListener('resize', () => { resize(); updateView(); placeIntro(); });
requestAnimationFrame(loop);
requestAnimationFrame(() => { updateView(); placeIntro(); });
bg(introPlay(intro.tk));

$('#start').addEventListener('click', () => {
  Sound.init(); Sound.pad();
  intro.tk.dead = true;
  $('#intro').classList.add('off');
  document.body.classList.add('started');
  W.glyph.glow = 1;
  begin();
});
$('#replay').addEventListener('click', () => { Sound.init(); begin(); });
$('#mute').addEventListener('click', e => {
  Sound.setMuted(!Sound.muted);
  const zh = Sound.muted ? '声音 关' : '声音 开';
  e.currentTarget.textContent = window.haqiHanziUi ? window.haqiHanziUi(zh, e.currentTarget) : zh;
});
addEventListener('blur', () => { W.holding = false; ui.action.classList.remove('holding'); });
})();
</script>

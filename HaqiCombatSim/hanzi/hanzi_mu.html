<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="icon" href="data:,">
<title>木 · 破土而出的树冠、树干与树根</title>
<style>
  :root {
    --gold: #8ef09a;
    --gold-soft: #d6fad8;
    --ink: #07140e;
    --wood: #c88c52;
    --amber: #f4a442;
    --ui-bg: rgba(8, 22, 15, 0.76);
    --ui-border: rgba(142, 240, 154, 0.36);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #07140e;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Serif SC", serif;
    color: #f0fff2;
    touch-action: none;
  }
  #stage {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    display: block;
    cursor: pointer;
  }

  /* 顶部进度条 */
  #hud {
    position: fixed; top: 18px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 10px;
    padding: 8px 16px;
    border-radius: 999px;
    background: var(--ui-bg);
    border: 1px solid var(--ui-border);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    z-index: 20;
    opacity: 0;
    transition: opacity .6s ease;
    pointer-events: none;
    max-width: calc(100vw - 96px);
  }
  #hud.show { opacity: 1; }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: rgba(255,255,255,0.22);
    transition: all .45s cubic-bezier(.2,.9,.3,1.3);
  }
  .dot.done { background: rgba(142, 240, 154, 0.68); }
  .dot.active {
    width: 24px; border-radius: 999px;
    background: linear-gradient(90deg, #b8f8a8, #44c468);
    box-shadow: 0 0 12px rgba(82, 214, 118, 0.78);
  }
  #hud-label {
    font-size: 12px; letter-spacing: 2px;
    color: rgba(238, 255, 242, 0.88);
    margin-left: 4px;
    white-space: nowrap;
  }

  /* 右上角工具栏 */
  #tools {
    position: fixed; top: 16px; right: 16px;
    display: flex; gap: 8px;
    z-index: 25;
  }
  .icon-btn {
    width: 38px; height: 38px; border-radius: 50%;
    background: var(--ui-bg);
    border: 1px solid var(--ui-border);
    color: var(--gold-soft);
    display: grid; place-items: center;
    cursor: pointer;
    backdrop-filter: blur(10px);
    transition: transform .2s ease, background .2s ease, border-color .2s ease;
  }
  .icon-btn:hover { transform: scale(1.06); border-color: rgba(142, 240, 154, 0.75); }
  .icon-btn:active { transform: scale(0.95); }
  .icon-btn svg { width: 18px; height: 18px; fill: currentColor; }

  /* 底部字幕与旁白 */
  #caption-wrap {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
    width: min(740px, 92vw);
    text-align: center;
    z-index: 20;
    pointer-events: none;
  }
  #caption {
    display: inline-block;
    padding: 13px 26px;
    border-radius: 20px;
    background: rgba(8, 22, 15, 0.8);
    border: 1px solid rgba(142, 240, 154, 0.28);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 14px 40px rgba(0,0,0,0.48);
    opacity: 0;
    transform: translateY(10px);
    transition: opacity .5s ease, transform .5s ease;
  }
  #caption.show { opacity: 1; transform: translateY(0); }
  #caption .zh {
    font-size: clamp(17px, 2.3vw, 22px);
    letter-spacing: 1.5px;
    line-height: 1.55;
    color: #f4fff6;
    text-shadow: 0 2px 10px rgba(0,0,0,0.6);
  }
  #caption .zh em {
    font-style: normal;
    color: var(--gold);
    font-weight: 600;
    padding: 0 2px;
  }
  #caption .sub {
    display: block;
    margin-top: 4px;
    font-size: clamp(12px, 1.5vw, 13.5px);
    color: rgba(214, 250, 216, 0.72);
    letter-spacing: 1px;
  }

  /* 交互提示气泡 */
  #prompt {
    position: fixed; left: 50%; bottom: 118px; transform: translateX(-50%);
    padding: 9px 20px;
    border-radius: 999px;
    background: rgba(68, 196, 104, 0.18);
    border: 1px solid rgba(142, 240, 154, 0.58);
    color: var(--gold-soft);
    font-size: 14px;
    letter-spacing: 2px;
    z-index: 20;
    opacity: 0;
    pointer-events: none;
    transition: opacity .4s ease, transform .4s ease;
    box-shadow: 0 0 24px rgba(68, 196, 104, 0.28);
    animation: pulsePrompt 2.2s ease-in-out infinite;
    white-space: nowrap;
  }
  #prompt.show { opacity: 1; }
  @keyframes pulsePrompt {
    0%,100% { transform: translateX(-50%) scale(1); box-shadow: 0 0 18px rgba(68, 196, 104, 0.24); }
    50% { transform: translateX(-50%) scale(1.04); box-shadow: 0 0 28px rgba(102, 224, 132, 0.52); }
  }

  /* 独立动作按钮（催芽幕等） */
  #act-btn {
    position: fixed; left: 50%; bottom: 114px; transform: translateX(-50%);
    padding: 12px 30px;
    border-radius: 999px;
    background: linear-gradient(135deg, rgba(164, 244, 132, 0.94), rgba(52, 168, 86, 0.94));
    border: 1px solid rgba(226, 255, 224, 0.82);
    color: #061c0f;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 3px;
    cursor: pointer;
    z-index: 23;
    opacity: 0;
    pointer-events: none;
    transform: translateX(-50%) translateY(8px);
    transition: opacity .35s ease, transform .35s ease, box-shadow .25s ease;
    box-shadow: 0 10px 30px rgba(68, 196, 104, 0.45), 0 0 24px rgba(142, 240, 154, 0.52);
  }
  #act-btn.show {
    opacity: 1;
    pointer-events: auto;
    transform: translateX(-50%) translateY(0);
    animation: actPulse 1.9s ease-in-out infinite;
  }
  #act-btn:hover { box-shadow: 0 12px 34px rgba(68, 196, 104, 0.65), 0 0 32px rgba(142, 240, 154, 0.75); }
  #act-btn:active { transform: translateX(-50%) scale(0.95); }
  @keyframes actPulse {
    0%,100% { transform: translateX(-50%) scale(1); }
    50% { transform: translateX(-50%) scale(1.05); }
  }

  /* 部件拆解卡片（成字幕） */
  #radicals {
    position: fixed; left: 50%; top: 68px; transform: translateX(-50%);
    display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;
    z-index: 21;
    opacity: 0; visibility: hidden; pointer-events: none;
    transition: opacity .2s ease;
    width: min(94vw, 680px);
  }
  #radicals.show { opacity: 1; visibility: visible; }
  .rad-pill {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 14px;
    border-radius: 999px;
    background: rgba(8, 22, 15, 0.82);
    border: 1px solid rgba(142, 240, 154, 0.34);
    backdrop-filter: blur(8px);
    font-size: 13px;
    color: #f0fff2;
    transition: all .4s ease;
  }
  .rad-pill.lit {
    border-color: var(--gold);
    box-shadow: 0 0 18px rgba(102, 224, 132, 0.48);
    transform: translateY(-2px);
  }
  .rad-dot {
    width: 10px; height: 10px; border-radius: 50%;
  }

  /* 词语卡片（林木幕） */
  #words {
    position: fixed; left: 50%; bottom: 118px; transform: translateX(-50%);
    display: flex; gap: 14px; flex-wrap: wrap; justify-content: center;
    z-index: 22;
    opacity: 0; pointer-events: none;
    transition: opacity .5s ease;
    width: min(92vw, 720px);
  }
  #words.show { opacity: 1; pointer-events: auto; }
  .word-card {
    min-width: 156px;
    padding: 12px 18px;
    border-radius: 16px;
    background: rgba(10, 26, 18, 0.86);
    border: 1px solid rgba(142, 240, 154, 0.36);
    backdrop-filter: blur(10px);
    text-align: center;
    cursor: pointer;
    transform: translateY(14px) scale(0.94);
    opacity: 0;
    transition: all .45s cubic-bezier(.2,.9,.3,1.2);
  }
  .word-card.in {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
  .word-card.active, .word-card:hover {
    border-color: var(--gold);
    background: rgba(24, 64, 38, 0.9);
    box-shadow: 0 8px 26px rgba(68, 196, 104, 0.35);
    transform: translateY(-3px) scale(1.03);
  }
  .word-card .w-py {
    font-size: 12px; color: rgba(214, 250, 216, 0.78);
    letter-spacing: 1.5px;
  }
  .word-card .w-zh {
    font-size: 24px; color: #fff;
    letter-spacing: 4px; margin: 3px 0 4px;
    font-weight: 600;
  }
  .word-card .w-zh b { color: var(--gold); }
  .word-card .w-desc {
    font-size: 12px; color: rgba(235, 252, 238, 0.76);
  }

  /* 描红辅助按钮栏 */
  #write-bar {
    position: fixed; left: 50%; top: 68px; transform: translateX(-50%);
    display: flex; align-items: center; gap: 10px;
    padding: 6px 14px;
    border-radius: 999px;
    background: rgba(8, 22, 15, 0.84);
    border: 1px solid rgba(142, 240, 154, 0.36);
    backdrop-filter: blur(8px);
    z-index: 22;
    opacity: 0; pointer-events: none;
    transition: opacity .3s ease;
    white-space: nowrap;
  }
  #write-bar.show { opacity: 1; pointer-events: auto; }
  #stroke-counter {
    font-size: 13px; color: var(--gold-soft); letter-spacing: 1.5px;
    padding: 0 6px;
    white-space: nowrap;
  }
  .mini-btn {
    padding: 4px 12px;
    border-radius: 999px;
    background: rgba(142, 240, 154, 0.16);
    border: 1px solid rgba(142, 240, 154, 0.45);
    color: var(--gold-soft);
    font-size: 12px;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all .2s ease;
    white-space: nowrap;
  }
  .mini-btn:hover { background: rgba(142, 240, 154, 0.3); }

  /* 片头覆盖层 */
  #intro {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: flex-end;
    padding-bottom: clamp(46px, 9vh, 88px);
    background: radial-gradient(circle at 50% 42%, rgba(10, 32, 20, 0.08) 0%, rgba(6, 18, 12, 0.5) 64%, rgba(3, 10, 7, 0.86) 100%);
    z-index: 30;
    transition: opacity .85s ease;
  }
  #intro.hide { opacity: 0; pointer-events: none; }
  .intro-panel {
    display: flex; flex-direction: column; align-items: center;
    padding: 20px 32px 24px;
    border-radius: 26px;
    background: rgba(8, 22, 15, 0.66);
    border: 1px solid rgba(142, 240, 154, 0.3);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.5);
    text-align: center;
    max-width: 92vw;
  }
  .intro-py {
    font-size: clamp(14px, 2vw, 18px);
    letter-spacing: 5px;
    color: rgba(214, 250, 216, 0.88);
    margin-bottom: 6px;
  }
  .intro-sub {
    font-size: clamp(14px, 2vw, 17px);
    letter-spacing: 3px;
    color: rgba(235, 252, 238, 0.88);
    margin-bottom: 18px;
  }
  .start-btn {
    padding: 13px 38px;
    border-radius: 999px;
    background: linear-gradient(135deg, rgba(142, 240, 154, 0.32), rgba(52, 168, 86, 0.2));
    border: 1.5px solid rgba(142, 240, 154, 0.8);
    color: #fff;
    font-size: 16px;
    letter-spacing: 5px;
    cursor: pointer;
    box-shadow: 0 10px 32px rgba(0,0,0,0.45), 0 0 28px rgba(68, 196, 104, 0.32);
    transition: all .28s ease;
  }
  .start-btn:hover {
    transform: translateY(-2px) scale(1.03);
    background: linear-gradient(135deg, rgba(142, 240, 154, 0.48), rgba(52, 168, 86, 0.3));
    box-shadow: 0 12px 36px rgba(0,0,0,0.5), 0 0 36px rgba(68, 196, 104, 0.52);
  }

  /* 尾声重播气泡 */
  #replay {
    position: fixed; left: 50%; bottom: 116px; transform: translateX(-50%);
    padding: 11px 28px;
    border-radius: 999px;
    background: rgba(8, 22, 15, 0.85);
    border: 1.5px solid rgba(142, 240, 154, 0.7);
    color: var(--gold-soft);
    font-size: 14px;
    letter-spacing: 3px;
    cursor: pointer;
    z-index: 22;
    opacity: 0; pointer-events: none;
    transition: all .35s ease;
    box-shadow: 0 8px 28px rgba(0,0,0,0.45);
  }
  #replay.show { opacity: 1; pointer-events: auto; }
  #replay:hover {
    background: rgba(142, 240, 154, 0.24);
    transform: translateX(-50%) translateY(-2px);
  }

  /* 左下角古文字事实边界轻提示 */
  #fact-note {
    position: fixed; left: 16px; bottom: 10px;
    font-size: 11px;
    color: rgba(214, 244, 218, 0.42);
    letter-spacing: 0.8px;
    z-index: 15;
    pointer-events: none;
  }

  @media (max-width: 640px) {
    #hud { top: 12px; padding: 6px 12px; gap: 7px; max-width: calc(100vw - 88px); }
    #hud-label { font-size: 11px; letter-spacing: 1px; }
    #tools { top: 10px; right: 10px; gap: 6px; }
    .icon-btn { width: 34px; height: 34px; }
    #radicals { top: 54px; gap: 6px; }
    .rad-pill { padding: 5px 10px; font-size: 11.5px; }
    #write-bar { top: 54px; padding: 5px 12px; gap: 8px; white-space: nowrap; }
    #stroke-counter { font-size: 12px; white-space: nowrap; }
    .mini-btn { white-space: nowrap; }
    #caption-wrap { bottom: 14px; width: 94vw; }
    #caption { padding: 10px 14px; border-radius: 16px; }
    #prompt { bottom: 128px; font-size: 12px; padding: 6px 14px; max-width: 92vw; overflow: hidden; text-overflow: ellipsis; }
    #act-btn { bottom: 126px; padding: 10px 24px; font-size: 14.5px; }
    #replay { bottom: 128px; padding: 9px 22px; font-size: 13px; }
    #words { bottom: 126px; gap: 8px; }
    .word-card { min-width: 104px; padding: 8px 11px; border-radius: 12px; }
    .word-card .w-zh { font-size: 19px; letter-spacing: 2px; }
    .word-card .w-desc { font-size: 10.5px; }
    #fact-note { display: none; }
    .intro-panel { padding: 16px 22px 20px; }
  }

.haqi-sub-trans { display:block; font-size:.78em; opacity:.85; margin-top:6px; }
</style>
<script>
// Haqi H5 protocol v1: independent pages remain usable without a parent.
(()=>{let context=null,written=false,finished=false,serial=0;const callbacks=new Map(),subCache=new Map(),uiCache=new Map(),pending=new Set(),uiNodes=new Map();
const isZh=loc=>!loc||/^zh\b/i.test(loc);
const send=data=>{if(context)parent.postMessage({channel:'haqi-hanzi',version:1,entryId:context.entryId,sessionId:context.sessionId,...data},context.origin);};
const refreshDom=()=>{for(const[el,zh]of uiNodes){if(!el?.isConnected){uiNodes.delete(el);continue;}const tr=!isZh(context?.locale)&&uiCache.get(zh);const next=(tr&&tr!==zh)?tr:zh;if(el.dataset.haqiKind==='seal'){const seal=el.querySelector('.seal');el.textContent=next;if(seal)el.prepend(seal);}else if(el.dataset.haqiKind==='tag'){const i1=document.createElement('i'),i2=document.createElement('i');el.replaceChildren(i1,document.createTextNode(next),i2);}else el.textContent=next;}document.querySelectorAll('[data-haqi-caption]').forEach(el=>renderCaption(el,el.dataset.haqiCaption));};
const flushPending=()=>{if(!context||!pending.size)return;const texts=[...pending];pending.clear();window.haqiHanziTranslate(texts);};
const ensureTexts=texts=>{const need=[];for(const t of texts){const s=typeof t==='string'?t.trim():'';if(s&&(!subCache.has(s)||!uiCache.has(s))&&!pending.has(s)){pending.add(s);need.push(s);}}if(need.length&&context)flushPending();};
const renderCaption=(el,zh)=>{if(!el)return;el.dataset.haqiCaption=zh||'';let sub=el.querySelector('.haqi-sub-trans');if(!zh||isZh(context?.subtitleLocale||context?.locale)){sub?.remove();return;}const tr=subCache.get(zh);if(!tr||tr===zh){sub?.remove();ensureTexts([zh]);return;}if(!sub){sub=document.createElement('span');sub.className='haqi-sub-trans';const host=el.querySelector('#capText')||el;if(host!==el&&host.parentNode===el)host.insertAdjacentElement('afterend',sub);else el.appendChild(sub);}sub.textContent=tr;};
const trackUi=(el,zh,kind='')=>{if(!el||!zh)return;if(kind)el.dataset.haqiKind=kind;uiNodes.set(el,zh);ensureTexts([zh]);};
const scanStatic=()=>{if(!document.body)return;document.querySelectorAll('#start,#replay,#mute,#demo,#action,#progress li,#seasonBar button,#note,.introBottom .mean,.introBottom .sub,.introBottom .meta,.heading .eyebrow,.heading h1,.heading .deck,.edition,.colophon,#glyphLabel,#targets .svg-label').forEach(el=>{const zh=(el.textContent||'').trim();if(zh&&!uiNodes.has(el))trackUi(el,zh);});document.querySelectorAll('#brand,.brand').forEach(el=>{if(uiNodes.has(el))return;const clone=el.cloneNode(true);clone.querySelector?.('.seal')?.remove();const zh=(clone.textContent||'').trim();if(zh)trackUi(el,zh,'seal');});document.querySelectorAll('.introTop .tag,.tag').forEach(el=>{if(uiNodes.has(el))return;const zh=(el.textContent||'').trim();if(zh)trackUi(el,zh,'tag');});refreshDom();};
if(document.readyState==='loading')addEventListener('DOMContentLoaded',scanStatic,{once:true});else scanStatic();
window.haqiHanziWritten=()=>{written=true;send({type:'written'});};
window.haqiHanziComplete=()=>{if(!written){written=true;send({type:'written'});}finished=true;send({type:'completed'});};
window.haqiHanziPrefetch=texts=>ensureTexts(Array.isArray(texts)?texts:[texts]);
window.haqiHanziUi=(zh,el)=>{const s=typeof zh==='string'?zh.trim():'';if(!s)return zh;if(el)trackUi(el,s);else ensureTexts([s]);const tr=!isZh(context?.locale)&&uiCache.get(s);return(tr&&tr!==s)?tr:zh;};
window.haqiHanziCaption=(el,zh)=>{const s=typeof zh==='string'?zh.trim():'';if(s)ensureTexts([s]);renderCaption(el,s);};
window.haqiHanziTranslate=texts=>new Promise(resolve=>{const list=(Array.isArray(texts)?texts:[]).map(t=>typeof t==='string'?t.trim():'').filter(Boolean);if(!context||!list.length){resolve({});return;}const requestId=String(++serial);const timer=setTimeout(()=>{callbacks.delete(requestId);resolve({});},1500);callbacks.set(requestId,msg=>{clearTimeout(timer);const sub=msg?.translations||{},ui=msg?.uiTranslations||sub;for(const[k,v]of Object.entries(sub))if(typeof v==='string'&&v.trim())subCache.set(k,v.trim());for(const[k,v]of Object.entries(ui))if(typeof v==='string'&&v.trim())uiCache.set(k,v.trim());refreshDom();resolve(sub);});send({type:'translate',requestId,texts:list});});
addEventListener('message',event=>{const m=event.data;if(event.source!==parent||parent===window||m?.channel!=='haqi-hanzi'||m.version!==1)return;
if(m.type==='init'&&typeof m.sessionId==='string'&&typeof m.entryId==='string'){if(document.referrer&&event.origin!==new URL(document.referrer).origin)return;context={...m,origin:event.origin};scanStatic();flushPending();refreshDom();if(written)send({type:'written'});if(finished)send({type:'completed'});}
else if(context&&event.origin===context.origin&&m.sessionId===context.sessionId&&m.type==='translations'){callbacks.get(m.requestId)?.(m);callbacks.delete(m.requestId);}});
if(parent!==window)parent.postMessage({channel:'haqi-hanzi',version:1,type:'ready'},'*');})();

// Compatibility for these authored pages' caption(text, subtitle) / ui(element) calls.
(()=>{
 const caption=window.haqiHanziCaption,ui=window.haqiHanziUi;
 window.haqiHanziUi=(text,el)=>{if(text&&typeof text==='object'){el=text;text=el.textContent;}const value=ui(text,el);if(el)el.textContent=value;return value;};
 window.haqiHanziCaption=(text,sub)=>{
  if(typeof text!=='string')return caption(text,sub);
  const box=document.getElementById('caption'),zh=box?.querySelector('.zh'),secondary=box?.querySelector('.sub');
  if(!box||!zh)return;
  zh.innerHTML=text;box.classList.toggle('show',!!text);
  if(secondary)secondary.hidden=true;
  caption(zh,zh.textContent);
 };
 const scan=()=>document.querySelectorAll('#prompt,#prompt-text,#act-btn,#hud-label,#stroke-counter,#fact-note,.intro-sub,.start-btn,.mini-btn,.w-desc').forEach(el=>{if(!el.children.length)window.haqiHanziUi(el);});
 if(document.readyState==='loading')addEventListener('DOMContentLoaded',scan,{once:true});else scan();
})();
</script>
</head>
<body>

<canvas id="stage"></canvas>

<!-- 顶部进度 -->
<div id="hud">
  <div class="dot" data-step="0"></div>
  <div class="dot" data-step="1"></div>
  <div class="dot" data-step="2"></div>
  <div class="dot" data-step="3"></div>
  <div class="dot" data-step="4"></div>
  <div class="dot" data-step="5"></div>
  <div class="dot" data-step="6"></div>
  <span id="hud-label">春泥</span>
</div>

<!-- 右上角控制按钮 -->
<div id="tools">
  <button class="icon-btn" id="btn-mute" title="声音开关" aria-label="声音开关">
    <svg id="ico-sound-on" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>

<script>
(() => {
  'use strict';

  // ============================================================================
  // 1. 工具与确定性随机数
  // ============================================================================
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const smooth = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };

  function mulberry32(seed) {
    let t = seed >>> 0;
    return function() {
      t += 0x6D2B79F5;
      let r = Math.imul(t ^ (t >>> 15), 1 | t);
      r ^= r + Math.imul(r ^ (r >>> 7), 61 | r);
      return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
    };
  }
  const rng = mulberry32(20261024);

  // ============================================================================
  // 2. WebAudio 实时春风拂叶与五声木琴音景（零外部音频依赖）
  // ============================================================================
  class SoundEngine {
    constructor() {
      this.ctx = null;
      this.muted = false;
      this.breezeGain = null;
      this.breezeFilter = null;
      // F 大调五声音阶: F4, G4, A4, C5, D5, F5, G5, A5, C6
      this.scale = [349.23, 392.00, 440.00, 523.25, 587.33, 698.46, 783.99, 880.00, 1046.50];
    }

    init() {
      if (this.ctx) {
        if (this.ctx.state === 'suspended') this.ctx.resume();
        return;
      }
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      this._setupBreezeNoise();
    }

    _setupBreezeNoise() {
      if (!this.ctx) return;
      const sr = this.ctx.sampleRate;
      const len = sr * 3;
      const buf = this.ctx.createBuffer(1, len, sr);
      const data = buf.getChannelData(0);
      let b0 = 0, b1 = 0;
      for (let i = 0; i < len; i++) {
        const w = rng() * 2 - 1;
        b0 = 0.995 * b0 + w * 0.04;
        b1 = 0.96 * b1 + w * 0.1;
        data[i] = (b0 + b1) * 0.16;
      }
      const src = this.ctx.createBufferSource();
      src.buffer = buf;
      src.loop = true;

      const filter = this.ctx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.value = 480;
      filter.Q.value = 0.9;

      const g = this.ctx.createGain();
      g.gain.value = 0.0001;

      src.connect(filter);
      filter.connect(g);
      g.connect(this.ctx.destination);
      src.start();
      this.breezeGain = g;
      this.breezeFilter = filter;
    }

    setBreezeLevel(level) {
      if (!this.ctx || !this.breezeGain) return;
      const target = this.muted ? 0.0001 : clamp(level, 0.001, 0.22);
      this.breezeGain.gain.setTargetAtTime(target, this.ctx.currentTime, 0.45);
      if (this.breezeFilter) {
        this.breezeFilter.frequency.setTargetAtTime(380 + level * 1200, this.ctx.currentTime, 0.45);
      }
    }

    toggleMute() {
      this.muted = !this.muted;
      if (this.ctx && this.breezeGain) {
        this.breezeGain.gain.setTargetAtTime(this.muted ? 0.0001 : 0.05, this.ctx.currentTime, 0.15);
      }
      return this.muted;
    }

    pluck(idx = 0, vol = 0.14, dur = 1.2) {
      if (this.muted || !this.ctx) return;
      const now = this.ctx.currentTime;
      const freq = this.scale[clamp(idx, 0, this.scale.length - 1)];
      const osc = this.ctx.createOscillator();
      const osc2 = this.ctx.createOscillator();
      const g = this.ctx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, now);
      osc2.type = 'triangle';
      osc2.frequency.setValueAtTime(freq * 2, now);

      g.gain.setValueAtTime(0.0001, now);
      g.gain.linearRampToValueAtTime(vol, now + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, now + dur);

      const g2 = this.ctx.createGain();
      g2.gain.setValueAtTime(vol * 0.24, now);
      g2.gain.exponentialRampToValueAtTime(0.0001, now + dur * 0.4);

      osc.connect(g);
      osc2.connect(g2);
      g2.connect(g);
      g.connect(this.ctx.destination);

      osc.start(now);
      osc2.start(now);
      osc.stop(now + dur + 0.05);
      osc2.stop(now + dur + 0.05);
    }

    woodTap(pitch = 520, vol = 0.1) {
      if (this.muted || !this.ctx) return;
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(pitch, now);
      osc.frequency.exponentialRampToValueAtTime(pitch * 1.35, now + 0.09);
      g.gain.setValueAtTime(0.0001, now);
      g.gain.linearRampToValueAtTime(vol, now + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, now + 0.18);
      osc.connect(g);
      g.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.2);
    }

    chord(indices = [0, 2, 3, 5], vol = 0.1, gap = 0.09) {
      indices.forEach((n, i) => {
        setTimeout(() => this.pluck(n, vol, 1.8), i * gap * 1000);
      });
    }

    bloomSound() {
      this.woodTap(580, 0.11);
      setTimeout(() => this.woodTap(820, 0.1), 65);
      setTimeout(() => this.pluck(4, 0.13, 1.4), 115);
    }
  }
  const sfx = new SoundEngine();
  // Scene actions use the same synthesized sound engine as the opening.
  const SFX = sfx;
  SFX.chime = pitch => sfx.woodTap(pitch);
  SFX.introPlay = () => sfx.chord();
  SFX.complete = () => sfx.chord([0,2,4,5]);
  SFX.reveal = () => sfx.bloomSound();
  SFX.rainTick = () => sfx.woodTap(680,.03);
  SFX.growTone = value => sfx.pluck(Math.round(value*5));
  SFX.strokeDone = index => sfx.pluck(index+1);
  SFX.birdChirp = () => sfx.pluck(7,.05,.4);
  const Narration = {speak(text){
    if(!text||!sfx.ctx||sfx.muted||!window.speechSynthesis||!window.SpeechSynthesisUtterance)return;
    window.speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(text);utterance.lang='zh-CN';
    window.speechSynthesis.speak(utterance);
  }};

  // ============================================================================
  // 3. 世界坐标与自适应相机
  // ============================================================================
  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d');
  let W = window.innerWidth, H = window.innerHeight, DPR = Math.min(window.devicePixelRatio || 1, 2);
  let isPortrait = H > W;

  const VIEW = {
    intro:   { cx: 800, cy: 450, w: 1280, pcy: 455, pw: 660 },
    hill:    { cx: 800, cy: 465, w: 1320, pcy: 470, pw: 680 },
    seed:    { cx: 800, cy: 525, w: 880,  pcy: 515, pw: 540 },
    grow:    { cx: 800, cy: 455, w: 1120, pcy: 460, pw: 610 },
    wide:    { cx: 800, cy: 455, w: 1340, pcy: 465, pw: 680 },
    anatomy: { cx: 800, cy: 450, w: 1040, pcy: 455, pw: 590 },
    glyph:   { cx: 800, cy: 445, w: 1060, pcy: 455, pw: 580 },
    finale:  { cx: 800, cy: 455, w: 1300, pcy: 465, pw: 660 }
  };

  const cam = {
    cx: 800, cy: 450, w: 1280,
    tcx: 800, tcy: 450, tw: 1280,
    scale: 1, offX: 0, offY: 0,
    setTarget(preset, instant = false) {
      const v = VIEW[preset] || VIEW.wide;
      this.tcx = v.cx;
      this.tcy = isPortrait ? v.pcy : v.cy;
      this.tw  = isPortrait ? v.pw  : v.w;
      if (instant) {
        this.cx = this.tcx; this.cy = this.tcy; this.w = this.tw;
      }
    },
    update(dt) {
      const k = 1 - Math.exp(-dt * 3.8);
      this.cx = lerp(this.cx, this.tcx, k);
      this.cy = lerp(this.cy, this.tcy, k);
      this.w  = lerp(this.w,  this.tw,  k);
      this.scale = W / this.w;
      this.offX = W * 0.5 - this.cx * this.scale;
      this.offY = H * 0.5 - this.cy * this.scale;
    },
    toScreen(wx, wy) {
      return { x: wx * this.scale + this.offX, y: wy * this.scale + this.offY };
    },
    toWorld(sx, sy) {
      return { x: (sx - this.offX) / this.scale, y: (sy - this.offY) / this.scale };
    }
  };

  let currentCamPreset = 'intro';
  function resize() {
    W = window.innerWidth; H = window.innerHeight;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    isPortrait = H > W;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    cam.setTarget(currentCamPreset, true);
  }
  window.addEventListener('resize', resize);

  // ============================================================================
  // 4. 视觉场景数据：地平线剖面、种子、树冠枝叶、地下根系与三处生机点
  // ============================================================================
  const GROUND_Y = 485;
  const SEED_POS = { x: 800, y: 520 };

  const FIREFLIES = Array.from({ length: 48 }, () => ({
    x: 140 + rng() * 1320,
    y: 45 + rng() * 410,
    r: 1.1 + rng() * 2.1,
    phase: rng() * Math.PI * 2,
    speed: 1.0 + rng() * 1.9
  }));

  // 树冠簇团位置（围绕横向枝条展开）
  const CANOPY_CLUSTERS = [
    { ox:   0, oy: -230, r: 62, col: '#48c878' },
    { ox: -86, oy: -175, r: 54, col: '#3eb86c' },
    { ox:  88, oy: -180, r: 54, col: '#3eb86c' },
    { ox: -142, oy: -142, r: 44, col: '#58d886' },
    { ox:  144, oy: -146, r: 44, col: '#58d886' },
    { ox: -46, oy: -206, r: 48, col: '#68e494' },
    { ox:  48, oy: -208, r: 48, col: '#68e494' }
  ];

  // 飘舞新叶粒子池
  const LEAVES = [];
  function spawnLeaves(wx, wy, count = 16, col = '#8ef09a') {
    for (let i = 0; i < count; i++) {
      const a = rng() * Math.PI * 2;
      const sp = 45 + rng() * 135;
      LEAVES.push({
        x: wx + (rng() - 0.5) * 26,
        y: wy + (rng() - 0.5) * 20,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - 35,
        rot: rng() * Math.PI * 2,
        vrot: (rng() - 0.5) * 5,
        r: 4.5 + rng() * 4.5,
        life: 1,
        decay: 0.58 + rng() * 0.45,
        col
      });
    }
  }

  const RINGS = [];
  function spawnRing(wx, wy, maxR = 92) {
    RINGS.push({ x: wx, y: wy, r: 8, maxR, alpha: 0.92 });
  }

  // 第 4 幕：唤醒大树三处生机
  const LIFE_SPOTS = [
    { id: 'foliage',  x: 800, y: 275, r: 56, label: '满树新叶', lit: false, litTime: 0 },
    { id: 'oriole',   x: 942, y: 335, r: 52, label: '枝头黄鹂', lit: false, litTime: 0 },
    { id: 'squirrel', x: 675, y: 545, r: 52, label: '树根松鼠', lit: false, litTime: 0 }
  ];
  // ============================================================================
  // 5. 「木」字笔顺与甲骨文/小篆/楷书构件定义（严格对齐 zh.json 4 画笔顺）
  // ============================================================================
  const GLYPH_BOX = { x: 640, y: 170, w: 320, h: 320 };
  const STROKES = [
    {
      name: '横',
      role: '树冠横枝',
      color: '#5ce08e',
      pts: [[20, 38], [49, 36], [78, 35]]
    },
    {
      name: '竖',
      role: '笔直树干',
      color: '#ffd166',
      pts: [[49, 12], [49, 38], [49, 66], [49, 90]]
    },
    {
      name: '撇',
      role: '左伸树根',
      color: '#8ce870',
      pts: [[47, 38], [38, 52], [27, 66], [14, 78]]
    },
    {
      name: '捺',
      role: '右展树根',
      color: '#5ec8a0',
      pts: [[51, 39], [62, 55], [74, 68], [88, 75]]
    }
  ];

  // 甲骨文/小篆象形线条（归一到 0..100 盒子：上为Y形枝条、中为主干、下为八字树根）
  const ORACLE_PATHS = [
    [[50, 14], [50, 88]],
    [[24, 24], [36, 36], [50, 44], [64, 36], [76, 24]],
    [[50, 56], [35, 70], [22, 84]],
    [[50, 56], [65, 70], [78, 84]]
  ];

  function glyphPtToWorld(nx, ny, box = GLYPH_BOX) {
    return [box.x + (nx / 100) * box.w, box.y + (ny / 100) * box.h];
  }

  // ============================================================================
  // 6. 状态机与 9 幕剧情定义
  // ============================================================================
  const state = {
    sceneIdx: 0,
    sceneTime: 0,
    globalTime: 0,
    holding: false,
    pointerW: { x: 800, y: 450 },
    pointerDownW: { x: 800, y: 450 },
    // 第1幕：按住春雨破土萌芽
    sproutProgress: 0,
    sproutDone: false,
    // 第2幕：向上拖动拔高树干与树根
    growLevel: 0,
    draggingGrow: false,
    growStartY: 0,
    growStartVal: 0,
    growDone: false,
    // 第3幕：点亮三处大树生机
    litCount: 0,
    allSpotsDone: false,
    // 第5幕：部件拆解高亮
    activeRadical: 'all',
    // 第6幕：逐笔描红
    strokeIndex: 0,
    strokeProgress: 0,
    tracing: false,
    tracePoints: [],
    completedStrokes: [false, false, false, false],
    writeCelebration: 0,
    // 第7幕：词意卡片
    wordsShown: false,
    // 第8幕：自由余韵额外小树苗与生机脉冲
    saplings: [],
    pulseTime: -10
  };

  function resetSceneState(idx) {
    state.sceneTime = 0;
    state.holding = false;
    state.draggingGrow = false;
    state.tracing = false;
    state.tracePoints = [];

    if (idx <= 1) {
      state.sproutProgress = 0;
      state.sproutDone = false;
      state.growLevel = 0;
      state.growDone = false;
      state.litCount = 0;
      state.allSpotsDone = false;
      LIFE_SPOTS.forEach(s => { s.lit = false; s.litTime = 0; });
    }
    if (idx === 2) {
      state.sproutProgress = 1;
      state.sproutDone = true;
      state.growLevel = 0;
      state.growDone = false;
      state.litCount = 0;
      state.allSpotsDone = false;
      LIFE_SPOTS.forEach(s => { s.lit = false; s.litTime = 0; });
    }
    if (idx === 3) {
      state.sproutProgress = 1;
      state.sproutDone = true;
      state.growLevel = 1;
      state.growDone = true;
      state.litCount = 0;
      state.allSpotsDone = false;
      LIFE_SPOTS.forEach(s => { s.lit = false; s.litTime = 0; });
    }
    if (idx >= 4) {
      state.sproutProgress = 1;
      state.sproutDone = true;
      state.growLevel = 1;
      state.growDone = true;
      state.litCount = 3;
      state.allSpotsDone = true;
      LIFE_SPOTS.forEach(s => { s.lit = true; s.litTime = 1; });
    }
    if (idx === 5) {
      state.activeRadical = 'all';
      document.querySelectorAll('.rad-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.rad === 'all');
      });
    }
    if (idx === 6) {
      state.strokeIndex = 0;
      state.strokeProgress = 0;
      state.completedStrokes = [false, false, false, false];
      state.writeCelebration = 0;
      updateStrokeCounter();
    }
    if (idx === 8) {
      state.saplings = [
        { x: 470, y: GROUND_Y, scale: 0.72, birth: state.globalTime - 1.5 },
        { x: 1130, y: GROUND_Y, scale: 0.76, birth: state.globalTime - 1.2 }
      ];
    }
  }

  function updateStrokeCounter() {
    const done = state.completedStrokes.filter(Boolean).length;
    const nextName = done < 4 ? ` · 第 ${done + 1} 笔：${STROKES[done].name}（${STROKES[done].role}）` : ' · 已写完！';
    document.getElementById('stroke-counter').textContent = `笔画：${done} / 4${nextName}`;
  }

  const SCENES = [
    {
      name: '序幕 · 春泥藏种',
      cam: 'intro',
      sub: '泥土之下藏着一颗饱满的种子，地面之上春风轻拂。让我们一起走近汉字「木」的生命故事。',
      prompt: '点击画面 · 唤醒泥土里的种子',
      narration: '泥土之下藏着一颗饱满的种子。点击画面，走近木字的故事。'
    },
    {
      name: '第一幕 · 破土萌芽',
      cam: 'seed',
      sub: '春雨润物，种子吸收水分，向下扎出嫩白胚根，向上顶破黑土长出两片嫩绿子叶！',
      prompt: '按住画面不放 · 降下春雨催发新芽',
      narration: '按住画面不放，降下春雨，看种子向下扎根、向上破土萌芽。'
    },
    {
      name: '第二幕 · 上枝下根',
      cam: 'tree',

  // ============================================================================
  // 7. 场景切换与 UI 同步
  // ============================================================================
  const titleCard = document.getElementById('intro');
  const subtitleEl = document.getElementById('cap-zh');
  const promptEl = document.getElementById('prompt');
  const promptTextEl = document.getElementById('prompt');
  const radicalsEl = document.getElementById('radicals');
  const writeBarEl = document.getElementById('write-bar');
  const wordsLayerEl = document.getElementById('words');
  const finActionsEl = document.getElementById('replay');
  const dotsEl = document.getElementById('hud');

  dotsEl.querySelectorAll('.dot').forEach(dot=>dot.remove());
  SCENES.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'dot' + (i === 0 ? ' active' : '');
    d.title = SCENES[i].name;
    d.addEventListener('click', (e) => {
      e.stopPropagation();
      SFX.init();
      goScene(i);
    });
    dotsEl.appendChild(d);
  });

  function updatePromptText(txt) {
    promptTextEl.textContent = window.haqiHanziUi(txt, promptTextEl);
    promptEl.classList.toggle('hide', !txt);
  }

  function goScene(idx) {
    idx = clamp(idx, 0, SCENES.length - 1);
    state.sceneIdx = idx;
    resetSceneState(idx);
    const sc = SCENES[idx];
    currentCamPreset = sc.cam;
    cam.setTarget(sc.cam, false);

    titleCard.classList.toggle('hide', idx !== 0);
    document.getElementById('hud').classList.toggle('show', idx !== 0);
    document.getElementById('caption').classList.toggle('show', idx !== 0);
    subtitleEl.textContent = sc.sub;
    window.haqiHanziCaption(subtitleEl, sc.sub);
    subtitleEl.classList.add('show');
    updatePromptText(sc.prompt);

    radicalsEl.classList.toggle('show', idx === 5);
    writeBarEl.classList.toggle('show', idx === 6);
    wordsLayerEl.classList.toggle('show', idx === 7);
    finActionsEl.classList.toggle('show', idx === 8);

    document.querySelectorAll('.dot').forEach((d, i) => {
      d.classList.toggle('active', i === idx);
    });

    if (idx === 0) SFX.introPlay();
    else if (idx === 4) SFX.chime(587.33);
    else if (idx === 7) {
      SFX.reveal();
      document.querySelectorAll('.word-card').forEach((c, i) => {
        c.classList.remove('show');
        setTimeout(() => c.classList.add('show'), 140 + i * 160);
      });
    } else if (idx === 8) {
      SFX.complete();
      window.haqiHanziComplete('mu', { char: '木', pinyin: 'mù' });
    }

    Narration.speak(sc.narration);
  }

  document.getElementById('start').addEventListener('click',()=>{SFX.init();goScene(1);});
  document.getElementById('btn-restart').addEventListener('click',()=>goScene(0));

  // 部件拆解按钮
  document.querySelectorAll('.rad-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      SFX.init();
      const rad = btn.dataset.rad;
      state.activeRadical = rad;
      document.querySelectorAll('.rad-btn').forEach(b => b.classList.toggle('active', b === btn));
      SFX.chime(rad === 'branch' ? 659.25 : rad === 'trunk' ? 523.25 : rad === 'root' ? 440 : 587.33);
    });
  });

  // 描红辅助按钮
  document.getElementById('btn-demo').addEventListener('click', (e) => {
    e.stopPropagation();
    SFX.init();
    autoCompleteNextStroke();
  });
  document.getElementById('btn-reset-write')?.addEventListener('click', (e) => {
    e.stopPropagation();
    SFX.init();
    state.strokeIndex = 0;
    state.strokeProgress = 0;
    state.completedStrokes = [false, false, false, false];
    state.writeCelebration = 0;
    updateStrokeCounter();
    SFX.chime(392);
  });

  function autoCompleteNextStroke() {
    if (state.sceneIdx !== 6) return;
    const idx = state.completedStrokes.findIndex(v => !v);
    if (idx === -1) return;
    state.completedStrokes[idx] = true;
    state.strokeIndex = idx + 1;
    state.strokeProgress = 0;
    const pts = STROKES[idx].pts;
    const mid = pts[Math.floor(pts.length / 2)];
    const [wx, wy] = glyphPtToWorld(mid[0], mid[1]);
    spawnLeaves(wx, wy, 14, STROKES[idx].color);
    SFX.strokeDone(idx);
    updateStrokeCounter();

    if (state.completedStrokes.every(Boolean)) {
      state.writeCelebration = 1;
      SFX.complete();
      window.haqiHanziWritten('mu', { char: '木', strokes: 4 });
      updatePromptText('写得真棒！点击画面进入词意森林');
      setTimeout(() => {
        if (state.sceneIdx === 6) goScene(7);
      }, 1500);
    }
  }

  // 词意卡片点击朗读
  document.querySelectorAll('.word-card').forEach(card => {
    card.addEventListener('click', (e) => {
      e.stopPropagation();
      SFX.init();
      SFX.chime(659.25);
      Narration.speak(card.dataset.speech || '');
    });
  });

  // 终幕重播与跳过按钮
  document.getElementById('replay').addEventListener('click', (e) => {
    e.stopPropagation();
    SFX.init();
    goScene(0);
  });
  document.getElementById('btn-skip')?.addEventListener('click', (e) => {
    e.stopPropagation();
    SFX.init();
    if (state.sceneIdx < SCENES.length - 1) goScene(state.sceneIdx + 1);
    else goScene(0);
  });
  document.getElementById('btn-mute').addEventListener('click', (e) => {
    e.stopPropagation();
    SFX.init();
    SFX.muted = !SFX.muted;
    document.getElementById('btn-mute').classList.toggle('muted', SFX.muted);
    if (SFX.muted && 'speechSynthesis' in window) window.speechSynthesis.cancel();
  });

  // ============================================================================
  // 8. 绘制函数：天空、剖面土壤、春雨、种子萌芽、大树枝干与根系、黄鹂松鼠、字形与描红
  // ============================================================================
  function drawSkyAndSoil(t) {
    // 天空渐变（随生长进度从晨曦森林渐变为明朗翠绿）
    const vitality = clamp(state.sproutProgress * 0.35 + state.growLevel * 0.4 + (state.litCount / 3) * 0.25, 0, 1);
    const skyGrad = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
    skyGrad.addColorStop(0, vitality > 0.5 ? '#0b2217' : '#08150f');
    skyGrad.addColorStop(0.55, vitality > 0.5 ? '#153a27' : '#0e2419');
    skyGrad.addColorStop(1, vitality > 0.5 ? '#235438' : '#173826');
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, 1600, GROUND_Y + 20);

    // 柔和阳光光柱
    const sunGlow = ctx.createRadialGradient(800, 75, 10, 800, 210, 520);
    sunGlow.addColorStop(0, `rgba(210,255,190,${0.14 + vitality * 0.14})`);
    sunGlow.addColorStop(0.55, `rgba(110,220,150,${0.06 + vitality * 0.08})`);
    sunGlow.addColorStop(1, 'rgba(20,60,40,0)');
    ctx.fillStyle = sunGlow;
    ctx.fillRect(180, 0, 1240, GROUND_Y);

    // 森林萤火/晨露微光点
    for (const f of FIREFLIES) {
      const a = 0.2 + 0.55 * (0.5 + 0.5 * Math.sin(t * f.speed + f.phase));
      ctx.fillStyle = `rgba(180,255,195,${a.toFixed(3)})`;
      ctx.beginPath();
      ctx.arc(f.x, f.y + Math.sin(t + f.phase) * 5, f.r, 0, Math.PI * 2);
      ctx.fill();
    }

    // 远景层叠山丘
    ctx.fillStyle = 'rgba(18,48,32,0.72)';
    ctx.beginPath();
    ctx.moveTo(0, GROUND_Y);
    for (let x = 0; x <= 1600; x += 80) {
      const y = GROUND_Y - 38 - Math.sin(x * 0.005 + 0.8) * 26 - Math.cos(x * 0.011) * 14;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(1600, GROUND_Y);
    ctx.closePath();
    ctx.fill();

    // 地下土壤横截面
    const soilGrad = ctx.createLinearGradient(0, GROUND_Y, 0, 900);
    soilGrad.addColorStop(0, '#2c1e14');
    soilGrad.addColorStop(0.28, '#23170f');
    soilGrad.addColorStop(1, '#120b07');
    ctx.fillStyle = soilGrad;
    ctx.fillRect(0, GROUND_Y, 1600, 900 - GROUND_Y);

    // 土壤层理纹理线
    ctx.strokeStyle = 'rgba(130,92,58,0.16)';
    ctx.lineWidth = 2;
    for (let row = 0; row < 4; row++) {
      const baseY = GROUND_Y + 55 + row * 72;
      ctx.beginPath();
      for (let x = 80; x <= 1520; x += 60) {
        const y = baseY + Math.sin(x * 0.012 + row * 1.7) * 8;
        if (x === 80) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }

    // 地表青苔草岸线
    const turfGrad = ctx.createLinearGradient(0, GROUND_Y - 12, 0, GROUND_Y + 14);
    turfGrad.addColorStop(0, '#5cd685');
    turfGrad.addColorStop(0.55, '#358c52');
    turfGrad.addColorStop(1, '#261910');
    ctx.fillStyle = turfGrad;
    ctx.beginPath();
    ctx.moveTo(0, GROUND_Y + 12);
    for (let x = 0; x <= 1600; x += 40) {
      const y = GROUND_Y - 5 + Math.sin(x * 0.015) * 4;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(1600, GROUND_Y + 14);
    ctx.closePath();
    ctx.fill();
  }

  function drawSpringRain(t) {
    if (state.sceneIdx !== 1) return;
    const intensity = state.holding ? 1 : 0.35;
    ctx.save();
    ctx.strokeStyle = `rgba(160,235,255,${0.25 + intensity * 0.35})`;
    ctx.lineWidth = 2;
    for (let i = 0; i < 36; i++) {
      const rx = 440 + ((i * 67 + t * 240) % 720);
      const ry = 140 + ((i * 97 + t * (420 + intensity * 260)) % (GROUND_Y - 130));
      ctx.beginPath();
      ctx.moveTo(rx, ry);
      ctx.lineTo(rx - 4, ry + 18 + intensity * 10);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawSeedAndSprout(t) {
    const sp = state.sproutProgress;
    const gl = state.growLevel;
    // 当树干已经完全长大后，种子融入主根中心
    if (gl > 0.65) return;

    ctx.save();
    const fade = clamp(1 - (gl - 0.3) / 0.35, 0, 1);
    ctx.globalAlpha = fade;

    // 破土前的饱满种子与温暖光晕
    const pulse = 1 + 0.06 * Math.sin(t * 4);
    const glow = ctx.createRadialGradient(SEED_POS.x, SEED_POS.y, 4, SEED_POS.x, SEED_POS.y, 48 + sp * 35);
    glow.addColorStop(0, 'rgba(255,220,120,0.55)');
    glow.addColorStop(1, 'rgba(255,220,120,0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(SEED_POS.x, SEED_POS.y, 52 + sp * 35, 0, Math.PI * 2);
    ctx.fill();

    // 向下扎出的胚根
    if (sp > 0.05) {
      const rootLen = sp * 78;
      ctx.strokeStyle = '#e5c07b';
      ctx.lineWidth = 5;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(SEED_POS.x, SEED_POS.y + 6);
      ctx.quadraticCurveTo(SEED_POS.x - 8, SEED_POS.y + rootLen * 0.55, SEED_POS.x + 4, SEED_POS.y + rootLen);
      ctx.stroke();

      if (sp > 0.45) {
        const sideK = (sp - 0.45) / 0.55;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(SEED_POS.x - 3, SEED_POS.y + 32);
        ctx.lineTo(SEED_POS.x - 28 * sideK, SEED_POS.y + 32 + 24 * sideK);
        ctx.moveTo(SEED_POS.x + 2, SEED_POS.y + 44);
        ctx.lineTo(SEED_POS.x + 28 * sideK, SEED_POS.y + 44 + 22 * sideK);
        ctx.stroke();
      }
    }

    // 向上破土的嫩茎与两片子叶
    if (sp > 0.12) {
      const stemK = clamp((sp - 0.12) / 0.88, 0, 1);
      const topY = SEED_POS.y - stemK * 98;
      ctx.strokeStyle = '#7be888';
      ctx.lineWidth = 6.5;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(SEED_POS.x, SEED_POS.y);
      ctx.quadraticCurveTo(SEED_POS.x - 5, (SEED_POS.y + topY) * 0.5, SEED_POS.x, topY);
      ctx.stroke();

      // 两片嫩绿子叶
      if (stemK > 0.45) {
        const leafK = smoothstep(0.45, 1.0, stemK);
        const sway = Math.sin(t * 3) * 0.08;
        drawSingleLeaf(SEED_POS.x, topY + 4, -0.75 + sway, 28 * leafK, '#84f294');
        drawSingleLeaf(SEED_POS.x, topY + 4,  0.75 + sway, 28 * leafK, '#68e07c');
      }
    }

    // 种子外壳
    ctx.fillStyle = '#c88a4b';
    ctx.strokeStyle = '#ffe2a8';
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.ellipse(SEED_POS.x, SEED_POS.y, 16 * pulse, 11 * pulse, -0.15, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // 第1幕环形进度条
    if (state.sceneIdx === 1 && sp > 0 && sp < 1) {
      ctx.strokeStyle = '#8ef09a';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(SEED_POS.x, SEED_POS.y - 25, 58, -Math.PI / 2, -Math.PI / 2 + sp * Math.PI * 2);
      ctx.stroke();
    }

    ctx.restore();
  }

  function drawSingleLeaf(x, y, angle, size, color) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(size * 0.55, -size * 0.5, size, -size * 0.15);
    ctx.quadraticCurveTo(size * 0.55, size * 0.35, 0, 0);
    ctx.fill();
    ctx.restore();
  }

  // 绘制主树（地面之上树干与枝条 + 地面之下树根 + 树冠与生机小动物）
  function drawMainTree(t, centerX = 800, baseY = GROUND_Y, scale = 1, growthOverride = null) {
    const gl = growthOverride !== null ? growthOverride : state.growLevel;
    if (gl <= 0.01) return;

    // 在描红和文字拆解幕适度淡化背景大树，突出中央字形
    const bgDim = (state.sceneIdx >= 4 && state.sceneIdx <= 6 && scale === 1) ? 0.32 : 1;

    ctx.save();
    ctx.translate(centerX, baseY);
    ctx.scale(scale, scale);
    ctx.globalAlpha = bgDim;

    const sway = Math.sin(t * 1.6 + centerX * 0.01) * 4 * gl;

    // 1. 地下树根系统（呼应「木」字下半部的撇、捺与竖尾）
    const rootDepth = gl * 185;
    const rootSpread = gl * 195;
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#7a4e2d';

    // 中心主直根（竖下部）
    ctx.lineWidth = 16 * (0.45 + 0.55 * gl);
    ctx.beginPath();
    ctx.moveTo(0, -4);
    ctx.quadraticCurveTo(4, rootDepth * 0.5, 0, rootDepth);
    ctx.stroke();

    // 左侧大斜根（呼应撇画）
    ctx.lineWidth = 13 * (0.45 + 0.55 * gl);
    ctx.beginPath();
    ctx.moveTo(-4, 14);
    ctx.quadraticCurveTo(-rootSpread * 0.45, rootDepth * 0.42, -rootSpread, rootDepth * 0.86);
    ctx.stroke();

    // 右侧大斜根（呼应捺画）
    ctx.beginPath();
    ctx.moveTo(4, 14);
    ctx.quadraticCurveTo(rootSpread * 0.45, rootDepth * 0.42, rootSpread, rootDepth * 0.86);
    ctx.stroke();

    // 细支根毛
    if (gl > 0.35) {
      const subK = (gl - 0.35) / 0.65;
      ctx.lineWidth = 5 * subK;
      ctx.strokeStyle = '#9c6a43';
      ctx.beginPath();
      ctx.moveTo(-rootSpread * 0.48, rootDepth * 0.46);
      ctx.lineTo(-rootSpread * 0.62, rootDepth * 0.88);
      ctx.moveTo(rootSpread * 0.48, rootDepth * 0.46);
      ctx.lineTo(rootSpread * 0.65, rootDepth * 0.88);
      ctx.stroke();
    }

    // 2. 地上笔直树干（呼应「木」字中竖）
    const trunkH = gl * 255;
    const trunkW = 14 + gl * 22;
    const trunkGrad = ctx.createLinearGradient(-trunkW, -trunkH, trunkW, 0);
    trunkGrad.addColorStop(0, '#8d5b34');
    trunkGrad.addColorStop(0.5, '#6e4425');
    trunkGrad.addColorStop(1, '#4f2f18');
    ctx.fillStyle = trunkGrad;

    ctx.beginPath();
    ctx.moveTo(-trunkW * 0.65, 6);
    ctx.quadraticCurveTo(-trunkW * 0.42, -trunkH * 0.5, -trunkW * 0.32 + sway * 0.4, -trunkH);
    ctx.lineTo(trunkW * 0.32 + sway * 0.4, -trunkH);
    ctx.quadraticCurveTo(trunkW * 0.42, -trunkH * 0.5, trunkW * 0.65, 6);
    ctx.closePath();
    ctx.fill();

    // 3. 左右舒展的主枝（呼应「木」字第一笔长横与甲骨文上扬枝杈）
    if (gl > 0.25) {
      const brK = smoothstep(0.25, 1.0, gl);
      const branchY = -trunkH * 0.66;
      const span = brK * 175;

      ctx.strokeStyle = '#794c2b';
      ctx.lineWidth = 13 * brK;
      ctx.beginPath();
      // 左横枝
      ctx.moveTo(sway * 0.2, branchY);
      ctx.quadraticCurveTo(-span * 0.5, branchY - 12, -span + sway, branchY - 26);
      // 右横枝
      ctx.moveTo(sway * 0.2, branchY);
      ctx.quadraticCurveTo(span * 0.5, branchY - 12, span + sway, branchY - 26);
      // 左上斜枝
      ctx.moveTo(sway * 0.3, -trunkH * 0.82);
      ctx.quadraticCurveTo(-span * 0.35, -trunkH - 18, -span * 0.62 + sway, -trunkH - 46 * brK);
      // 右上斜枝
      ctx.moveTo(sway * 0.3, -trunkH * 0.82);
      ctx.quadraticCurveTo(span * 0.35, -trunkH - 18, span * 0.62 + sway, -trunkH - 46 * brK);
      ctx.stroke();
    }

    // 4. 树冠繁茂叶团
    if (gl > 0.45) {
      const capK = smoothstep(0.45, 1.0, gl);
      const foliageLit = LIFE_SPOTS[0].lit ? 1.16 : 0.92;
      for (let i = 0; i < CANOPY_CLUSTERS.length; i++) {
        const c = CANOPY_CLUSTERS[i];
        const cx = c.ox * capK + sway * (0.7 + (i % 3) * 0.2);
        const cy = c.oy * capK - (1 - capK) * 60;
        const r = c.r * capK * foliageLit;

        const g = ctx.createRadialGradient(cx - r * 0.25, cy - r * 0.25, r * 0.1, cx, cy, r);
        g.addColorStop(0, LIFE_SPOTS[0].lit ? '#98ffaa' : '#6ee28e');
        g.addColorStop(0.65, c.col);
        g.addColorStop(1, 'rgba(26,92,48,0.88)');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // 第2幕提示向上拖动的引导光箭
    if (state.sceneIdx === 2 && !state.growDone && scale === 1) {
      const arrowY = -60 - gl * 180 + Math.sin(t * 5) * 10;
      ctx.strokeStyle = 'rgba(255,230,130,0.88)';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(0, arrowY + 28);
      ctx.lineTo(0, arrowY - 18);
      ctx.lineTo(-14, arrowY - 2);
      ctx.moveTo(0, arrowY - 18);
      ctx.lineTo(14, arrowY - 2);
      ctx.stroke();
    }

    ctx.restore();
  }

  // 第3幕及之后：绘制枝头黄鹂与树根松鼠及三处互动光圈
  function drawTreeLifeAndSpots(t) {
    if (state.sceneIdx < 3) return;
    const dim = (state.sceneIdx >= 4 && state.sceneIdx <= 6) ? 0.28 : 1;
    ctx.save();
    ctx.globalAlpha = dim;

    // 枝头黄鹂（右侧横枝上）
    const orioleLit = LIFE_SPOTS[1].lit;
    const bx = 942, by = 335 + Math.sin(t * (orioleLit ? 7 : 2.5)) * (orioleLit ? 5 : 2);
    ctx.save();
    ctx.translate(bx, by);
    ctx.fillStyle = orioleLit ? '#ffd84d' : '#b89b48';
    ctx.beginPath();
    ctx.ellipse(0, 0, 17, 12, -0.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(13, -7, 9, 0, Math.PI * 2);
    ctx.fill();
    // 鸟喙与眼睛
    ctx.fillStyle = '#ff7b29';
    ctx.beginPath();
    ctx.moveTo(21, -8);
    ctx.lineTo(30, -5);
    ctx.lineTo(21, -3);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#1b1b1b';
    ctx.beginPath();
    ctx.arc(15, -9, 2, 0, Math.PI * 2);
    ctx.fill();
    // 音符欢唱
    if (orioleLit) {
      ctx.strokeStyle = '#ffe98a';
      ctx.lineWidth = 2.2;
      const ny = -22 - ((t * 22) % 18);
      ctx.beginPath();
      ctx.arc(26, ny, 4, 0, Math.PI * 2);
      ctx.moveTo(30, ny);
      ctx.lineTo(30, ny - 12);
      ctx.lineTo(37, ny - 9);
      ctx.stroke();
    }
    ctx.restore();

    // 树根松鼠（左侧树根旁）
    const sqLit = LIFE_SPOTS[2].lit;
    const sx = 675, sy = 545 + Math.abs(Math.sin(t * (sqLit ? 6 : 2))) * (sqLit ? -6 : -1);
    ctx.save();
    ctx.translate(sx, sy);
    // 蓬松大尾巴
    ctx.fillStyle = sqLit ? '#d9823b' : '#9c6234';
    ctx.beginPath();
    ctx.ellipse(-15, -6, 14, 20, -0.45, 0, Math.PI * 2);
    ctx.fill();
    // 身体与脑袋
    ctx.fillStyle = sqLit ? '#e8954c' : '#ad6f3e';
    ctx.beginPath();
    ctx.ellipse(2, 2, 13, 10, 0.1, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(12, -6, 8.5, 0, Math.PI * 2);
    ctx.fill();
    // 松果
    if (sqLit) {
      ctx.fillStyle = '#ffd166';
      ctx.beginPath();
      ctx.arc(21, 0, 5.5, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();

    // 第3幕光圈引导
    if (state.sceneIdx === 3) {
      for (const s of LIFE_SPOTS) {
        const pulse = 1 + 0.12 * Math.sin(t * 4.5);
        ctx.save();
        ctx.strokeStyle = s.lit ? 'rgba(130,255,160,0.85)' : 'rgba(255,220,115,0.92)';
        ctx.lineWidth = s.lit ? 3 : 3.5;
        ctx.setLineDash(s.lit ? [] : [8, 6]);
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r * (s.lit ? 0.82 : pulse), 0, Math.PI * 2);
        ctx.stroke();

        ctx.fillStyle = s.lit ? 'rgba(140,255,175,0.95)' : 'rgba(255,236,165,0.95)';
        ctx.font = '700 16px "Noto Serif SC", serif';
        ctx.textAlign = 'center';
        ctx.fillText(s.lit ? `✓ ${s.label}` : s.label, s.x, s.y + s.r + 22);
        ctx.restore();
      }
    }

    ctx.restore();
  }

  // 第4幕 & 第5幕：甲骨文/小篆字形演化与部件拆解高亮
  function drawGlyphEvolutionAndRadicals(t) {
    if (state.sceneIdx !== 4 && state.sceneIdx !== 5) return;

    ctx.save();
    // 中央背光圆盘
    const cx = 800, cy = 330;
    const disc = ctx.createRadialGradient(cx, cy, 20, cx, cy, 250);
    disc.addColorStop(0, 'rgba(22,64,40,0.88)');
    disc.addColorStop(0.75, 'rgba(12,38,24,0.68)');
    disc.addColorStop(1, 'rgba(12,38,24,0)');
    ctx.fillStyle = disc;
    ctx.beginPath();
    ctx.arc(cx, cy, 250, 0, Math.PI * 2);
    ctx.fill();

    if (state.sceneIdx === 4) {
      // 左侧展示甲骨文「木」，右侧展示楷书「木」
      const progress = clamp(state.sceneTime / 2.2, 0, 1);
      const leftBox = { x: 450, y: 185, w: 260, h: 260 };
      const rightBox = { x: 890, y: 185, w: 260, h: 260 };

      // 甲骨文/小篆「木」
      ctx.strokeStyle = '#ffd97d';
      ctx.lineWidth = 12;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      for (const path of ORACLE_PATHS) {
        ctx.beginPath();
        path.forEach((p, idx) => {
          const [wx, wy] = glyphPtToWorld(p[0], p[1], leftBox);
          if (idx === 0) ctx.moveTo(wx, wy);
          else ctx.lineTo(wx, wy);
        });
        ctx.stroke();
      }
      ctx.fillStyle = 'rgba(255,232,175,0.92)';
      ctx.font = '700 20px "Noto Serif SC", serif';
      ctx.textAlign = 'center';
      ctx.fillText('甲骨文 / 小篆 · 象形树枝树根', leftBox.x + leftBox.w * 0.5, leftBox.y + leftBox.h + 36);

      // 中间演化箭头
      ctx.strokeStyle = `rgba(142,240,154,${progress})`;
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(745, 315);
      ctx.lineTo(855, 315);
      ctx.lineTo(838, 302);
      ctx.moveTo(855, 315);
      ctx.lineTo(838, 328);
      ctx.stroke();

      // 右侧楷书「木」
      ctx.globalAlpha = smoothstep(0.2, 1.0, progress);
      for (let i = 0; i < STROKES.length; i++) {
        drawStrokePolyline(STROKES[i].pts, rightBox, STROKES[i].color, 16, 1);
      }
      ctx.fillStyle = 'rgba(180,255,200,0.95)';
      ctx.fillText('现代楷书 · 四画「木」', rightBox.x + rightBox.w * 0.5, rightBox.y + rightBox.h + 36);
    } else {
      // 第5幕：部件拆解高亮（横=树冠横枝，竖=笔直树干，撇捺=左右树根）
      const rad = state.activeRadical;
      for (let i = 0; i < STROKES.length; i++) {
        const isHit =
          rad === 'all' ||
          (rad === 'branch' && i === 0) ||
          (rad === 'trunk' && i === 1) ||
          (rad === 'root' && (i === 2 || i === 3));
        const col = isHit ? STROKES[i].color : 'rgba(160,195,175,0.24)';
        const w = isHit ? 20 + Math.sin(t * 5) * 2 : 13;
        drawStrokePolyline(STROKES[i].pts, GLYPH_BOX, col, w, 1);
      }
    }

    ctx.restore();
  }

  function drawStrokePolyline(pts, box, color, width, progress = 1) {
    if (!pts || pts.length < 2 || progress <= 0) return;
    ctx.save();
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    const totalSegs = pts.length - 1;
    const exactSeg = clamp(progress, 0, 1) * totalSegs;
    const fullSegs = Math.floor(exactSeg);
    const frac = exactSeg - fullSegs;

    ctx.beginPath();
    const [sx, sy] = glyphPtToWorld(pts[0][0], pts[0][1], box);
    ctx.moveTo(sx, sy);

    for (let i = 1; i <= fullSegs; i++) {
      const [wx, wy] = glyphPtToWorld(pts[i][0], pts[i][1], box);
      ctx.lineTo(wx, wy);
    }
    if (fullSegs < totalSegs && frac > 0) {
      const p0 = pts[fullSegs];
      const p1 = pts[fullSegs + 1];
      const nx = lerp(p0[0], p1[0], frac);
      const ny = lerp(p0[1], p1[1], frac);
      const [wx, wy] = glyphPtToWorld(nx, ny, box);
      ctx.lineTo(wx, wy);
    }
    ctx.stroke();
    ctx.restore();
  }

  // 第6幕：田字格与逐笔描红引导
  function drawWritingGridAndStrokes(t) {
    if (state.sceneIdx !== 6) return;
    const b = GLYPH_BOX;

    ctx.save();
    // 田字格底框
    ctx.fillStyle = 'rgba(10,30,20,0.82)';
    ctx.strokeStyle = 'rgba(130,225,160,0.45)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.roundRect(b.x - 16, b.y - 16, b.w + 32, b.h + 32, 18);
    ctx.fill();
    ctx.stroke();

    // 田字格十字虚线
    ctx.strokeStyle = 'rgba(130,225,160,0.2)';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([8, 8]);
    ctx.beginPath();
    ctx.moveTo(b.x, b.y + b.h * 0.5);
    ctx.lineTo(b.x + b.w, b.y + b.h * 0.5);
    ctx.moveTo(b.x + b.w * 0.5, b.y);
    ctx.lineTo(b.x + b.w * 0.5, b.y + b.h);
    ctx.stroke();
    ctx.setLineDash([]);

    // 底层灰色字模
    for (let i = 0; i < STROKES.length; i++) {
      drawStrokePolyline(STROKES[i].pts, b, 'rgba(180,210,190,0.18)', 22, 1);
    }

    // 已完成笔画
    for (let i = 0; i < STROKES.length; i++) {
      if (state.completedStrokes[i]) {
        drawStrokePolyline(STROKES[i].pts, b, STROKES[i].color, 22, 1);
      }
    }

    // 当前正在描写的笔画与动态引导光点
    const curIdx = state.completedStrokes.findIndex(v => !v);
    if (curIdx !== -1) {
      const st = STROKES[curIdx];
      // 当前已滑过的进度
      if (state.strokeProgress > 0) {
        drawStrokePolyline(st.pts, b, st.color, 22, state.strokeProgress);
      }

      // 起点呼吸光球 + 引导轨迹方向
      const [startX, startY] = glyphPtToWorld(st.pts[0][0], st.pts[0][1], b);
      const [endX, endY] = glyphPtToWorld(st.pts[st.pts.length - 1][0], st.pts[st.pts.length - 1][1], b);
      const pulse = 10 + 4 * Math.sin(t * 6);
      ctx.fillStyle = '#ffe57f';
      ctx.beginPath();
      ctx.arc(startX, startY, pulse, 0, Math.PI * 2);
      ctx.fill();

      // 方向虚线小箭头
      ctx.strokeStyle = 'rgba(255,235,140,0.78)';
      ctx.lineWidth = 3;
      ctx.setLineDash([6, 6]);
      drawStrokePolyline(st.pts, b, 'rgba(255,235,140,0.72)', 4, 1);
      ctx.setLineDash([]);

      // 终点小圆环
      ctx.strokeStyle = '#8ef09a';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(endX, endY, 9, 0, Math.PI * 2);
      ctx.stroke();
    }

    ctx.restore();
  }

  // 第8幕：自由余韵中的额外小树苗
  function drawSaplings(t) {
    if (state.sceneIdx !== 8) return;
    for (const sap of state.saplings) {
      const age = clamp((t - sap.birth) / 1.2, 0.15, 1);
      drawMainTree(t, sap.x, sap.y, sap.scale * age, age);
    }
  }

  function updateAndDrawParticles(dt) {
    // 树叶粒子
    for (let i = LEAVES.length - 1; i >= 0; i--) {
      const p = LEAVES[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 65 * dt; // 轻柔重力
      p.vx += Math.sin(state.globalTime * 3 + i) * 18 * dt;
      p.rot += p.vrot * dt;
      p.life -= p.decay * dt;
      if (p.life <= 0) {
        LEAVES.splice(i, 1);
        continue;
      }
      ctx.save();
      ctx.globalAlpha = clamp(p.life, 0, 1);
      drawSingleLeaf(p.x, p.y, p.rot, p.r * 2.4, p.col);
      ctx.restore();
    }

    // 涟漪光圈
    for (let i = RINGS.length - 1; i >= 0; i--) {
      const r = RINGS[i];
      r.r += 140 * dt;
      r.alpha -= 1.05 * dt;
      if (r.alpha <= 0 || r.r >= r.maxR) {
        RINGS.splice(i, 1);
        continue;
      }
      ctx.save();
      ctx.strokeStyle = `rgba(160,255,180,${r.alpha.toFixed(3)})`;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }
  }

  // ============================================================================
  // 9. 指针交互：按住春雨萌芽、向上拖动拔高树干、点击唤醒生机、描红写字、种树余韵
  // ============================================================================
  function getPointerWorld(e) {
    const rect = canvas.getBoundingClientRect();
    const sx = e.clientX - rect.left;
    const sy = e.clientY - rect.top;
    return cam.toWorld(sx, sy);
  }

  function evaluateStrokeTrace(pw) {
    const curIdx = state.completedStrokes.findIndex(v => !v);
    if (curIdx === -1) return;
    const pts = STROKES[curIdx].pts;
    const worldPts = pts.map(p => glyphPtToWorld(p[0], p[1], GLYPH_BOX));

    // 计算当前指针在折线上的投影进度
    let totalLen = 0;
    const segLens = [];
    for (let i = 0; i < worldPts.length - 1; i++) {
      const l = dist(worldPts[i][0], worldPts[i][1], worldPts[i + 1][0], worldPts[i + 1][1]);
      segLens.push(l);
      totalLen += l;
    }

    let bestDist = Infinity;
    let bestProgress = 0;
    let accum = 0;
    for (let i = 0; i < worldPts.length - 1; i++) {
      const [ax, ay] = worldPts[i];
      const [bx, by] = worldPts[i + 1];
      const vx = bx - ax, vy = by - ay;
      const len2 = vx * vx + vy * vy || 1;
      const t = clamp(((pw.x - ax) * vx + (pw.y - ay) * vy) / len2, 0, 1);
      const px = ax + vx * t, py = ay + vy * t;
      const d = dist(pw.x, pw.y, px, py);
      if (d < bestDist) {
        bestDist = d;
        bestProgress = (accum + segLens[i] * t) / totalLen;
      }
      accum += segLens[i];
    }

    // 宽容度：距离笔画 85 世界像素内均可推进进度
    if (bestDist < 85 && bestProgress >= state.strokeProgress - 0.12) {
      state.strokeProgress = Math.max(state.strokeProgress, bestProgress);
      if (state.strokeProgress >= 0.82) {
        autoCompleteNextStroke();
        state.tracing = false;
      }
    }
  }

  canvas.addEventListener('pointerdown', (e) => {
    SFX.init();
    const pw = getPointerWorld(e);
    state.holding = true;
    state.pointerW = pw;
    state.pointerDownW = pw;
    spawnRing(pw.x, pw.y, 68);

    const idx = state.sceneIdx;
    if (idx === 0) {
      goScene(1);
      return;
    }
    if (idx === 1) {
      SFX.rainTick();
      spawnLeaves(SEED_POS.x, SEED_POS.y - 10, 8, '#8ef09a');
      return;
    }
    if (idx === 2) {
      state.draggingGrow = true;
      state.growStartY = pw.y;
      state.growStartVal = state.growLevel;
      return;
    }
    if (idx === 3) {
      // 检查是否点中三处生机点（或直接点亮下一个未点亮的点，保证儿童友好度）
      let hitSpot = LIFE_SPOTS.find(s => !s.lit && dist(pw.x, pw.y, s.x, s.y) < s.r + 36);
      if (!hitSpot) hitSpot = LIFE_SPOTS.find(s => !s.lit);
      if (hitSpot) {
        hitSpot.lit = true;
        hitSpot.litTime = state.globalTime;
        state.litCount = LIFE_SPOTS.filter(s => s.lit).length;
        spawnLeaves(hitSpot.x, hitSpot.y, 20, '#9cffad');
        spawnRing(hitSpot.x, hitSpot.y, 110);
        if (hitSpot.id === 'oriole') SFX.birdChirp();
        else SFX.chime(523.25 + state.litCount * 85);

        updatePromptText(`依次点击 3 处金色光圈 · 唤醒大树生机（${state.litCount} / 3）`);
        if (state.litCount >= 3 && !state.allSpotsDone) {
          state.allSpotsDone = true;
          SFX.reveal();
          updatePromptText('大树焕发勃勃生机！正在进入甲骨文字形...');
          setTimeout(() => {
            if (state.sceneIdx === 3) goScene(4);
          }, 1150);
        }
      }
      return;
    }
    if (idx === 4 || idx === 5) {
      goScene(idx + 1);
      return;
    }
    if (idx === 6) {
      if (state.completedStrokes.every(Boolean)) {
        goScene(7);
        return;
      }
      state.tracing = true;
      evaluateStrokeTrace(pw);
      return;
    }
    if (idx === 7) {
      goScene(8);
      return;
    }
    if (idx === 8) {
      // 点击中央大树掀起飞叶，点击两侧草地种下新树苗
      if (Math.abs(pw.x - 800) < 170 && pw.y < GROUND_Y + 40) {
        state.pulseTime = state.globalTime;
        spawnLeaves(800, 290, 28, '#9cffad');
        SFX.birdChirp();
      } else {
        const sx = clamp(pw.x, 220, 1380);
        if (state.saplings.length >= 8) state.saplings.shift();
        state.saplings.push({
          x: sx,
          y: GROUND_Y,
          scale: 0.48 + rng() * 0.32,
          birth: state.globalTime
        });
        spawnLeaves(sx, GROUND_Y - 40, 18, '#84f294');
        SFX.growTone(0.6 + rng() * 0.4);
      }
    }
  });

  window.addEventListener('pointermove', (e) => {
    const pw = getPointerWorld(e);
    state.pointerW = pw;

    if (state.sceneIdx === 2 && state.draggingGrow && !state.growDone) {
      const dy = state.growStartY - pw.y;
      const nextVal = clamp(state.growStartVal + dy / 210, 0, 1);
      if (nextVal > state.growLevel + 0.08) {
        SFX.growTone(nextVal);
        spawnLeaves(800, GROUND_Y - nextVal * 220, 6, '#7ce88c');
      }
      state.growLevel = Math.max(state.growLevel, nextVal);
      if (state.growLevel >= 0.96 && !state.growDone) {
        state.growLevel = 1;
        state.growDone = true;
        state.draggingGrow = false;
        SFX.reveal();
        spawnLeaves(800, 280, 26, '#9cffad');
        updatePromptText('参天大树长成了！正在进入下一幕...');
        setTimeout(() => {
          if (state.sceneIdx === 2) goScene(3);
        }, 1100);
      }
    }

    if (state.sceneIdx === 6 && state.tracing) {
      evaluateStrokeTrace(pw);
    }
  });

  window.addEventListener('pointerup', () => {
    state.holding = false;
    state.draggingGrow = false;
    state.tracing = false;
  });

  // ============================================================================
  // 10. 主循环与自动化测试桥接接口 window.__mu
  // ============================================================================
  let lastTS = performance.now();
  let rainSoundTimer = 0;

  function tick(ts) {
    const dt = Math.min((ts - lastTS) / 1000, 0.06);
    lastTS = ts;
    state.globalTime += dt;
    state.sceneTime += dt;

    // 第1幕：按住春雨催化种子萌芽
    if (state.sceneIdx === 1 && !state.sproutDone) {
      if (state.holding) {
        state.sproutProgress = clamp(state.sproutProgress + dt * 0.68, 0, 1);
        rainSoundTimer += dt;
        if (rainSoundTimer > 0.22) {
          rainSoundTimer = 0;
          SFX.rainTick();
          spawnLeaves(SEED_POS.x, SEED_POS.y - state.sproutProgress * 80, 4, '#8ef09a');
        }
        if (state.sproutProgress >= 1) {
          state.sproutDone = true;
          SFX.reveal();
          spawnLeaves(SEED_POS.x, GROUND_Y - 50, 22, '#9cffad');
          updatePromptText('种子破土发芽啦！正在进入下一幕...');
          setTimeout(() => {
            if (state.sceneIdx === 1) goScene(2);
          }, 1050);
        }
      }
    }

    cam.update(dt);

    // 渲染世界
    ctx.save();
    ctx.scale(DPR, DPR);
    ctx.clearRect(0, 0, W, H);

    ctx.save();
    ctx.translate(cam.offX, cam.offY);
    ctx.scale(cam.scale, cam.scale);

    drawSkyAndSoil(state.globalTime);
    drawSpringRain(state.globalTime);
    drawSaplings(state.globalTime);
    drawMainTree(state.globalTime, 800, GROUND_Y, 1);
    drawSeedAndSprout(state.globalTime);
    drawTreeLifeAndSpots(state.globalTime);
    drawGlyphEvolutionAndRadicals(state.globalTime);
    drawWritingGridAndStrokes(state.globalTime);
    updateAndDrawParticles(dt);

    ctx.restore();
    ctx.restore();

    requestAnimationFrame(tick);
  }

  // 暴露自动化校验桥接
  window.__mu = {
    state,
    STROKES,
    LIFE_SPOTS,
    toScreen: (wx, wy) => cam.toScreen(wx, wy),
    glyphToScreen: (nx, ny) => {
      const [wx, wy] = glyphPtToWorld(nx, ny, GLYPH_BOX);
      return cam.toScreen(wx, wy);
    },
    getState: () => ({
      sceneIdx: state.sceneIdx,
      sceneName: SCENES[state.sceneIdx]?.name || '',
      sproutProgress: state.sproutProgress,
      growLevel: state.growLevel,
      litCount: state.litCount,
      activeRadical: state.activeRadical,
      completedStrokes: state.completedStrokes.slice(),
      saplingCount: state.saplings.length
    }),
    goScene: (i) => goScene(i),
    completeCurrentStroke: () => autoCompleteNextStroke()
  };

  resize();
  goScene(0);
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>

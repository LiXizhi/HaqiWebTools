<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>岛屿社交隔离验收</title>
<link rel="stylesheet" href="../../css/adventure.css"><link rel="stylesheet" href="../../css/adventure_storybook.css"><link rel="stylesheet" href="../../css/adventure_social.css">
<link rel="stylesheet" href="../../css/adventure_world_map.css">
<body class="haqi-app"><canvas id="world" tabindex="0"></canvas><div id="hud"></div><div id="overlay"></div><output id="result" style="position:fixed;bottom:4px;left:4px;z-index:100;background:white;color:black"></output>
<script type="module">
import {loadResources} from '../../js/adventure_assets.js';
import {createAdventure} from '../../js/adventure_core.js';
import {renderHud} from '../../js/view_adventure.js';
import {createWorld,nearestWalkable} from '../../js/adventure_world_core.js';
import {createRenderer} from '../../js/adventure_renderer.js';
import {createIslandSocial} from '../../js/adventure_social_controller.js';
import {renderDungeons} from '../../js/view_adventure_dungeons.js';
import {renderMaps} from '../../js/view_adventure_maps.js';
const params=new URLSearchParams(location.search);
const base=document.createElement('base');base.href=new URL('../../',location.href).href;document.head.append(base);
// Entire fixture is in memory. No real account, player save or remote message writes.
const assets=await loadResources(p=>document.querySelector('#result').textContent=p.label),save=createAdventure(assets.content,{name:'社交验收'}),world=createWorld(params.get('zone')||'camp',assets.content,save),renderer=createRenderer(document.querySelector('#world'),assets);
save.zone=world.zone;save.position={...world.layout.spawn};
const hud=document.querySelector('#hud'),overlay=document.querySelector('#overlay'),result=document.querySelector('#result');let panel=null;
const model=()=>({assets,save,social:social.state(),socialActors:social.actors,membership:{},now:Date.now()});
function close(){social.close();panel=null;overlay.replaceChildren();overlay.className='overlay';}
function open(kind){panel=kind;paint();}
const social=createIslandSocial({getState:()=>({save,assets,world,paused:!!panel,locked:!!panel}),getOwner:()=>null,onChange:paint,onPersist:()=>{},onOpen:open,onClose:close,onLogin:()=>result.textContent='登录提示：访客未发送消息',toast:message=>result.textContent=message});
function teleportToPosition(x,y){save.position=nearestWalkable(world,x,y);close();result.textContent=`已传送：${save.position.x}, ${save.position.y}`;}
function paint(){renderHud(hud,model(),{panel:open,membership:()=>{},track:()=>{},untrack:()=>{},interact:()=>{},mountToggle:()=>{save.mountHidden=!save.mountHidden;paint();}});if(panel==='dungeons')renderDungeons(overlay,model(),{close:()=>{if(social.state().pickingDungeon){social.cancelDungeonPick();open('social-party');return;}close();},pick:id=>{try{social.pickPartyDungeon(id);}catch(e){result.textContent=e.message;}},lobby:(id,restart=false)=>{try{social.pickPartyDungeon(id,{restart});}catch(e){result.textContent=e.message;}},enter:()=>result.textContent='副本选择成功（隔离模式）',leave:()=>{}});else if(['map','worldmap'].includes(panel))renderMaps(overlay,world,model(),{close,draw:(canvas,options)=>renderer.minimap(canvas,world,save,options),teleport:id=>{const p=world.landmarks.find(m=>m.id===id);teleportToPosition(p.x,p.y);},teleportToPosition,switchMap:view=>open(view==='world'?'worldmap':'map')},panel==='worldmap'?'world':'local');else if(panel)social.paint(overlay,panel);}
await social.enter();
if(params.get('panel')==='social-party'){
    const dungeon=assets.content.dungeons?.find(d=>d.playable&&!/Instance_Test/i.test(d.id)&&d.arenas.every(a=>!a.blocked?.length));
    if(dungeon){try{social.pickPartyDungeon(dungeon.id);}catch(e){result.textContent=e.message;}}
    else open('social-party');
}else if(params.get('panel')==='social-profile'){
    const actor=social.actors[0];if(actor)social.select(actor.profile);else paint();
}else if(params.get('panel')==='map')open('map');else paint();
let last=0;function frame(now){social.step(Math.min(.1,(now-last)/1000));last=now;renderer.render(world,save,now,{socialActors:social.actors});requestAnimationFrame(frame);}requestAnimationFrame(frame);
document.querySelector('#world').addEventListener('click',event=>{const point=renderer.screenToWorld(event.clientX,event.clientY),p=social.pick(point);if(p)social.select(p);});
const launch=document.createElement('button');launch.textContent='组队房间';launch.style='position:fixed;bottom:30px;left:5px;z-index:100';launch.onclick=()=>open('social-party');document.body.append(launch);
const approach=document.createElement('button');approach.textContent='靠近伙伴';approach.style='position:fixed;bottom:30px;left:90px;z-index:100';approach.onclick=()=>{close();const a=social.actors[0];save.position=nearestWalkable(world,a.position.x+60,a.position.y);};document.body.append(approach);
result.textContent=`隔离验收已就绪 · ${social.actors.length}位伙伴`;
document.documentElement.dataset.fixtureReady='1';
</script></body></html>

<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>公共页签验收</title>
<link rel="stylesheet" href="../../css/adventure.css"><link rel="stylesheet" href="../../css/adventure_storybook.css">
<link rel="stylesheet" href="../../css/adventure_shop.css"><link rel="stylesheet" href="../../css/adventure_strengthening.css"><link rel="stylesheet" href="../../css/adventure_gems.css"><link rel="stylesheet" href="../../css/adventure_world_map.css">
<body class="haqi-app"><div id="root"></div><script type="module">
import {loadResources} from '../../js/adventure_assets.js';
import {applyAction,createAdventure} from '../../js/adventure_core.js';
import {renderPanel} from '../../js/view_adventure.js';
// Real views with an in-memory character; no player storage is read or written.
const base=document.createElement('base');base.href=new URL('../../',location.href).href;document.head.append(base);
const assets=await loadResources(),save=createAdventure(assets.content,{name:'页签验收'});
const params=new URLSearchParams(location.search);
if(params.get('zone'))save.zone=params.get('zone');
if(params.has('noatlas'))document.body.classList.remove('storybook-ui');
const model={assets,save,shopView:{category:'pet'},petView:{},equipmentView:{tab:'gear',slot:0,item:null,query:'',page:0},strengtheningView:{guid:null,filter:0,page:0,pending:false,message:''},gemView:{guid:null,gemId:null,runes:[null,null,null],runeIndex:0,step:'equipment',filter:0,page:0,mode:'mount',removeIds:[],message:'',confirm:false}};
const root=document.querySelector('#root'),cb={close:()=>root.replaceChildren(),panel:show,action:()=>{},seenGuide:key=>{save.tips[key]=true;},encounter:()=>{},refresh:()=>show(params.get('panel')||'shop')};
function show(kind){
    if(kind==='upgrade'&&params.get('guide')==='1'&&assets.content.items[1912]){
        save.level=Math.max(save.level,2);
        save.inventory[1912]=Math.max(1,save.inventory[1912]||0);
        applyAction(save,assets.content,{type:'equip',itemId:1912});
    }
    if(kind==='deck'&&params.get('guide')==='1'&&save.deck.length>1){
        save.deck=save.deck.slice(0,1);
        const layout=save.deckLayouts?.[save.activeDeckLayout||0];
        if(layout)layout.deck=save.deck.map(row=>({...row}));
    }
    renderPanel(root,kind,model,cb);
    document.documentElement.dataset.fixtureReady='1';
}
window.__fixtureShow=show;
show(params.get('panel')||'shop');
</script></body></html>

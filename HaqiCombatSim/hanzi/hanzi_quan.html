function densify(pts, step) {
  const out = [[pts[0][0], pts[0][1]]];
  for (let i = 1; i < pts.length; i++) {
    const a = pts[i - 1], b = pts[i];
    const n = Math.max(1, Math.ceil(Math.hypot(b[0] - a[0], b[1] - a[1]) / step));
    for (let k = 1; k <= n; k++) out.push([lerp(a[0], b[0], k / n), lerp(a[1], b[1], k / n)]);
  }
  return out;
}

  let j = 0;
  for (let i = 0; i <= count; i++) {
    const target = total * i / count;
    while (j < d.length - 2 && d[j + 1] < target) j++;
    const seg = (d[j + 1] - d[j]) || 1, f = clamp((target - d[j]) / seg);
    out.push([lerp(pts[j][0], pts[j + 1][0], f), lerp(pts[j][1], pts[j + 1][1], f)]);

}

      if (s.length === 4) {

}

/* 山脊：三角包络 + 分形噪声，一次性生成 Path2D 与披麻皴纹理 */
function makeRidge(seed, x0, x1, baseY, peaks, rough) {
  const r = mulberry32(seed);
  const oct = [];
  for (let o = 0; o < 4; o++) oct.push({ f: 0.0022 * Math.pow(2.15, o), a: rough / Math.pow(1.95, o), p: r() * TAU });
  const pts = [];
  for (let x = x0; x <= x1; x += 10) {
    let env = 0;
    for (const pk of peaks) {
      const d = Math.abs((x - pk.x) / pk.w);
      if (d < 1) env = Math.max(env, pk.h * Math.pow(1 - d, 1.3));
    }
    let n = 0;
    for (const o of oct) n += Math.sin(x * o.f + o.p) * o.a;
    pts.push([x, baseY - env - n * (0.35 + 0.65 * clamp(env / 160))]);
  }
  const path = new Path2D();
  path.moveTo(x0, baseY + 420);
  for (const p of pts) path.lineTo(p[0], p[1]);
  path.lineTo(x1, baseY + 420);
  path.closePath();
  // 披麻皴：顺着山势向下的短皴笔
  const cun = [];
  for (let i = 0; i < 210; i++) {
    const k = Math.floor(r() * (pts.length - 1));
    const [px, py] = pts[k];
    const depth = 12 + r() * (baseY - py) * 0.82;
    const len = 16 + r() * 54;
    const drift = (r() - 0.5) * 26;
    cun.push([px, py + depth, px + drift, py + depth + len, 0.05 + r() * 0.13]);
  }
  return { path, pts, cun, baseY };
}

/* 松：树干 + 层叠针簇，一次性生成 */
function makePine(x, y, h, seed) {
  const r = mulberry32(seed);
  const lean = (r() - 0.5) * 0.16;
  const tiers = [];
  const n = 4 + Math.floor(r() * 2);
  for (let i = 0; i < n; i++) {
    const t = i / (n - 1);
    const ty = -h * (0.34 + t * 0.62);
    const w = h * (0.44 - t * 0.26) * (0.85 + r() * 0.3);
    const needles = [];
    const cnt = 9 + Math.floor(r() * 6);
    for (let k = 0; k < cnt; k++) {
      const u = (k / (cnt - 1)) * 2 - 1;
      needles.push([u * w, ty + Math.abs(u) * h * 0.055 - r() * h * 0.03, h * (0.045 + r() * 0.05)]);
    }
    tiers.push({ ty, w, needles, dx: lean * ty * -1 });
  }
  return { x, y, h, lean, tiers, ph: r() * TAU };
}

function drawPine(P, moonlit) {
  const sway = reduceMotion ? 0 : Math.sin(clock * 0.00055 + P.ph) * 0.026;
  ctx.save();
  ctx.translate(P.x, P.y);
  ctx.rotate(sway);
  // 树干
  ctx.strokeStyle = '#0a141b';
  ctx.lineWidth = Math.max(2.2, P.h * 0.035);
  ctx.lineCap = 'round';
  ctx.beginPath();
  // 树干必须与针簇层同一倾斜量（层偏移 = -2*lean*ty），否则会被拉成横贯天空的长线
  ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(P.lean * P.h, -P.h * 0.5, P.lean * P.h * 1.92, -P.h * 0.96);
  ctx.stroke();
  for (const T of P.tiers) {
    ctx.save();
    ctx.translate(T.dx + P.lean * T.ty * -1, T.ty);
    // 针簇团块
    ctx.fillStyle = '#0d1d22';
    ctx.beginPath();
    ctx.moveTo(-T.w, 2);
    ctx.quadraticCurveTo(-T.w * 0.4, -P.h * 0.075, 0, -P.h * 0.05);
    ctx.quadraticCurveTo(T.w * 0.4, -P.h * 0.075, T.w, 2);
    ctx.quadraticCurveTo(0, P.h * 0.035, -T.w, 2);
    ctx.closePath(); ctx.fill();
    // 放射松针
    ctx.strokeStyle = '#12292c'; ctx.lineWidth = 1.1;
    ctx.beginPath();
    for (const [nx, ny, nl] of T.needles) {
      for (let k = -1; k <= 1; k++) {
        ctx.moveTo(nx, ny);
        ctx.lineTo(nx + k * nl * 0.5, ny - nl);
      }
    }
    ctx.stroke();
    // 月华镶边
    if (moonlit > 0.05) {
      ctx.strokeStyle = `rgba(206,232,224,${(0.3 * moonlit).toFixed(3)})`;
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(T.w * 0.1, -P.h * 0.052);
      ctx.quadraticCurveTo(T.w * 0.55, -P.h * 0.072, T.w, 1);
      ctx.stroke();
    }
    ctx.restore();
  }
  ctx.restore();
}

  const m = W.glyph.m;

    let tx = b[0] - a[0], ty = b[1] - a[1]; const l = Math.hypot(tx, ty) || 1; tx /= l; ty /= l;

/* ---------- 帧更新与渲染 ---------- */
let introPt = null;
function updateParticles() {
  const k = DT * 0.05;
  for (const sp of W.splashes) {
    sp.x += sp.vx * k; sp.y += sp.vy * k; sp.vy += 0.075 * k;
  }
  W.splashes = W.splashes.filter(sp => clock - sp.t0 < sp.dur);
  W.ripples = W.ripples.filter(rp => clock - rp.t0 < rp.dur);

  if (W.flow > 0.02) {
    for (const d of W.drops) {
      d.u += d.sp * DT * (reduceMotion ? 0.35 : 1);
      if (d.u > 1) {
        d.u -= 1;
        if (W.pool > 0.4 && rand() > 0.72) {
          const P = flowAt(1);
          spawnRipple(P.x + (rand() - 0.5) * 40, POOL_Y + 6 + rand() * 14, 34 + rand() * 26, 0.3, 1400);
        }
      }
    }
    // 叠石处的水花与滴水声
    if (!reduceMotion && W.flow > 0.3 && clock - Sound.lastDrip > 620) {
      const li = Math.floor(rand() * LEDGES.length);
      const L = LEDGES[li];
      if (W.flow > li * 0.28 + 0.2) {
        spawnSplash(L.x + 6, L.y - L.ry * 0.6, 3, 0.55);
        if (rand() > 0.55) { Sound.drip(760 + li * 190 + rand() * 120, 0.045); Sound.lastDrip = clock; }
      }
    }
  }
  for (const f of W.flies) {
    if (f.a <= 0.001) continue;
    const a = clock * 0.00022 * f.sp + f.ph;
    f.x += Math.cos(a * 1.7) * 0.35 * k;
    f.y += Math.sin(a * 2.3) * 0.24 * k;
    if (f.x < 200) f.x = 2200; if (f.x > 2260) f.x = 240;
    f.y = clamp(f.y, 470, 800);
  }
  Sound.setFlow(W.intro ? 0.7 : W.flow * 0.9);
  if (W.shake > 0.01) W.shake = Math.max(0, W.shake - DT * 0.008);

  if (W.intro) {
    W.moon = 1; W.stars = 1; W.shafts = 0.85; W.mist = 1;
    W.spring = 1; W.flow = 1; W.pool = 1; W.charge = 1;
    W.spots.forEach(s => { s.found = true; s.a = 0; });
    W.flies.forEach(f => { f.a = 0.85; });
    const targetOrbit = introPt ? clamp((introPt.x / SW - 0.5) * 2, -1, 1) : (reduceMotion ? 0 : Math.sin(clock * 0.00055) * 0.6);
    cam.orbitX += (targetOrbit - cam.orbitX) * Math.min(1, DT / 240);
    if (!reduceMotion && clock - Sound.lastDrip > 1500 && W.intro) {
      Sound.lastDrip = clock;
      const P = flowAt(0.4 + rand() * 0.6);
      spawnRipple(P.x, POOL_Y + 8 + rand() * 20, 30 + rand() * 24, 0.26, 1500);
    }
  } else {
    cam.orbitX *= 0.92;
  }
}
function render() {
  updateView();
  const w = cvs.width, h = cvs.height;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;

  drawSky();
  drawMoon();
  drawShafts();
  drawMountains();
  drawMist(false);
  drawCliff();
  drawBank();
  drawPool();
  drawStream();
  drawParticles();
  drawMist(true);
  drawInteractHints();

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  ctx.drawImage(hempC, 0, 0);
  if (!vignette || vignette.w !== w || vignette.h !== h) {
    const g = ctx.createRadialGradient(w / 2, h * 0.46, Math.min(w, h) * 0.34, w / 2, h * 0.46, Math.hypot(w, h) * 0.66);
    g.addColorStop(0, 'rgba(6,12,18,0)');

}

let last = null, paused = false;
function loop(now) {
  requestAnimationFrame(loop);
  if (last == null) last = now;
  const dt = Math.min(50, Math.max(0, now - last));
  last = now;
  if (visible && !paused) {
    DT = dt;
    clock += dt;
    updateParticles();
    const list = waiters; waiters = [];
    for (const wt of list) { if (wt.tk.dead) wt.rej(new Cancelled()); else wt.res(clock); }
  }
  render();
}

cvs.addEventListener('pointerdown', e => {

async function sWrite(tk) {
  publish('sWrite');
  progress(4);
  await caption('写字', '「泉」一共九笔，先写上面的白，再写下面的水。', tk);
  await tween(800, t => { W.glyph.prog = W.glyph.prog.map(() => 1 - t); W.glyph.ghost = t; }, tk);
  W.glyph.prog = Array(NS).fill(0);
  W.glyph.trace = true; W.trace = { stroke: 0, pen: null };

  const showStroke = () => {
    capMinEnd = 0;
    showCaption('写字', `第 ${W.trace.stroke + 1} 笔，共 ${NS} 笔。`);
    hint(`${KAI[W.trace.stroke].name}：从红点起笔，顺着虚线写`);
  };
  await captionDone(tk);
  showStroke();

  let samples = MLD[0], drag = null, lastInput = clock, demoing = false, completed = 0, invalidHint = 0;
  const finishStroke = () => {
    const i = W.trace.stroke;
    if (i >= NS) return;
    W.glyph.prog[i] = 1;
    Sound.pluck(PENTA[i % PENTA.length], 0.12, 1.4);
    W.trace.stroke++;
    W.trace.pen = null;
    completed++;
    if (W.trace.stroke < NS) { samples = MLD[W.trace.stroke]; showStroke(); }
  };
  S.finish = finishStroke;
  const tolLocal = () => Math.max(20, 48 / (CV.k * GL.s));

  S.handler = {
    down(p) {
      if (demoing || W.trace.stroke >= NS) return;
      lastInput = clock;
      const q = toLocal(p.x, p.y), t = tolLocal();
      const lastPt = samples[samples.length - 1];
      const dEnd = Math.hypot(q.x - lastPt[0], q.y - lastPt[1]);
      let startIdx = -1, bestD = Infinity;
      const startLimit = Math.max(1, Math.floor(samples.length * 0.35));
      for (let j = 0; j < startLimit; j++) {
        const d = Math.hypot(q.x - samples[j][0], q.y - samples[j][1]);
        if (d < bestD) { bestD = d; startIdx = j; }
      }
      if (bestD > t * 1.75 || (bestD > dEnd * 1.15 && dEnd < t * 1.2)) {
        if (clock - invalidHint > 500) { hint('从这一笔的红点开始哦'); invalidHint = clock; }
        return;
      }
      drag = { idx: startIdx, fIdx: startIdx, lastQ: q };
      W.glyph.prog[W.trace.stroke] = drag.idx / (samples.length - 1);
      W.trace.pen = samples[drag.idx];
    },
    move(p) {
      if (!drag) return;
      lastInput = clock;
      const q = toLocal(p.x, p.y), t = tolLocal();
      const prev = drag.lastQ || q;
      const distMove = Math.hypot(q.x - prev.x, q.y - prev.y);
      const steps = Math.max(1, Math.min(8, Math.ceil(distMove / 4)));
      const lastIdx = samples.length - 1;
      for (let s = 1; s <= steps; s++) {
        const u = s / steps, sx = lerp(prev.x, q.x, u), sy = lerp(prev.y, q.y, u);
        const win = Math.max(18, Math.ceil(lastIdx * 0.55));
        let best = drag.idx, bd = Infinity;
        for (let j = Math.max(0, drag.idx - 2); j <= Math.min(lastIdx, drag.idx + win); j++) {
          const d = Math.hypot(sx - samples[j][0], sy - samples[j][1]);
          if (d < bd) { bd = d; best = j; }
        }
        if (bd <= t * 1.35 && best >= drag.idx) {
          const a = samples[drag.idx], b = samples[best];
          const mvx = q.x - prev.x, mvy = q.y - prev.y, svx = b[0] - a[0], svy = b[1] - a[1];
          if (best === drag.idx || distMove < 0.5 || (mvx * svx + mvy * svy) >= -0.25 * distMove * Math.hypot(svx, svy)) {
            drag.idx = best; drag.fIdx = Math.max(drag.fIdx || 0, best);
          }
        }
      }
      if (distMove > 0.4 && drag.idx < lastIdx) {
        const curIdx = Math.min(lastIdx - 1, drag.idx);
        const lookIdx = Math.min(lastIdx, curIdx + Math.max(6, Math.ceil(lastIdx * 0.18)));
        const tx = samples[lookIdx][0] - samples[curIdx][0], ty = samples[lookIdx][1] - samples[curIdx][1];
        const tLen = Math.hypot(tx, ty) || 1;
        const forwardProj = ((q.x - prev.x) * tx + (q.y - prev.y) * ty) / tLen;
        const curD = Math.hypot(q.x - samples[curIdx][0], q.y - samples[curIdx][1]);
        if (forwardProj > 0.15 && curD <= t * 2.6) {
          let totalLen = 0;
          for (let j = 1; j <= lastIdx; j++) totalLen += Math.hypot(samples[j][0] - samples[j - 1][0], samples[j][1] - samples[j - 1][1]);
          const avgSeg = Math.max(0.6, totalLen / lastIdx);
          drag.fIdx = Math.min(lastIdx, Math.max(drag.fIdx || drag.idx, drag.idx) + (forwardProj / avgSeg) * 1.25);
          drag.idx = Math.max(drag.idx, Math.floor(drag.fIdx));
        }
      }
      drag.lastQ = q;
      W.glyph.prog[W.trace.stroke] = drag.idx / lastIdx;
      W.trace.pen = samples[drag.idx];
    },
    up(p, cancel) {
      if (!drag) return;
      const d = drag; drag = null; W.trace.pen = null;
      const lastIdx = samples.length - 1;
      const needIdx = Math.min(lastIdx - 2, Math.max(3, Math.ceil(lastIdx * 0.56)));
      if (!cancel && d.idx >= needIdx) { finishStroke(); return; }
      const i = W.trace.stroke, from = W.glyph.prog[i];
      bg(tween(260, t => { if (W.trace.stroke === i) W.glyph.prog[i] = from * (1 - t); }, tk));
      if (clock - invalidHint > 400) { hint('顺着虚线方向写到箭头附近即可'); invalidHint = clock; }
    },
  };

  const demo = async () => {
    if (demoing || W.trace.stroke >= NS) return;
    demoing = true; ui.demo.disabled = true; drag = null;
    hint('看笔尖光点走过每一笔');
    while (W.trace.stroke < NS) {
      const i = W.trace.stroke, pts = MLD[i];
      W.glyph.prog[i] = 0;
      await tween(720 * M, t => { W.glyph.prog[i] = t; W.trace.pen = pts[Math.round(t * (pts.length - 1))]; }, tk, ease.sine);
      W.trace.pen = null;
      finishStroke();
      await wait(160, tk);
    }
  };
  S.demo = () => { S.interactions.push('demo'); bg(demo()); };
  mode('trace'); ui.demo.hidden = false;
  if (AUTO) { S.interactions.push('auto'); bg(demo()); }

  let nudged = false;
  while (W.trace.stroke < NS) {
    await frame(tk);
    if (!demoing && !nudged && clock - lastInput > 14000) { hint('写不出来也没关系，点“看示范”'); nudged = true; }
    if (!demoing && completed === 0 && clock - lastInput > 26000) { S.interactions.push('auto'); bg(demo()); }
  }

  S.handler = null; S.demo = null; S.finish = null; mode(null); hint(null);
  ui.demo.hidden = true; ui.demo.disabled = false; W.glyph.trace = false;
  if (!S.interactions.includes('demo') && !S.interactions.includes('auto')) S.interactions.push('user');
  window.__quan.events.push('written');
  window.haqiHanziWritten?.();

  await tween(500, t => { W.glyph.ghost = 1 - t; }, tk);
  await tween(480, t => { W.glyph.stamp = t; }, tk, ease.out);
  Sound.bell(NOTE.A4, 0.11); Sound.pluck(NOTE.A5, 0.08);
  await caption('写字', '写好了！泉，山泉的泉。', tk);
  await captionDone(tk);
}

async function sWords(tk) {
  publish('sWords');
  progress(5);
  const g0 = { ...GL };
  await tween(1000 * M, t => {
    GL.cy = lerp(g0.cy, g0.cy - 26, t);
    GL.s = lerp(g0.s, portrait ? 3.2 : 2.84, t);
    W.veil = lerp(0.95, 0.74, t);
  }, tk);

  for (let i = 0; i < WORDS.length; i++) {
    const pCap = caption(WORDS[i][0], WORDS[i][1], tk);
    await wait(340, tk);
    W.wordOn = i;
    Sound.pluck(PENTA[3 + i], 0.13);
    Sound.drip(NOTE.D6 * (1 + i * 0.08), 0.05);
    const from = W.mood, to = WORD_MOOD[i];
    bg(tween(1100 * M, t => { W.mood = lerp(from, to, t); }, tk));
    bg(tween(600, t => { W.glyph.words = Math.max(W.glyph.words, i + t); }, tk, ease.out));
    await pCap;
    await captionDone(tk);
  }
  W.wordOn = -1;
}

async function sFinale(tk) {
  publish('sFinale');
  progress(6);
  setPaperMode(false);
  bg(camTo(camView('finale'), 2800 * M, tk));
  await tween(2200 * M, t => {
    W.glyph.alpha = 1 - t;
    W.veil = 0.74 * (1 - t);
    W.mood = lerp(2, 0.15, t);
  }, tk);
  W.glyph = { ...W.glyph, alpha: 0, words: 0 };
  Sound.bell(NOTE.D5, 0.09);

  await caption('余韵', '明月松间照，清泉石上流——山睡了，泉还在轻轻地唱。', tk, 420);
  await captionDone(tk);

  hint('点一点水面激起涟漪，点一点松林唤起流萤');
  mode('play');
  setAction('再看一次', () => { Sound.init(); begin(); });
  S.handler = {
    down(p) {
      if (p.y > POOL_Y - 30) {
        spawnRipple(clamp(p.x, 260, 2180), clamp(p.y, POOL_Y + 4, POOL_Y + 120), 110, 0.6, 1900);
        spawnSplash(clamp(p.x, 260, 2180), POOL_Y + 4, 12, 0.8);
        Sound.drip(700 + rand() * 700, 0.11);
        Sound.splash(0.4, 0.04, 2400);
      } else if (p.y < 420) {
        Sound.bell(NOTE.A5, 0.07);
        spawnRipple(moonPoolX(), POOL_Y + 30, 130, 0.4, 2200);
      } else {
        Sound.wind();
        Sound.pluck(PENTA[Math.floor(rand() * PENTA.length)], 0.09);
        for (const f of W.flies) {
          if (rand() > 0.55) { f.x = clamp(p.x + (rand() - 0.5) * 320, portrait ? 740 : 240, portrait ? 1250 : 2200); f.y = clamp(p.y + (rand() - 0.5) * 180, 470, 780); }
        }
        bg(tween(700, t => { W.flies.forEach(f => { f.a = Math.max(f.a, t); }); }, tk));
      }
      hint(null);
    },
  };
  window.__quan.finished = true;
  window.__quan.events.push('completed');
  window.haqiHanziComplete();
  for (;;) await frame(tk);
}

const SCENES = [sNight, sListen, sGush, sGlyph, sWrite, sWords, sFinale];

async function begin() {
  stopAll();
  const tk = token = { dead: false };
  capMinEnd = 0;
  if (paused) setPaused(false);
  resetWorld();
  W.intro = false;
  setPaperMode(false);
  Object.assign(cam, camView('night'));
  S.handler = null; S.demo = null; S.finish = null; mode(null); setAction(null); hint(null);
  ui.demo.hidden = true; ui.demo.disabled = false; ui.cap.classList.remove('on');
  rand = mulberry32(SEED);
  S.interactions = [];
  Sound.lastDrip = 0;
  window.__quan.events = []; window.__quan.finished = false;
  publish('sNight');
  try { for (const sc of SCENES) await sc(tk); }
  catch (e) { if (!(e instanceof Cancelled)) console.error(e); }
}

async function introPlay(tk) {
  W.intro = true;
  Object.assign(cam, camView('intro'));
  for (;;) await frame(tk);
}

resetWorld();
Object.assign(cam, camView('intro'));
window.__quan = {
  scene: 'intro', finished: false, events: [], interactions: [], state: W,
  medians: QUAN.medians, strokes: QUAN.strokes, toScreen,
  localToScreen(x, y) { return toScreen(GL.cx + (x - 50) * GL.s, GL.cy + (y - 50) * GL.s); },
  strokePoints: KPTS, tracePoints: MLD,
  get paused() { return paused; },
  get muted() { return Sound.muted; },
  completeCurrentStroke() { S.finish?.(); },
};
resize();
render();
addEventListener('resize', () => { resize(); render(); });
requestAnimationFrame(loop);
bg(introPlay(token = { dead: false }));

$('#start').addEventListener('click', () => {
  Sound.init();
  $('#intro').classList.add('off');
  document.body.classList.add('started');
  begin();
});
$('#replay').addEventListener('click', () => {
  Sound.init();
  $('#intro').classList.add('off');
  document.body.classList.add('started');
  begin();
});
$('#mute').addEventListener('click', e => {
  Sound.init();
  Sound.setMuted(!Sound.muted);
  const btn = e.currentTarget;
  btn.setAttribute('aria-pressed', String(Sound.muted));
  const zh = Sound.muted ? '开启声音' : '静音';
  btn.textContent = window.haqiHanziUi ? window.haqiHanziUi(zh, btn) : zh;
});
function setPaused(v) {
  paused = v;
  last = null;
  Sound.setSuspended(v);
  const btn = $('#pause');
  btn.setAttribute('aria-pressed', String(v));
  const zh = v ? '继续' : '暂停';
  btn.textContent = window.haqiHanziUi ? window.haqiHanziUi(zh, btn) : zh;
}
$('#pause').addEventListener('click', () => { Sound.init(); setPaused(!paused); });
document.addEventListener('visibilitychange', () => {
  visible = !document.hidden;
  last = null;
  Sound.setSuspended(!visible || paused);
});
addEventListener('pagehide', () => { stopAll(); void Sound.ctx?.close().catch(() => {}); }, { once: true });

if (AUTO) {
  $('#intro').classList.add('off');
  document.body.classList.add('started');
  begin();
}
})();
</script>
</body>

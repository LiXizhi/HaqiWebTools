window.haqiHanziPrefetch=texts=>ensureTexts(Array.isArray(texts)?texts:[texts]);
window.haqiHanziUi=(zh,el)=>{const s=typeof zh==='string'?zh.trim():'';if(!s)return zh;if(el)trackUi(el,s);else ensureTexts([s]);const tr=!isZh(context?.locale)&&uiCache.get(s);return(tr&&tr!==s)?tr:zh;};

window.haqiHanziTranslate=texts=>new Promise(resolve=>{const list=(Array.isArray(texts)?texts:[]).map(t=>typeof t==='string'?t.trim():'').filter(Boolean);if(!context||!list.length){resolve({});return;}const requestId=String(++serial);const timer=setTimeout(()=>{callbacks.delete(requestId);resolve({});},1500);callbacks.set(requestId,msg=>{clearTimeout(timer);const sub=msg?.translations||{},ui=msg?.uiTranslations||sub;for(const[k,v]of Object.entries(sub))if(typeof v==='string'&&v.trim())subCache.set(k,v.trim());for(const[k,v]of Object.entries(ui))if(typeof v==='string'&&v.trim())uiCache.set(k,v.trim());refreshDom();resolve(sub);});send({type:'translate',requestId,texts:list});});
addEventListener('message',event=>{const m=event.data;if(event.source!==parent||parent===window||m?.channel!=='haqi-hanzi'||m.version!==1)return;
if(m.type==='init'&&typeof m.sessionId==='string'&&typeof m.entryId==='string'){if(document.referrer&&event.origin!==new URL(document.referrer).origin)return;context={...m,origin:event.origin};scanStatic();flushPending();refreshDom();if(written)send({type:'written'});if(finished)send({type:'completed'});}
else if(context&&event.origin===context.origin&&m.sessionId===context.sessionId&&m.type==='translations'){callbacks.get(m.requestId)?.(m);callbacks.delete(m.requestId);}});
if(parent!==window)parent.postMessage({channel:'haqi-hanzi',version:1,type:'ready'},'*');})();

    }
  },
  arp(idx = 0) {
    if (!this.ctx || this.muted) return;
    [0, 1, 2, 4].forEach((k, i) => {
      const f = PENTA[Math.min(PENTA.length - 1, idx + k)];
      setTimeout(() => this.zheng(f, 0.09, 1.3), i * 65);
    });
  },
  basketDrop(idx = 0) {
    if (!this.ctx || this.muted) return;
    const c = this.ctx, t = c.currentTime;
    const o = c.createOscillator(), g = c.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(280 + idx * 35, t);
    o.frequency.exponentialRampToValueAtTime(145, t + 0.14);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.14, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + 0.2);
    this.zheng(PENTA[2 + idx], 0.08, 1.1);
  },
  oriole() {
    if (!this.ctx || this.muted) return;
    const c = this.ctx, t = c.currentTime;
    for (const [dt, f0, f1] of [[0, 1180, 1560], [0.14, 1360, 1760]]) {
      const o = c.createOscillator(), g = c.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(f0, t + dt);
      o.frequency.exponentialRampToValueAtTime(f1, t + dt + 0.11);
      g.gain.setValueAtTime(0.0001, t + dt);
      g.gain.linearRampToValueAtTime(0.055, t + dt + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dt + 0.13);
      o.connect(g); g.connect(this.master);
      o.start(t + dt); o.stop(t + dt + 0.15);
    }
  },
  bell(freq = NOTE.F5, vol = 0.085) {
    if (!this.ctx || this.muted) return;
    const c = this.ctx, t = c.currentTime;
    for (const [r, a, d] of [[1, 1, 2.2], [2.756, 0.36, 1.2]]) {
      const o = c.createOscillator(), g = c.createGain();
      o.type = 'sine'; o.frequency.value = freq * r;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(vol * a, t + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.connect(g); g.connect(this.master);
      o.start(t); o.stop(t + d + 0.04);
    }
  },
  breeze(dur = 0.6, freq = 1800, vol = 0.03) {
    if (!this.ctx || !this.noise || this.muted) return;
    const c = this.ctx, t = c.currentTime;
    const s = c.createBufferSource(); s.buffer = this.noise;
    const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = freq; bp.Q.value = 1.1;
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + Math.min(0.15, dur * 0.3));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(bp); bp.connect(g); g.connect(this.master);
    this.nCursor = (this.nCursor + 0.23) % 1.2;
    s.start(t, this.nCursor); s.stop(t + dur + 0.04);
  },
};

function densify(pts, step) {
  const out = [[pts[0][0], pts[0][1]]];
  for (let i = 1; i < pts.length; i++) {
    const a = pts[i - 1], b = pts[i];
    const n = Math.max(1, Math.ceil(Math.hypot(b[0] - a[0], b[1] - a[1]) / step));
    for (let k = 1; k <= n; k++) out.push([lerp(a[0], b[0], k / n), lerp(a[1], b[1], k / n)]);
  }
  return out;
}
function resamplePoly(pts, count = 64) {
  const d = [0];
  for (let i = 1; i < pts.length; i++) d.push(d[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
  const total = d[d.length - 1] || 1, out = [];
  let j = 0;
  for (let i = 0; i <= count; i++) {
    const target = total * i / count;
    while (j < d.length - 2 && d[j + 1] < target) j++;
    const seg = (d[j + 1] - d[j]) || 1, f = clamp((target - d[j]) / seg);
    out.push([lerp(pts[j][0], pts[j + 1][0], f), lerp(pts[j][1], pts[j + 1][1], f)]);
  }
  return out;
}
function bezierChain(segs) {
  const pts = [];
  for (const s of segs) {
    for (let i = 0; i <= 20; i++) {
      const t = i / 20, u = 1 - t;
      if (s.length === 4) {
        pts.push([
          u * u * u * s[0][0] + 3 * u * u * t * s[1][0] + 3 * u * t * t * s[2][0] + t * t * t * s[3][0],
          u * u * u * s[0][1] + 3 * u * u * t * s[1][1] + 3 * u * t * t * s[2][1] + t * t * t * s[3][1],
        ]);
      } else pts.push([lerp(s[0][0], s[1][0], t), lerp(s[0][1], s[1][1], t)]);
    }
  }
  return resamplePoly(pts, 64);
}

  if (open < 0.15) {
    // 含苞青粉小花蕾
    ctx.fillStyle = '#7fa184';
    ctx.beginPath(); ctx.arc(0, 4, 4.5, 0, TAU); ctx.fill();
    ctx.fillStyle = '#f5e4e6';
    ctx.beginPath(); ctx.ellipse(0, -2, 5.5, 7, 0, 0, TAU); ctx.fill();
    ctx.restore();
    return;
  }
  const r = 11 * (0.35 + 0.65 * open);
  // 淡青花托微露
  ctx.fillStyle = 'rgba(132,168,136,0.55)';
  ctx.beginPath(); ctx.arc(0, 0, r * 0.42, 0, TAU); ctx.fill();
  // 五瓣雪白圆润花瓣（宋院工笔白粉晕染）
  for (let i = 0; i < 5; i++) {
    const a = -Math.PI / 2 + (i * TAU) / 5;
    ctx.save();
    ctx.rotate(a);
    ctx.fillStyle = '#fffdfa';
    ctx.strokeStyle = 'rgba(196,172,168,0.48)';
    ctx.lineWidth = 0.85;
    ctx.beginPath();
    ctx.ellipse(0, -r * 0.72, r * 0.56, r * 0.68, 0, 0, TAU);
    ctx.fill(); ctx.stroke();
    ctx.restore();
  }
  // 淡青花心与鹅黄细花丝
  ctx.fillStyle = '#b8ceb0';
  ctx.beginPath(); ctx.arc(0, 0, 3.2 * open, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(218,168,72,0.85)';
  ctx.lineWidth = 0.9;
  for (let i = 0; i < 7; i++) {
    const a = (i * TAU) / 7 + 0.2;
    const lx = Math.cos(a) * r * 0.48, ly = Math.sin(a) * r * 0.48;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(lx, ly); ctx.stroke();
    ctx.fillStyle = '#eec25e';
    ctx.beginPath(); ctx.arc(lx, ly, 1.3, 0, TAU); ctx.fill();
  }
  ctx.restore();
}

function drawRipePlum(x, y, s, rot = 0) {
  if (s <= 0.02) return;

  ctx.rotate(rot);
  ctx.scale(s, s);
  // 果柄与两片嫩绿李叶
  ctx.strokeStyle = '#5a432e'; ctx.lineWidth = 2.2;
  ctx.beginPath(); ctx.moveTo(0, -20); ctx.quadraticCurveTo(3, -28, 7, -32); ctx.stroke();
  ctx.fillStyle = '#4e8458';
  ctx.beginPath(); ctx.ellipse(-11, -24, 12, 5.2, -0.45, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(12, -23, 11, 4.8, 0.4, 0, TAU); ctx.fill();

  // 绛紫饱满李果主体
  const pg = ctx.createRadialGradient(-7, -7, 3, 0, 2, 24);

function drawPlumTree() {
  setCam(ctx, 1);
  const leafAmt = clamp((W.season - 0.35) * 1.15);
  const breeze = reduceMotion ? 0 : Math.sin(clock * 0.0018) * 3.5;

  // 树下柔影
  ctx.fillStyle = 'rgba(56,64,46,0.18)';
  ctx.beginPath(); ctx.ellipse(TREE_X, TREE_BASE + 8, 175, 24, 0, 0, TAU); ctx.fill();

  // 苍劲老李树干与上展四向枝干（天然对应上部「木」的一横、一竖、一撇、一捺！）
  ctx.save();
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const barkG = ctx.createLinearGradient(TREE_X - 40, 260, TREE_X + 40, TREE_BASE);
  barkG.addColorStop(0, '#5a4332');
  barkG.addColorStop(0.55, '#493526');
  barkG.addColorStop(1, '#38271b');
  ctx.strokeStyle = barkG;

  // 主竖干（对应木之竖）
  ctx.lineWidth = 32;
  ctx.beginPath();
  ctx.moveTo(TREE_X, TREE_BASE);
  ctx.quadraticCurveTo(TREE_X - 8, 520, TREE_X + 2, 265);
  ctx.stroke();

  // 两侧横展主枝（对应木之横）
  ctx.lineWidth = 18;
  ctx.beginPath();
  ctx.moveTo(TREE_X - 4, 372);
  ctx.quadraticCurveTo(1070, 352, 925 + breeze * 0.5, 360);
  ctx.moveTo(TREE_X + 4, 368);
  ctx.quadraticCurveTo(1335, 348, 1485 + breeze * 0.5, 364);
  ctx.stroke();

  // 下垂斜展侧枝与露根（对应木之撇、捺）
  ctx.lineWidth = 13;
  ctx.beginPath();
  ctx.moveTo(TREE_X - 8, 425);
  ctx.quadraticCurveTo(1080, 468, 965, 512);
  ctx.moveTo(TREE_X + 8, 425);
  ctx.quadraticCurveTo(1325, 468, 1445, 510);
  ctx.stroke();

  // 树皮苔点肌理
  ctx.fillStyle = 'rgba(116,148,108,0.42)';
  for (const [mx, my, mr] of [[-8, 590, 6], [6, 535, 5], [-5, 470, 4.5]]) {
    ctx.beginPath(); ctx.arc(TREE_X + mx, my, mr, 0, TAU); ctx.fill();
  }
  ctx.restore();

  // 盛夏翠叶层（当进入结李季浮现）
  if (leafAmt > 0.02) {
    ctx.save();
    ctx.globalAlpha = leafAmt * 0.9;
    for (const c of W.boughs) {
      for (const [bx, by] of c.blossoms) {
        const lx = c.x + bx * 1.15 + breeze * 0.5, ly = c.y + by * 1.05;
        ctx.fillStyle = '#4e8459';
        ctx.beginPath(); ctx.ellipse(lx - 12, ly + 4, 18, 7.5, -0.4, 0, TAU); ctx.fill();
        ctx.fillStyle = '#689d68';
        ctx.beginPath(); ctx.ellipse(lx + 11, ly - 3, 16, 7, 0.35, 0, TAU); ctx.fill();
      }
    }
    ctx.restore();
  }

  // 三簇五瓣白李花（盛春似雪，入夏渐隐为果）
  const flowerFade = 1 - clamp((W.season - 1.15) * 1.35);
  if (flowerFade > 0.02) {
    ctx.save();
    ctx.globalAlpha = flowerFade;
    for (const c of W.boughs) {
      const sway = (reduceMotion ? 0 : Math.sin(clock * 0.0024 + c.i) * 3) + Math.sin(c.sway * Math.PI) * 8;
      // 柔和花团白雾底晕
      if (c.bloom > 0.1) {
        const bgG = ctx.createRadialGradient(c.x + sway, c.y, 8, c.x + sway, c.y, c.r * 1.15);
        bgG.addColorStop(0, `rgba(255,253,248,${(0.55 * c.bloom).toFixed(3)})`);
        bgG.addColorStop(1, 'rgba(255,253,248,0)');
        ctx.fillStyle = bgG;
        ctx.beginPath(); ctx.arc(c.x + sway, c.y, c.r * 1.15, 0, TAU); ctx.fill();
      }
      for (const [bx, by, sc] of c.blossoms) {
        drawPlumBlossom(c.x + bx + sway, c.y + by, sc * 1.28, c.bloom);
      }
      // 催花互动引导光环
      if (W.bloomUI > 0.02 && c.bloom < 0.5) {
        const p = reduceMotion ? 0.5 : 0.5 + 0.5 * Math.sin(clock * 0.004 + c.i * 1.6);
        ctx.strokeStyle = `rgba(182,78,102,${(W.bloomUI * (0.42 + 0.42 * p)).toFixed(3)})`;
        ctx.lineWidth = 2.2;
        ctx.beginPath(); ctx.arc(c.x, c.y, 44 + p * 12, 0, TAU); ctx.stroke();
      }
    }
    ctx.restore();
  }

  // 树下竹编果篮（盛放采下的紫李，位置正处于树干正下方，天然呼应下「子」）
  drawBasketAndPlums();
}

function drawBasketAndPlums() {
  const bx = TREE_X, by = 668;
  // 竹篮后沿
  ctx.save();
  ctx.translate(bx, by);
  ctx.fillStyle = '#8b683e';
  ctx.beginPath(); ctx.ellipse(0, -14, 46, 12, 0, 0, TAU); ctx.fill();

  // 已落入竹篮的李子
  for (const p of W.plums) {
    if (p.state === 'basket') drawRipePlum(p.curX - bx, p.curY - by, 0.72, 0.15 * (p.i - 1));
  }

  // 竹篮编织前壁与提梁
  const wg = ctx.createLinearGradient(-46, -14, 46, 20);
  wg.addColorStop(0, '#cfa86e');
  wg.addColorStop(0.55, '#b68c52');
  wg.addColorStop(1, '#8c6738');
  ctx.fillStyle = wg;
  ctx.beginPath();
  ctx.moveTo(-46, -14);
  ctx.quadraticCurveTo(-40, 22, 0, 22);
  ctx.quadraticCurveTo(40, 22, 46, -14);
  ctx.quadraticCurveTo(0, -4, -46, -14);
  ctx.fill();
  ctx.strokeStyle = '#75532b'; ctx.lineWidth = 1.6;
  ctx.stroke();
  // 竹编斜纹与提梁
  for (let x = -30; x <= 30; x += 15) {
    ctx.beginPath(); ctx.moveTo(x - 6, -8); ctx.lineTo(x + 4, 18); ctx.stroke();
  }
  ctx.lineWidth = 3.6;
  ctx.beginPath(); ctx.arc(0, -14, 42, Math.PI * 1.06, Math.PI * 1.94); ctx.stroke();
  ctx.restore();

  // 悬挂枝头或正在下落的熟李
  for (const p of W.plums) {
    if (p.state === 'basket' || p.grow <= 0.02) continue;
    const sway = p.state === 'hang' && !reduceMotion ? Math.sin(clock * 0.0026 + p.i * 1.9) * 0.06 : p.rot;
    drawRipePlum(p.curX, p.curY, p.grow, sway);
    if (W.pickUI > 0.02 && p.state === 'hang') {
      const pulse = reduceMotion ? 0.5 : 0.5 + 0.5 * Math.sin(clock * 0.0042 + p.i * 1.5);
      ctx.strokeStyle = `rgba(232,168,78,${(W.pickUI * (0.45 + 0.45 * pulse)).toFixed(3)})`;
      ctx.lineWidth = 2.2;
      ctx.beginPath(); ctx.arc(p.curX, p.curY, 28 + pulse * 9, 0, TAU); ctx.stroke();
    }
  }
}

    ctx.strokeStyle = '#9e3348'; ctx.lineWidth = 1.8;

function drawPetals() {
  setCam(ctx, 1);
  for (const p of W.petals) {
    const u = clamp((clock - p.t0) / p.dur);

/* ---------- 字源演进、书契底板、七笔描红与词意 ---------- */
function glyphCam() {
  setCam(ctx, 1);
  ctx.translate(GL.cx, GL.cy);
  ctx.scale(GL.s, GL.s);
  ctx.translate(-50, -50);
}
function toLocal(wx, wy) { return { x: (wx - GL.cx) / GL.s + 50, y: (wy - GL.cy) / GL.s + 50 }; }
function withMmah(fn) {
  ctx.save();
  ctx.scale(100 / 1024, 100 / 1024);
  ctx.translate(0, 900); ctx.scale(1, -1);
  fn();
  ctx.restore();
}
function strokePts(i) {
  const m = W.glyph.m;
  if (m <= 0) return OPTS[i];
  if (m >= 2) return KPTS[i];
  const [a, b, e] = m < 1 ? [OPTS[i], SPTS[i], ease.inOut(m)] : [SPTS[i], KPTS[i], ease.inOut(m - 1)];
  return a.map((p, j) => [lerp(p[0], b[j][0], e), lerp(p[1], b[j][1], e)]);
}
function strokeW(i, s) {
  const m = W.glyph.m;
  if (m <= 1) return lerp(2.7 * PROF.carve(s), 3.5 * PROF.seal(s), ease.inOut(clamp(m)));
  return lerp(3.5 * PROF.seal(s), KAI[i].w * PROF[KAI[i].p](s), ease.inOut(clamp(m - 1)));
}
function brush(c, i, upto) {
  if (upto <= 0.001) return;
  const pts = strokePts(i);
  const n = pts.length - 1, m = upto * n, mi = Math.floor(m);
  const P = pts.slice(0, mi + 1);
  if (mi < n && m > mi) { const a = pts[mi], b = pts[mi + 1], f = m - mi; P.push([lerp(a[0], b[0], f), lerp(a[1], b[1], f)]); }
  if (P.length < 2) return;
  const Lp = [], Rp = [];
  for (let j = 0; j < P.length; j++) {
    const a = P[Math.max(0, j - 1)], b = P[Math.min(P.length - 1, j + 1)];
    let tx = b[0] - a[0], ty = b[1] - a[1]; const l = Math.hypot(tx, ty) || 1; tx /= l; ty /= l;
    const s = Math.min(1, (j / (P.length - 1)) * (m / n));
    const w = strokeW(i, s) / 2;
    Lp.push([P[j][0] - ty * w, P[j][1] + tx * w]);
    Rp.push([P[j][0] + ty * w, P[j][1] - tx * w]);
  }
  c.beginPath(); c.moveTo(Lp[0][0], Lp[0][1]);
  for (const p of Lp) c.lineTo(p[0], p[1]);
  for (let j = Rp.length - 1; j >= 0; j--) c.lineTo(Rp[j][0], Rp[j][1]);
  c.closePath(); c.fill();
  const e0 = P[0], e1 = P[P.length - 1];
  c.beginPath();
  c.arc(e0[0], e0[1], strokeW(i, 0) / 2, 0, TAU);
  c.arc(e1[0], e1[1], strokeW(i, Math.min(1, m / n)) / 2, 0, TAU);
  c.fill();
}
function paintStroke(i, q) {
  if (q <= 0) return;
  const path = LI_PATHS[i];
  if (q >= 1) { ctx.fill(path); return; }
  ctx.save();
  ctx.clip(path);
  ctx.lineWidth = 175; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.strokeStyle = ctx.fillStyle;
  const pts = MMD[i], count = (pts.length - 1) * q, k = Math.floor(count);
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (let j = 1; j <= k && j < pts.length; j++) ctx.lineTo(pts[j][0], pts[j][1]);
  if (k < pts.length - 1) {
    const a = pts[k], b = pts[k + 1], f = count - k;
    ctx.lineTo(lerp(a[0], b[0], f), lerp(a[1], b[1], f));
  }
  ctx.stroke();
  ctx.restore();
}

function drawPlates(a, m) {
  const bone = a * (1 - smooth(m * 1.3));
  const slip = a * smooth(m * 2.2 - 0.5) * (1 - smooth((m - 1.15) * 2.2));
  const paper = a * smooth((m - 1.25) * 2.2);
  if (bone > 0.01) {
    ctx.save(); ctx.globalAlpha = bone;
    const g = ctx.createRadialGradient(42, 36, 8, 50, 50, 74);
    g.addColorStop(0, '#f4ead2'); g.addColorStop(0.7, '#ddc79e'); g.addColorStop(1, '#bda070');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.ellipse(50, 50, 64, 58, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#997f54'; ctx.lineWidth = 0.9; ctx.stroke();
    ctx.restore();
  }
  if (slip > 0.01) {
    ctx.save(); ctx.globalAlpha = slip;
    for (const [x0, w, f] of [[-22, 42, 0.45], [24, 52, 1], [80, 42, 0.45]]) {
      ctx.globalAlpha = slip * f;
      const g = ctx.createLinearGradient(x0, 0, x0 + w, 0);
      g.addColorStop(0, '#c8a96e'); g.addColorStop(0.5, '#e7d2a0'); g.addColorStop(1, '#bd9c61');
      ctx.fillStyle = g; ctx.fillRect(x0, -8, w, 116);
    }
    ctx.restore();
  }
  if (paper > 0.01) {
    ctx.save(); ctx.globalAlpha = paper;
    ctx.fillStyle = 'rgba(54,36,28,0.12)'; ctx.fillRect(-5, -4, 114, 114);
    ctx.fillStyle = '#fbf5e8'; ctx.fillRect(-8, -8, 116, 116);
    ctx.strokeStyle = '#8f2d46'; ctx.lineWidth = 1.2; ctx.strokeRect(-8, -8, 116, 116);
    ctx.strokeStyle = 'rgba(143,45,70,0.26)'; ctx.lineWidth = 0.5;
    ctx.setLineDash([2, 2]);
    ctx.beginPath();
    ctx.moveTo(50, -8); ctx.lineTo(50, 108);
    ctx.moveTo(-8, 50); ctx.lineTo(108, 50);
    ctx.moveTo(-8, -8); ctx.lineTo(108, 108);
    ctx.moveTo(108, -8); ctx.lineTo(-8, 108);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }
}

function drawLabels() {

function drawTraceUI() {
  const T = W.trace;
  if (!W.glyph.trace || T.stroke >= NS) return;
  const pts = MLD[T.stroke];
  ctx.save();
  ctx.globalAlpha = W.glyph.alpha;
  ctx.strokeStyle = 'rgba(143,45,70,0.85)'; ctx.lineWidth = 0.68; ctx.setLineDash([1.6, 1.7]);
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (const p of pts) ctx.lineTo(p[0], p[1]);
  ctx.stroke(); ctx.setLineDash([]);

  const a = pts[Math.max(0, pts.length - 3)], b = pts[pts.length - 1];
  const ang = Math.atan2(b[1] - a[1], b[0] - a[0]);
  ctx.fillStyle = 'rgba(143,45,70,0.9)';
  ctx.beginPath();
  ctx.moveTo(b[0] + Math.cos(ang) * 2.5, b[1] + Math.sin(ang) * 2.5);
  ctx.lineTo(b[0] + Math.cos(ang + 2.5) * 2.3, b[1] + Math.sin(ang + 2.5) * 2.3);
  ctx.lineTo(b[0] + Math.cos(ang - 2.5) * 2.3, b[1] + Math.sin(ang - 2.5) * 2.3);
  ctx.fill();

  const [sx, sy] = pts[0];
  const pulse = reduceMotion ? 0.6 : 0.5 + 0.5 * Math.sin(clock / 220);
  ctx.fillStyle = `rgba(143,45,70,${(0.24 * pulse).toFixed(3)})`;
  ctx.beginPath(); ctx.arc(sx, sy, 3.6 + pulse * 1.5, 0, TAU); ctx.fill();
  ctx.fillStyle = '#8f2d46';
  ctx.beginPath(); ctx.arc(sx, sy, 2.1, 0, TAU); ctx.fill();
  ctx.font = '600 5px system-ui,sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(String(T.stroke + 1), sx - 5.6, sy - 3.6);
  ctx.textAlign = 'start';

  if (T.pen) {
    ctx.fillStyle = '#fff9ee';
    ctx.shadowColor = 'rgba(200,152,68,0.92)'; ctx.shadowBlur = 11 * DPR;
    ctx.beginPath(); ctx.arc(T.pen[0], T.pen[1], 2.1, 0, TAU); ctx.fill();
    ctx.shadowBlur = 0;
  }
  ctx.restore();
}

function drawStamp(a) {
  if (a <= 0.01) return;
  const s = lerp(1.45, 1, ease.out(a));
  ctx.save();
  ctx.translate(96, 96); ctx.scale(s, s); ctx.rotate(-0.05);
  ctx.globalAlpha = W.glyph.alpha * Math.min(1, a * 1.5);
  ctx.fillStyle = '#b2402d';
  ctx.fillRect(-10.5, -10.5, 21, 21);
  ctx.translate(-8, -8); ctx.scale(0.16, 0.16);
  ctx.fillStyle = '#faf3e4';
  withMmah(() => { for (const p of LI_PATHS) ctx.fill(p); });
  ctx.restore();
}

const WORDS = [
  ['李子', '夏天成熟的李子，裹着淡淡的白霜，酸甜多汁。'],
  ['桃李', '春风吹过，桃花和李花争着盛开，满园芬芳。'],
  ['行李', '出门远行时，把随身的衣物收进行李，踏上旅途。'],
];

function drawWords() {
  setCam(ctx, 1);
  const g = W.glyph;
  const y = GL.cy + GL.s * 60 + 50, size = portrait ? 38 : 44, gap = portrait ? size * 1.2 : size * 1.45;
  ctx.font = `${size}px "Kaiti SC","STKaiti","KaiTi",serif`;
  ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  const shown = WORDS.map(([w]) => window.haqiHanziUi ? window.haqiHanziUi(w) : w);
  const widths = shown.map(s => ctx.measureText(s).width);
  let x = GL.cx - (widths.reduce((a, b) => a + b, 0) + gap * (shown.length - 1)) / 2;
  shown.forEach((s, i) => {
    const a = clamp(g.words - i) * g.alpha;
    if (a > 0) {
      const on = W.wordOn === i;
      ctx.globalAlpha = a * (on ? 1 : 0.5);
      ctx.fillStyle = on ? '#8f2d46' : '#2c2420';
      ctx.fillText(s, x, y + (1 - clamp(g.words - i)) * 14);
    }
    x += widths[i] + gap;
  });
  ctx.globalAlpha = 1; ctx.textAlign = 'start';
}

function drawGlyph() {
  const g = W.glyph;
  if (g.alpha <= 0.001) return;
  ctx.save();
  glyphCam();
  if (g.plate > 0.01) drawPlates(g.alpha * g.plate, g.m);
  if (g.ghost > 0.01) {
    ctx.save();
    ctx.globalAlpha = g.alpha * g.ghost;
    ctx.fillStyle = '#ded2ba';
    withMmah(() => { for (let i = 0; i < NS; i++) if (g.prog[i] < 0.99) ctx.fill(LI_PATHS[i]); });
    ctx.restore();
  }
  if (g.outline < 0.99) {
    ctx.save();
    ctx.globalAlpha = g.alpha * (1 - g.outline);
    for (let i = 0; i < NS; i++) {
      ctx.fillStyle = i < 4 ? mixCol('#694b30', '#241f1c', smooth(g.m - 1)) : mixCol('#8f2d46', '#241f1c', smooth(g.m - 1));
      brush(ctx, i, g.prog[i]);
    }
    ctx.restore();
  }
  if (g.outline > 0.01) {
    ctx.save();
    ctx.globalAlpha = g.alpha * g.outline;
    withMmah(() => {
      for (let i = 0; i < NS; i++) {
        ctx.fillStyle = g.labels > 0.1 ? (i < 4 ? '#4d3724' : '#8f2d46') : '#221d1a';
        paintStroke(i, g.prog[i]);
      }
    });
    ctx.restore();
  }
  drawLabels();
  drawTraceUI();
  drawStamp(g.stamp);
  ctx.restore();
  if (g.words > 0.01) drawWords();
}

function drawVeil() {
  if (W.veil <= 0.001) return;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = `rgba(246,239,225,${W.veil.toFixed(3)})`;
  ctx.fillRect(0, 0, SW, SH);
}

/* ---------- 帧更新与渲染 ---------- */
let introPt = null;
function updateParticles() {
  for (const p of W.petals) {
    p.x += p.vx * DT * 0.055 + Math.sin(clock * 0.002 + p.rot) * 0.35;
    p.y += p.vy * DT * 0.055;
    p.rot += p.vr * DT * 0.06;
  }
  W.petals = W.petals.filter(p => clock - p.t0 < p.dur);
  if (W.intro) {
    W.season = 1;
    W.boughs.forEach(b => { b.bloom = 1; });
    if (!reduceMotion && rand() < 0.07) spawnPetals(1020 + rand() * 380, 260 + rand() * 110, 1);
    if (introPt) {
      const wp = toWorld(introPt.x, introPt.y);
      W.boughs.forEach(b => {
        if (Math.hypot(wp.x - b.x, wp.y - b.y) < 130) b.sway = Math.min(1, b.sway + 0.08);
      });
    }
    W.boughs.forEach(b => { b.sway *= 0.94; });
  }
}

function render() {
  updateView();
  const w = cvs.width, h = cvs.height;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;

  drawSky();
  drawDistantVillage();
  drawPlumTree();
  drawOrioleAndChild();
  drawPetals();
  drawVeil();
  drawGlyph();

  // 楮皮冷金宣纸叠印与册页暗晕
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = 'multiply'; ctx.globalAlpha = 0.86;
  ctx.drawImage(paperC, 0, 0);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  if (!vignette || vignette.w !== w || vignette.h !== h) {
    const g = ctx.createRadialGradient(w / 2, h * 0.46, Math.min(w, h) * 0.36, w / 2, h * 0.46, Math.hypot(w, h) * 0.65);
    g.addColorStop(0, 'rgba(52,36,24,0)');
    g.addColorStop(1, 'rgba(52,36,24,0.28)');
    vignette = { w, h, g };
  }
  ctx.fillStyle = vignette.g;
  ctx.fillRect(0, 0, w, h);
}

let last = null;
function loop(now) {
  requestAnimationFrame(loop);
  if (last == null) last = now;
  const dt = Math.min(50, Math.max(0, now - last));
  last = now;
  if (visible) {
    DT = dt;
    clock += dt;
    updateParticles();
    const list = waiters; waiters = [];
    for (const wt of list) { if (wt.tk.dead) wt.rej(new Cancelled()); else wt.res(clock); }
  }
  render();
}

/* ---------- 字幕与交互控制 ---------- */
const ui = {
  cap: $('#caption'), capT: $('#capTitle'), capP: $('#capText'),
  hint: $('#hint'), action: $('#action'), demo: $('#demo'),
  prog: [...document.querySelectorAll('#progress li')],
};
const CHAR_MS = 65;
let capMinEnd = 0;
function span(cls, text) { const s = document.createElement('span'); if (cls) s.className = cls; s.textContent = text; return s; }
function showCaption(title, text) {
  ui.capT.textContent = window.haqiHanziUi ? window.haqiHanziUi(title, ui.capT) : title;
  ui.capP.replaceChildren(...[...text].map((c, i) => { const s = span('ch', c); s.style.setProperty('--i', i); return s; }));
  window.haqiHanziCaption?.(ui.cap, text);
  ui.cap.classList.remove('on'); void ui.cap.offsetWidth; ui.cap.classList.add('on');
}
async function caption(title, text, tk, hold = 0) {
  window.haqiHanziPrefetch?.([title, text]);
  while (clock < capMinEnd) await frame(tk);
  ui.cap.classList.remove('on');
  await wait(340, tk);
  showCaption(title, text);
  const n = [...text].length;
  capMinEnd = clock + (Math.max(reduceMotion ? 1300 : n * CHAR_MS + 1200, n * 140) + 520 + hold) * FAST;
}
async function captionDone(tk) { while (clock < capMinEnd) await frame(tk); }
function hint(text) {
  if (text) {
    const s = span('', '');
    s.textContent = window.haqiHanziUi ? window.haqiHanziUi(text, s) : text;
    ui.hint.replaceChildren(s); ui.hint.classList.add('on');
  } else ui.hint.classList.remove('on');
}
function progress(i) { ui.prog.forEach((li, j) => { li.classList.toggle('on', j === i); li.classList.toggle('done', j < i); }); }
function mode(m) { document.body.classList.remove('bloom', 'pick', 'trace', 'petal'); if (m) document.body.classList.add(m); S.mode = m; }
let actionFn = null;
function setAction(label, fn) {
  actionFn = fn;
  if (label) {
    ui.action.textContent = window.haqiHanziUi ? window.haqiHanziUi(label, ui.action) : label;
    ui.action.hidden = false;
  } else ui.action.hidden = true;
}
function stopAll() {
  token.dead = true;
  const list = waiters; waiters = [];
  for (const wt of list) wt.rej(new Cancelled());
}

const S = { handler: null, demo: null, finish: null, mode: null, interactions: [] };
let activePid = null;
addEventListener('pointermove', e => { if (W.intro) introPt = { x: e.clientX, y: e.clientY }; });
cvs.addEventListener('pointerdown', e => {
  if (!e.isPrimary || activePid != null) return;
  const h = S.handler; if (!h || !h.down) return;
  activePid = e.pointerId;
  try { cvs.setPointerCapture(e.pointerId); } catch {}
  e.preventDefault();
  h.down(toWorld(e.clientX, e.clientY), e);
});
cvs.addEventListener('pointermove', e => {
  if (e.pointerId !== activePid) return;
  const h = S.handler; if (!h || !h.move) return;
  const list = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  for (const ev of (list.length ? list : [e])) h.move(toWorld(ev.clientX, ev.clientY), ev);
});
function endPtr(e, cancel) {
  if (e.pointerId !== activePid) return;
  activePid = null;
  S.handler?.up?.(toWorld(e.clientX, e.clientY), cancel);
}
cvs.addEventListener('pointerup', e => endPtr(e, false));
cvs.addEventListener('pointercancel', e => endPtr(e, true));
cvs.addEventListener('lostpointercapture', e => endPtr(e, true));
cvs.addEventListener('keydown', e => {
  if (e.code !== 'Space' && e.code !== 'Enter') return;
  if (e.repeat) return;
  e.preventDefault();
  if (S.mode === 'trace' && S.demo) S.demo();
  else if (actionFn) actionFn();
});
ui.action.addEventListener('click', () => { if (actionFn) actionFn(); });
ui.demo.addEventListener('click', () => { if (S.demo) S.demo(); });

function publish(sc) { window.__li.scene = sc; window.__li.interactions = S.interactions; window.__li.state = W; }

  hint('轻点或划过发亮的花枝，唤醒雪白李花');

  let opened = 0, lastAct = clock;
  const openBough = (b, how) => {
    if (!b || b.bloom > 0.1) return;
    lastAct = clock;
    opened++;
    S.interactions.push(how);
    Sound.breeze(0.55, 1950, 0.032);

    }

      if (hit) openBough(hit, 'tap'); else openNext('tap');

async function sWrite(tk) {
  publish('sWrite');
  progress(4);
  await caption('写字', '「李」一共七笔，先上后下。跟着红点写一棵李树。', tk);
  await tween(800, t => { W.glyph.prog = W.glyph.prog.map(() => 1 - t); W.glyph.ghost = t; }, tk);
  W.glyph.prog = Array(NS).fill(0);
  W.glyph.trace = true; W.trace = { stroke: 0, pen: null };

  const showStroke = () => {
    capMinEnd = 0;
    showCaption('写字', `第 ${W.trace.stroke + 1} 笔，共 ${NS} 笔。`);
    hint(`${KAI[W.trace.stroke].name}：从红点起笔，顺着虚线写`);
  };
  await captionDone(tk);
  showStroke();

  let samples = MLD[0], drag = null, lastInput = clock, demoing = false, completed = 0, invalidHint = 0;
  const finishStroke = () => {
    const i = W.trace.stroke;
    if (i >= NS) return;
    W.glyph.prog[i] = 1;
    Sound.zheng(PENTA[i % PENTA.length], 0.12, 1.4);
    W.trace.stroke++;
    W.trace.pen = null;
    completed++;
    if (W.trace.stroke < NS) { samples = MLD[W.trace.stroke]; showStroke(); }
  };
  S.finish = finishStroke;
  const tolLocal = () => Math.max(20, 48 / (CV.k * GL.s));

  S.handler = {
    down(p) {
      if (demoing || W.trace.stroke >= NS) return;
      lastInput = clock;
      const q = toLocal(p.x, p.y), t = tolLocal();
      const lastPt = samples[samples.length - 1];
      const dEnd = Math.hypot(q.x - lastPt[0], q.y - lastPt[1]);
      let startIdx = -1, bestD = Infinity;
      const startLimit = Math.max(1, Math.floor(samples.length * 0.35));
      for (let j = 0; j < startLimit; j++) {
        const d = Math.hypot(q.x - samples[j][0], q.y - samples[j][1]);
        if (d < bestD) { bestD = d; startIdx = j; }
      }
      if (bestD > t * 1.75 || (bestD > dEnd * 1.15 && dEnd < t * 1.2)) {
        if (clock - invalidHint > 500) { hint('从这一笔的红点开始哦'); invalidHint = clock; }
        return;
      }
      drag = { idx: startIdx, fIdx: startIdx, lastQ: q };
      W.glyph.prog[W.trace.stroke] = drag.idx / (samples.length - 1);
      W.trace.pen = samples[drag.idx];
      Sound.breeze(0.22, 1700, 0.018);
    },
    move(p) {
      if (!drag) return;
      lastInput = clock;
      const q = toLocal(p.x, p.y), t = tolLocal();
      const prev = drag.lastQ || q;
      const distMove = Math.hypot(q.x - prev.x, q.y - prev.y);
      const steps = Math.max(1, Math.min(8, Math.ceil(distMove / 4)));
      const lastIdx = samples.length - 1;
      for (let s = 1; s <= steps; s++) {
        const u = s / steps, sx = lerp(prev.x, q.x, u), sy = lerp(prev.y, q.y, u);
        const win = Math.max(18, Math.ceil(lastIdx * 0.55));
        let best = drag.idx, bd = Infinity;
        for (let j = Math.max(0, drag.idx - 2); j <= Math.min(lastIdx, drag.idx + win); j++) {
          const d = Math.hypot(sx - samples[j][0], sy - samples[j][1]);
          if (d < bd) { bd = d; best = j; }
        }
        if (bd <= t * 1.35 && best >= drag.idx) {
          const a = samples[drag.idx], b = samples[best];
          const mvx = q.x - prev.x, mvy = q.y - prev.y, svx = b[0] - a[0], svy = b[1] - a[1];
          if (best === drag.idx || distMove < 0.5 || (mvx * svx + mvy * svy) >= -0.25 * distMove * Math.hypot(svx, svy)) {
            drag.idx = best; drag.fIdx = Math.max(drag.fIdx || 0, best);
          }
        }
      }
      if (distMove > 0.4 && drag.idx < lastIdx) {
        const curIdx = Math.min(lastIdx - 1, drag.idx);
        const lookIdx = Math.min(lastIdx, curIdx + Math.max(6, Math.ceil(lastIdx * 0.18)));
        const tx = samples[lookIdx][0] - samples[curIdx][0], ty = samples[lookIdx][1] - samples[curIdx][1];
        const tLen = Math.hypot(tx, ty) || 1;
        const forwardProj = ((q.x - prev.x) * tx + (q.y - prev.y) * ty) / tLen;
        const curD = Math.hypot(q.x - samples[curIdx][0], q.y - samples[curIdx][1]);
        if (forwardProj > 0.15 && curD <= t * 2.6) {
          let totalLen = 0;
          for (let j = 1; j <= lastIdx; j++) totalLen += Math.hypot(samples[j][0] - samples[j - 1][0], samples[j][1] - samples[j - 1][1]);
          const avgSeg = Math.max(0.6, totalLen / lastIdx);
          drag.fIdx = Math.min(lastIdx, Math.max(drag.fIdx || drag.idx, drag.idx) + (forwardProj / avgSeg) * 1.25);
          drag.idx = Math.max(drag.idx, Math.floor(drag.fIdx));
        }
      }
      drag.lastQ = q;
      W.glyph.prog[W.trace.stroke] = drag.idx / lastIdx;
      W.trace.pen = samples[drag.idx];
    },
    up(p, cancel) {
      if (!drag) return;
      const d = drag; drag = null; W.trace.pen = null;
      const lastIdx = samples.length - 1;
      const needIdx = Math.min(lastIdx - 2, Math.max(3, Math.ceil(lastIdx * 0.56)));
      if (!cancel && d.idx >= needIdx) { finishStroke(); return; }
      const i = W.trace.stroke, from = W.glyph.prog[i];
      bg(tween(260, t => { if (W.trace.stroke === i) W.glyph.prog[i] = from * (1 - t); }, tk));
      if (clock - invalidHint > 400) { hint('顺着虚线方向写到箭头附近即可'); invalidHint = clock; }
    },
  };

  const demo = async () => {
    if (demoing || W.trace.stroke >= NS) return;
    demoing = true; ui.demo.disabled = true; drag = null;
    hint('看笔尖光点走过每一笔');
    while (W.trace.stroke < NS) {
      const i = W.trace.stroke, pts = MLD[i];
      W.glyph.prog[i] = 0;
      await tween(760 * M, t => { W.glyph.prog[i] = t; W.trace.pen = pts[Math.round(t * (pts.length - 1))]; }, tk, ease.sine);
      W.trace.pen = null;
      finishStroke();
      await wait(180, tk);
    }
  };
  S.demo = () => { S.interactions.push('demo'); bg(demo()); };
  mode('trace'); ui.demo.hidden = false;
  if (AUTO) { S.interactions.push('auto'); bg(demo()); }

  let nudged = false;
  while (W.trace.stroke < NS) {
    await frame(tk);
    if (!demoing && !nudged && clock - lastInput > 14000) { hint('写不出来也没关系，点“看示范”'); nudged = true; }
    if (!demoing && completed === 0 && clock - lastInput > 26000) { S.interactions.push('auto'); bg(demo()); }
  }

  S.handler = null; S.demo = null; S.finish = null; mode(null); hint(null);
  ui.demo.hidden = true; ui.demo.disabled = false; W.glyph.trace = false;
  if (!S.interactions.includes('demo') && !S.interactions.includes('auto')) S.interactions.push('user');
  window.__li.events.push('written');
  window.haqiHanziWritten?.();

  await tween(500, t => { W.glyph.ghost = 1 - t; }, tk);
  await tween(480, t => { W.glyph.stamp = t; }, tk, ease.out);
  Sound.bell(NOTE.F5, 0.09); Sound.bell(NOTE.C5, 0.05);
  await caption('写字', '写好了！李，李子与桃李的李。', tk);
  await captionDone(tk);
}

async function sWords(tk) {
  publish('sWords');
  progress(5);
  const g0 = { ...GL };
  await tween(1000 * M, t => {
    GL.cy = lerp(g0.cy, g0.cy - 28, t);
    GL.s = lerp(g0.s, 2.86, t);
    W.veil = lerp(0.94, 0.68, t);
  }, tk);

  for (let i = 0; i < WORDS.length; i++) {
    const pCap = caption(WORDS[i][0], WORDS[i][1], tk);
    await wait(340, tk);
    W.wordOn = i;
    Sound.zheng(PENTA[3 + i], 0.12);
    if (i === 1) bg(tween(900 * M, t => { W.wordMood = t; }, tk));
    if (i === 2) bg(tween(900 * M, t => { W.wordMood = 1 + t; }, tk));
    bg(tween(600, t => { W.glyph.words = Math.max(W.glyph.words, i + t); }, tk, ease.out));
    await pCap;
    await captionDone(tk);
  }
  W.wordOn = -1;
}

async function sFinale(tk) {
  publish('sFinale');
  progress(6);
  W.season = 1.05; // 满树春花与篮中熟李同框如宋画折枝
  bg(camTo(VIEW.finale, 2800 * M, tk));
  await tween(2000 * M, t => {
    W.glyph.alpha = 1 - t;
    W.veil = 0.68 * (1 - t);
    W.wordMood = lerp(2, 0.3, t);
  }, tk);
  W.glyph = { ...W.glyph, alpha: 0, words: 0 };
  spawnPetals(TREE_X, 320, 22);
  Sound.arp(2);

  await caption('余韵', '春花如雪，果香满篮，树下的小路静静伸向远方。', tk, 400);
  await captionDone(tk);

  hint('点一点枝头，洒下一阵芬芳的李花雨');
  mode('petal');
  setAction('再看一次', () => { Sound.init(); begin(); });
  S.handler = {
    down(p) {
      spawnPetals(clamp(p.x, 860, 1540), clamp(p.y, 210, 480), 18);
      Sound.arp(Math.floor(rand() * 4));
      hint(null);
    },
  };
  window.__li.finished = true;
  window.__li.events.push('completed');
  window.haqiHanziComplete();
  for (;;) await frame(tk);
}

const SCENES = [sSpring, sBloom, sFruit, sGlyph, sWrite, sWords, sFinale];

async function begin() {
  stopAll();
  const tk = token = { dead: false };
  capMinEnd = 0;
  resetWorld();
  W.intro = false;
  Object.assign(cam, VIEW.spring);
  S.handler = null; S.demo = null; S.finish = null; mode(null); setAction(null); hint(null);
  ui.demo.hidden = true; ui.demo.disabled = false; ui.cap.classList.remove('on');
  rand = mulberry32(20261113);
  S.interactions = [];
  window.__li.events = []; window.__li.finished = false;
  publish('sSpring');
  try { for (const sc of SCENES) await sc(tk); }
  catch (e) { if (!(e instanceof Cancelled)) console.error(e); }
}

async function introPlay(tk) {
  W.intro = true;
  Object.assign(cam, VIEW.intro);
  for (;;) await frame(tk);
}

resetWorld();
Object.assign(cam, VIEW.intro);
window.__li = {
  scene: 'intro', finished: false, events: [], interactions: [], state: W,
  medians: LI.medians, strokes: LI.strokes, toScreen,
  completeCurrentStroke() { S.finish?.(); },
};
resize();
render();
addEventListener('resize', () => { resize(); render(); });
requestAnimationFrame(loop);
bg(introPlay(token = { dead: false }));

$('#start').addEventListener('click', () => {
  Sound.init();
  $('#intro').classList.add('off');
  document.body.classList.add('started');
  begin();
});
$('#replay').addEventListener('click', () => {
  Sound.init();
  $('#intro').classList.add('off');
  document.body.classList.add('started');
  begin();
});
$('#mute').addEventListener('click', e => {
  Sound.init();
  Sound.setMuted(!Sound.muted);
  const btn = e.currentTarget;
  btn.setAttribute('aria-pressed', String(Sound.muted));
  const zh = Sound.muted ? '开启声音' : '静音';
  btn.textContent = window.haqiHanziUi ? window.haqiHanziUi(zh, btn) : zh;
});
document.addEventListener('visibilitychange', () => { visible = !document.hidden; last = null; });
addEventListener('pagehide', () => { stopAll(); void Sound.ctx?.close().catch(() => {}); }, { once: true });

if (AUTO) {
  $('#intro').classList.add('off');
  document.body.classList.add('started');
  begin();
}
})();
</script>

<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>街头晴空 · 六帧样张</title>
<style>body{max-width:1450px;margin:24px auto;padding:0 20px;background:#f6f3eb;color:#302b25;font:16px/1.7 system-ui}h1{font-size:24px}.players{display:flex;gap:28px;align-items:center;flex-wrap:wrap}canvas{background:repeating-conic-gradient(#e7e5de 0% 25%,#f8f6ef 0% 50%) 0/24px 24px;width:280px;height:430px}#reference{height:430px;width:240px;object-fit:contain}button,input{font:inherit}button{padding:6px 12px;margin:4px}#strip{width:100%;background:#ddd8cc}a{color:#17676a}</style>
<h1>街头晴空 · 真人动作参考生成样张</h1><p>同一角色的六帧侧面走路。左侧为 AI 服装样张，右侧为对应真人参考。当前为身体动作验证稿，尚未接入正式角色图集。</p>
<div class="players"><canvas width="362" height="556" aria-label="角色动作预览"></canvas><img id="reference" src="pose-1.webp" alt="真人动作参考"><div><p id="label"></p><button id="toggle">暂停</button><button id="previous">上一帧</button><button id="next">下一帧</button><p><label>每帧 <input id="speed" type="range" min="80" max="700" value="170"> <span id="ms">170</span> 毫秒</label></p><label><input type="checkbox" id="mirror">镜像向左</label><p>第 1、6 帧：近侧腿前、近侧手后。<br>第 3、4 帧：近侧腿后、近侧手前。<br>第 2、5 帧：不同腿经过身体下方。</p></div></div>
<p id="status">正在加载样张…</p><img id="strip" src="male9-reference-pilot.webp" alt="六帧完整样张"><p><a href="index.html">返回真人参考</a> · <a href="character-prompts.json">生成提示词与版本记录</a></p>
<script type="module">
const sheet=new Image(),ctx=document.querySelector('canvas').getContext('2d');let frame=0,playing=true,ready=false,last=0;
function draw(){if(!ready)return;const w=sheet.width/6;ctx.clearRect(0,0,362,556);ctx.save();if(document.querySelector('#mirror').checked){ctx.translate(362,0);ctx.scale(-1,1)}ctx.drawImage(sheet,frame*w,130,w,556,0,0,362,556);ctx.restore();document.querySelector('#reference').src=`pose-${frame+1}.webp`;document.querySelector('#reference').style.transform=document.querySelector('#mirror').checked?'scaleX(-1)':'';document.querySelector('#label').textContent=`第 ${frame+1} / 6 帧`;document.querySelector('#toggle').textContent=playing?'暂停':'播放'}
sheet.onload=()=>{ready=true;document.querySelector('#status').textContent='可暂停逐帧检查手脚与遮挡。镜像仅用于查看方向，不代表完成另一侧图集。';draw()};sheet.onerror=()=>document.querySelector('#status').textContent='样张加载失败，请刷新重试。';sheet.src='male9-reference-pilot.webp';
document.querySelector('#toggle').onclick=()=>{playing=!playing;last=performance.now();draw()};document.querySelector('#previous').onclick=()=>{playing=false;frame=(frame+5)%6;draw()};document.querySelector('#next').onclick=()=>{playing=false;frame=(frame+1)%6;draw()};document.querySelector('#mirror').onchange=draw;document.querySelector('#speed').oninput=e=>document.querySelector('#ms').textContent=e.target.value;
function tick(t){if(ready&&playing&&t-last>=+document.querySelector('#speed').value){frame=(frame+1)%6;last=t;draw()}requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script></html>

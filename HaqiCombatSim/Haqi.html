<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#204d4d">
  <meta name="description" content="魔法哈奇初心之旅：探索魔法营地、结识原版NPC、收集卡牌，开启一场二维魔法冒险。">
  <title>魔法哈奇 · 初心之旅</title>
  <link rel="modulepreload" href="js/adventure_app.js">
  <link rel="stylesheet" href="css/adventure.css">
  <link rel="stylesheet" href="css/adventure_local_play.css">
  <link rel="stylesheet" href="css/adventure_battle_intro.css">
  <link rel="stylesheet" href="css/adventure_storybook.css">
  <link rel="stylesheet" href="css/adventure_social.css">
  <link rel="stylesheet" href="css/adventure_dialogue.css">
  <link rel="stylesheet" href="css/adventure_rewards.css">
  <link rel="stylesheet" href="css/adventure_world_map.css">
  <link rel="stylesheet" href="css/adventure_strengthening.css">
  <link rel="stylesheet" href="css/adventure_shop.css">
<link rel="stylesheet" href="css/adventure_gems.css">
  <link rel="stylesheet" href="css/adventure_fishing.css">
  <link rel="stylesheet" href="css/adventure_loading.css">
<link rel="stylesheet" href="css/language_adventure.css">
<link rel="stylesheet" href="css/adventure_earth.css">
<link rel="stylesheet" href="css/prologue.css">
<link rel="stylesheet" href="css/home.css">
</head>
<body class="haqi-app">
  <main id="game" aria-label="魔法哈奇冒险">
    <canvas id="world" aria-label="魔法世界，点击地面移动，点击居民交谈" tabindex="0"></canvas>
    <div id="hud"></div>
    <div id="battle-layer"></div>
    <div id="overlay"></div>
    <div id="entry"><section id="boot-loading" class="boot-loading" aria-busy="true">
      <div id="load-brand"></div>
      <h1 id="load-title">魔法哈奇</h1><p id="load-chapter" class="boot-chapter">初心之旅</p>
      <div class="boot-transfer">
        <p id="load-caption" class="boot-caption">加载中…</p>
        <p id="load-status" class="boot-status" role="status">准备出发…</p>
        <progress id="load-progress" max="1"></progress>
        <p id="load-detail" class="boot-detail"></p>
      </div>
      <p id="load-note" class="boot-note"></p>
    </section></div>
    <div id="toast" role="status" aria-live="polite"></div>
  </main>
  <noscript>请开启 JavaScript 后开始冒险。</noscript>
  <script type="importmap">
{
  "imports": {
    "./js/skill_art.js": "./js/skill_art.js?v=painted-spells-20261117",
    "./js/spell_effects.js": "./js/spell_effects.js?v=painted-spells-20261117",
    "./js/painterly_spell_art.js": "./js/painterly_spell_art.js?v=painted-spells-20261117",
    "./js/learning/companion_wordplay.js": "./js/learning/companion_wordplay.js?v=language-practice-20261117b",
    "./js/companion_wordplay_core.js": "./js/companion_wordplay_core.js?v=language-practice-20261117b",
    "./js/views/adventure/view_companion_wordplay.js": "./js/views/adventure/view_companion_wordplay.js?v=language-practice-20261117b",
    "./js/learning_language_core.js": "./js/learning_language_core.js?v=language-practice-20261117b",
    "./js/audio/language_adventure_voice.js": "./js/audio/language_adventure_voice.js?v=language-practice-20261117b",
    "./js/dialogue_speaker_core.js": "./js/dialogue_speaker_core.js?v=language-practice-20261117b"
  }
}
</script>
<script id="adventure-module" type="module" src="js/adventure_boot.js"></script>
  <script>
    (() => {
      const showBootError = message => {
        const card = document.getElementById('boot-loading');
        if (!card) return;
        card.setAttribute('aria-busy', 'false');
        document.getElementById('load-caption').textContent = '暂时无法出发';
        document.getElementById('load-status').textContent = message;
        document.getElementById('load-progress').hidden = true;
      };
      if (location.protocol === 'file:') showBootError('请通过游戏预览入口打开。');
      else (document.getElementById('adventure-module') || document.querySelector('script[type="module"][src]'))?.addEventListener('error', () => showBootError('加载失败，请刷新重试。'));
    })();
  </script>
</body>
</html>

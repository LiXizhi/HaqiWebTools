<title>孙 sūn · 一根丝，接着一代人</title>

<style>
:root{
  --night:#0c1626;--indigo:#16283f;--vat:#24486b;
  --silk:#e9c684;--silk-hi:#f8e7bd;--lamp:#ffab52;--ember:#ff7a3d;
  --cinnabar:#c2402c;--leaf:#6fae6a;--cocoon:#f4ecd9;--paper:#f6efdd;--ink:#1b1a20;
  --kai:"Kaiti SC","STKaiti","KaiTi","BiauKai","Kaiti TC","DFKai-SB","Songti SC","STSong","SimSun",serif;
  --serif:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC","SimSun",serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--night);color:var(--cocoon);font-family:var(--serif);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,canvas:focus-visible{outline:2px solid var(--silk-hi);outline-offset:3px}
[hidden]{display:none!important}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
body.spin #stage,body.tie #stage,body.play #stage{cursor:pointer}
body.trace #stage{cursor:crosshair}

#brand{
  position:fixed;left:max(16px,env(safe-area-inset-left));top:max(14px,env(safe-area-inset-top));
  display:flex;align-items:center;gap:9px;z-index:8;pointer-events:none;
  font-family:var(--kai);font-size:15px;letter-spacing:.22em;color:var(--cocoon);
  text-shadow:0 1px 10px rgba(0,0,0,.75);
}
#brand .seal{
  background:var(--cinnabar);color:#fff6e8;border-radius:3px;padding:4px 6px 3px;
  font-size:15px;line-height:1;letter-spacing:0;box-shadow:0 2px 10px rgba(0,0,0,.5);
}
body.paper #brand{color:var(--ink);text-shadow:none}

#progress{
  position:fixed;top:max(16px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);
  display:flex;list-style:none;margin:0;padding:0;gap:clamp(8px,1.8vw,20px);
  z-index:10;opacity:0;transition:opacity .7s;pointer-events:none;
}
#progress::before{content:"";position:absolute;top:3px;left:12px;right:12px;height:1px;background:rgba(233,198,132,.28)}
body.paper #progress::before{background:rgba(60,44,28,.22)}
body.started #progress{opacity:1}
#progress li{
  position:relative;font-family:var(--kai);font-size:13px;letter-spacing:.08em;
  padding-top:12px;color:rgba(244,236,217,.55);transition:color .45s;white-space:nowrap;
}
body.paper #progress li{color:rgba(52,40,28,.55)}
#progress li::before{
  content:"";position:absolute;top:0;left:50%;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;
  background:rgba(233,198,132,.34);transition:background .45s,transform .45s,box-shadow .45s;
}
#progress li.done{color:var(--cocoon)}
body.paper #progress li.done{color:var(--ink)}
#progress li.done::before{background:var(--silk)}
#progress li.on{color:var(--silk-hi);font-weight:600}
body.paper #progress li.on{color:#8a4a1c}
#progress li.on::before{background:var(--lamp);transform:scale(1.55);box-shadow:0 0 11px 2px rgba(255,171,82,.6)}

#controls{
  position:fixed;right:max(14px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));
  display:flex;gap:8px;z-index:12;opacity:0;pointer-events:none;transition:opacity .6s;
}
body.started #controls{opacity:1;pointer-events:auto}
#controls button{
  font-family:var(--kai);font-size:14px;letter-spacing:.16em;color:var(--cocoon);
  background:rgba(14,26,42,.78);border:1px solid rgba(233,198,132,.46);
  border-radius:4px;padding:6px 11px 6px 13px;backdrop-filter:blur(6px);
}
body.paper #controls button{color:var(--ink);background:rgba(250,245,233,.9);border-color:rgba(138,74,28,.42)}

#hint{
  position:fixed;left:16px;right:16px;margin:0 auto;width:fit-content;max-width:calc(100vw - 32px);
  top:max(58px,calc(env(safe-area-inset-top) + 46px));text-align:center;
  color:#fff4dd;opacity:0;transition:opacity .4s;pointer-events:none;z-index:9;
  padding:7px 20px 8px;border:1px solid rgba(233,198,132,.55);border-radius:22px;
  background:rgba(12,22,38,.88);backdrop-filter:blur(6px);box-shadow:0 6px 22px rgba(0,0,0,.48);
}
body.paper #hint{color:#3a2a18;background:rgba(251,246,234,.94);border-color:rgba(138,74,28,.45)}
#hint span{font-family:var(--kai);font-size:clamp(15px,2.1vh,19px);letter-spacing:.1em}
#hint.on{opacity:1;animation:pulseHint 2.1s ease-in-out infinite}
@keyframes pulseHint{50%{box-shadow:0 0 0 6px rgba(255,171,82,.16),0 6px 24px rgba(0,0,0,.5)}}

#caption{
  position:fixed;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translate(-50%,10px);
  width:min(880px,calc(100vw - 24px));text-align:center;opacity:0;
  transition:opacity .48s,transform .62s cubic-bezier(.2,.7,.2,1);pointer-events:none;z-index:7;
  padding:18px 24px 14px;border-radius:16px;
  background:radial-gradient(ellipse at center,rgba(9,17,29,.92) 44%,rgba(9,17,29,0) 78%);
}
body.paper #caption{background:radial-gradient(ellipse at center,rgba(248,242,228,.95) 45%,rgba(248,242,228,0) 78%)}
#caption.on{opacity:1;transform:translate(-50%,0)}
#capTitle{
  margin:0 0 6px;font-weight:400;font-family:var(--kai);font-size:clamp(14px,2vh,18px);
  letter-spacing:.38em;margin-left:.38em;color:var(--silk);
}
body.paper #capTitle{color:#8a4a1c}
#capText{
  margin:0;font-family:var(--kai);font-size:clamp(19px,calc(.95vw + 1.5vh),27px);
  line-height:1.68;letter-spacing:.06em;min-height:1.68em;color:var(--cocoon);
  text-shadow:0 1px 12px rgba(0,0,0,.85);
}
body.paper #capText{color:var(--ink);text-shadow:0 1px 8px rgba(255,252,244,.9)}
#capText .ch{animation:inkFade .85s ease-out both;animation-delay:calc(var(--i) * 48ms + 60ms)}
@keyframes inkFade{from{opacity:0;filter:blur(2px)}to{opacity:1;filter:none}}
.haqi-sub-trans{
  display:block;margin-top:4px;font-family:Georgia,"Times New Roman",system-ui,sans-serif;
  font-size:clamp(13px,1.75vh,16px);line-height:1.45;color:#cdd9e4;letter-spacing:.02em;
}
body.paper .haqi-sub-trans{color:#5a5346}

.actions{display:flex;justify-content:center;gap:12px;margin-top:11px}
.actions button{pointer-events:auto;font-family:var(--kai);letter-spacing:.2em;border-radius:4px;transition:transform .16s,filter .16s}
.actions button:hover{transform:translateY(-1px);filter:brightness(1.08)}
#action{
  font-size:17px;padding:8px 22px 8px 26px;color:#fff6e6;
  border:1px solid var(--silk);background:linear-gradient(180deg,#a4632a,#5e3312);
  box-shadow:0 6px 18px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,224,170,.34);
}
#demo{
  font-size:16px;padding:7px 16px 7px 20px;color:var(--ink);
  background:rgba(250,245,233,.94);border:1px solid rgba(138,74,28,.45);
}

#note{
  position:fixed;left:max(16px,env(safe-area-inset-left));bottom:max(10px,env(safe-area-inset-bottom));
  font-size:11px;color:rgba(214,206,186,.68);letter-spacing:.06em;z-index:4;pointer-events:none;max-width:46vw;
}
body.paper #note{color:rgba(74,60,44,.75)}

#intro{position:fixed;inset:0;z-index:20;pointer-events:none;transition:opacity .95s,transform .95s}
#intro.off{opacity:0;transform:scale(1.03)}
#intro.off *{pointer-events:none!important}
.introTop,.introBottom{position:absolute;left:0;right:0;display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 20px}
.introTop{top:max(20px,env(safe-area-inset-top))}
.introBottom{bottom:max(18px,env(safe-area-inset-bottom));gap:7px}
.tag{display:flex;align-items:center;gap:12px;font-family:var(--kai);font-size:clamp(14px,2vh,18px);letter-spacing:.3em;color:var(--silk)}
.tag i{display:block;width:clamp(24px,5vw,56px);height:1px;background:currentColor;opacity:.6}
.pinyin{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:clamp(30px,5vh,46px);line-height:1.05;color:var(--silk-hi);letter-spacing:.08em;text-shadow:0 2px 18px rgba(0,0,0,.8)}
.mean{font-family:var(--kai);font-size:clamp(18px,2.5vh,23px);letter-spacing:.22em;color:#ffdca8;text-shadow:0 2px 14px rgba(0,0,0,.8)}
.sub{font-family:var(--kai);font-size:clamp(14px,2vh,18px);color:#d5dae2;letter-spacing:.1em;margin:2px 0 0;line-height:1.65;text-shadow:0 1px 12px rgba(0,0,0,.8)}
.btn-main{
  pointer-events:auto;margin-top:8px;font-family:var(--kai);font-size:clamp(18px,2.5vh,22px);
  letter-spacing:.38em;padding:10px 26px 10px 34px;color:#fff7ea;
  background:linear-gradient(180deg,#b06c2c,#5b3111);border:1px solid var(--silk);border-radius:4px;
  box-shadow:0 8px 26px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,226,172,.38);
  transition:transform .2s;animation:glowBtn 2.8s ease-in-out infinite;
}
.btn-main:hover{transform:translateY(-2px)}
@keyframes glowBtn{50%{box-shadow:0 8px 26px rgba(0,0,0,.58),0 0 0 8px rgba(255,171,82,.16)}}
.meta{font-size:12px;color:#a9b4c2;letter-spacing:.1em;margin:2px 0 0}
.rise{opacity:0;transform:translateY(12px);animation:rise .9s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:var(--d,0s)}
@keyframes rise{to{opacity:1;transform:none}}

body.portrait #brand,body.portrait #note{display:none}
body.portrait #controls{top:max(56px,calc(env(safe-area-inset-top) + 46px))}
body.portrait #hint{top:max(102px,calc(env(safe-area-inset-top) + 92px))}
body.portrait #controls button{font-size:13px;padding:6px 9px 6px 11px;letter-spacing:.1em}
body.portrait #progress li{font-size:11px}
body.portrait #capText{font-size:clamp(18px,4.6vw,22px);line-height:1.58}
@media (max-height:560px){.sub,.meta,#note{display:none}#caption{padding:8px 14px 6px}.actions{margin-top:6px}#capText{line-height:1.5;min-height:1.5em}}
@media (prefers-reduced-motion:reduce){#intro,#caption{transition-duration:.35s}#hint.on,.btn-main{animation:none}#capText .ch{animation-duration:.2s;animation-delay:0s}}
</style>

<body>
<canvas id="stage" tabindex="0" role="img" aria-label="夜里的一间缫丝蚕室：油灯照亮桑叶与蚕匾，茧盆冒着热气，奶奶转动丝车，一根金色的蚕丝从茧里抽出，缠上丝锭，再穿过一个个丝结连向孩子的手；丝线与孩子合成左子右小的孙字。"></canvas>
<div id="brand"><span class="seal">孙</span>一字一画卷</div>
<ol id="progress" aria-label="故事进度">
  <li>蚕室</li><li>缫丝</li><li>相续</li><li>成字</li><li>写字</li><li>词意</li><li>余韵</li>
</ol>
<div id="controls">
  <button id="pause" type="button" aria-pressed="false">暂停</button>
  <button id="mute" type="button" aria-pressed="false">静音</button>
  <button id="replay" type="button">重播</button>
</div>
<div id="hint" role="status"></div>
<section id="caption" aria-live="polite" aria-atomic="true">
  <h2 id="capTitle"></h2>
  <p id="capText"></p>
  <div class="actions">
    <button id="action" type="button" hidden></button>
    <button id="demo" type="button" hidden>看示范</button>
  </div>
</section>
<div id="note">「孙」从子从糸，糸是丝，取相续之意；古文字为部件示意，描红笔顺依规范楷书。</div>
<div id="intro">
  <div class="introTop"><div class="tag rise" style="--d:.2s"><i></i>灯下缫丝 · 汉字故事<i></i></div></div>

function densify(pts, step) {

  for (let i = 1; i < pts.length; i++) {
    const a = pts[i - 1], b = pts[i];
    const n = Math.max(1, Math.ceil(Math.hypot(b[0] - a[0], b[1] - a[1]) / step));
    for (let k = 1; k <= n; k++) out.push([lerp(a[0], b[0], k / n), lerp(a[1], b[1], k / n)]);
  }
  return out;
}
function resamplePoly(pts, count = 64) {
  const d = [0];
  for (let i = 1; i < pts.length; i++) d.push(d[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
  const total = d[d.length - 1] || 1, out = [];
  let j = 0;
  for (let i = 0; i <= count; i++) {
    const target = total * i / count;
    while (j < d.length - 2 && d[j + 1] < target) j++;
    const seg = (d[j + 1] - d[j]) || 1, f = clamp((target - d[j]) / seg);
    out.push([lerp(pts[j][0], pts[j + 1][0], f), lerp(pts[j][1], pts[j + 1][1], f)]);
  }
  return out;
}
function spline(pts, per = 12) {
  const P = [pts[0], ...pts, pts[pts.length - 1]], out = [];
  for (let i = 1; i < P.length - 2; i++) {
    const p0 = P[i - 1], p1 = P[i], p2 = P[i + 1], p3 = P[i + 2];
    for (let k = 0; k < per; k++) {
      const t = k / per, t2 = t * t, t3 = t2 * t;
      out.push([
        0.5 * (2 * p1[0] + (-p0[0] + p2[0]) * t + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * t2 + (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * t3),
        0.5 * (2 * p1[1] + (-p0[1] + p2[1]) * t + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3),
      ]);
    }
  }
  out.push(pts[pts.length - 1]);
  return out;
}
function bezierChain(segs) {
  const pts = [];
  for (const s of segs) {
    const n = 16;
    for (let i = 0; i < n; i++) {
      const t = i / n, u = 1 - t;
      pts.push([
        u * u * u * s[0][0] + 3 * u * u * t * s[1][0] + 3 * u * t * t * s[2][0] + t * t * t * s[3][0],
        u * u * u * s[0][1] + 3 * u * u * t * s[1][1] + 3 * u * t * t * s[2][1] + t * t * t * s[3][1],
      ]);
    }
  }
  const last = segs[segs.length - 1][3];
  pts.push([last[0], last[1]]);
  return resamplePoly(pts, 64);
}

  for (let i = 1; i < THREAD.length; i++) THREAD_LEN.push(THREAD_LEN[i - 1] + Math.hypot(THREAD[i][0] - THREAD[i - 1][0], THREAD[i][1] - THREAD[i - 1][1]));
  THREAD_TOTAL = THREAD_LEN[THREAD_LEN.length - 1] || 1;
  // 丝结在丝路上的弧长位置，用于点亮判定与光点流动
  KNOT_U = L.knots.map(k => {
    let best = 0, bd = Infinity;
    for (let i = 0; i < THREAD.length; i++) {
      const d = Math.hypot(THREAD[i][0] - k[0], THREAD[i][1] - k[1]);
      if (d < bd) { bd = d; best = i; }
    }
    return THREAD_LEN[best] / THREAD_TOTAL;
  });
}
let KNOT_U = [0.7, 0.8, 0.9];
function threadAt(u) {
  const target = clamp(u) * THREAD_TOTAL;
  let j = 0;
  while (j < THREAD_LEN.length - 2 && THREAD_LEN[j + 1] < target) j++;
  const seg = (THREAD_LEN[j + 1] - THREAD_LEN[j]) || 1, f = clamp((target - THREAD_LEN[j]) / seg);
  const a = THREAD[j], b = THREAD[j + 1];
  const tx = b[0] - a[0], ty = b[1] - a[1], l = Math.hypot(tx, ty) || 1;
  return { x: lerp(a[0], b[0], f), y: lerp(a[1], b[1], f), tx: tx / l, ty: ty / l };
}

  ctx.globalAlpha = Math.max(0.25, lampA);
  ctx.strokeStyle = mixCol('#20180f', '#8a6134', lampA); ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(la.x, 96); ctx.lineTo(la.x, la.y - 34); ctx.stroke();
  ctx.fillStyle = mixCol('#241a12', '#9a6a36', lampA);
  ctx.beginPath(); ctx.moveTo(la.x - 30, la.y - 34); ctx.lineTo(la.x + 30, la.y - 34); ctx.lineTo(la.x + 18, la.y - 16); ctx.lineTo(la.x - 18, la.y - 16); ctx.closePath(); ctx.fill();
  const bowl = ctx.createLinearGradient(la.x - 26, la.y - 16, la.x + 26, la.y + 34);
  bowl.addColorStop(0, mixCol('#2a1e14', '#d69a4a', lampA)); bowl.addColorStop(1, mixCol('#1a120c', '#7a4a1e', lampA));
  ctx.fillStyle = bowl;
  ctx.beginPath(); ctx.ellipse(la.x, la.y + 8, 27, 24, 0, 0, TAU); ctx.fill();
  if (lampA > 0.05) {
    const fh = 26 * flick;
    const fg = ctx.createRadialGradient(la.x, la.y - 4, 1, la.x, la.y - 4, fh);
    fg.addColorStop(0, 'rgba(255,252,228,0.98)'); fg.addColorStop(0.35, 'rgba(255,206,120,0.9)'); fg.addColorStop(1, 'rgba(255,140,50,0)');

  }

  // 长案与地面：一直铺到画外，竖屏下方才不会露出空底色
  ctx.save();
  const ty = L.tableY;

  tg.addColorStop(0, mixCol('#1a120c', '#8a5c30', lampA * 0.9));

  ctx.strokeStyle = `rgba(255,206,140,${(0.3 * lampA).toFixed(3)})`; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(-600, ty + 1); ctx.lineTo(3000, ty + 1); ctx.stroke();
  ctx.globalAlpha = 0.3 * lampA; ctx.strokeStyle = 'rgba(30,18,10,0.8)'; ctx.lineWidth = 1.6;
  for (let i = 0; i < 8; i++) {

    ctx.beginPath(); ctx.moveTo(-560, y); ctx.bezierCurveTo(800, y + 5, 1500, y - 5, 2960, y + 3); ctx.stroke();
  }
  // 案沿投影，把长案与地面分开
  ctx.globalAlpha = 0.5;
  const edge = ctx.createLinearGradient(0, ty + 186, 0, ty + 250);
  edge.addColorStop(0, 'rgba(0,0,0,0.55)'); edge.addColorStop(1, 'rgba(0,0,0,0)');

/* 桑叶：掌状浅裂、叶尖收细、基部带柄。bite 越大，叶缘被啃出的弧口越深，
   缺口是轮廓的一部分，不能事后盖色块（会在叶面上留下黑点）。 */
const LEAF_EDGE = [
  [[-10, 20], [-20, 16], [-24, 6]],
  [[-27, -1], [-22, -4], [-19, -6]],
  [[-26, -12], [-24, -20], [-16, -22]],
  [[-12, -23], [-9, -21], [-7, -19]],
  [[-6, -27], [-2, -32], [0, -34]],
  [[2, -32], [6, -27], [7, -19]],
  [[9, -21], [12, -23], [16, -22]],
  [[24, -20], [26, -12], [19, -6]],
  [[22, -4], [27, -1], [24, 6]],
  [[20, 16], [10, 20], [0, 26]],
];
function leafPath(x, y, s, rot, bite = 0) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s / 24, s / 24);
  ctx.beginPath();
  ctx.moveTo(0, 26);
  LEAF_EDGE.forEach((seg, i) => {
    // 隔一段把叶缘往里收，形成蚕啃过的半圆缺口
    const k = bite > 0.02 && i % 3 === 1 ? 1 - 0.42 * bite : 1;
    const c1 = [seg[0][0] * k, seg[0][1] * k], c2 = [seg[1][0] * k, seg[1][1] * k], e = [seg[2][0] * k, seg[2][1] * k];
    ctx.bezierCurveTo(c1[0], c1[1], c2[0], c2[1], e[0], e[1]);
  });
  ctx.closePath();
  ctx.restore();
}
function leafVeins(x, y, s, rot, a) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s / 24, s / 24);
  ctx.strokeStyle = `rgba(232,248,204,${a.toFixed(3)})`; ctx.lineWidth = 1.1; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0, 24); ctx.lineTo(0, -30); ctx.stroke();
  for (const [dy, dx] of [[10, 19], [-2, 21], [-14, 14]]) {
    ctx.beginPath(); ctx.moveTo(0, dy); ctx.quadraticCurveTo(dx * 0.5, dy - 4, dx, dy - 9); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, dy); ctx.quadraticCurveTo(-dx * 0.5, dy - 4, -dx, dy - 9); ctx.stroke();
  }
  ctx.restore();
}
function cocoonPath(x, y, rx, ry, rot) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ctx.beginPath(); ctx.ellipse(0, 0, rx, ry, 0, 0, TAU);
  ctx.restore();
}

/* ---------- 蚕匾：桑叶与吃叶的蚕 ---------- */
function drawTray(lampA) {
  const t = L.tray;
  ctx.save();
  ctx.fillStyle = `rgba(0,0,0,${(0.35 * lampA).toFixed(3)})`;
  ctx.beginPath(); ctx.ellipse(t.x + 12, t.y + t.ry * 0.7, t.rx * 1.02, t.ry * 0.7, 0, 0, TAU); ctx.fill();
  const rim = ctx.createLinearGradient(t.x - t.rx, t.y - t.ry, t.x + t.rx, t.y + t.ry);
  rim.addColorStop(0, mixCol('#241a12', '#c79a5c', lampA));
  rim.addColorStop(0.5, mixCol('#1a120c', '#8a6234', lampA));
  rim.addColorStop(1, mixCol('#120c08', '#5e3f1e', lampA));
  ctx.fillStyle = rim;
  ctx.beginPath(); ctx.ellipse(t.x, t.y, t.rx, t.ry, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = mixCol('#0e0b08', '#3d2a16', lampA * 0.8);
  ctx.beginPath(); ctx.ellipse(t.x, t.y - 4, t.rx * 0.92, t.ry * 0.82, 0, 0, TAU); ctx.fill();
  ctx.save();
  ctx.globalAlpha = 0.35 * lampA; ctx.strokeStyle = '#d8b070'; ctx.lineWidth = 1;
  for (let i = -4; i <= 4; i++) {
    ctx.beginPath(); ctx.moveTo(t.x + i * t.rx / 5, t.y - t.ry * 0.8); ctx.lineTo(t.x + i * t.rx / 5, t.y + t.ry * 0.8); ctx.stroke();
  }
  ctx.restore();

  for (const lf of W.leaves) {
    const sway = reduceMotion ? 0 : Math.sin(clock * 0.0011 + lf.ph) * 0.05;
    const size = 40 * lf.s, rot = lf.rot + sway;
    ctx.save();
    // 叶柄
    ctx.strokeStyle = mixCol('#12200c', '#5c7a34', lampA); ctx.lineWidth = 2.4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(lf.x, lf.y); ctx.lineTo(lf.x - Math.sin(rot) * size * 1.3, lf.y + Math.cos(rot) * size * 1.3); ctx.stroke();
    leafPath(lf.x, lf.y, size, rot, lf.bite);
    const lg = ctx.createLinearGradient(lf.x - size, lf.y - size, lf.x + size, lf.y + size);
    lg.addColorStop(0, mixCol('#16240f', '#9ed06e', lampA));
    lg.addColorStop(0.55, mixCol('#101c0a', '#5f9a44', lampA));
    lg.addColorStop(1, mixCol('#0a1206', '#33642f', lampA));
    ctx.fillStyle = lg; ctx.fill();
    ctx.strokeStyle = `rgba(226,246,196,${(0.3 * lampA).toFixed(3)})`; ctx.lineWidth = 1.1;

}
function drawWorm(wm, lampA) {
  const segs = 9, L0 = wm.len;
  ctx.save();
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const pts = [];
  for (let i = 0; i < segs; i++) {
    const u = i / (segs - 1);
    const x = wm.x + wm.dir * (u - 0.5) * L0;
    const y = wm.y + Math.sin(clock * 0.005 * wm.sp * 30 + wm.ph + u * 3.4) * 4.2 * (reduceMotion ? 0.3 : 1);
    pts.push([x, y, 6.6 - Math.abs(u - 0.35) * 4.2]);
  }
  ctx.strokeStyle = `rgba(0,0,0,${(0.3 * lampA).toFixed(3)})`; ctx.lineWidth = 13;
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1] + 5);
  for (const p of pts) ctx.lineTo(p[0], p[1] + 5);
  ctx.stroke();
  const bodyG = ctx.createLinearGradient(wm.x - L0 / 2, wm.y - 8, wm.x + L0 / 2, wm.y + 8);
  bodyG.addColorStop(0, mixCol('#3a3630', '#f6efdd', lampA));
  bodyG.addColorStop(1, mixCol('#2a2620', '#d9cdb4', lampA));
  ctx.strokeStyle = bodyG;
  for (let i = 0; i < pts.length - 1; i++) {
    ctx.lineWidth = pts[i][2] * 2;
    ctx.beginPath(); ctx.moveTo(pts[i][0], pts[i][1]); ctx.lineTo(pts[i + 1][0], pts[i + 1][1]); ctx.stroke();
  }
  const head = pts[0], chew = wm.chew;
  ctx.fillStyle = mixCol('#332c22', '#e8dcc0', lampA);
  ctx.beginPath(); ctx.arc(head[0], head[1], 7 + chew * 1.2, 0, TAU); ctx.fill();
  ctx.fillStyle = `rgba(40,28,18,${(0.8 * lampA).toFixed(3)})`;
  ctx.beginPath(); ctx.arc(head[0] - wm.dir * 2.4, head[1] - 2.2, 1.5, 0, TAU); ctx.fill();
  ctx.restore();
}

/* ---------- 茧盆与蒸汽 ---------- */
function drawBasin(lampA, C) {
  const b = L.basin;
  ctx.save();
  ctx.fillStyle = `rgba(0,0,0,${(0.4 * lampA).toFixed(3)})`;
  ctx.beginPath(); ctx.ellipse(b.x + 10, b.y + b.ry * 0.9, b.rx * 1.05, b.ry * 0.6, 0, 0, TAU); ctx.fill();
  const bg = ctx.createLinearGradient(b.x - b.rx, b.y, b.x + b.rx, b.y + b.ry);
  bg.addColorStop(0, mixCol('#1e2226', '#9aa2a8', lampA));
  bg.addColorStop(0.5, mixCol('#14171a', '#5c646c', lampA));
  bg.addColorStop(1, mixCol('#0e1012', '#3a4046', lampA));
  ctx.fillStyle = bg;
  ctx.beginPath(); ctx.ellipse(b.x, b.y, b.rx, b.ry, 0, 0, TAU); ctx.fill();
  const water = ctx.createLinearGradient(b.x, b.y - b.ry, b.x, b.y + b.ry);
  water.addColorStop(0, mixCol('#101a22', '#4c6a7a', lampA));
  water.addColorStop(1, mixCol('#0a1016', '#28414f', lampA));
  ctx.fillStyle = water;
  ctx.beginPath(); ctx.ellipse(b.x, b.y - 3, b.rx * 0.9, b.ry * 0.78, 0, 0, TAU); ctx.fill();
  ctx.save();
  ctx.globalAlpha = 0.4 * lampA * (0.4 + W.steam * 0.6);
  ctx.strokeStyle = C.silk; ctx.lineWidth = 1;
  for (let i = 0; i < 4; i++) {
    const y = b.y - 10 + i * 7, ph = clock * 0.0012 + i;
    ctx.beginPath();
    ctx.moveTo(b.x - b.rx * 0.7, y);
    ctx.quadraticCurveTo(b.x, y + Math.sin(ph) * 4, b.x + b.rx * 0.7, y);
    ctx.stroke();
  }
  ctx.restore();
  for (const co of W.cocoons) {
    const bob = reduceMotion ? 0 : Math.sin(clock * 0.0016 + co.ph) * 2.2;
    ctx.save();
    cocoonPath(co.x, co.y + bob, 13 * co.s, 19 * co.s, co.rot);
    const cg = ctx.createLinearGradient(co.x - 14, co.y - 20, co.x + 14, co.y + 20);
    cg.addColorStop(0, mixCol('#403c34', '#fbf3df', lampA));
    cg.addColorStop(1, mixCol('#2a2620', '#cdbb95', lampA));
    ctx.fillStyle = cg; ctx.fill();
    ctx.strokeStyle = `rgba(255,248,226,${(0.3 * lampA * (1 - co.reeled * 0.6)).toFixed(3)})`;
    ctx.lineWidth = 0.9; ctx.stroke();
    ctx.restore();
  }
  ctx.restore();
  // 蒸汽
  if (W.steam > 0.01) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const p of W.motes) {
      const a = clamp(1 - (clock - p.t0) / p.dur) * W.steam * 0.3;
      if (a <= 0.004) continue;
      const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
      g.addColorStop(0, `rgba(226,236,246,${a.toFixed(3)})`);
      g.addColorStop(1, 'rgba(226,236,246,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill();
    }
    ctx.restore();
  }
}

/* ---------- 缫丝车：木轮、丝锭与那根从茧里抽出来的丝 ---------- */
function drawReel(lampA, C) {
  const w = L.wheel, bo = L.bobbin, hk = L.hook;
  ctx.save();
  // 导丝钩：一根立柱挑着瓷环，丝从这里换向
  ctx.strokeStyle = mixCol('#181008', '#7a5228', lampA); ctx.lineWidth = 7; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(hk.x - 16, L.tableY + 4); ctx.lineTo(hk.x, hk.y + 12); ctx.stroke();
  ctx.strokeStyle = mixCol('#2a2018', '#d8cdb4', lampA); ctx.lineWidth = 4;
  ctx.beginPath(); ctx.arc(hk.x, hk.y, 11, 0, TAU); ctx.stroke();
  // 支架
  ctx.strokeStyle = mixCol('#181008', '#7a5228', lampA); ctx.lineWidth = 14; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(w.x - w.r * 0.7, L.tableY + 6); ctx.lineTo(w.x, w.y); ctx.lineTo(w.x + w.r * 0.7, L.tableY + 6); ctx.stroke();
  ctx.lineWidth = 8;
  ctx.beginPath(); ctx.moveTo(w.x - w.r * 0.5, w.y + w.r * 0.55); ctx.lineTo(w.x + w.r * 0.5, w.y + w.r * 0.55); ctx.stroke();
  // 轮辐
  ctx.save();
  ctx.translate(w.x, w.y); ctx.rotate(W.wheelA);
  ctx.strokeStyle = mixCol('#20160c', '#a0703a', lampA); ctx.lineWidth = 7;
  for (let i = 0; i < 8; i++) {
    const a = i / 8 * TAU;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a) * w.r, Math.sin(a) * w.r); ctx.stroke();
  }
  ctx.lineWidth = 13;
  const rg = ctx.createLinearGradient(-w.r, -w.r, w.r, w.r);
  rg.addColorStop(0, mixCol('#2a1c10', '#c08c46', lampA));
  rg.addColorStop(1, mixCol('#160e08', '#6b451f', lampA));
  ctx.strokeStyle = rg;
  ctx.beginPath(); ctx.arc(0, 0, w.r, 0, TAU); ctx.stroke();
  // 轮上缠绕的丝
  ctx.strokeStyle = `rgba(233,198,132,${(0.5 * lampA * W.spin).toFixed(3)})`; ctx.lineWidth = 2;
  for (let i = 0; i < 5; i++) { ctx.beginPath(); ctx.arc(0, 0, w.r - 8 - i * 3.5, 0, TAU); ctx.stroke(); }
  // 摇柄
  ctx.strokeStyle = mixCol('#241a10', '#b07c3c', lampA); ctx.lineWidth = 9;
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(w.r * 0.72, 0); ctx.stroke();
  ctx.fillStyle = mixCol('#2a1e12', '#d8a45c', lampA);
  ctx.beginPath(); ctx.arc(w.r * 0.72, 0, 11, 0, TAU); ctx.fill();
  ctx.restore();
  ctx.fillStyle = mixCol('#1a120a', '#8a5c2c', lampA);
  ctx.beginPath(); ctx.arc(w.x, w.y, 15, 0, TAU); ctx.fill();

  // 丝锭
  ctx.save();
  ctx.translate(bo.x, bo.y);
  ctx.strokeStyle = mixCol('#1c140c', '#8a6030', lampA); ctx.lineWidth = 9;
  ctx.beginPath(); ctx.moveTo(0, -46); ctx.lineTo(0, 46); ctx.stroke();
  const wrap = W.wound;
  if (wrap > 0.001) {
    const rw = 34 * wrap, rh = 44 * wrap;
    const wg = ctx.createLinearGradient(-rw, -rh, rw, rh);
    wg.addColorStop(0, mixCol('#4a4034', '#fbeec6', lampA));
    wg.addColorStop(0.5, mixCol('#3a3228', '#e9c684', lampA));
    wg.addColorStop(1, mixCol('#2a241c', '#b8944e', lampA));
    ctx.fillStyle = wg;
    ctx.beginPath(); ctx.ellipse(0, 0, rw, rh, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = `rgba(120,88,40,${(0.4 * lampA).toFixed(3)})`; ctx.lineWidth = 1;
    for (let i = -5; i <= 5; i++) {
      const y = i * rh / 6;
      const dx = rw * Math.sqrt(Math.max(0, 1 - (y / rh) ** 2));
      ctx.beginPath(); ctx.moveTo(-dx, y); ctx.quadraticCurveTo(0, y + 3, dx, y); ctx.stroke();
    }
  }
  ctx.fillStyle = mixCol('#241a10', '#a8763a', lampA);
  ctx.beginPath(); ctx.ellipse(0, -48, 20, 6, 0, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(0, 48, 20, 6, 0, 0, TAU); ctx.fill();
  ctx.restore();
  ctx.restore();
}

function drawThread(lampA, C) {
  if (W.thread <= 0.001) return;
  const n = THREAD.length - 1, upto = clamp(W.thread) * n;
  ctx.save();
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  // 丝的影子
  ctx.strokeStyle = `rgba(0,0,0,${(0.3 * lampA).toFixed(3)})`; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(THREAD[0][0] + 2, THREAD[0][1] + 3);
  for (let i = 1; i <= Math.floor(upto); i++) ctx.lineTo(THREAD[i][0] + 2, THREAD[i][1] + 3);
  ctx.stroke();
  // 光晕
  ctx.globalCompositeOperation = 'lighter';
  ctx.strokeStyle = `rgba(255,196,110,${(0.2 + 0.3 * W.threadGlow).toFixed(3)})`;
  ctx.lineWidth = 10 + 6 * W.threadGlow;
  ctx.beginPath(); ctx.moveTo(THREAD[0][0], THREAD[0][1]);
  for (let i = 1; i <= Math.floor(upto); i++) ctx.lineTo(THREAD[i][0], THREAD[i][1]);
  ctx.stroke();
  ctx.globalCompositeOperation = 'source-over';
  ctx.strokeStyle = mixCol('#8a7a58', C.silk, Math.max(lampA, W.threadGlow));
  ctx.lineWidth = 2.6;
  ctx.beginPath(); ctx.moveTo(THREAD[0][0], THREAD[0][1]);
  for (let i = 1; i <= Math.floor(upto); i++) ctx.lineTo(THREAD[i][0], THREAD[i][1]);
  const fi = Math.floor(upto);
  if (fi < n) { const a = THREAD[fi], b = THREAD[fi + 1], f = upto - fi; ctx.lineTo(lerp(a[0], b[0], f), lerp(a[1], b[1], f)); }
  ctx.stroke();
  // 沿丝流动的光点
  const beads = 5;
  for (let i = 0; i < beads; i++) {
    const u = ((clock * 0.00013 + i / beads) % 1) * clamp(W.thread);
    const p = threadAt(u);
    const a = 0.5 + 0.5 * Math.sin(clock * 0.004 + i);
    ctx.globalCompositeOperation = 'lighter';
    const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, 13);
    g.addColorStop(0, `rgba(255,240,200,${(0.7 * a).toFixed(3)})`);
    g.addColorStop(1, 'rgba(255,190,110,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, 13, 0, TAU); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
  }
  ctx.restore();
}

/* ---------- 丝结：一个结接住下一个结 ---------- */
function drawKnots(C) {
  if (W.tieUI <= 0.01 && !W.knotTied.some(Boolean)) return;
  ctx.save();
  L.knots.forEach((k, i) => {
    const on = W.knotOn[i], tied = W.knotTied[i];
    const pulse = reduceMotion ? 0.6 : 0.5 + 0.5 * Math.sin(clock * 0.004 + i * 1.7);
    if (!tied && W.tieUI > 0.02) {
      const r = 26 + pulse * 8;
      ctx.globalCompositeOperation = 'lighter';
      const g = ctx.createRadialGradient(k[0], k[1], 0, k[0], k[1], r * 2.2);
      g.addColorStop(0, `rgba(255,214,150,${(0.4 * W.tieUI).toFixed(3)})`);
      g.addColorStop(1, 'rgba(255,180,90,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(k[0], k[1], r * 2.2, 0, TAU); ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
      ctx.strokeStyle = `rgba(255,226,170,${(0.75 * W.tieUI).toFixed(3)})`; ctx.lineWidth = 2;
      ctx.setLineDash([6, 7]); ctx.lineDashOffset = -clock * 0.02;
      ctx.beginPath(); ctx.arc(k[0], k[1], r, 0, TAU); ctx.stroke();
      ctx.setLineDash([]);
    }
    if (on > 0.01) {
      ctx.save();
      ctx.translate(k[0], k[1]);
      const s = lerp(1.5, 1, ease.out(on));
      ctx.scale(s, s);
      ctx.globalCompositeOperation = 'lighter';
      const g = ctx.createRadialGradient(0, 0, 0, 0, 0, 54);

/* ---------- 剪影：摇车的奶奶与接线的孩子 ----------

function figure(x, y, s, facing, fill, rim, target, kind) {
  ctx.save();

  ctx.beginPath();
  ctx.moveTo(-30, 0);
  ctx.bezierCurveTo(-30, -46, -22, -78, -18, -104);

  ctx.beginPath(); ctx.arc(2, headY, headR, 0, TAU); ctx.fill();
  if (kind === 'child') {
    ctx.beginPath(); ctx.arc(-14, headY - 16, 8, 0, TAU); ctx.fill();

  ctx.fillRect(-6, headY + headR - 4, 16, 14);

  const dx = toLocalX - shoulder[0], dy = toLocalY - shoulder[1];
  const dist = Math.hypot(dx, dy) || 1;
  const reach = Math.min(dist, 108);
  const ux = dx / dist, uy = dy / dist;
  const hand = [shoulder[0] + ux * reach, shoulder[1] + uy * reach];
  const bow = kind === 'child' ? 16 : 22;
  const elbow = [shoulder[0] + ux * reach * 0.5 - uy * bow, shoulder[1] + uy * reach * 0.5 + ux * bow];

  ctx.fillStyle = fill;
  ctx.beginPath(); ctx.arc(hand[0], hand[1], kind === 'child' ? 7 : 8, 0, TAU); ctx.fill();

  ctx.beginPath();
  ctx.moveTo(16, -124); ctx.bezierCurveTo(30, -114, 30, -84, 32, -56); ctx.bezierCurveTo(34, -30, 34, -12, 34, 0);
  ctx.stroke();
  ctx.beginPath(); ctx.arc(2, headY, headR, Math.PI * 1.62, Math.PI * 0.42); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(shoulder[0], shoulder[1] - 6); ctx.quadraticCurveTo(elbow[0], elbow[1] - 6, hand[0], hand[1] - 6); ctx.stroke();
  ctx.restore();
}

/* ---------- 余韵：一条流向远处灯火的丝河 ---------- */

/* ---------- 空气中的尘埃、丝屑与火星 ---------- */

    ctx.fillStyle = '#d8cdb2';
    withMmah(() => { for (let i = 0; i < NS; i++) if (g.prog[i] < 0.99) ctx.fill(SUN_PATHS[i]); });
    ctx.restore();
  }
  if (g.outline < 0.99 && g.trad < 0.99) {
    ctx.save();
    ctx.globalAlpha = g.alpha * (1 - g.outline) * (1 - g.trad);
    // 缣帛上是发亮的金丝，竹简上必须换成深墨，否则浅底浅字看不见
    const silkPhase = 1 - smooth(g.m * 1.5);
    const inkOnSlip = smooth((g.m - 0.34) / 0.5);
    const col = mixCol(mixCol('#f8e2ac', '#3a2a14', inkOnSlip), '#1b1a20', smooth((g.m - 1.1) / 0.7));
    if (silkPhase > 0.02) {
      ctx.shadowColor = `rgba(255,196,110,${(0.85 * silkPhase).toFixed(3)})`;
      ctx.shadowBlur = 7 * DPR * silkPhase;
    }
    ctx.fillStyle = col;
    for (let i = 0; i < NS; i++) brush(ctx, i, g.prog[i]);
    ctx.shadowBlur = 0;
    ctx.restore();
  }
  if (g.outline > 0.01 && g.trad < 0.99) {
    ctx.save();
    ctx.globalAlpha = g.alpha * g.outline * (1 - g.trad);
    withMmah(() => {
      for (let i = 0; i < NS; i++) {
        ctx.fillStyle = g.labels > 0.1 ? (i < 3 ? '#1b1a20' : '#c2402c') : '#1b1a20';
        paintStroke(i, g.prog[i]);
      }
    });
    ctx.restore();
  }
  if (g.trad > 0.01) {
    ctx.save();
    ctx.globalAlpha = g.alpha * g.trad;
    withMmah(() => {
      for (let i = 0; i < NT; i++) {
        ctx.fillStyle = i < 3 ? '#1b1a20' : '#8a4a1c';
        const q = g.progT[i];
        if (q <= 0) continue;
        if (q >= 1) { ctx.fill(TRAD_PATHS[i]); continue; }
        ctx.save(); ctx.clip(TRAD_PATHS[i]);
        ctx.lineWidth = 175; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = ctx.fillStyle;
        const pts = densify(SUN_TRAD.medians[i], 10), count = (pts.length - 1) * q, k = Math.floor(count);
        ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
        for (let j = 1; j <= k && j < pts.length; j++) ctx.lineTo(pts[j][0], pts[j][1]);
        if (k < pts.length - 1) { const a = pts[k], b = pts[k + 1], f = count - k; ctx.lineTo(lerp(a[0], b[0], f), lerp(a[1], b[1], f)); }
        ctx.stroke(); ctx.restore();
      }
    });
    ctx.restore();
  }
  drawLabels();
  drawTraceUI();
  drawStamp(g.stamp);
  ctx.restore();
  if (g.words > 0.01) drawWords();
}
function drawVeil() {
  if (W.veil <= 0.001) return;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = `rgba(246,239,221,${W.veil.toFixed(3)})`;
  ctx.fillRect(0, 0, SW, SH);
}
function drawBloom() {
  if (W.bloomT >= 1 || W.bloomT <= 0) return;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const t = W.bloomT;
  ctx.save();
  for (const b of [{ x: 0.4, y: 0.62, d: 0 }, { x: 0.56, y: 0.5, d: 0.18 }]) {
    const u = clamp((t - b.d) / (1 - b.d));
    if (u <= 0) continue;
    const r = ease.out(u) * Math.hypot(SW, SH) * 0.8;
    const a = Math.sin(Math.PI * u) * 0.92;
    if (a <= 0.005) continue;
    const g = ctx.createRadialGradient(SW * b.x, SH * b.y, r * 0.12, SW * b.x, SH * b.y, r);
    g.addColorStop(0, `rgba(252,246,230,${a.toFixed(3)})`);
    g.addColorStop(0.62, `rgba(246,239,221,${(a * 0.86).toFixed(3)})`);
    g.addColorStop(1, 'rgba(246,239,221,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, SW, SH);
  }
  ctx.restore();
}

/* ---------- 帧更新与渲染 ---------- */
let introPt = null;
function updateWorld() {
  const k = DT * 0.05;
  W.wheelA += W.wheelV * DT * 0.001;
  W.wheelV *= Math.pow(0.9992, DT);
  if (Math.abs(W.wheelV) < 0.02) W.wheelV = 0;
  // 缫车每转过一格响一次木轴
  const notch = Math.floor(W.wheelA / (TAU / 8));
  if (notch !== W._notch) { if (W._notch !== undefined && Math.abs(W.wheelV) > 0.6) Sound.click(0.035); W._notch = notch; }
  Sound.setWheel(Math.min(1, Math.abs(W.wheelV) / 6));
  Sound.setRoom(W.intro ? 0.9 : W.lamp * (1 - W.veil));

  for (const wm of W.worms) {
    wm.chew = Math.max(0, wm.chew - DT * 0.004);
    if (!reduceMotion && W.lamp > 0.4 && W.veil < 0.3 && clock - Sound.lastNibble > 420 && rand() > 0.72) {
      wm.chew = 1;
      const lf = W.leaves[Math.floor(rand() * W.leaves.length)];
      if (lf) lf.bite = Math.min(1, lf.bite + 0.05);
      Sound.nibble(0.028); Sound.lastNibble = clock;
    }
  }
  if (W.steam > 0.05 && W.motes.length < 46 && rand() > 0.55) {
    const b = L.basin;
    W.motes.push({ x: b.x + (rand() - 0.5) * b.rx * 1.4, y: b.y - 10, r: 14 + rand() * 26, vy: -0.5 - rand() * 0.6, vx: (rand() - 0.5) * 0.3, t0: clock, dur: 1800 + rand() * 1600 });
  }
  for (const p of W.motes) { p.x += p.vx * k; p.y += p.vy * k; p.r += 0.22 * k; }
  W.motes = W.motes.filter(p => clock - p.t0 < p.dur);
  W.wisps = W.wisps.filter(p => clock - p.t0 < p.dur);
  for (const s of W.sparks) { s.x += s.vx * k; s.y += s.vy * k; s.vy += 0.03 * k; }
  W.sparks = W.sparks.filter(s => clock - s.t0 < s.dur);
  for (const la of W.lanterns) la.u = Math.min(1, la.u + la.sp * DT * (reduceMotion ? 0.4 : 1));
  W.lanterns = W.lanterns.filter(la => la.u < 1);
  if (W.shake > 0.01) W.shake = Math.max(0, W.shake - DT * 0.008);
  if (W.threadGlow > 0.01) W.threadGlow = Math.max(0, W.threadGlow - DT * 0.0011);

  if (W.intro) {
    W.lamp = 1; W.moon = 1; W.steam = 0.85; W.spin = 1; W.wound = 0.82;
    W.thread = 1; W.childA = 1; W.mood = 1.4;
    W.knotTied = [true, true, true]; W.knotOn = [1, 1, 1];
    if (Math.abs(W.wheelV) < 0.4) W.wheelV = 1.1;
    const targetOrbit = introPt ? clamp((introPt.x / SW - 0.5) * 2, -1, 1) : (reduceMotion ? 0 : Math.sin(clock * 0.00055) * 0.55);
    cam.orbitX += (targetOrbit - cam.orbitX) * Math.min(1, DT / 240);
  } else {
    cam.orbitX *= 0.92;
  }
}
function render() {
  updateView();
  const w = cvs.width, h = cvs.height;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  const C = moodCols();

  drawRoom(C);
  setCam(ctx, 0.94);
  drawTray(W.lamp);
  drawBasin(W.lamp, C);
  drawPeople(W.lamp, C);
  drawReel(W.lamp, C);
  drawThread(W.lamp, C);
  drawKnots(C);
  drawRiver(C);
  drawAir(C);

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  drawVeil();
  drawBloom();
  drawGlyph();

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  ctx.drawImage(grainC, 0, 0);
  if (!vignette || vignette.w !== w || vignette.h !== h) {
    const g = ctx.createRadialGradient(w / 2, h * 0.46, Math.min(w, h) * 0.34, w / 2, h * 0.46, Math.hypot(w, h) * 0.66);
    g.addColorStop(0, 'rgba(6,10,18,0)');
    g.addColorStop(1, 'rgba(6,10,18,0.44)');
    vignette = { w, h, g };
  }
  ctx.fillStyle = vignette.g;
  ctx.fillRect(0, 0, w, h);
}

let last = null, paused = false;
function loop(now) {
  requestAnimationFrame(loop);
  if (last == null) last = now;
  const dt = Math.min(50, Math.max(0, now - last));
  last = now;
  if (visible && !paused) {
    DT = dt;
    clock += dt;
    updateWorld();
    const list = waiters; waiters = [];
    for (const wt of list) { if (wt.tk.dead) wt.rej(new Cancelled()); else wt.res(clock); }
  }
  render();
}

/* ---------- 字幕与交互控制 ---------- */
const ui = {
  cap: $('#caption'), capT: $('#capTitle'), capP: $('#capText'),
  hint: $('#hint'), action: $('#action'), demo: $('#demo'),
  prog: [...document.querySelectorAll('#progress li')],
};
const CHAR_MS = 65;
let capMinEnd = 0;
function span(cls, text) { const s = document.createElement('span'); if (cls) s.className = cls; s.textContent = text; return s; }
function showCaption(title, text) {
  ui.capT.textContent = window.haqiHanziUi ? window.haqiHanziUi(title, ui.capT) : title;
  ui.capP.replaceChildren(...[...text].map((c, i) => { const s = span('ch', c); s.style.setProperty('--i', i); return s; }));

}
async function caption(title, text, tk, hold = 0) {

}
async function captionDone(tk) { while (clock < capMinEnd) await frame(tk); }
function hint(text) {

}
function progress(i) { ui.prog.forEach((li, j) => { li.classList.toggle('on', j === i); li.classList.toggle('done', j < i); }); }
function mode(m) { document.body.classList.remove('spin', 'tie', 'trace', 'play'); if (m) document.body.classList.add(m); S.mode = m; }
let actionFn = null;
function setAction(label, fn) {

const S = { handler: null, demo: null, finish: null, mode: null, interactions: [] };
let activePid = null;
addEventListener('pointermove', e => { if (W.intro) introPt = { x: e.clientX, y: e.clientY }; });
cvs.addEventListener('pointerdown', e => {
  if (!e.isPrimary || activePid != null) return;
  const h = S.handler; if (!h || !h.down) return;
  activePid = e.pointerId;
  try { cvs.setPointerCapture(e.pointerId); } catch {}
  e.preventDefault();
  h.down(toWorld(e.clientX, e.clientY, h.px ?? 1), e);
});
cvs.addEventListener('pointermove', e => {
  if (e.pointerId !== activePid) return;
  const h = S.handler; if (!h || !h.move) return;
  const list = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  for (const ev of (list.length ? list : [e])) h.move(toWorld(ev.clientX, ev.clientY, h.px ?? 1), ev);
});
function endPtr(e, cancel) {
  if (e.pointerId !== activePid) return;
  activePid = null;
  const h = S.handler;
  h?.up?.(toWorld(e.clientX, e.clientY, h.px ?? 1), cancel);
}
cvs.addEventListener('pointerup', e => endPtr(e, false));
cvs.addEventListener('pointercancel', e => endPtr(e, true));
cvs.addEventListener('lostpointercapture', e => endPtr(e, true));
cvs.addEventListener('keydown', e => {
  if (e.code !== 'Space' && e.code !== 'Enter') return;
  if (e.repeat) return;
  e.preventDefault();
  if (S.mode === 'trace' && S.demo) S.demo();
  else if (actionFn) actionFn();
});
ui.action.addEventListener('click', () => { if (actionFn) actionFn(); });
ui.demo.addEventListener('click', () => { if (S.demo) S.demo(); });

/* ---------- 第二幕 · 缫丝：摇动丝车，把丝从茧里抽出来 ---------- */
async function sSpin(tk) {
  publish('sSpin');
  progress(1);
  bg(camTo(camView('spin'), 2200 * M, tk));
  await caption('缫丝', '奶奶说：茧要用温水泡一泡，才找得到那根丝的头。', tk);
  hint('点一点丝车，帮奶奶摇动轮子');
  mode('spin');
  bg(tween(600, t => { W.spinUI = t; }, tk));

  let turns = 0, lastAct = clock, reeling = false;
  const NEED = 3;
  const wind = how => {
    if (reeling) return;
    lastAct = clock;
    turns++;
    S.interactions.push(how);
    W.wheelV = Math.min(9, W.wheelV + 4.2);
    W.shake = 2.4;
    W.threadGlow = 1;
    Sound.breath(0.5, 0.05, 1100, 0.9);
    const b = L.basin;
    spawnWisp(b.x + (rand() - 0.5) * 60, b.y - 16, L.hook.x, L.hook.y, 900);
    const target = turns / NEED;
    bg(tween(900 * M, t => {
      W.thread = Math.max(W.thread, lerp(W.thread, target * 0.52, t));
      W.spin = Math.max(W.spin, t * target);
      W.wound = Math.max(W.wound, target * 0.5);
    }, tk, ease.out));
    if (turns >= NEED) reeling = true;
    else hint(`再摇 ${NEED - turns} 下，丝头就出来了`);
  };
  setAction('摇一摇丝车', () => wind('button'));
  S.handler = {
    px: 0.94,
    down(p) {
      const w = L.wheel;
      if (Math.hypot(p.x - w.x, p.y - w.y) < w.r * 2.1) wind('tap'); else wind('tap');
    },
  };
  while (!reeling) {
    await frame(tk);
    if (clock - lastAct > (AUTO ? 420 : 7600)) wind('auto');
  }
  S.handler = null; setAction(null); mode(null); hint(null); W.spinUI = 0;

  Sound.reel();
  W.threadGlow = 1;
  const co = W.cocoons[0];
  if (co) co.reeled = 1;
  await tween(2000 * M, t => { W.thread = lerp(0.52, 0.62, t); W.wound = lerp(0.5, 0.82, t); W.spin = 1; }, tk, ease.out);
  await caption('缫丝', '找到了！一根细细的丝从茧里被抽出来，绕过导丝的钩子，缠上丝锭。', tk, 240);
  Sound.pluck(NOTE.E5, 0.11);
  await caption('缫丝', '一颗茧能抽出很长很长的丝。丝不断，是因为它一直被接着。', tk, 380);
  await captionDone(tk);
}

/* ---------- 第三幕 · 相续：点亮三个丝结，把丝接到孩子手里 ---------- */
async function sTie(tk) {
  publish('sTie');
  progress(2);
  bg(camTo(camView('tie'), 2400 * M, tk));
  bg(tween(1600 * M, t => { W.childA = t; }, tk, ease.out));
  await caption('相续', '孙女伸出小手，等在丝的那一头。丝要接过去，才算传下来。', tk);
  hint('点一点发亮的丝结，把丝一段一段接过去');
  mode('tie');
  bg(tween(560, t => { W.tieUI = t; }, tk));

  let tied = 0, lastAct = clock;
  const tie = (i, how) => {
    if (i < 0 || W.knotTied[i]) return;
    lastAct = clock;
    W.knotTied[i] = true; tied++;
    S.interactions.push(how);
    Sound.pluck(PENTA[3 + i * 2], 0.12, 1.6);
    Sound.bell(NOTE.C6 * (1 + i * 0.06), 0.05);
    spawnSpark(L.knots[i][0], L.knots[i][1], 14, 0.9);
    const from = W.thread, to = lerp(0.62, 1, tied / 3);
    bg(tween(900 * M, t => { W.knotOn[i] = t; W.thread = lerp(from, to, t); W.threadGlow = 1; }, tk, ease.out));
    if (tied < 3) hint(`接好了 ${tied} / 3 · 再点下一个丝结`);
  };
  const tieNext = how => tie(W.knotTied.findIndex(v => !v), how);
  setAction('接一个丝结', () => tieNext('button'));
  S.handler = {
    px: 0.94,
    down(p) {
      let best = -1, bd = Infinity;
      L.knots.forEach((k, i) => {
        if (W.knotTied[i]) return;
        const d = Math.hypot(p.x - k[0], p.y - k[1]);
        if (d < bd) { bd = d; best = i; }
      });
      if (best >= 0 && bd < 150) tie(best, 'tap'); else tieNext('tap');
    },
  };
  while (tied < 3) {
    await frame(tk);
    if (clock - lastAct > (AUTO ? 420 : 8200)) tieNext('auto');
  }
  S.handler = null; setAction(null); mode(null); hint(null); W.tieUI = 0;
  await wait(500 * M, tk);
  W.threadGlow = 1;
  Sound.bell(NOTE.G5, 0.09);
  spawnSpark(L.hand.x, L.hand.y, 24, 1.2);
  await caption('相续', '丝到了孩子手里。奶奶的手，和孙女的手，中间是同一根丝。', tk, 420);
  await captionDone(tk);
}

  await caption('简体楷书', '今天写「孙」：右边简写成小，左边的子最后一笔向上提，让位置给右边。', tk, 520);
  await captionDone(tk);
  await tween(500, t => { W.glyph.labels = 1 - t; }, tk);
}

/* ---------- 第五幕 · 写字：六笔规范描红 ---------- */
async function sWrite(tk) {
  publish('sWrite');
  progress(4);
  await caption('写字', '「孙」一共六笔：先写左边的子，再写右边的小。', tk);
  await tween(800, t => { W.glyph.prog = W.glyph.prog.map(() => 1 - t); W.glyph.ghost = t; }, tk);
  W.glyph.prog = Array(NS).fill(0);
  W.glyph.trace = true; W.trace = { stroke: 0, pen: null };

  const showStroke = () => {
    capMinEnd = 0;
    showCaption('写字', `第 ${W.trace.stroke + 1} 笔，共 ${NS} 笔。`);
    hint(`${KAI[W.trace.stroke].name}：从红点起笔，顺着虚线写`);
  };
  await captionDone(tk);
  showStroke();

  let samples = MLD[0], drag = null, lastInput = clock, demoing = false, completed = 0, invalidHint = 0;
  const finishStroke = () => {
    const i = W.trace.stroke;
    if (i >= NS) return;
    W.glyph.prog[i] = 1;
    Sound.pluck(PENTA[i % PENTA.length], 0.12, 1.4);
    W.trace.stroke++;
    W.trace.pen = null;
    completed++;
    if (W.trace.stroke < NS) { samples = MLD[W.trace.stroke]; showStroke(); }
  };
  S.finish = finishStroke;
  const tolLocal = () => Math.max(20, 48 / (CV.k * GL.s));

  S.handler = {
    down(p) {
      if (demoing || W.trace.stroke >= NS) return;
      lastInput = clock;
      const q = toLocal(p.x, p.y), t = tolLocal();
      const lastPt = samples[samples.length - 1];
      const dEnd = Math.hypot(q.x - lastPt[0], q.y - lastPt[1]);
      let startIdx = -1, bestD = Infinity;
      const startLimit = Math.max(1, Math.floor(samples.length * 0.35));
      for (let j = 0; j < startLimit; j++) {
        const d = Math.hypot(q.x - samples[j][0], q.y - samples[j][1]);
        if (d < bestD) { bestD = d; startIdx = j; }
      }
      if (bestD > t * 1.75 || (bestD > dEnd * 1.15 && dEnd < t * 1.2)) {
        if (clock - invalidHint > 500) { hint('从这一笔的红点开始哦'); invalidHint = clock; }
        return;
      }
      drag = { idx: startIdx, fIdx: startIdx, lastQ: q };
      W.glyph.prog[W.trace.stroke] = drag.idx / (samples.length - 1);
      W.trace.pen = samples[drag.idx];
    },
    move(p) {
      if (!drag) return;
      lastInput = clock;
      const q = toLocal(p.x, p.y), t = tolLocal();
      const prev = drag.lastQ || q;
      const distMove = Math.hypot(q.x - prev.x, q.y - prev.y);
      const steps = Math.max(1, Math.min(8, Math.ceil(distMove / 4)));
      const lastIdx = samples.length - 1;
      for (let s = 1; s <= steps; s++) {
        const u = s / steps, sx = lerp(prev.x, q.x, u), sy = lerp(prev.y, q.y, u);
        const win = Math.max(18, Math.ceil(lastIdx * 0.55));
        let best = drag.idx, bd = Infinity;
        for (let j = Math.max(0, drag.idx - 2); j <= Math.min(lastIdx, drag.idx + win); j++) {
          const d = Math.hypot(sx - samples[j][0], sy - samples[j][1]);
          if (d < bd) { bd = d; best = j; }
        }
        if (bd <= t * 1.35 && best >= drag.idx) {
          const a = samples[drag.idx], b = samples[best];
          const mvx = q.x - prev.x, mvy = q.y - prev.y, svx = b[0] - a[0], svy = b[1] - a[1];
          if (best === drag.idx || distMove < 0.5 || (mvx * svx + mvy * svy) >= -0.25 * distMove * Math.hypot(svx, svy)) {
            drag.idx = best; drag.fIdx = Math.max(drag.fIdx || 0, best);
          }
        }
      }
      if (distMove > 0.4 && drag.idx < lastIdx) {
        const curIdx = Math.min(lastIdx - 1, drag.idx);
        const lookIdx = Math.min(lastIdx, curIdx + Math.max(6, Math.ceil(lastIdx * 0.18)));
        const tx = samples[lookIdx][0] - samples[curIdx][0], ty = samples[lookIdx][1] - samples[curIdx][1];
        const tLen = Math.hypot(tx, ty) || 1;
        const forwardProj = ((q.x - prev.x) * tx + (q.y - prev.y) * ty) / tLen;
        const curD = Math.hypot(q.x - samples[curIdx][0], q.y - samples[curIdx][1]);
        if (forwardProj > 0.15 && curD <= t * 2.6) {
          let totalLen = 0;
          for (let j = 1; j <= lastIdx; j++) totalLen += Math.hypot(samples[j][0] - samples[j - 1][0], samples[j][1] - samples[j - 1][1]);
          const avgSeg = Math.max(0.6, totalLen / lastIdx);
          drag.fIdx = Math.min(lastIdx, Math.max(drag.fIdx || drag.idx, drag.idx) + (forwardProj / avgSeg) * 1.25);
          drag.idx = Math.max(drag.idx, Math.floor(drag.fIdx));
        }
      }
      drag.lastQ = q;
      W.glyph.prog[W.trace.stroke] = drag.idx / lastIdx;
      W.trace.pen = samples[drag.idx];
    },
    up(p, cancel) {
      if (!drag) return;
      const d = drag; drag = null; W.trace.pen = null;
      const lastIdx = samples.length - 1;
      const needIdx = Math.min(lastIdx - 2, Math.max(3, Math.ceil(lastIdx * 0.56)));
      if (!cancel && d.idx >= needIdx) { finishStroke(); return; }
      const i = W.trace.stroke, from = W.glyph.prog[i];
      bg(tween(260, t => { if (W.trace.stroke === i) W.glyph.prog[i] = from * (1 - t); }, tk));
      if (clock - invalidHint > 400) { hint('顺着虚线方向写到箭头附近即可'); invalidHint = clock; }
    },
  };

  const demo = async () => {
    if (demoing || W.trace.stroke >= NS) return;
    demoing = true; ui.demo.disabled = true; drag = null;
    hint('看笔尖光点走过每一笔');
    while (W.trace.stroke < NS) {
      const i = W.trace.stroke, pts = MLD[i];
      W.glyph.prog[i] = 0;
      await tween(720 * M, t => { W.glyph.prog[i] = t; W.trace.pen = pts[Math.round(t * (pts.length - 1))]; }, tk, ease.sine);
      W.trace.pen = null;
      finishStroke();
      await wait(160, tk);
    }
  };
  S.demo = () => { S.interactions.push('demo'); bg(demo()); };
  mode('trace'); ui.demo.hidden = false;
  if (AUTO) { S.interactions.push('auto'); bg(demo()); }

  let nudged = false;
  while (W.trace.stroke < NS) {
    await frame(tk);
    if (!demoing && !nudged && clock - lastInput > 14000) { hint('写不出来也没关系，点“看示范”'); nudged = true; }
    if (!demoing && completed === 0 && clock - lastInput > 26000) { S.interactions.push('auto'); bg(demo()); }
  }

  S.handler = null; S.demo = null; S.finish = null; mode(null); hint(null);
  ui.demo.hidden = true; ui.demo.disabled = false; W.glyph.trace = false;
  if (!S.interactions.includes('demo') && !S.interactions.includes('auto')) S.interactions.push('user');
  window.__sun.events.push('written');
  window.haqiHanziWritten?.();

  await tween(500, t => { W.glyph.ghost = 1 - t; }, tk);
  await tween(480, t => { W.glyph.stamp = t; }, tk, ease.out);
  Sound.stamp(); Sound.pluck(NOTE.C5, 0.09);
  await caption('写字', '写好了！孙，子孙的孙。', tk);
  await captionDone(tk);
}

/* ---------- 第六幕 · 词意 ---------- */
async function sWords(tk) {
  publish('sWords');
  progress(5);
  const g0 = { ...GL };
  await tween(1000 * M, t => {
    GL.cy = lerp(g0.cy, g0.cy - 26, t);
    GL.s = lerp(g0.s, portrait ? 3.4 : 2.84, t);
    W.veil = lerp(0.95, 0.76, t);
  }, tk);

  for (let i = 0; i < WORDS.length; i++) {
    const pCap = caption(WORDS[i][0], WORDS[i][1], tk);
    await wait(340, tk);
    W.wordOn = i;
    Sound.pluck(PENTA[3 + i * 2], 0.13);
    Sound.bell(NOTE.C6 * (1 + i * 0.08), 0.05);
    const from = W.mood, to = WORD_MOOD[i];
    bg(tween(1100 * M, t => { W.mood = lerp(from, to, t); }, tk));
    bg(tween(600, t => { W.glyph.words = Math.max(W.glyph.words, i + t); }, tk, ease.out));
    await pCap;
    await captionDone(tk);
  }
  W.wordOn = -1;
}

/* ---------- 第七幕 · 余韵：丝河放灯，一代接着一代 ---------- */
async function sFinale(tk) {
  publish('sFinale');
  progress(6);
  setPaperMode(false);
  bg(camTo(camView('finale'), 2800 * M, tk));
  await tween(2200 * M, t => {
    W.glyph.alpha = 1 - t;
    W.veil = 0.76 * (1 - t);
    W.mood = lerp(3, 2.4, t);
    W.riverA = t;
    W.childA = 1;
  }, tk);
  W.glyph = { ...W.glyph, alpha: 0, words: 0 };
  Sound.bell(NOTE.C5, 0.09);
  for (let i = 0; i < 4; i++) { spawnLantern(0.04 + i * 0.07); await wait(260 * M, tk); }

  await caption('余韵', '一根丝，接着一代人。灯下的丝还长，路上的孩子也还多。', tk, 420);
  await captionDone(tk);

  hint('点一点丝河放一盏灯，点一点丝车让它再转起来');
  mode('play');
  const release = u => {
    spawnLantern(clamp(u, 0.02, 0.5));
    Sound.pluck(PENTA[Math.floor(rand() * PENTA.length)], 0.1);
    Sound.breath(1.2, 0.03, 900, 0.6);
    const p = riverPoint(clamp(u, 0.02, 0.5));
    spawnSpark(p.x, p.y, 16, 0.8);
  };
  setAction('再放一盏灯', () => { Sound.init(); release(0.3); S.interactions.push('button'); });
  S.handler = {
    px: 0.94,
    down(p) {
      const w = L.wheel;
      if (Math.hypot(p.x - w.x, p.y - w.y) < w.r * 1.6) {
        W.wheelV = Math.min(9, W.wheelV + 4);
        W.threadGlow = 1;
        Sound.click(0.05);
        Sound.breath(0.6, 0.045, 1200, 0.9);
      } else {
        const u = clamp((p.x - L.basin.x) / (L.riverEnd.x - L.basin.x), 0.02, 0.6);
        release(u);
      }
      hint(null);
    },
  };
  window.__sun.finished = true;
  window.__sun.events.push('completed');
  window.haqiHanziComplete();
  for (;;) await frame(tk);
}

const SCENES = [sNight, sSpin, sTie, sGlyph, sWrite, sWords, sFinale];

async function begin() {
  stopAll();
  const tk = token = { dead: false };
  capMinEnd = 0;
  if (paused) setPaused(false);
  buildLayout();
  resetWorld();
  W.intro = false;
  setPaperMode(false);
  Object.assign(cam, camView('night'));
  S.handler = null; S.demo = null; S.finish = null; mode(null); setAction(null); hint(null);
  ui.demo.hidden = true; ui.demo.disabled = false; ui.cap.classList.remove('on');
  S.interactions = [];
  Sound.lastNibble = 0; Sound.lastWheel = -1;
  window.__sun.events = []; window.__sun.finished = false;
  publish('sNight');
  try { for (const sc of SCENES) await sc(tk); }
  catch (e) { if (!(e instanceof Cancelled)) console.error(e); }
}

async function introPlay(tk) {
  W.intro = true;
  Object.assign(cam, camView('intro'));
  for (;;) await frame(tk);
}

resize();
resetWorld();
Object.assign(cam, camView('intro'));
window.__sun = {
  scene: 'intro', finished: false, events: [], interactions: [], state: W,
  medians: SUN.medians, strokes: SUN.strokes, toScreen,
  localToScreen(x, y) { return toScreen(GL.cx + (x - 50) * GL.s, GL.cy + (y - 50) * GL.s); },
  strokePoints: KPTS, tracePoints: MLD,
  get paused() { return paused; },
  get muted() { return Sound.muted; },
  completeCurrentStroke() { S.finish?.(); },
};
render();
addEventListener('resize', () => { resize(); render(); });
requestAnimationFrame(loop);
bg(introPlay(token = { dead: false }));

$('#start').addEventListener('click', () => {
  Sound.init();
  $('#intro').classList.add('off');
  document.body.classList.add('started');
  begin();
});
$('#replay').addEventListener('click', () => {
  Sound.init();
  $('#intro').classList.add('off');
  document.body.classList.add('started');
  begin();
});
$('#mute').addEventListener('click', e => {
  Sound.init();
  Sound.setMuted(!Sound.muted);
  const btn = e.currentTarget;
  btn.setAttribute('aria-pressed', String(Sound.muted));
  const zh = Sound.muted ? '开启声音' : '静音';
  btn.textContent = window.haqiHanziUi ? window.haqiHanziUi(zh, btn) : zh;
});
function setPaused(v) {
  paused = v;
  last = null;
  Sound.setSuspended(v);
  const btn = $('#pause');
  btn.setAttribute('aria-pressed', String(v));
  const zh = v ? '继续' : '暂停';
  btn.textContent = window.haqiHanziUi ? window.haqiHanziUi(zh, btn) : zh;
}
$('#pause').addEventListener('click', () => { Sound.init(); setPaused(!paused); });
document.addEventListener('visibilitychange', () => {
  visible = !document.hidden;
  last = null;
  Sound.setSuspended(!visible || paused);
});
addEventListener('pagehide', () => { stopAll(); void Sound.ctx?.close().catch(() => {}); }, { once: true });

if (AUTO) {
  $('#intro').classList.add('off');
  document.body.classList.add('started');
  begin();
}
})();
</script>
</body>

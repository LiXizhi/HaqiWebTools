<script>
// Haqi H5 protocol v1: independent pages remain usable without a parent.
(()=>{let context=null,written=false,finished=false,serial=0;const callbacks=new Map(),subCache=new Map(),uiCache=new Map(),pending=new Set(),uiNodes=new Map();
const isZh=loc=>!loc||/^zh\b/i.test(loc);
const send=data=>{if(context)parent.postMessage({channel:'haqi-hanzi',version:1,entryId:context.entryId,sessionId:context.sessionId,...data},context.origin);};
const refreshDom=()=>{for(const[el,zh]of uiNodes){if(!el?.isConnected){uiNodes.delete(el);continue;}const tr=!isZh(context?.locale)&&uiCache.get(zh);const next=(tr&&tr!==zh)?tr:zh;if(el.dataset.haqiKind==='seal'){const seal=el.querySelector('.seal');el.textContent=next;if(seal)el.prepend(seal);}else if(el.dataset.haqiKind==='tag'){const i1=document.createElement('i'),i2=document.createElement('i');el.replaceChildren(i1,document.createTextNode(next),i2);}else el.textContent=next;}document.querySelectorAll('[data-haqi-caption]').forEach(el=>renderCaption(el,el.dataset.haqiCaption));};
const flushPending=()=>{if(!context||!pending.size)return;const texts=[...pending];pending.clear();window.haqiHanziTranslate(texts);};
const ensureTexts=texts=>{const need=[];for(const t of texts){const s=typeof t==='string'?t.trim():'';if(s&&(!subCache.has(s)||!uiCache.has(s))&&!pending.has(s)){pending.add(s);need.push(s);}}if(need.length&&context)flushPending();};
const renderCaption=(el,zh)=>{if(!el)return;el.dataset.haqiCaption=zh||'';let sub=el.querySelector('.haqi-sub-trans');if(!zh||isZh(context?.subtitleLocale||context?.locale)){sub?.remove();return;}const tr=subCache.get(zh);if(!tr||tr===zh){sub?.remove();ensureTexts([zh]);return;}if(!sub){sub=document.createElement('span');sub.className='haqi-sub-trans';const host=el.querySelector('#capText')||el;if(host!==el&&host.parentNode===el)host.insertAdjacentElement('afterend',sub);else el.appendChild(sub);}sub.textContent=tr;};
const trackUi=(el,zh,kind='')=>{if(!el||!zh)return;if(kind)el.dataset.haqiKind=kind;uiNodes.set(el,zh);ensureTexts([zh]);};
const scanStatic=()=>{if(!document.body)return;document.querySelectorAll('#start,#replay,#mute,#demo,#action,#progress li,#seasonBar button,#note,.introBottom .mean,.introBottom .sub,.introBottom .meta,.heading .eyebrow,.heading h1,.heading .deck,.edition,.colophon,#glyphLabel,#targets .svg-label').forEach(el=>{const zh=(el.textContent||'').trim();if(zh&&!uiNodes.has(el))trackUi(el,zh);});document.querySelectorAll('#brand,.brand').forEach(el=>{if(uiNodes.has(el))return;const clone=el.cloneNode(true);clone.querySelector?.('.seal')?.remove();const zh=(clone.textContent||'').trim();if(zh)trackUi(el,zh,'seal');});document.querySelectorAll('.introTop .tag,.tag').forEach(el=>{if(uiNodes.has(el))return;const zh=(el.textContent||'').trim();if(zh)trackUi(el,zh,'tag');});refreshDom();};
if(document.readyState==='loading')addEventListener('DOMContentLoaded',scanStatic,{once:true});else scanStatic();
window.haqiHanziWritten=()=>{written=true;send({type:'written'});};
window.haqiHanziComplete=()=>{if(!written){written=true;send({type:'written'});}finished=true;send({type:'completed'});};
window.haqiHanziPrefetch=texts=>ensureTexts(Array.isArray(texts)?texts:[texts]);
window.haqiHanziUi=(zh,el)=>{const s=typeof zh==='string'?zh.trim():'';if(!s)return zh;if(el)trackUi(el,s);else ensureTexts([s]);const tr=!isZh(context?.locale)&&uiCache.get(s);return(tr&&tr!==s)?tr:zh;};
window.haqiHanziCaption=(el,zh)=>{const s=typeof zh==='string'?zh.trim():'';if(s)ensureTexts([s]);renderCaption(el,s);};
window.haqiHanziTranslate=texts=>new Promise(resolve=>{const list=(Array.isArray(texts)?texts:[]).map(t=>typeof t==='string'?t.trim():'').filter(Boolean);if(!context||!list.length){resolve({});return;}const requestId=String(++serial);const timer=setTimeout(()=>{callbacks.delete(requestId);resolve({});},1500);callbacks.set(requestId,msg=>{clearTimeout(timer);const sub=msg?.translations||{},ui=msg?.uiTranslations||sub;for(const[k,v]of Object.entries(sub))if(typeof v==='string'&&v.trim())subCache.set(k,v.trim());for(const[k,v]of Object.entries(ui))if(typeof v==='string'&&v.trim())uiCache.set(k,v.trim());refreshDom();resolve(sub);});send({type:'translate',requestId,texts:list});});
addEventListener('message',event=>{const m=event.data;if(event.source!==parent||parent===window||m?.channel!=='haqi-hanzi'||m.version!==1)return;
if(m.type==='init'&&typeof m.sessionId==='string'&&typeof m.entryId==='string'){if(document.referrer&&event.origin!==new URL(document.referrer).origin)return;context={...m,origin:event.origin};scanStatic();flushPending();refreshDom();if(written)send({type:'written'});if(finished)send({type:'completed'});}
else if(context&&event.origin===context.origin&&m.sessionId===context.sessionId&&m.type==='translations'){callbacks.get(m.requestId)?.(m);callbacks.delete(m.requestId);}});
if(parent!==window)parent.postMessage({channel:'haqi-hanzi',version:1,type:'ready'},'*');})();
</script>

const names = ['撇','竖','横','竖','撇','捺'];
const pathData = a => `M${a[0]} ${a[1]}C${a.slice(2).join(' ')}`;
function path(parent, points, cls='brush') { const p=document.createElementNS(ns,'path');p.setAttribute('d',pathData(points));p.setAttribute('class',cls);parent.append(p);return p; }
const personPaths=standing.map(a=>path($('personLines'),a));
const treePaths=tree.map(a=>path($('treeLines'),a));
const ghosts=glyph.map(a=>path($('ghosts'),a,'ghost'));
const written=glyph.map(a=>path($('written'),a));
let state='intro', generation=0, controller=new AbortController(), drag=null, stroke=0, samples=[], tracing=false, demoRunning=false, selected=false;
let personX=-200;
const ease=t=>t*t*(3-2*t);
function opacity(id,n){$(id).style.opacity=n;}
function personPosition(x,y=0){personX=x;$('person').setAttribute('transform',`translate(${x} ${y})`);}
function hint(text){ const h=$('hint'); h.textContent=text?(window.haqiHanziUi?window.haqiHanziUi(text,h):text):''; }
function caption(chapter,text,h=''){ const ch=$('chapter'),cap=$('caption'); ch.textContent=window.haqiHanziUi?window.haqiHanziUi(chapter,ch):chapter; cap.textContent=text; window.haqiHanziCaption?.(cap,text); hint(h); const c=document.querySelector('.caption'); c.classList.remove('changed'); void c.offsetWidth; c.classList.add('changed'); }
function scene(next,index){state=next;document.body.dataset.scene=next;document.querySelectorAll('#progress li').forEach((li,i)=>{if(i===index)li.setAttribute('aria-current','step');else li.removeAttribute('aria-current');});$('action').hidden=true;$('demo').hidden=true;updateViewBox();}
function action(text){ const b=$('action'); b.textContent=window.haqiHanziUi?window.haqiHanziUi(text,b):text; b.hidden=false; }
function animate(ms,fn,signal=controller.signal){
 return new Promise(resolve=>{let frame,start;let settled=false;const finish=ok=>{if(settled)return;settled=true;cancelAnimationFrame(frame);signal.removeEventListener('abort',abort);resolve(ok);};const abort=()=>finish(false);if(signal.aborted){finish(false);return;}signal.addEventListener('abort',abort,{once:true});
 const step=t=>{if(start===undefined)start=t;const p=Math.min(1,(t-start)/ms);fn(ease(p));if(p===1)finish(true);else frame=requestAnimationFrame(step);};frame=requestAnimationFrame(step);});
}
const pause=ms=>animate(ms,()=>{});
const motion=(ms,fn)=>animate(reduced.matches?180:ms,fn);
function morph(paths,from,to,p){paths.forEach((el,i)=>el.setAttribute('d',pathData(from[i].map((v,j)=>v+(to[i][j]-v)*p))));}
function reset(){
 controller.abort();controller=new AbortController();generation++;cancelPointer();stroke=0;selected=false;tracing=false;demoRunning=false;
 scene('intro',0);personPosition(-200);morph(personPaths,standing,standing,1);morph(treePaths,tree,tree,1);
 for(const id of ['landscape','person','tree','treeVisual','personDetails','canopy'])opacity(id,1);
 opacity('shadow',0);$('canopy').setAttribute('transform','translate(305 95) scale(.5)');$('canopy').classList.remove('sway');
 $('personDetails').removeAttribute('transform');$('arm').setAttribute('d','M423 308Q450 336 478 311');$('leg').setAttribute('d','M413 350Q432 369 448 397');$('bag').removeAttribute('transform');
 $('targets').hidden=true;$('treeTarget').hidden=false;$('shadeTarget').hidden=true;$('personTarget').hidden=true;
 $('writing').hidden=true;$('glyphLabel').hidden=true;$('pen').hidden=true;$('startDot').hidden=false;$('replay').hidden=true;$('demo').disabled=false;
 written.forEach(p=>{p.style.opacity=0;p.style.strokeDasharray='';p.style.strokeDashoffset='';});$('trace').setAttribute('d','');
 caption('序 · 在路上','走累了，就歇一会儿。','一个可以看、可以玩、可以写的汉字故事');action('走进故事');
}
async function begin(){
 reset();scene('walk',0);$('replay').hidden=false;caption('一 · 启程','走了好久，他有些累了。','跟着他的脚步，慢慢往前走。');
 personPosition(-330);
 if(!await motion(6500,p=>personPosition(-330+130*p,reduced.matches?0:Math.sin(p*36)*3*(1-p))))return;
 if(!await pause(1000))return;
 scene('tree',1);caption('二 · 遇树','前面有棵树。','点一点小树，让枝叶展开。');$('targets').hidden=false;action('点一点小树');
}
async function grow(){
 if(state!=='tree')return;scene('growing',1);$('targets').hidden=true;
 if(!await motion(2500,p=>{const s=.5+.5*p;$('canopy').setAttribute('transform',`translate(${610*(1-s)} ${190*(1-s)}) scale(${s})`);opacity('shadow',p);}))return;
 $('canopy').removeAttribute('transform');$('canopy').classList.add('sway');
 scene('move',2);caption('三 · 歇息','树下真凉快。','拖动小人到树荫，或先点小人，再点树荫。');
 $('targets').hidden=false;$('treeTarget').hidden=true;$('shadeTarget').hidden=false;$('personTarget').hidden=false;action('选中小人');
}
function selectPerson(){if(state!=='move')return;selected=true;hint('小人准备好了，点一下树荫吧。');action('走到树荫里');}
async function rest(){
 if(state!=='move')return;const x=personX;cancelPointer();scene('rest',2);$('targets').hidden=true;caption('三 · 歇息','靠着大树，歇一会儿。','风轻轻吹，树叶沙沙响。');
 if(!await motion(1700,p=>personPosition(x+(128-x)*p)))return;
 if(!await motion(1700,p=>{
 personPosition(128*(1-p));morph(personPaths,standing,resting,p);$('personDetails').setAttribute('transform',`translate(${123*p} ${35*p})`);
 $('arm').setAttribute('d',`M${423+7*p} ${308+9*p}Q${450-4*p} ${336+9*p} ${478-15*p} ${311+24*p}`);
 $('leg').setAttribute('d',`M${413+16*p} ${350-15*p}Q${432+10*p} ${369-8*p} ${448+11*p} ${397-28*p}`);
 $('bag').setAttribute('transform',`translate(${-27*p} ${34*p})`);
 }))return;
 if(!await pause(5500))return;
 scene('morph',3);caption('四 · 成字','一个人，靠着树。','看，画里藏着一个字。');$('canopy').classList.remove('sway');
 if(!await motion(1800,p=>{morph(personPaths,resting,standing,p);$('personDetails').setAttribute('transform',`translate(${123*(1-p)} ${35*(1-p)})`);opacity('personDetails',1-p);}))return;
 if(!await motion(4800,p=>{morph(personPaths,standing,glyph.slice(0,2),p);morph(treePaths,tree,glyph.slice(2),p);opacity('canopy',1-p);opacity('treeVisual',1-p);opacity('landscape',1-p);opacity('shadow',1-p);}))return;
 $('glyphLabel').hidden=false;caption('四 · 成字','休，休息的休。','左边是单人旁，右边是木。');
 if(!await pause(5000))return;
 startWriting();
}
function startWriting(){scene('write',4);opacity('person',0);opacity('tree',0);$('writing').hidden=false;$('glyphLabel').hidden=true;$('demo').hidden=false;prepareStroke();}
function prepareStroke(){
 const p=ghosts[stroke],length=p.getTotalLength(),count=Math.ceil(length/5)+1;samples=Array.from({length:count},(_,i)=>p.getPointAtLength(length*i/(count-1)));
 $('guide').setAttribute('d',pathData(glyph[stroke]));$('trace').setAttribute('d','');$('startDot').setAttribute('cx',samples[0].x);$('startDot').setAttribute('cy',samples[0].y);
 $('strokeNumber').setAttribute('x',samples[0].x-22);$('strokeNumber').setAttribute('y',samples[0].y-15);$('strokeNumber').textContent=stroke+1;
 caption('五 · 描字',`第 ${stroke+1} 笔 · ${names[stroke]}`,'从红点起笔，顺着虚线慢慢写。');
}
async function finishStroke(){
 written[stroke].style.opacity=1;written[stroke].style.strokeDasharray='';written[stroke].style.strokeDashoffset='';$('trace').setAttribute('d','');stroke++;
 if(stroke<6){prepareStroke();return;}
 scene('written',4);$('demo').hidden=true;$('guide').setAttribute('d','');$('startDot').hidden=true;$('strokeNumber').textContent='';$('glyphLabel').hidden=false;
 window.haqiHanziWritten?.();
 caption('五 · 描字','写好了！休，休息的休。','一人一木，把这个字记在心里。');
 if(!await pause(3300))return;
 await finale();
}
async function demonstrate(){
 if(state!=='write'||demoRunning)return;cancelPointer();demoRunning=true;$('demo').disabled=true;hint('看红点走过每一笔，你也可以跟着比画。');const token=generation;
 while(stroke<6&&state==='write'){
 const p=written[stroke],length=p.getTotalLength();p.style.opacity=1;p.style.strokeDasharray=length;p.style.strokeDashoffset=length;$('pen').hidden=false;
 if(!await motion(1700,t=>{p.style.strokeDashoffset=length*(1-t);const pt=p.getPointAtLength(t*length);$('pen').setAttribute('cx',pt.x);$('pen').setAttribute('cy',pt.y);}))return;
 $('pen').hidden=true;await finishStroke();if(token!==generation)return;if(state==='write'&&!await pause(450))return;
 }
 if(token===generation){demoRunning=false;$('demo').disabled=false;}
}
async function finale(){
 scene('finale',5);caption('六 · 再出发','休息好了，再出发。','好好休息，也是一件重要的事。');$('writing').hidden=true;opacity('person',1);opacity('tree',1);$('glyphLabel').hidden=true;
 if(!await motion(3500,p=>{morph(personPaths,glyph.slice(0,2),standing,p);morph(treePaths,glyph.slice(2),tree,p);opacity('canopy',p);opacity('landscape',p);opacity('shadow',p);}))return;
 $('personDetails').removeAttribute('transform');$('bag').removeAttribute('transform');$('leg').setAttribute('d','M413 350Q432 369 448 397');
 if(!await motion(1500,p=>{opacity('personDetails',p);opacity('treeVisual',p);$('arm').setAttribute('d',`M423 308Q452 305 ${470+Math.sin(p*12)*7} 278`);}))return;
 $('canopy').classList.add('sway');
 if(!await motion(3300,p=>personPosition(370*p,reduced.matches?0:Math.sin(p*30)*3)))return;
 window.haqiHanziComplete(); scene('done',5);action('再看一次');
}
function point(e){const ctm=svg.getScreenCTM();return ctm?new DOMPoint(e.clientX,e.clientY).matrixTransform(ctm.inverse()):{x:0,y:0};}
function cancelPointer(){if(!drag)return;const old=drag;drag=null;tracing=false;if(svg.hasPointerCapture(old.id))svg.releasePointerCapture(old.id);if(old.kind==='trace')$('trace').setAttribute('d','');if(old.kind==='move'&&state==='move')personPosition(-200);}
function tracePoint(p){
 if(!drag||drag.kind!=='trace')return;let best=drag.index,distance=Infinity;
 // Search a short forward window: crossings, reversed strokes and endpoint jumps cannot complete a stroke.
 for(let i=Math.max(0,drag.index-2);i<Math.min(samples.length,drag.index+9);i++){const d=Math.hypot(p.x-samples[i].x,p.y-samples[i].y);if(d<distance){distance=d;best=i;}}
 if(distance>24){drag.invalid=true;return;}drag.index=Math.max(drag.index,best);
 const pts=samples.slice(0,drag.index+1);$('trace').setAttribute('d',pts.map((pt,i)=>`${i?'L':'M'}${pt.x} ${pt.y}`).join(' '));
}
svg.addEventListener('pointerdown',e=>{
 if(drag||!e.isPrimary||e.button!==0)return;const p=point(e);
 if(state==='move'&&e.target.closest('#personTarget')){e.preventDefault();drag={id:e.pointerId,kind:'move',start:p,origin:personX,moved:false};svg.setPointerCapture(e.pointerId);}
 else if(state==='write'&&!demoRunning){e.preventDefault();if(Math.hypot(p.x-samples[0].x,p.y-samples[0].y)>28){hint('从这一笔的红点开始哦。');return;}drag={id:e.pointerId,kind:'trace',index:0,invalid:false};tracing=true;svg.setPointerCapture(e.pointerId);tracePoint(p);}
});
svg.addEventListener('pointermove',e=>{
 if(!drag||drag.id!==e.pointerId)return;const p=point(e);
 if(drag.kind==='move'){const dx=p.x-drag.start.x,dy=p.y-drag.start.y;drag.moved||=Math.hypot(dx,dy)>6;personPosition(drag.origin+dx,dy);}
 else for(const event of e.getCoalescedEvents?.().length?e.getCoalescedEvents():[e])tracePoint(point(event));
});
svg.addEventListener('pointerup',e=>{
 if(!drag||drag.id!==e.pointerId)return;const p=point(e),old=drag;
 if(old.kind==='trace')tracePoint(p);
 drag=null;tracing=false;if(svg.hasPointerCapture(e.pointerId))svg.releasePointerCapture(e.pointerId);
 if(old.kind==='move'){
 if(!old.moved){personPosition(-200);selectPerson();}
 else if(p.x>=409&&p.x<=559&&p.y>=265&&p.y<=445){rest();}
 else{personPosition(-200);hint('还没到树荫里，再试一次吧。');}
 }else if(!old.invalid&&old.index>=samples.length-3){finishStroke();}
 else{$('trace').setAttribute('d','');hint('没关系，从红点开始，把这一笔写完整。');}
});
svg.addEventListener('pointercancel',cancelPointer);svg.addEventListener('lostpointercapture',cancelPointer);
$('treeTarget').addEventListener('click',grow);$('shadeTarget').addEventListener('click',()=>{if(selected)rest();else if(state==='move')hint('先点一下小人，再带他走到树荫。');});
$('action').addEventListener('click',()=>{if(state==='intro'||state==='done')begin();else if(state==='tree')grow();else if(state==='move'){if(selected)rest();else selectPerson();}});
$('replay').addEventListener('click',begin);$('demo').addEventListener('click',demonstrate);
function updateViewBox(){svg.setAttribute('viewBox',innerWidth<=600?(state==='write'||state==='written'?'265 55 500 455':'135 40 650 485'):'0 0 1000 520');}
function layout(){cancelPointer();updateViewBox();}
addEventListener('resize',layout);addEventListener('blur',cancelPointer);addEventListener('pagehide',()=>{controller.abort();cancelPointer();});
addEventListener('pageshow',e=>{if(e.persisted)reset();});
// SVG elements do not consistently implement HTMLElement.hidden; reflect it explicitly.
for(const el of svg.querySelectorAll('[hidden],#targets,#treeTarget,#shadeTarget,#personTarget,#writing,#glyphLabel,#pen,#startDot')){
 Object.defineProperty(el,'hidden',{get(){return this.hasAttribute('hidden');},set(v){this.toggleAttribute('hidden',!!v);}});
}
reset();layout();
</script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<title>明 míng · 日月同辉</title>

<style>
:root{
  --night:#0e1120;--cream:#f4efe2;--gold:#f2c063;--silver:#a9c6f2;--muted:#8f98ab;
  --serif:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC","SimSun",serif;
  --kai:"Kaiti SC","STKaiti","KaiTi","BiauKai","Kaiti TC",var(--serif);
}
html,body{margin:0;height:100%;overflow:hidden;background:var(--night)}
body{color:var(--cream);font-family:var(--serif);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--gold);outline-offset:4px}
#sampler{position:absolute;width:0;height:0;overflow:hidden}
#view{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
body.tap #view{cursor:pointer}body.grab #view{cursor:grab}body.trace #view{cursor:crosshair}

#brand{position:fixed;left:max(16px,env(safe-area-inset-left));top:max(14px,env(safe-area-inset-top));display:flex;align-items:center;gap:10px;
  font-family:var(--kai);font-size:14px;letter-spacing:.22em;color:#d8cba8;z-index:8;pointer-events:none;opacity:.85}
#brand .seal{background:#b8432c;color:#fbecd0;border-radius:3px;padding:5px 5px 4px;font-size:15px;line-height:1;letter-spacing:0}

#progress{position:fixed;top:max(16px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;list-style:none;
  margin:0;padding:0;gap:clamp(5px,1.2vw,18px);z-index:10;opacity:0;transition:opacity .8s;pointer-events:none}
#progress::before{content:"";position:absolute;top:2.5px;left:12px;right:12px;height:1px;background:rgba(244,239,226,.16)}
body.started #progress{opacity:1}
#progress li{position:relative;font-family:var(--kai);font-size:13px;color:#7c859a;letter-spacing:.06em;padding-top:12px;transition:color .6s;white-space:nowrap}
#progress li::before{content:"";position:absolute;top:0;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:#39405a;transition:background .6s,transform .6s,box-shadow .6s}
#progress li.done{color:#c9c2ae}#progress li.done::before{background:#c9c2ae}
#progress li.on{color:var(--cream)}#progress li.on::before{background:var(--gold);transform:scale(1.6);box-shadow:0 0 10px 2px rgba(242,192,99,.65)}

#controls{position:fixed;right:max(14px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));display:flex;gap:8px;z-index:12;opacity:0;pointer-events:none;transition:opacity .6s}
body.started #controls{opacity:1;pointer-events:auto}
#controls button{font-family:var(--kai);font-size:14px;letter-spacing:.18em;color:#e9dcc0;background:rgba(14,18,32,.62);
  border:1px solid rgba(242,192,99,.34);border-radius:4px;padding:6px 8px 6px 12px;cursor:pointer;backdrop-filter:blur(4px)}
#controls button:hover{background:rgba(38,44,68,.9)}

#hint{position:fixed;left:16px;right:16px;margin:0 auto;width:fit-content;max-width:calc(100vw - 32px);box-sizing:border-box;
  top:max(60px,calc(env(safe-area-inset-top) + 46px));text-align:center;color:#ffe2ab;opacity:0;transition:opacity .45s;pointer-events:none;z-index:9;
  padding:7px 20px 8px;border:1px solid rgba(242,192,99,.5);border-radius:22px;background:rgba(14,18,32,.74);backdrop-filter:blur(4px)}
#hint span{font-family:var(--kai);font-size:clamp(16px,2.3vh,20px);letter-spacing:.12em}
#hint.on{opacity:1;animation:breathe 1.8s ease-in-out infinite}
@keyframes breathe{50%{box-shadow:0 0 0 6px rgba(242,192,99,.13),0 0 24px rgba(242,192,99,.22)}}

#caption{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translate(-50%,10px);
  width:min(900px,calc(100vw - 24px));box-sizing:border-box;text-align:center;opacity:0;
  transition:opacity .5s,transform .7s cubic-bezier(.2,.7,.2,1);pointer-events:none;z-index:6;padding:20px 22px 14px;
  background:radial-gradient(ellipse at center,rgba(8,10,20,.82) 38%,rgba(8,10,20,0) 72%)}
#caption.on{opacity:1;transform:translate(-50%,0)}
#capTitle{margin:0 0 8px;font-weight:400;font-family:var(--kai);font-size:clamp(15px,2.2vh,19px);letter-spacing:.42em;margin-left:.42em;color:var(--gold)}
#caption.on #capTitle{animation:sealIn .8s cubic-bezier(.2,.7,.2,1) both}
#capText{margin:0;font-family:var(--kai);font-size:clamp(19px,calc(1vw + 1.6vh),28px);line-height:1.7;color:var(--cream);letter-spacing:.06em;min-height:1.7em;
  text-shadow:0 1px 12px rgba(0,0,0,.7)}
#capText .ch{animation:inkIn 1.2s ease-out both;animation-delay:calc(var(--i) * 70ms + 120ms)}
@keyframes inkIn{from{opacity:0;color:transparent;text-shadow:0 0 14px rgba(242,192,99,.95)}50%{opacity:1}to{color:var(--cream);text-shadow:0 1px 12px rgba(0,0,0,.7)}}
@keyframes sealIn{from{opacity:0;letter-spacing:.9em;filter:blur(4px)}to{opacity:1;letter-spacing:.42em;filter:none}}
.actions{display:flex;justify-content:center;gap:10px;margin-top:12px;min-height:0}
.actions button{pointer-events:auto;cursor:pointer;font-family:var(--kai);letter-spacing:.24em;border-radius:4px}
#action{font-size:18px;padding:9px 20px 9px 26px;color:#2a1c05;border:1px solid #ffdda0;background:linear-gradient(#ffe6b6,#f0b955);
  box-shadow:0 6px 20px rgba(240,185,85,.32),inset 0 1px 0 rgba(255,255,255,.55)}
#action:hover{filter:brightness(1.06)}
#demo{font-size:16px;padding:8px 14px 8px 20px;color:#e8eefc;background:rgba(14,18,32,.55);border:1px solid rgba(169,198,242,.45)}
[hidden]{display:none!important}

#intro{position:fixed;inset:0;z-index:20;pointer-events:none;transition:opacity 1s,transform 1s}
#intro.off{opacity:0;transform:scale(1.03)}
#intro.off *{pointer-events:none!important}
.introTop,.introBottom{position:absolute;left:0;right:0;display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 20px}
.introTop{bottom:calc(100% - var(--gTop,140px) + 18px)}
.introBottom{top:calc(var(--gBottom,560px) + 18px);gap:8px}
.tag{display:flex;align-items:center;gap:10px;font-family:var(--kai);font-size:clamp(15px,2.2vh,19px);letter-spacing:.3em;color:var(--gold)}
.tag i{display:block;width:clamp(24px,5vw,60px);height:1px;background:currentColor;opacity:.6}
.pinyin{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:clamp(30px,5.2vh,46px);line-height:1;color:var(--cream);letter-spacing:.06em}
.mean{font-family:var(--kai);font-size:clamp(17px,2.5vh,22px);letter-spacing:.2em;color:#e6d9b8}
.sub{font-family:var(--kai);font-size:clamp(15px,2.1vh,18px);color:#9fa9bc;letter-spacing:.14em;margin:2px 0 0;line-height:1.7}
.btn-main{pointer-events:auto;margin-top:8px;font-family:var(--kai);font-size:clamp(18px,2.6vh,22px);letter-spacing:.4em;padding:10px 24px 10px 32px;
  color:#2a1c05;background:linear-gradient(#ffe6b6,#f0b955);border:1px solid #ffdda0;border-radius:4px;cursor:pointer;
  box-shadow:0 6px 22px rgba(240,185,85,.35);transition:transform .2s;animation:btnGlow 2.6s ease-in-out infinite}
.btn-main:hover{transform:translateY(-2px)}
@keyframes btnGlow{50%{box-shadow:0 6px 22px rgba(240,185,85,.35),0 0 0 9px rgba(242,192,99,.13),0 0 44px rgba(242,192,99,.3)}}
.meta{font-size:12px;color:#7c859a;letter-spacing:.14em;margin:0}
.rise{opacity:0;transform:translateY(12px);animation:rise 1s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:var(--d,0s)}
@keyframes rise{to{opacity:1;transform:none}}
@media (max-height:540px){.sub,.meta{display:none}.introBottom{gap:4px}}

#note{position:fixed;left:max(16px,env(safe-area-inset-left));bottom:max(12px,env(safe-area-inset-bottom));font-size:11px;color:#6f7889;letter-spacing:.12em;z-index:4;pointer-events:none}
body.portrait #brand{display:none}
body.portrait #controls{top:max(44px,calc(env(safe-area-inset-top) + 34px))}
body.portrait #hint{top:max(92px,calc(env(safe-area-inset-top) + 82px))}
body.portrait #note{display:none}
body.portrait #capText{font-size:clamp(18px,4.8vw,22px);line-height:1.62}
body.portrait #progress li{font-size:11px}
@media (max-height:540px){#capText{font-size:17px;line-height:1.5}#caption{padding:8px 14px 6px}.actions{margin-top:6px}}
@media (prefers-reduced-motion: reduce){
  #intro,#caption{transition-duration:.4s}
  #hint.on,.btn-main{animation:none}
  #capText .ch{animation-duration:.25s;animation-delay:0s}
}
</style>

<body>
<svg id="sampler" aria-hidden="true"></svg>
<canvas id="view" role="img" aria-label="灰暗的山谷里，太阳从东边升起，月亮从西边升起；两团光在天空相会，照得山水通明，画面化作甲骨文与楷书的明"></canvas>

<div id="brand"><span class="seal">字</span>一字一故事</div>
<ol id="progress" aria-hidden="true"><li>未明</li><li>日出</li><li>月出</li><li>同辉</li><li>成字</li><li>写字</li><li>余韵</li></ol>
<div id="controls"><button id="replay" type="button">重播</button><button id="mute" type="button">声音 开</button></div>
<div id="hint" role="status"></div>
<section id="caption" aria-live="polite" aria-atomic="true">
  <h2 id="capTitle"></h2><p id="capText"></p>
  <div class="actions"><button id="action" type="button" hidden></button><button id="demo" type="button" hidden>看示范</button></div>
</section>
<div id="note">古字形为依据通行字形的艺术示意</div>

<div id="intro">
  <div class="introTop"><div class="tag rise" style="--d:.3s"><i></i>今天认识一个汉字<i></i></div></div>
  <div class="introBottom">
    <div class="pinyin rise" style="--d:2.9s">míng</div>
    <div class="mean rise" style="--d:3.2s">明 · 太阳和月亮，都亮</div>
    <p class="sub rise" style="--d:3.5s">日发光，月也发光，两个合起来就是明</p>
    <button id="start" class="btn-main rise" style="--d:3.8s" type="button">开始</button>
    <p class="meta rise" style="--d:4s">约三分钟 · 两次拖动、一次点击与描字 · 建议开启声音</p>
  </div>
</div>

<script>
(() => {
'use strict';

const $ = s => document.querySelector(s);
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => { t = clamp(t); return t * t * (3 - 2 * t); };
const ease = {
  inOut: t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2,
  out: t => 1 - Math.pow(1 - t, 3),
  sine: t => -(Math.cos(Math.PI * t) - 1) / 2,
  lin: t => t,
};
function mulberry32(a) {
  return () => {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const M = reduceMotion ? 0.6 : 1;
let rand = mulberry32(20261015);

/* ---------- 虚拟时钟：页面隐藏时暂停，回来不跳帧 ---------- */
class Cancelled extends Error {}
let clock = 0, DT = 16;
let waiters = [];
let token = { dead: true };
function frame(tk) { return new Promise((res, rej) => waiters.push({ tk, res, rej })); }
async function wait(ms, tk) { const t0 = clock; while (clock - t0 < ms) await frame(tk); }
async function tween(ms, fn, tk, ez = ease.inOut) {
  if (ms <= 0) { fn(1); return; }
  const t0 = clock;
  for (;;) {
    await frame(tk);
    const t = clamp((clock - t0) / ms);
    fn(ez(t));
    if (t >= 1) return;
  }
}
const bg = p => p.catch(e => { if (!(e instanceof Cancelled)) console.error(e); });

/* ---------- 声音：WebAudio 实时合成，不加载音频文件 ----------
   日与月各有一组持续音：太阳是 C 大三和弦（暖），月亮是 A 小三和弦（凉）。
   两盏都亮时五音齐鸣，合成明亮的 C6 和弦——声音和画面一起变亮。 */
const NOTE = { C3: 130.81, G3: 196.00, A3: 220.00, C4: 261.63, D4: 293.66, E4: 329.63, G4: 392.00, A4: 440.00, C5: 523.25, D5: 587.33, E5: 659.26, G5: 783.99, A5: 880.00, C6: 1046.50 };
const PENTA = [NOTE.C4, NOTE.D4, NOTE.E4, NOTE.G4, NOTE.A4, NOTE.C5, NOTE.D5, NOTE.E5, NOTE.G5, NOTE.A5];
const Sound = {
  ctx: null, master: null, wet: null, noise: null, muted: false,
  sunBus: null, moonBus: null, padOn: false,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try { this.ctx = new C(); } catch { return; }
    const c = this.ctx;
    this.master = c.createGain();
    this.master.gain.value = this.muted ? 0 : 0.6;
    this.master.connect(c.destination);
    const d = c.createDelay(1); d.delayTime.value = 0.29;
    const fb = c.createGain(); fb.gain.value = 0.34;
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2600;
    this.wet = c.createGain(); this.wet.gain.value = 0.3;
    this.wet.connect(d); d.connect(lp); lp.connect(fb); fb.connect(d); lp.connect(this.master);
    const len = c.sampleRate * 2;
    const buf = c.createBuffer(1, len, c.sampleRate);
    const data = buf.getChannelData(0);
    const r = mulberry32(7);
    for (let i = 0; i < len; i++) data[i] = r() * 2 - 1;
    this.noise = buf;
  },
  setMuted(m) {
    this.muted = m;
    if (this.master) this.master.gain.setTargetAtTime(m ? 0 : 0.6, this.ctx.currentTime, 0.05);
  },
  out(node, wet = true) { node.connect(this.master); if (wet) node.connect(this.wet); },
  pluck(f, vol = 0.16, dur = 2.6) {
    const c = this.ctx; if (!c) return;
    const t = c.currentTime;
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    const lp = c.createBiquadFilter(); lp.type = 'lowpass';
    lp.frequency.setValueAtTime(f * 6, t);
    lp.frequency.exponentialRampToValueAtTime(f * 1.4, t + dur * 0.6);
    lp.connect(g); this.out(g);
    for (const [m, type, a] of [[1, 'triangle', 1], [2.003, 'sine', 0.3], [3.01, 'sine', 0.09]]) {
      const o = c.createOscillator(); o.type = type;
      o.frequency.setValueAtTime(f * m * 1.012, t);
      o.frequency.exponentialRampToValueAtTime(f * m, t + 0.12);
      const og = c.createGain(); og.gain.value = a;
      o.connect(og); og.connect(lp); o.start(t); o.stop(t + dur + 0.05);
    }
  },
  bell(f, vol = 0.1, dur = 3.6) {
    const c = this.ctx; if (!c) return;
    const t = c.currentTime;
    for (const [m, a, dd] of [[1, 1, 1], [2.76, 0.32, 0.5], [5.4, 0.1, 0.24], [0.5, 0.18, 1.2]]) {
      const o = c.createOscillator(); o.type = 'sine'; o.frequency.value = f * m;
      const g = c.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol * a, t + 0.006);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur * dd);
      o.connect(g); this.out(g); o.start(t); o.stop(t + dur * dd + 0.05);
    }
  },
  hiss(dur, freq, vol, q = 0.8, wet = false) {
    const c = this.ctx; if (!c || !this.noise) return;
    const t = c.currentTime;
    const s = c.createBufferSource(); s.buffer = this.noise;
    const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = freq; bp.Q.value = q;
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + Math.min(0.06, dur * 0.3));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(bp); bp.connect(g); this.out(g, wet);
    s.start(t, rand() * 1.5); s.stop(t + dur + 0.05);
  },
  // 日出：向上滑行的气流
  rise(vol = 0.1) {
    const c = this.ctx; if (!c || !this.noise) return;
    const t = c.currentTime;
    const s = c.createBufferSource(); s.buffer = this.noise;
    const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.4;
    bp.frequency.setValueAtTime(240, t);
    bp.frequency.exponentialRampToValueAtTime(2600, t + 2.2);
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.9);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 2.4);
    s.connect(bp); bp.connect(g); this.out(g, true);
    s.start(t, rand()); s.stop(t + 2.5);
  },
  // 月出：清亮的琶音
  moonRise() {
    const seq = [NOTE.A4, NOTE.C5, NOTE.E5, NOTE.A5];
    seq.forEach((f, i) => setTimeout(() => this.bell(f, 0.075, 4), reduceMotion ? 0 : i * 140));
  },
  // 日月两盏持续音
  pad() {
    const c = this.ctx; if (!c || this.padOn) return;
    this.padOn = true;
    const mk = (notes, cutoff, gain) => {
      const g = c.createGain(); g.gain.value = 0;
      const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = cutoff;
      const lfo = c.createOscillator(); lfo.frequency.value = 0.07;
      const lg = c.createGain(); lg.gain.value = 0.008;
      lfo.connect(lg); lg.connect(g.gain); lfo.start();
      for (const [f, type, a] of notes) {
        const o = c.createOscillator(); o.type = type; o.frequency.value = f;
        const og = c.createGain(); og.gain.value = a;
        o.connect(og); og.connect(lp); o.start();
      }
      lp.connect(g); g.connect(this.master);
      g.__peak = gain;
      return g;
    };
    this.sunBus = mk([[NOTE.C3, 'sine', 0.6], [NOTE.G3, 'triangle', 0.34], [NOTE.E4, 'sine', 0.22]], 780, 0.055);
    this.moonBus = mk([[NOTE.A3, 'sine', 0.5], [NOTE.E4, 'sine', 0.26], [NOTE.C5, 'sine', 0.16]], 1500, 0.045);
  },
  padLevels(s, m) {
    const c = this.ctx; if (!c) return;
    if (this.sunBus) this.sunBus.gain.setTargetAtTime(this.sunBus.__peak * clamp(s), c.currentTime, 0.45);
    if (this.moonBus) this.moonBus.gain.setTargetAtTime(this.moonBus.__peak * clamp(m), c.currentTime, 0.45);
  },
};

/* ---------- 画布与镜头 ---------- */
const cvs = $('#view'), ctx = cvs.getContext('2d');
let SW = 1, SH = 1, DPR = 1, portrait = false;
const cam = { x: 900, y: 460, w: 1900, h: 1020, pw: 1000, pcy: 0.46 };
const CV = { x: 0, y: 0, k: 1, cy: 0 };
const VIEW = {
  intro:  { x: 900, y: 430, w: 1500, h: 880, pw: 760,  pcy: 0.40 },
  dim:    { x: 900, y: 470, w: 1950, h: 1060, pw: 1010, pcy: 0.48 },
  sun:    { x: 560, y: 420, w: 1520, h: 860, pw: 880,  pcy: 0.45 },
  moon:   { x: 1220, y: 420, w: 1620, h: 880, pw: 900,  pcy: 0.45 },
  wide:   { x: 900, y: 430, w: 2100, h: 1100, pw: 1120, pcy: 0.46 },
  glyph:  { x: 900, y: 415, w: 720,  h: 720,  pw: 540,  pcy: 0.42 },
  finale: { x: 900, y: 460, w: 2050, h: 1090, pw: 1140, pcy: 0.48 },
};
function frameW(v) { return portrait ? (v.pw ?? v.w * 0.62) : v.w; }
function updateView() {
  const usableH = SH * (portrait ? 0.62 : 0.78);
  CV.k = Math.min(SW / frameW(cam), usableH / cam.h);
  CV.cy = SH * (portrait ? cam.pcy : 0.45);
  let dx = 0, dy = 0;
  if (!reduceMotion && W.drift) { dx = Math.sin(clock * 0.00019) * 8 * W.drift; dy = Math.sin(clock * 0.00014 + 1) * 5 * W.drift; }
  CV.x = cam.x + dx; CV.y = cam.y + dy;
}
function setCam(c, px = 1) {
  const k = CV.k;
  c.setTransform(DPR * k, 0, 0, DPR * k, DPR * (SW / 2 - CV.x * px * k), DPR * (CV.cy - CV.y * k));
}
function resetTf() { ctx.setTransform(DPR, 0, 0, DPR, 0, 0); }

/* ---------- 主循环 ---------- */
let last = null;
function loop(now) {
  if (last == null) last = now;
  DT = Math.min(50, Math.max(0, now - last));
  last = now;
  clock += DT;
  render();
  const list = waiters; waiters = [];
  for (const wt of list) { if (wt.tk.dead) wt.rej(new Cancelled()); else wt.res(clock); }
  requestAnimationFrame(loop);
}

  const tk = token = { dead: false };
  capMinEnd = 0;
  waiters.forEach(w => w.rej(new Cancelled())); waiters = [];
  resetWorld();
  Object.assign(cam, VIEW.dim);
  S.handler = null; S.demo = null; mode(null); setAction(null); hint(null);
  ui.demo.hidden = true; ui.demo.disabled = false;
  ui.cap.classList.remove('on');
  Sound.padLevels(0, 0);
  S.interactions = [];
  G = makeFrame(B_MING, 900, 415, 460);
  window.__ming = { interactions: S.interactions, scene: null, finished: false, toScreen, localToScreen, strokes: MING, state: W, sunScreen: () => toScreen(sunPos().x, sunPos().y), moonScreen: () => toScreen(moonPos().x, moonPos().y), now: () => clock };
  try {
    for (const sc of SCENES) { window.__ming.scene = sc.name; await sc(tk); }
  } catch (e) {
    if (!(e instanceof Cancelled)) console.error(e);
  }
}

/* ---------- 片头：灰暗的山谷里写出「明」 ---------- */
const intro = { tk: { dead: false } };
function placeIntro() {
  if (intro.tk.dead) return;
  const a = localToScreen(G.bbox.cx, G.bbox.y0 - 6), b = localToScreen(G.bbox.cx, G.bbox.y1 + 6);
  const box = $('#intro');
  box.style.setProperty('--gTop', `${a.y}px`);
  box.style.setProperty('--gBottom', `${b.y}px`);
}
async function introPlay(tk) {
  W.sun.up = 0; W.moon.up = 0;
  W.glyph.alpha = 1; W.glyph.morph = 1; W.glyph.morphFrom = false;
  W.glyph.prog = [0, 0, 0, 0, 0, 0, 0, 0];
  W.glyph.frameA = null; W.glyph.frameB = null;
  await wait(600, tk);
  for (let i = 0; i < 8; i++) {
    await tween(320 + RAW_MING[i].length * 8, t => { W.glyph.prog[i] = t; }, tk, ease.sine);
    await wait(70, tk);
  }
  for (;;) {
    await frame(tk);
    W.glyph.glow = 1 + 0.25 * Math.sin(clock / 700);
  }
}

resetWorld();
Object.assign(cam, VIEW.dim);
G = makeFrame(B_MING, 900, 415, 460);
window.__ming = { interactions: [], scene: 'intro', finished: false, toScreen, localToScreen, strokes: MING, state: W, sunScreen: () => toScreen(sunPos().x, sunPos().y), moonScreen: () => toScreen(moonPos().x, moonPos().y), now: () => clock };
resize();
updateView();
addEventListener('resize', () => { resize(); updateView(); placeIntro(); });
document.addEventListener('visibilitychange', () => { last = null; });
requestAnimationFrame(loop);
requestAnimationFrame(() => { updateView(); placeIntro(); });
bg(introPlay(intro.tk));

$('#start').addEventListener('click', () => {
  Sound.init(); Sound.pad();
  intro.tk.dead = true;
  $('#intro').classList.add('off');
  document.body.classList.add('started');
  W.glyph.glow = 1;
  begin();
});
$('#replay').addEventListener('click', () => { Sound.init(); begin(); });
$('#mute').addEventListener('click', e => {
  Sound.setMuted(!Sound.muted);
  e.currentTarget.textContent = Sound.muted ? '声音 关' : '声音 开';
});
})();
</script>

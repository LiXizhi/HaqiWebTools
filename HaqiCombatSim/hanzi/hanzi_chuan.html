<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0f1a">
<title>传 chuán · 一驿接一驿，把灯传下去</title>
<link rel="icon" href="data:,">
<style>
:root{
  --bg:#0a0f1a;--paper:#f4ead6;--lamp:#ffb347;--ember:#ff6b35;--cinnabar:#c8402f;--jade:#4ec9b0;--frost:#cfe0f5;--muted:#8b98ad;
  --serif:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC","SimSun",serif;
  --kai:"Kaiti SC","STKaiti","KaiTi","BiauKai","Kaiti TC",var(--serif);
}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg)}
body{color:var(--paper);font-family:var(--serif);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--lamp);outline-offset:4px}
#glView,#inkView{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#glView{z-index:1}
#inkView{z-index:3}
body.hold #inkView{cursor:pointer}
body.drag #inkView{cursor:grab}
body.drag.dragging #inkView{cursor:grabbing}
body.trace #inkView{cursor:crosshair}
body.orbit #inkView{cursor:grab}
body.orbit.dragging #inkView{cursor:grabbing}

#brand{position:fixed;left:max(16px,env(safe-area-inset-left));top:max(14px,env(safe-area-inset-top));display:flex;align-items:center;gap:10px;
  font-family:var(--kai);font-size:14px;letter-spacing:.22em;color:#c9bda6;z-index:8;pointer-events:none;opacity:.9}
#brand .seal{background:var(--cinnabar);color:#fbecd0;border-radius:3px;padding:5px 5px 4px;font-size:15px;line-height:1;letter-spacing:0;box-shadow:0 2px 8px rgba(200,64,47,.45)}

#progress{position:fixed;top:max(16px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;list-style:none;
  margin:0;padding:0;gap:clamp(8px,1.8vw,22px);z-index:10;opacity:0;transition:opacity .8s;pointer-events:none}
#progress::before{content:"";position:absolute;top:2.5px;left:12px;right:12px;height:1px;background:rgba(244,234,214,.18)}
body.started #progress{opacity:1}
#progress li{position:relative;font-family:var(--kai);font-size:13px;color:#5f6b80;letter-spacing:.08em;padding-top:12px;transition:color .6s;white-space:nowrap}
#progress li::before{content:"";position:absolute;top:0;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:#2c3648;transition:background .6s,transform .6s,box-shadow .6s}
#progress li.done{color:#a9b4c6}#progress li.done::before{background:#8fa0b8}
#progress li.on{color:var(--paper)}#progress li.on::before{background:var(--lamp);transform:scale(1.65);box-shadow:0 0 10px 2px rgba(255,179,71,.65)}

#controls{position:fixed;right:max(14px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));display:flex;gap:8px;z-index:12;opacity:0;pointer-events:none;transition:opacity .6s}
body.started #controls{opacity:1;pointer-events:auto}
#controls button{font-family:var(--kai);font-size:14px;letter-spacing:.16em;color:#eadfc7;background:rgba(12,18,30,.68);
  border:1px solid rgba(255,179,71,.38);border-radius:4px;padding:6px 10px 6px 12px;cursor:pointer;backdrop-filter:blur(4px)}
#controls button:hover{background:rgba(30,40,60,.88)}
#controls button[aria-pressed="true"]{border-color:rgba(139,152,173,.6);color:#aeb9cb}

#moodBar{position:fixed;left:max(14px,env(safe-area-inset-left));top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px;z-index:11;opacity:0;pointer-events:none;transition:opacity .5s}
#moodBar.on{opacity:1;pointer-events:auto}
#moodBar button{font-family:var(--kai);font-size:13px;letter-spacing:.14em;color:#dccfb6;background:rgba(12,18,30,.7);
  border:1px solid rgba(255,179,71,.35);border-radius:16px;padding:5px 14px;cursor:pointer;backdrop-filter:blur(4px);writing-mode:vertical-rl;text-orientation:upright}
#moodBar button.active{color:#1a1206;background:var(--lamp);border-color:var(--lamp);font-weight:600}

#hint{position:fixed;left:16px;right:16px;margin:0 auto;width:fit-content;max-width:calc(100vw - 32px);box-sizing:border-box;
  top:max(60px,calc(env(safe-area-inset-top) + 46px));text-align:center;color:#ffe9c9;opacity:0;transition:opacity .45s;pointer-events:none;z-index:9;
  padding:7px 20px 8px;border:1px solid rgba(255,179,71,.5);border-radius:22px;background:rgba(9,13,22,.78);backdrop-filter:blur(4px)}
#hint span{font-family:var(--kai);font-size:clamp(15px,2.2vh,19px);letter-spacing:.12em}
#hint.on{opacity:1;animation:breathe 1.8s ease-in-out infinite}
@keyframes breathe{50%{box-shadow:0 0 0 6px rgba(255,179,71,.12),0 0 24px rgba(255,179,71,.24)}}

#caption{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translate(-50%,10px);
  width:min(900px,calc(100vw - 24px));box-sizing:border-box;text-align:center;opacity:0;
  transition:opacity .5s,transform .7s cubic-bezier(.2,.7,.2,1);pointer-events:none;z-index:6;padding:20px 22px 14px;
  background:radial-gradient(ellipse at center,rgba(6,9,16,.84) 38%,rgba(6,9,16,0) 74%)}
#caption.on{opacity:1;transform:translate(-50%,0)}
#capTitle{margin:0 0 8px;font-weight:400;font-family:var(--kai);font-size:clamp(15px,2.2vh,19px);letter-spacing:.42em;margin-left:.42em;color:var(--lamp)}
#caption.on #capTitle{animation:sealIn .8s cubic-bezier(.2,.7,.2,1) both}
#capText{margin:0;font-family:var(--kai);font-size:clamp(19px,calc(1vw + 1.6vh),28px);line-height:1.7;color:var(--paper);letter-spacing:.06em;min-height:1.7em;
  text-shadow:0 1px 12px rgba(0,0,0,.8)}
#capText .ch{animation:inkIn 1.1s ease-out both;animation-delay:calc(var(--i) * 65ms + 100ms)}
.haqi-sub-trans{display:block;margin-top:4px;font-family:Georgia,"Times New Roman",system-ui,sans-serif;font-size:clamp(13px,1.8vh,17px);line-height:1.45;color:#b3bfd2;letter-spacing:.02em}
@keyframes inkIn{from{opacity:0;color:var(--paper);text-shadow:0 0 16px rgba(255,179,71,.95)}45%{opacity:1}to{opacity:1;color:var(--paper);text-shadow:0 1px 12px rgba(0,0,0,.8)}}
@keyframes sealIn{from{opacity:0;letter-spacing:.9em;filter:blur(4px)}to{opacity:1;letter-spacing:.42em;filter:none}}

.actions{margin-top:12px;display:flex;justify-content:center;gap:12px;pointer-events:auto;min-height:38px}
.actions button{font-family:var(--kai);font-size:clamp(15px,2.1vh,18px);letter-spacing:.2em;padding:7px 20px 7px 24px;border-radius:20px;cursor:pointer;
  color:#1a1206;background:linear-gradient(135deg,#ffd08a,#ff9e3d);border:none;box-shadow:0 4px 16px rgba(255,158,61,.35);transition:transform .2s,box-shadow .2s}
.actions button:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(255,158,61,.5)}
.actions button.holding{transform:scale(.96);background:linear-gradient(135deg,#ff8a4c,#e0492a);color:#fff2e2}
#demo{background:rgba(12,18,30,.8);color:var(--paper);border:1px solid rgba(255,179,71,.45);box-shadow:none}
#demo:hover{background:rgba(30,40,60,.92)}

#note{position:fixed;right:max(14px,env(safe-area-inset-right));bottom:max(8px,env(safe-area-inset-bottom));
  font-size:11px;color:rgba(206,196,176,.44);letter-spacing:.08em;z-index:5;pointer-events:none}

#intro{position:fixed;inset:0;z-index:20;pointer-events:none;transition:opacity .9s,transform .9s}
#intro.off{opacity:0;transform:scale(1.04)}
#intro.off *{pointer-events:none!important}
.introTop,.introBottom{position:absolute;left:0;right:0;display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 20px}
.introTop{bottom:calc(100% - var(--gTop,140px) + 12px);gap:6px}
.introBottom{top:calc(var(--gBottom,540px) + 12px);gap:7px}
.introTop .tag{display:flex;align-items:center;gap:10px;font-family:var(--kai);font-size:clamp(14px,2.1vh,18px);letter-spacing:.3em;color:var(--lamp)}
.introTop .tag i{display:block;width:clamp(24px,5vw,60px);height:1px;background:currentColor;opacity:.55}
.pinyin{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:clamp(28px,4.8vh,44px);line-height:1;color:var(--paper);letter-spacing:.06em}
.mean{font-family:var(--kai);font-size:clamp(16px,2.4vh,21px);letter-spacing:.22em;color:var(--jade)}
.sub{font-size:clamp(13px,1.9vh,16px);color:#b3bfd2;letter-spacing:.1em;margin:2px 0 0;line-height:1.6}
.btn-main{pointer-events:auto;margin-top:6px;font-family:var(--kai);font-size:clamp(18px,2.5vh,22px);letter-spacing:.4em;padding:10px 26px 10px 34px;
  color:#1a1206;background:linear-gradient(135deg,#ffd08a,#ff9e3d);border:none;border-radius:24px;cursor:pointer;
  box-shadow:0 6px 20px rgba(255,158,61,.4);transition:transform .2s,box-shadow .2s;animation:btnGlow 2.4s ease-in-out infinite}
.btn-main:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(255,158,61,.55)}
@keyframes btnGlow{50%{box-shadow:0 6px 20px rgba(255,158,61,.4),0 0 0 8px rgba(255,179,71,.14)}}
.meta{font-size:12px;color:#7f8ca1;letter-spacing:.12em;margin:0}
.rise{opacity:0;transform:translateY(12px);animation:rise .85s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:var(--d,0s)}
@keyframes rise{to{opacity:1;transform:none}}

@media (max-width:640px){
  #brand{font-size:0;letter-spacing:0;gap:0}
  #brand .seal{font-size:13px;padding:4px}
  #progress{top:max(46px,calc(env(safe-area-inset-top) + 36px));gap:7px;width:calc(100vw - 20px);justify-content:center}
  #progress::before{left:16px;right:16px}
  #progress li{font-size:10px;padding-top:9px;letter-spacing:0}
  #hint{top:max(84px,calc(env(safe-area-inset-top) + 74px));padding:6px 14px}
  #hint span{font-size:14px;letter-spacing:.06em}
  #moodBar{left:auto;right:max(10px,env(safe-area-inset-right));top:50%;transform:translateY(-50%);gap:6px}
  #moodBar button{font-size:12px;padding:6px 9px;letter-spacing:.1em}
  #controls button{font-size:12px;padding:5px 8px;letter-spacing:.08em}
  #capText{font-size:17px;line-height:1.6}
  #note{display:none}
}
@media (max-height:560px){
  .sub,.meta{display:none}
  .introBottom{gap:4px}
}
@media (prefers-reduced-motion:reduce){
  #hint.on,.btn-main{animation:none}
  #capText .ch{animation-duration:.25s;animation-delay:0s}
}
</style>

<script>
// Haqi H5 protocol v1: independent pages remain usable without a parent.
(()=>{let context=null,written=false,finished=false,serial=0;const callbacks=new Map(),subCache=new Map(),uiCache=new Map(),pending=new Set(),uiNodes=new Map();
const isZh=loc=>!loc||/^zh\b/i.test(loc);
const send=data=>{if(context)parent.postMessage({channel:'haqi-hanzi',version:1,entryId:context.entryId,sessionId:context.sessionId,...data},context.origin);};
const refreshDom=()=>{for(const[el,zh]of uiNodes){if(!el?.isConnected){uiNodes.delete(el);continue;}const tr=!isZh(context?.locale)&&uiCache.get(zh);const next=(tr&&tr!==zh)?tr:zh;if(el.dataset.haqiKind==='seal'){const seal=el.querySelector('.seal');el.textContent=next;if(seal)el.prepend(seal);}else if(el.dataset.haqiKind==='tag'){const i1=document.createElement('i'),i2=document.createElement('i');el.replaceChildren(i1,document.createTextNode(next),i2);}else el.textContent=next;}document.querySelectorAll('[data-haqi-caption]').forEach(el=>renderCaption(el,el.dataset.haqiCaption));};
const flushPending=()=>{if(!context||!pending.size)return;const texts=[...pending];pending.clear();window.haqiHanziTranslate(texts);};
const ensureTexts=texts=>{const need=[];for(const t of texts){const s=typeof t==='string'?t.trim():'';if(s&&(!subCache.has(s)||!uiCache.has(s))&&!pending.has(s)){pending.add(s);need.push(s);}}if(need.length&&context)flushPending();};
const renderCaption=(el,zh)=>{if(!el)return;el.dataset.haqiCaption=zh||'';let sub=el.querySelector('.haqi-sub-trans');if(!zh||isZh(context?.subtitleLocale||context?.locale)){sub?.remove();return;}const tr=subCache.get(zh);if(!tr||tr===zh){sub?.remove();ensureTexts([zh]);return;}if(!sub){sub=document.createElement('span');sub.className='haqi-sub-trans';const host=el.querySelector('#capText')||el;if(host!==el&&host.parentNode===el)host.insertAdjacentElement('afterend',sub);else el.appendChild(sub);}sub.textContent=tr;};
const trackUi=(el,zh,kind='')=>{if(!el||!zh)return;if(kind)el.dataset.haqiKind=kind;uiNodes.set(el,zh);ensureTexts([zh]);};
const scanStatic=()=>{if(!document.body)return;document.querySelectorAll('#start,#replay,#mute,#pause,#demo,#action,#progress li,#moodBar button,#note,.introBottom .mean,.introBottom .sub,.introBottom .meta').forEach(el=>{const zh=(el.textContent||'').trim();if(zh&&!uiNodes.has(el))trackUi(el,zh);});document.querySelectorAll('#brand,.brand').forEach(el=>{if(uiNodes.has(el))return;const clone=el.cloneNode(true);clone.querySelector?.('.seal')?.remove();const zh=(clone.textContent||'').trim();if(zh)trackUi(el,zh,'seal');});document.querySelectorAll('.introTop .tag,.tag').forEach(el=>{if(uiNodes.has(el))return;const zh=(el.textContent||'').trim();if(zh)trackUi(el,zh,'tag');});refreshDom();};
if(document.readyState==='loading')addEventListener('DOMContentLoaded',scanStatic,{once:true});else scanStatic();
window.haqiHanziWritten=()=>{written=true;send({type:'written'});};
window.haqiHanziComplete=()=>{if(!written){written=true;send({type:'written'});}finished=true;send({type:'completed'});};
window.haqiHanziPrefetch=texts=>ensureTexts(Array.isArray(texts)?texts:[texts]);
window.haqiHanziUi=(zh,el)=>{const s=typeof zh==='string'?zh.trim():'';if(!s)return zh;if(el)trackUi(el,s);else ensureTexts([s]);const tr=!isZh(context?.locale)&&uiCache.get(s);return(tr&&tr!==s)?tr:zh;};
window.haqiHanziCaption=(el,zh)=>{const s=typeof zh==='string'?zh.trim():'';if(s)ensureTexts([s]);renderCaption(el,s);};
window.haqiHanziTranslate=texts=>new Promise(resolve=>{const list=(Array.isArray(texts)?texts:[]).map(t=>typeof t==='string'?t.trim():'').filter(Boolean);if(!context||!list.length){resolve({});return;}const requestId=String(++serial);const timer=setTimeout(()=>{callbacks.delete(requestId);resolve({});},1500);callbacks.set(requestId,msg=>{clearTimeout(timer);const sub=msg?.translations||{},ui=msg?.uiTranslations||sub;for(const[k,v]of Object.entries(sub))if(typeof v==='string'&&v.trim())subCache.set(k,v.trim());for(const[k,v]of Object.entries(ui))if(typeof v==='string'&&v.trim())uiCache.set(k,v.trim());refreshDom();resolve(sub);});send({type:'translate',requestId,texts:list});});
addEventListener('message',event=>{const m=event.data;if(event.source!==parent||parent===window||m?.channel!=='haqi-hanzi'||m.version!==1)return;
if(m.type==='init'&&typeof m.sessionId==='string'&&typeof m.entryId==='string'){if(document.referrer&&event.origin!==new URL(document.referrer).origin)return;context={...m,origin:event.origin};scanStatic();flushPending();refreshDom();if(written)send({type:'written'});if(finished)send({type:'completed'});}
else if(context&&event.origin===context.origin&&m.sessionId===context.sessionId&&m.type==='translations'){callbacks.get(m.requestId)?.(m);callbacks.delete(m.requestId);}});
if(parent!==window)parent.postMessage({channel:'haqi-hanzi',version:1,type:'ready'},'*');})();
</script>

<body>
<canvas id="glView" aria-hidden="true"></canvas>
<canvas id="inkView" role="img" aria-label="夜色山道上四座驿站接力传灯，驿马把家书送进山谷，万家灯火次第亮起；驿道人影与纺砖之手化作楷书「传」"></canvas>

<div id="brand"><span class="seal">字</span>一字一故事 · 三维夜驿篇</div>
<ol id="progress" aria-hidden="true"><li>夜驿</li><li>传灯</li><li>传书</li><li>成字</li><li>写字</li><li>词意</li><li>灯火满谷</li></ol>
<div id="controls">
  <button id="mute" type="button" aria-pressed="false">声音 开</button>
  <button id="pause" type="button" aria-pressed="false">暂停</button>
  <button id="replay" type="button">重播</button>
</div>
<div id="moodBar" role="group" aria-label="四种夜驿意境">
  <button type="button" data-mood="0" class="active">夜驿</button>
  <button type="button" data-mood="1">破晓</button>
  <button type="button" data-mood="2">灯火</button>
  <button type="button" data-mood="3">雪驿</button>
</div>
<div id="hint" role="status"></div>
<section id="caption" aria-live="polite" aria-atomic="true">
  <h2 id="capTitle"></h2><p id="capText"></p>
  <div class="actions"><button id="action" type="button" hidden></button><button id="demo" type="button" hidden>看示范</button></div>
</section>
<div id="note">古字形为艺术示意 · 笔画轮廓与中线核对自 Make Me a Hanzi (Arphic Public License)</div>

<div id="intro">
  <div class="introTop"><div class="tag rise" style="--d:.2s"><i></i>今天认识一个汉字<i></i></div></div>
  <div class="introBottom">
    <div class="pinyin rise" style="--d:1.8s">chuán</div>
    <div class="mean rise" style="--d:2.0s">亻 · 专 · 传</div>
    <p class="sub rise" style="--d:2.2s">一驿接一驿，把灯传下去</p>
    <button id="start" class="btn-main rise" style="--d:2.4s" type="button">开始</button>
    <p class="meta rise" style="--d:2.6s">3D 夜驿立体剧场 · 三次互动与六笔描字 · 建议开启声音</p>
  </div>
</div>

const STATION_U = [0.05, 0.35, 0.65, 0.95];
function roadXZ(u) {
  const x = lerp(-10.5, 10.5, clamp(u));
  const z = -Math.sin(clamp(u) * Math.PI) * 1.7 + 0.4;
  return { x, z };
}
function groundY(x, z) {
  // 驿道一带（z≈0）平缓便于人物行走；向深处平滑抬升成丘陵，
  // 但抬升幅度饱和在 2.0 以内 —— 始终低于所有机位高度，
  // 因此地面尽端的轮廓永远落在真实地平线之下。该处地面已被雾完全染成雾色，
  // 而天空在地平线以下同样恒等于雾色，两者同色相接，任何画幅都无水平硬边。
  const back = Math.max(0, (-z - 5) / 22);
  const ridge = 2.0 * (1 - Math.exp(-back * 0.55));
  const roll = 0.1 * Math.sin(x * 0.4) * Math.cos(z * 0.35) + Math.min(1, back) * 0.4 * Math.sin(x * 0.11 + 1.2);
  return ridge + roll - 0.4;
}
// 共享的柔光贴图：灯晕、星点、流萤都用它，避免方形点与生硬边缘
function makeGlowTexture(inner = 'rgba(255,255,255,1)', outer = 'rgba(255,255,255,0)') {
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const x = c.getContext('2d');
  const g = x.createRadialGradient(64, 64, 0, 64, 64, 64);
  g.addColorStop(0, inner);
  g.addColorStop(0.28, 'rgba(255,255,255,0.55)');
  g.addColorStop(0.62, 'rgba(255,255,255,0.14)');
  g.addColorStop(1, outer);
  x.fillStyle = g; x.fillRect(0, 0, 128, 128);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
function roadPoint(u) {
  const { x, z } = roadXZ(u);
  return { x, y: groundY(x, z) + 0.04, z };
}
function stationPoint3D(i) {
  const p = roadPoint(STATION_U[i]);
  return { x: p.x, y: p.y + 1.55, z: p.z - 0.9 };
}

  skyMesh = new THREE.Mesh(

        uTop: { value: new THREE.Color('#060a14') }, uBot: { value: new THREE.Color('#0b1220') },

        void main(){
          vec3 d = normalize(vW - cameraPosition);
          // d.y = 0 即真实地平线；向上渐变到夜穹顶色，向下保持雾色

/* ---------- 视图投影 ---------- */
function frameW(v) { return portrait ? (v.pw ?? v.w * 0.62) : v.w; }
function updateView() {
  const usableH = SH * (portrait ? 0.62 : 0.78);
  CV.k = Math.min(SW / frameW(cam2D), usableH / cam2D.h);
  CV.cy = SH * (portrait ? cam2D.pcy : 0.46);
  let dx = 0, dy = 0;
  if (!reduceMotion && W.drift) { dx = Math.sin(clock * 0.00022) * 5 * W.drift; dy = Math.sin(clock * 0.00017 + 1) * 3.5 * W.drift; }
  CV.x = cam2D.x + dx; CV.y = cam2D.y + dy;
}
function setCam(c) {
  const k = CV.k;
  c.setTransform(DPR * k, 0, 0, DPR * k, DPR * (SW / 2 - CV.x * k), DPR * (CV.cy - CV.y * k));
}
function toWorld(cx, cy) { return { x: (cx - SW / 2) / CV.k + CV.x, y: (cy - CV.cy) / CV.k + CV.y }; }
function toScreen(x, y) { return { x: (x - CV.x) * CV.k + SW / 2, y: (y - CV.y) * CV.k + CV.cy }; }
let _projV = null;
function world3DToScreen(vx, vy, vz) {
  if (!camera || !_projV || !worldGroup) return fbProject(vx, vy);
  _projV.set(vx, vy, vz);
  _projV.applyMatrix4(worldGroup.matrixWorld);
  _projV.project(camera);
  return { x: (_projV.x * 0.5 + 0.5) * SW, y: (-_projV.y * 0.5 + 0.5) * SH };
}
async function cam3DTo(preset, ms, tk, ez = ease.inOut) {
  const from = { ...curCam3D }, to = { ...preset };
  await tween(ms, t => {
    for (const k of ['x', 'y', 'z', 'tx', 'ty', 'tz', 'fov', 'pfov']) curCam3D[k] = lerp(from[k], to[k], t);
  }, tk, ez);
}
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  SW = innerWidth; SH = innerHeight;
  portrait = SW / SH < 0.85;
  document.body.classList.toggle('portrait', portrait);
  cvs.width = Math.round(SW * DPR);
  cvs.height = Math.round(SH * DPR);
  if (renderer && camera) {
    renderer.setSize(SW, SH, false);
    camera.aspect = SW / Math.max(1, SH);
    camera.updateProjectionMatrix();
  }
}

const CHUAN_PATHS = CHUAN.strokes.map(d => new Path2D(d));
const NS = 6;

function densify(pts, step) {
  const out = [[pts[0][0], pts[0][1]]];
  for (let i = 1; i < pts.length; i++) {
    const a = pts[i - 1], b = pts[i];
    const n = Math.max(1, Math.ceil(Math.hypot(b[0] - a[0], b[1] - a[1]) / step));
    for (let k = 1; k <= n; k++) out.push([lerp(a[0], b[0], k / n), lerp(a[1], b[1], k / n)]);
  }
  return out;
}
function resamplePoly(pts, count = 64) {
  const d = [0];
  for (let i = 1; i < pts.length; i++) d.push(d[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
  const total = d[d.length - 1] || 1, out = [];
  let j = 0;
  for (let i = 0; i <= count; i++) {
    const target = total * i / count;
    while (j < d.length - 2 && d[j + 1] < target) j++;
    const seg = (d[j + 1] - d[j]) || 1, f = clamp((target - d[j]) / seg);
    out.push([lerp(pts[j][0], pts[j + 1][0], f), lerp(pts[j][1], pts[j + 1][1], f)]);
  }
  return out;
}
function bezierChain(segs) {
  const pts = [];
  for (const s of segs) {
    for (let i = 0; i <= 20; i++) {
      const t = i / 20, u = 1 - t;
      if (s.length === 4) {

  }
  // 体积光柱

      gr.addColorStop(0, `rgba(255,179,71,${(0.1 * W.rays3D).toFixed(3)})`);
      gr.addColorStop(1, 'rgba(255,179,71,0)');
      ctx.fillStyle = gr;
      ctx.beginPath();
      ctx.moveTo(top.x - 0.5 * u, top.y); ctx.lineTo(top.x + 0.5 * u, top.y);
      ctx.lineTo(bot.x + 2.0 * u, bot.y); ctx.lineTo(bot.x - 2.0 * u, bot.y);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }
  // 四座驿亭与檐下灯笼
  for (let i = 0; i < 4; i++) {
    const p = roadPoint(STATION_U[i]), s = fb(p.x, p.y);
    ctx.fillStyle = '#5a5348';
    ctx.fillRect(s.x - 1.0 * u, s.y - 0.2 * u, 2.0 * u, 0.2 * u);
    for (const px of [-0.78, 0.78]) ctx.fillRect(s.x + px * u - 0.07 * u, s.y - 1.75 * u, 0.14 * u, 1.6 * u);
    ctx.fillStyle = '#2c2a33';
    ctx.beginPath();
    ctx.moveTo(s.x, s.y - 2.5 * u); ctx.lineTo(s.x - 1.5 * u, s.y - 1.72 * u); ctx.lineTo(s.x + 1.5 * u, s.y - 1.72 * u);
    ctx.closePath(); ctx.fill();
    const lp = fb(p.x, p.y + 1.42), on = W.lit[i];
    if (on > 0.01) {
      const gr = ctx.createRadialGradient(lp.x, lp.y, 0, lp.x, lp.y, 2.4 * u);
      gr.addColorStop(0, `rgba(255,179,71,${(0.5 * on).toFixed(3)})`);
      gr.addColorStop(1, 'rgba(255,179,71,0)');
      ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(lp.x, lp.y, 2.4 * u, 0, TAU); ctx.fill();
    }
    ctx.fillStyle = on > 0.5 ? '#ffd08a' : '#4a4038';
    ctx.beginPath(); ctx.arc(lp.x, lp.y, 0.19 * u, 0, TAU); ctx.fill();
  }
  // 山谷村舍与次第亮起的窗火
  const vr = mulberry32(1201);
  for (let i = 0; i < 26; i++) {
    const row = i % 3;
    const hx = VILLAGE_X + (vr() - 0.5) * 5.2 + row * 0.7;
    const hz = -2.2 - row * 1.9 + (vr() - 0.5) * 1.2;
    const sc = 0.8 + vr() * 0.55, delay = vr();
    const s = fb(hx, groundY(hx, hz)), w = 0.95 * sc * u, h = 0.72 * sc * u;
    ctx.fillStyle = '#3a3340'; ctx.fillRect(s.x - w / 2, s.y - h, w, h);
    ctx.fillStyle = '#2c2a33';
    ctx.beginPath();
    ctx.moveTo(s.x, s.y - h - 0.52 * sc * u); ctx.lineTo(s.x - w * 0.62, s.y - h); ctx.lineTo(s.x + w * 0.62, s.y - h);
    ctx.closePath(); ctx.fill();
    const on = clamp((W.village - delay * 0.6) / 0.4);
    if (on > 0.01) {
      ctx.fillStyle = `rgba(255,196,106,${(0.95 * on).toFixed(3)})`;
      ctx.fillRect(s.x - 0.12 * sc * u, s.y - h * 0.62, 0.24 * sc * u, 0.2 * sc * u);
    }
  }
  // 村口烽火

    const s = fb(VILLAGE_X - 1.6, groundY(VILLAGE_X - 1.6, -1.2));
    const h = 1.5 * W.beacon * u * (1 + 0.08 * Math.sin(clock / 120));
    const gr = ctx.createRadialGradient(s.x, s.y - h * 0.4, 0, s.x, s.y - h * 0.4, 3 * u);
    gr.addColorStop(0, `rgba(255,107,53,${(0.4 * W.beacon).toFixed(3)})`);
    gr.addColorStop(1, 'rgba(255,107,53,0)');
    ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(s.x, s.y - h * 0.4, 3 * u, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ff6b35';
    ctx.beginPath();
    ctx.moveTo(s.x, s.y - h); ctx.lineTo(s.x - 0.42 * u * W.beacon, s.y); ctx.lineTo(s.x + 0.42 * u * W.beacon, s.y);
    ctx.closePath(); ctx.fill();
  }
  // 驿使提灯
  if (W.courierOn) {
    const p = roadPoint(W.relayU), s = fb(p.x, p.y);
    ctx.fillStyle = '#3a4a63';
    ctx.beginPath();
    ctx.moveTo(s.x, s.y - 1.0 * u); ctx.lineTo(s.x - 0.32 * u, s.y); ctx.lineTo(s.x + 0.32 * u, s.y);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#f0d3b4'; ctx.beginPath(); ctx.arc(s.x, s.y - 1.08 * u, 0.19 * u, 0, TAU); ctx.fill();
    ctx.fillStyle = '#b9925c';
    ctx.beginPath();
    ctx.moveTo(s.x, s.y - 1.42 * u); ctx.lineTo(s.x - 0.46 * u, s.y - 1.2 * u); ctx.lineTo(s.x + 0.46 * u, s.y - 1.2 * u);
    ctx.closePath(); ctx.fill();
    if (W.carry) {
      const lp = fb(p.x + 0.56, p.y + 0.6);
      const gr = ctx.createRadialGradient(lp.x, lp.y, 0, lp.x, lp.y, 1.8 * u);
      gr.addColorStop(0, 'rgba(255,179,71,0.55)'); gr.addColorStop(1, 'rgba(255,179,71,0)');
      ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(lp.x, lp.y, 1.8 * u, 0, TAU); ctx.fill();
      ctx.fillStyle = '#ffd08a'; ctx.beginPath(); ctx.arc(lp.x, lp.y, 0.16 * u, 0, TAU); ctx.fill();
    }
  }
  // 驿马传书
  if (W.horseOn) {
    const p = roadPoint(W.horseU), s = fb(p.x, p.y);
    ctx.fillStyle = '#4a3628';
    ctx.beginPath(); ctx.ellipse(s.x, s.y - 0.78 * u, 0.55 * u, 0.28 * u, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(s.x + 0.62 * u, s.y - 1.12 * u, 0.24 * u, 0.13 * u, -0.3, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#4a3628'; ctx.lineWidth = 0.1 * u; ctx.lineCap = 'round';
    for (let l = 0; l < 4; l++) {
      const lx = s.x + (l < 2 ? 0.34 : -0.34) * u;
      const sw = Math.sin(W.gait * 6 + l * 1.6) * 0.16 * u;
      ctx.beginPath(); ctx.moveTo(lx, s.y - 0.6 * u); ctx.lineTo(lx + sw, s.y); ctx.stroke();
    }
  }
  // 夜雾流萤
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const pr = mulberry32(707);
  for (let i = 0; i < 90; i++) {
    const bx = (pr() - 0.5) * 40, by = pr() * 8, bz = (pr() - 0.5) * 20;
    const x = bx + Math.sin(clock / 2600 + i) * 1.2, y = by + Math.sin(clock / 1900 + i * 2) * 0.5;
    const s = fb(x, y);
    ctx.fillStyle = `rgba(255,179,71,${(0.16 + 0.14 * Math.sin(clock / 700 + i)).toFixed(3)})`;
    ctx.beginPath(); ctx.arc(s.x, s.y, 1.6 * CV.k + 0.6, 0, TAU); ctx.fill();
    void bz;
  }
  // 余韵孔明灯：上升高度受画面约束，最高只到天空中部，不越过顶部 UI
  for (let i = 0; i < 24; i++) {
    const t = clamp(W.lamps * 24 - i);
    if (t <= 0) continue;
    const lx = -8 + (i % 8) * 2.4 + Math.sin(i * 2.3) * 1.2;
    const ly = 0.6 + t * 5.4 + Math.sin(clock / 1400 + i) * 0.25;
    const s = fb(lx, ly);
    if (s.y < SH * 0.26) continue;
    const a = 0.85 * Math.min(1, t * 3) * clamp((s.y - SH * 0.26) / (SH * 0.1));
    const gr = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, 0.7 * u);
    gr.addColorStop(0, `rgba(255,179,71,${(a * 0.5).toFixed(3)})`);
    gr.addColorStop(1, 'rgba(255,179,71,0)');
    ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(s.x, s.y, 0.7 * u, 0, TAU); ctx.fill();
    ctx.fillStyle = `rgba(255,208,138,${a.toFixed(3)})`;
    ctx.beginPath(); ctx.ellipse(s.x, s.y, 0.15 * u, 0.2 * u, 0, 0, TAU); ctx.fill();
  }
  ctx.restore();
  ctx.restore();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  CV.k = k2; CV.cy = cy2; CV.y = y2;
}

/* ---------- 互动引导：接力虚线、按住送书的进度环、余韵点灯涟漪 ---------- */
// 无 WebGL 时改用 2D 保底自身的投影，保证引导线与画面元素严格对齐
function fbView() {
  return {
    k: Math.min(SW / (portrait ? 1180 : 1620), SH / (portrait ? 1500 : 1020)),
    cy: SH * (portrait ? 0.44 : 0.5), y: 470,
  };
}
function fbProject(x, y) {
  const v = fbView();
  return { x: (820 + x * FBK - CV.x) * v.k + SW / 2, y: (560 - y * FBK - v.y) * v.k + v.cy };
}
function stationScreen(i) {
  const p = stationPoint3D(i);
  if (!renderer) return fbProject(p.x, p.y);
  return world3DToScreen(p.x, p.y, p.z);
}
function relayScreen(u) {
  const p = roadPoint(u);
  if (!renderer) return fbProject(p.x, p.y + 0.6);
  return world3DToScreen(p.x, p.y + 0.6, p.z);
}
function drawInteractiveGuides() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  // 传灯：从驿使手中灯笼到下一座驿亭的虚线
  if (W.relayHint > 0.01 && W.relayTarget >= 0) {
    const a = relayScreen(W.relayU), b = stationScreen(W.relayTarget);
    ctx.strokeStyle = `rgba(255,179,71,${(0.6 * W.relayHint).toFixed(3)})`;
    ctx.lineWidth = 2; ctx.setLineDash([7, 7]);
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    ctx.setLineDash([]);
    const pulse = reduceMotion ? 0.5 : (clock % 1500) / 1500;
    ctx.strokeStyle = `rgba(255,179,71,${(0.75 * (1 - pulse) * W.relayHint).toFixed(3)})`;
    ctx.beginPath(); ctx.arc(b.x, b.y, 24 + pulse * 34, 0, TAU); ctx.stroke();
    ctx.fillStyle = `rgba(255,208,138,${(0.9 * W.relayHint).toFixed(3)})`;
    ctx.beginPath(); ctx.arc(a.x, a.y, 8, 0, TAU); ctx.fill();
  }
  // 传书：按住按钮时驿马身侧的蓄力环
  if (W.sendHint > 0.01) {
    const p = roadPoint(W.horseU), s = world3DToScreen(p.x, p.y + 1.3, p.z);
    ctx.strokeStyle = `rgba(78,201,176,${(0.5 * W.sendHint).toFixed(3)})`;
    ctx.lineWidth = 2; ctx.setLineDash([5, 6]);
    ctx.beginPath(); ctx.arc(s.x, s.y, 30, 0, TAU); ctx.stroke();
    ctx.setLineDash([]);
    if (W.send > 0.001) {
      ctx.strokeStyle = `rgba(255,179,71,${(0.95 * W.sendHint).toFixed(3)})`;
      ctx.lineWidth = 4; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(s.x, s.y, 30, -Math.PI / 2, -Math.PI / 2 + TAU * clamp(W.send)); ctx.stroke();
    }
  }
  // 成字：从驿道灯火飞向字形的汇聚光点
  if (W.converge.length) {
    setCam(ctx);
    ctx.globalCompositeOperation = 'lighter';
    for (const p of W.converge) {
      const t = clamp((clock - p.t0 - p.delay) / p.dur);
      if (t <= 0 || t >= 1) continue;
      const e = ease.inOut(t);
      const x = lerp(p.sx, p.tx, e) + Math.sin(e * Math.PI) * p.curl;
      const y = lerp(p.sy, p.ty, e) - Math.sin(e * Math.PI) * 40;
      ctx.fillStyle = `rgba(255,179,71,${(Math.sin(Math.PI * t) * 0.9).toFixed(3)})`;
      ctx.beginPath(); ctx.arc(x, y, p.s * (1.2 - e * 0.4), 0, TAU); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
  }
  // 余韵：点击升起的灯焰涟漪
  if (W.ripples.length) {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.globalCompositeOperation = 'lighter';
    for (const rp of W.ripples) {
      const a = clamp(1 - rp.age / 2600);
      ctx.strokeStyle = `rgba(255,179,71,${(a * 0.7).toFixed(3)})`;
      ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.arc(rp.x, rp.y, 8 + (1 - a) * 46, 0, TAU); ctx.stroke();
      ctx.fillStyle = `rgba(255,208,138,${(a * 0.9).toFixed(3)})`;
      ctx.beginPath(); ctx.arc(rp.x, rp.y - (1 - a) * 30, 4.2, 0, TAU); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}

/* ---------- Three.js 每帧状态：意境混色、驿灯接力、驿马奔驰、万家灯火 ---------- */
let _cA = null, _cB = null, _dummy = null;
function moodColor(key) {
  const mood = MOODS[W.mood] || MOODS[0];
  return _cA.set(mood[key]).lerp(_cB.set(DAWN[key]), clamp(W.dawn));
}
function render3D() {
  if (!renderer || !scene || !camera) return;
  const t = clock / 1000;
  const mood = MOODS[W.mood] || MOODS[0];

  matGround.color.copy(moodColor('ground'));
  matPine.color.copy(moodColor('pine'));
  scene.fog.color.copy(moodColor('fog'));
  skyMesh.material.uniforms.uTop.value.copy(moodColor('skyTop'));
  // 天空下半球用雾色，保证与远处地面同色，消除水平分界
  skyMesh.material.uniforms.uBot.value.copy(moodColor('fog'));
  skyMesh.material.uniforms.uGlow.value.copy(moodColor('ray'));
  skyMesh.material.uniforms.uDawn.value = clamp(W.dawn);
  const fogC = moodColor('fog').clone();
  skyMesh.userData.ridgeMats.forEach(pm => {
    pm.uniforms.uColor.value.copy(moodColor('pine'));
    pm.uniforms.uFog.value.copy(fogC);
  });
  // 雾在近景之后才起效；远端距离小于地面尽端，
  // 于是地面在到达平面边缘之前就已完全等于雾色，与天空同色相接。
  scene.fog.near = lerp(11, 14, W.dawn);
  scene.fog.far = lerp(48, 58, W.dawn);
  matMoon.color.copy(moodColor('moon'));
  matMoon.opacity = 0.5 * (1 - W.dawn * 0.6);
  moonMesh.userData.halo.material.opacity = 0.26 * (1 - W.dawn * 0.7);
  moonMesh.userData.halo.material.color.copy(moodColor('moon'));
  // 月轮与光晕始终正对相机（世界空间位置固定，环绕时空间关系正确）
  moonMesh.quaternion.copy(camera.quaternion);
  moonMesh.userData.halo.quaternion.copy(camera.quaternion);
  starSys.material.opacity = 0.85 * lerp(mood.star, DAWN.star, clamp(W.dawn));
  matRay.uniforms.uColor.value.copy(moodColor('ray'));
  matRay.uniforms.uOpacity.value = W.rays3D * (0.2 + 0.05 * Math.sin(t * 1.3));
  matRay.uniforms.uTime.value = t;
  matTrail.color.copy(moodColor('ray'));
  matTrail.opacity = 0.55 + 0.3 * W.trailGlow;
  moonL.color.copy(moodColor('moon'));
  moonL.intensity = lerp(1.35, 0.5, W.dawn);
  rimL.intensity = lerp(0.75, 0.35, W.dawn);
  sunL.intensity = W.dawn * 1.5;
  ambientL.intensity = lerp(0.85, 1.05, W.dawn);
  particleSys.material.color.copy(moodColor('ray'));

  // 光轨随接力生长
  trailMesh.geometry.setDrawRange(0, Math.floor(trailIndexCount * clamp(W.trailU)));

  // 四座驿亭：灯亮与点光
  for (let i = 0; i < 4; i++) {
    const on = clamp(W.lit[i]);
    const st = stations[i];
    st.userData.lamp.material = on > 0.5 ? matLampOn : matLampOff;
    const flick = reduceMotion ? 1 : 0.9 + 0.1 * Math.sin(t * 6.5 + i * 1.7);
    st.userData.lamp.scale.setScalar(lerp(0.85, 1.15, on) * flick);
    stationLights[i].intensity = on * 2.6 * flick;
    stationLights[i].color.copy(moodColor('ray'));
  }

  // 驿使沿驿道前行
  courierGroup.visible = W.courierOn;
  if (W.courierOn) {
    const p = roadPoint(W.relayU), p2 = roadPoint(Math.min(1, W.relayU + 0.01));
    courierGroup.position.set(p.x, p.y, p.z);
    courierGroup.rotation.y = Math.atan2(p2.x - p.x, p2.z - p.z) - Math.PI / 2;
    const bob = W.courierWalk ? Math.abs(Math.sin(W.gait * 5)) * 0.06 : 0;
    courierGroup.position.y += bob;
    courierLamp.visible = W.carry > 0.01;
    courierLamp.scale.setScalar(clamp(W.carry) * (reduceMotion ? 1 : 0.92 + 0.08 * Math.sin(t * 7)));

    const p = roadPoint(W.horseU), p2 = roadPoint(Math.min(1, W.horseU + 0.01));

  }

    _dummy.position.set(d.x, d.y + 0.4 * d.s, d.z + 0.44 * d.s);

  beaconL.intensity = W.beacon * 5.5;

  // 余韵孔明灯：从谷地升起，散布在驿道上空的中景高度，
  // 不堆到画面顶端遮挡 UI，越远越小，形成有纵深的灯河。
  for (let i = 0; i < skyLamps.length; i++) {
    const m = skyLamps[i];
    const k = clamp(W.lamps * 24 - i);
    m.visible = k > 0.01;
    if (!m.visible) continue;
    const col = i % 8, row = (i / 8) | 0;
    const lx = -9.5 + col * 2.7 + Math.sin(i * 2.3) * 1.1;
    const lz = -2.0 - row * 4.6 + Math.cos(i * 1.7) * 1.6;
    const rise = 0.9 + k * (2.6 + row * 1.1);
    m.position.set(lx + Math.sin(t * 0.5 + i) * 0.35, rise + Math.sin(t * 0.8 + i) * 0.25, lz);
    const grow = Math.min(1, k * 3);
    m.scale.set(1, 1.3, 1).multiplyScalar(grow);
    m.userData.halo.quaternion.copy(camera.quaternion);
    m.userData.halo.scale.setScalar(1 / Math.max(0.05, grow));
  }

  // 夜雾流萤
  const arr = particleSys.geometry.attributes.position.array;
  const vx = (0.012 + W.dawn * 0.01) * (DT / 16);
  const vy = (W.mood === 3 ? -0.02 : 0.008) * (DT / 16);
  for (let i = 0; i < arr.length; i += 3) {
    arr[i] += vx; arr[i + 1] += vy;
    if (arr[i] > 22) arr[i] = -22;
    if (arr[i + 1] > 7) arr[i + 1] = -0.4;
    if (arr[i + 1] < -0.6) arr[i + 1] = 6.6;
  }
  particleSys.geometry.attributes.position.needsUpdate = true;

  // 相机：环绕 + 滚轮/双指缩放 + 缓慢漂移
  const yaw = W.orbitYaw + (!reduceMotion && W.drift ? Math.sin(t * 0.22) * 0.045 : 0);
  worldGroup.rotation.y = yaw;
  zoom += (zoomTarget - zoom) * Math.min(1, DT / 180);
  camera.fov = portrait ? curCam3D.pfov : curCam3D.fov;
  camera.updateProjectionMatrix();
  const dx = curCam3D.x - curCam3D.tx, dy = curCam3D.y - curCam3D.ty, dz = curCam3D.z - curCam3D.tz;
  camera.position.set(curCam3D.tx + dx * zoom, curCam3D.ty + dy * zoom, curCam3D.tz + dz * zoom);
  camera.lookAt(curCam3D.tx, curCam3D.ty, curCam3D.tz);
  worldGroup.updateMatrixWorld();
  // 天空穹顶跟随相机平移（不跟随旋转），保证任何机位都被完整包裹，
  // 渐变仍按真实视线方向计算，地平线位置恒定。
  skyMesh.position.copy(camera.position);
  skyMesh.updateMatrixWorld();

  renderer.render(scene, camera);
}

function render() {
  updateView();
  render3D();
  const w = cvs.width, h = cvs.height;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  ctx.clearRect(0, 0, w, h);
  if (!renderer) drawFallbackScene();
  if (W.veil > 0.001) {
    ctx.fillStyle = `rgba(6,9,16,${(W.veil * 0.78).toFixed(3)})`;
    ctx.fillRect(0, 0, w, h);
  }
  drawInteractiveGuides();
  drawGlyph();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}

/* ---------- 帧更新与单一 rAF 循环 ---------- */
function updateParticles() {
  if (W.courierWalk || W.horseRun) W.gait += DT * 0.012;
  for (const rp of W.ripples) rp.age += DT;
  W.ripples = W.ripples.filter(rp => rp.age < 2600);
  W.converge = W.converge.filter(p => clock - p.t0 - p.delay < p.dur);
  if (W.hoofOn && W.horseRun) {
    W.hoofAcc += DT;
    if (W.hoofAcc > 260) { W.hoofAcc = 0; Sound.hoof(0.055); }
  }
}
let last = null;
function loop(now) {
  requestAnimationFrame(loop);
  if (last == null) last = now;
  const dt = Math.min(50, Math.max(0, now - last));
  last = now;
  if (visible && !paused) {
    DT = dt;
    clock += dt;
    updateParticles();
    const list = waiters; waiters = [];
    for (const wt of list) { if (wt.tk.dead) wt.rej(new Cancelled()); else wt.res(clock); }
  }
  render();
}

/* ---------- UI 字幕与输入绑定 ---------- */
const ui = {

const CHAR_MS = 65;
let capMinEnd = 0;
function span(cls, text) { const s = document.createElement('span'); if (cls) s.className = cls; s.textContent = text; return s; }
function showCaption(title, text) {
  ui.capT.textContent = window.haqiHanziUi ? window.haqiHanziUi(title, ui.capT) : title;

async function caption(title, text, tk, hold = 0) {

}
async function captionDone(tk) { while (clock < capMinEnd) await frame(tk); }
function hint(text) {

function progress(i) { ui.prog.forEach((li, j) => { li.classList.toggle('on', j === i); li.classList.toggle('done', j < i); }); }
function mode(m) {

let actionFn = null;

const S = { handler: null, demo: null, finish: null, mode: null, interactions: [] };
let activePid = null;
cvs.addEventListener('pointerdown', e => {
  if (!e.isPrimary || activePid != null) return;
  const h = S.handler; if (!h || !h.down) return;
  activePid = e.pointerId;
  try { cvs.setPointerCapture(e.pointerId); } catch {}
  e.preventDefault();
  h.down(toWorld(e.clientX, e.clientY), { x: e.clientX, y: e.clientY }, e);
});
cvs.addEventListener('pointermove', e => {
  if (e.pointerId !== activePid) return;
  const h = S.handler; if (!h || !h.move) return;
  const list = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
  for (const ev of (list.length ? list : [e])) h.move(toWorld(ev.clientX, ev.clientY), { x: ev.clientX, y: ev.clientY }, ev);
});
function endPtr(e, cancel) {
  if (e.pointerId !== activePid) return;
  activePid = null;
  S.handler?.up?.(toWorld(e.clientX, e.clientY), { x: e.clientX, y: e.clientY }, cancel);
}
cvs.addEventListener('pointerup', e => endPtr(e, false));
cvs.addEventListener('pointercancel', e => endPtr(e, true));
cvs.addEventListener('lostpointercapture', e => endPtr(e, true));
cvs.addEventListener('keydown', e => {
  if (e.code !== 'Space' && e.code !== 'Enter') return;
  if (e.repeat) return;
  e.preventDefault();
  if (S.mode === 'trace' && S.demo) S.demo();
  else if (S.mode === 'hold') holdButton(true);
  else if (actionFn) actionFn();
});
cvs.addEventListener('keyup', e => { if ((e.code === 'Space' || e.code === 'Enter') && S.mode === 'hold') holdButton(false); });
cvs.tabIndex = 0;

// 滚轮缩放（仅余韵环绕阶段生效，避免打断描字与拖拽）
cvs.addEventListener('wheel', e => {
  if (S.mode !== 'orbit') return;
  e.preventDefault();
  zoomTarget = clamp(zoomTarget * (e.deltaY > 0 ? 1.12 : 0.89), 0.55, 2.2);
}, { passive: false });
// 双指捏合缩放
const pinch = { d0: 0, z0: 1, ids: [] };
cvs.addEventListener('touchstart', e => {
  if (S.mode !== 'orbit' || e.touches.length !== 2) return;
  pinch.d0 = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
  pinch.z0 = zoomTarget;
}, { passive: true });
cvs.addEventListener('touchmove', e => {
  if (S.mode !== 'orbit' || e.touches.length !== 2 || !pinch.d0) return;
  e.preventDefault();
  const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
  zoomTarget = clamp(pinch.z0 * (pinch.d0 / Math.max(1, d)), 0.55, 2.2);
}, { passive: false });
cvs.addEventListener('touchend', () => { pinch.d0 = 0; }, { passive: true });

function holdButton(on) {
  if (S.mode !== 'hold') return;
  W.holding = on;
  ui.action.classList.toggle('holding', on);
  if (on) W.everHeld = true;
}
ui.action.addEventListener('pointerdown', e => {
  if (S.mode === 'hold') { e.preventDefault(); try { ui.action.setPointerCapture(e.pointerId); } catch {} holdButton(true); }
});
for (const ev of ['pointerup', 'pointercancel', 'lostpointercapture']) ui.action.addEventListener(ev, () => holdButton(false));
ui.action.addEventListener('click', () => { if (S.mode !== 'hold' && actionFn) actionFn(); });
ui.demo.addEventListener('click', () => { if (S.demo) S.demo(); });
ui.moods.forEach(btn => {
  btn.addEventListener('click', () => {

/* ---------- 第二幕 · 传灯：拖动灯笼点亮下一座驿亭 ---------- */
async function sRelay(tk) {
  publish('sRelay');
  progress(1);
  bg(cam3DTo(CAM3D.relay, 2600 * M, tk));
  await caption('传灯', '一个人走不了那么远。所以，把灯交给下一个人。', tk);
  await captionDone(tk);

  let leg = 0, drag = null, lastInput = clock, nudged = false;
  const legFrom = () => STATION_U[leg];
  const legTo = () => STATION_U[leg + 1];
  const enterLeg = () => {
    W.relayTarget = leg + 1;
    W.relayHint = 1;
    hint('按住驿使手中的灯，拖到下一座亮着光圈的驿亭');
    capMinEnd = 0;
    showCaption('传灯', `第 ${leg + 1} 段驿路，共 3 段。`);
  };
  const arrive = async () => {
    const target = leg + 1;
    W.relayHint = 0; W.relayTarget = -1;
    W.courierWalk = true;
    const u0 = W.relayU, u1 = legTo();
    await tween(1500 * M, t => {
      W.relayU = lerp(u0, u1, t);
      W.trailU = W.relayU;
      W.trailGlow = 1;
    }, tk, ease.sine);
    W.courierWalk = false;
    W.lit[target] = 1;
    W.carry = 0;
    Sound.bell(PENTA[3 + target], 0.11);
    Sound.breeze(0.7, 1200, 0.05);
    await tween(420 * M, t => { W.carry = t; }, tk, ease.out);
    leg++;
    if (leg < 3) { enterLeg(); lastInput = clock; }
  };

  mode('drag');
  enterLeg();
  const tolPx = () => Math.max(52, Math.min(SW, SH) * 0.09);
  S.handler = {
    down(wPt, sPt) {
      if (W.relayTarget < 0) return;
      lastInput = clock;
      const a = relayScreen(W.relayU);
      if (Math.hypot(sPt.x - a.x, sPt.y - a.y) > tolPx() * 1.6) {
        hint('先按住驿使手里那盏亮着的灯');
        return;
      }
      drag = { x: sPt.x, y: sPt.y };
      document.body.classList.add('dragging');
      Sound.pluck(NOTE.E5, 0.07, 0.8);
    },
    move(wPt, sPt) {
      if (!drag) return;
      lastInput = clock;
      drag.x = sPt.x; drag.y = sPt.y;
      const b = stationScreen(W.relayTarget);
      if (Math.hypot(sPt.x - b.x, sPt.y - b.y) < tolPx()) {
        drag = null;
        document.body.classList.remove('dragging');
        bg(arrive());
      }
    },
    up(wPt, sPt, cancel) {
      if (!drag) return;
      drag = null;
      document.body.classList.remove('dragging');
      if (cancel) return;
      const b = stationScreen(W.relayTarget);
      if (Math.hypot(sPt.x - b.x, sPt.y - b.y) < tolPx() * 1.5) bg(arrive());
      else hint('把灯一直拖到光圈的驿亭里，它才会亮起来');
    },
  };
  const autoRelay = async () => {
    S.interactions.push('auto');
    while (leg < 3) { await arrive(); await wait(260, tk); }
  };
  S.demo = () => { S.interactions.push('demo'); drag = null; document.body.classList.remove('dragging'); bg(autoRelay()); };
  ui.demo.hidden = false;
  if (AUTO) bg(autoRelay());

  while (leg < 3) {
    await frame(tk);
    if (!nudged && clock - lastInput > 15000) { hint('也可以点下方“看示范”，看灯是怎么一驿一驿传下去的'); nudged = true; }
    if (clock - lastInput > 30000 && W.relayTarget >= 0 && !S.interactions.includes('auto')) { lastInput = clock; bg(autoRelay()); }
  }
  S.handler = null; S.demo = null; mode(null); hint(null);
  ui.demo.hidden = true;
  if (!S.interactions.includes('demo') && !S.interactions.includes('auto')) S.interactions.push('user');
  await caption('传灯', '四座驿亭都亮了。灯没有走完全部的路，是「传」让路走完了。', tk);
  await captionDone(tk);
}

/* ---------- 第五幕 · 写字：六笔真实楷书描红 ---------- */
async function sWrite(tk) {
  publish('sWrite');
  progress(4);
  W.drift = 0;
  await caption('写字', '「传」一共六笔：先写左边的单人旁，再写右边的「专」。跟着红点写一写。', tk);
  await tween(800 * M, t => {
    W.glyph.prog = W.glyph.prog.map(() => 1 - t);
    W.glyph.ghost = t;
    W.glyph.labels = 1 - t;
  }, tk);
  W.glyph.prog = new Array(NS).fill(0);
  W.trace = { stroke: 0, pen: null };

  const showStroke = () => {
    capMinEnd = 0;
    showCaption('写字', `第 ${W.trace.stroke + 1} 笔，共 ${NS} 笔。`);
    hint(`${KAI[W.trace.stroke].name}：从红点起笔，顺着虚线写`);
  };
  await captionDone(tk);
  showStroke();

  let samples = MLD[0], drag = null, lastInput = clock, demoing = false, completed = 0, invalidHint = 0;
  const finishStroke = () => {
    const i = W.trace.stroke;
    if (i >= NS) return;
    W.glyph.prog[i] = 1;
    Sound.pluck(PENTA[i % PENTA.length], 0.12, 1.4);
    W.trace.stroke++;
    W.trace.pen = null;
    completed++;
    if (W.trace.stroke < NS) { samples = MLD[W.trace.stroke]; showStroke(); }
  };
  S.finish = finishStroke;
  const tolLocal = () => Math.max(20, 48 / (CV.k * GL.s));

  S.handler = {
    down(p) {
      if (demoing || W.trace.stroke >= NS) return;
      lastInput = clock;
      const q = toLocal(p.x, p.y), t = tolLocal();
      const lastPt = samples[samples.length - 1];
      const dEnd = Math.hypot(q.x - lastPt[0], q.y - lastPt[1]);
      let startIdx = 0, bestD = Infinity;
      const startLimit = Math.max(1, Math.floor(samples.length * 0.35));
      for (let j = 0; j < startLimit; j++) {
        const d = Math.hypot(q.x - samples[j][0], q.y - samples[j][1]);
        if (d < bestD) { bestD = d; startIdx = j; }
      }
      if (bestD > t * 1.75 || (bestD > dEnd * 1.15 && dEnd < t * 1.2)) {
        if (clock - invalidHint > 500) { hint('从这一笔的红点开始哦'); invalidHint = clock; }
        return;
      }
      drag = { idx: startIdx, fIdx: startIdx, lastQ: q };
      W.glyph.prog[W.trace.stroke] = drag.idx / (samples.length - 1);
      W.trace.pen = samples[drag.idx];
    },
    move(p) {
      if (!drag) return;
      lastInput = clock;
      const q = toLocal(p.x, p.y), t = tolLocal();
      const prev = drag.lastQ || q;
      const distMove = Math.hypot(q.x - prev.x, q.y - prev.y);
      const steps = Math.max(1, Math.min(8, Math.ceil(distMove / 4)));
      const lastIdx = samples.length - 1;
      for (let s = 1; s <= steps; s++) {
        const u = s / steps, sx = lerp(prev.x, q.x, u), sy = lerp(prev.y, q.y, u);
        const win = Math.max(18, Math.ceil(lastIdx * 0.55));
        let best = drag.idx, bd = Infinity;
        for (let j = Math.max(0, drag.idx - 2); j <= Math.min(lastIdx, drag.idx + win); j++) {
          const d = Math.hypot(sx - samples[j][0], sy - samples[j][1]);
          if (d < bd) { bd = d; best = j; }
        }
        if (bd <= t * 1.35 && best >= drag.idx) {
          const a = samples[drag.idx], b = samples[best];
          const mvx = q.x - prev.x, mvy = q.y - prev.y, svx = b[0] - a[0], svy = b[1] - a[1];
          if (best === drag.idx || distMove < 0.5 || (mvx * svx + mvy * svy) >= -0.25 * distMove * Math.hypot(svx, svy)) {
            drag.idx = best; drag.fIdx = Math.max(drag.fIdx || 0, best);
          }
        }
      }
      if (distMove > 0.4 && drag.idx < lastIdx) {
        const curIdx = Math.min(lastIdx - 1, drag.idx);
        const lookIdx = Math.min(lastIdx, curIdx + Math.max(6, Math.ceil(lastIdx * 0.18)));
        const tx = samples[lookIdx][0] - samples[curIdx][0], ty = samples[lookIdx][1] - samples[curIdx][1];
        const tLen = Math.hypot(tx, ty) || 1;
        const forwardProj = ((q.x - prev.x) * tx + (q.y - prev.y) * ty) / tLen;
        const curD = Math.hypot(q.x - samples[curIdx][0], q.y - samples[curIdx][1]);
        if (forwardProj > 0.15 && curD <= t * 2.6) {
          let totalLen = 0;
          for (let j = 1; j <= lastIdx; j++) totalLen += Math.hypot(samples[j][0] - samples[j - 1][0], samples[j][1] - samples[j - 1][1]);
          const avgSeg = Math.max(0.6, totalLen / lastIdx);
          drag.fIdx = Math.min(lastIdx, Math.max(drag.fIdx || drag.idx, drag.idx) + (forwardProj / avgSeg) * 1.25);
          drag.idx = Math.max(drag.idx, Math.floor(drag.fIdx));
        }
      }
      drag.lastQ = q;
      W.glyph.prog[W.trace.stroke] = drag.idx / lastIdx;
      W.trace.pen = samples[drag.idx];
    },
    up(p, sPt, cancel) {
      if (!drag) return;
      const d = drag; drag = null; W.trace.pen = null;
      const lastIdx = samples.length - 1;
      const needIdx = Math.min(lastIdx - 2, Math.max(3, Math.ceil(lastIdx * 0.56)));
      if (!cancel && d.idx >= needIdx) { finishStroke(); return; }
      const i = W.trace.stroke, from = W.glyph.prog[i];
      bg(tween(260, t => { if (W.trace.stroke === i) W.glyph.prog[i] = from * (1 - t); }, tk));
      if (clock - invalidHint > 400) { hint('顺着虚线方向写到箭头附近即可'); invalidHint = clock; }
    },
  };

  const demo = async () => {
    if (demoing || W.trace.stroke >= NS) return;
    demoing = true; ui.demo.disabled = true; drag = null;
    hint('看笔尖光点走过每一笔');
    while (W.trace.stroke < NS) {
      const i = W.trace.stroke, pts = MLD[i];
      W.glyph.prog[i] = 0;
      await tween(720 * M, t => { W.glyph.prog[i] = t; W.trace.pen = pts[Math.round(t * (pts.length - 1))]; }, tk, ease.sine);
      W.trace.pen = null;
      finishStroke();
      await wait(160, tk);
    }
  };
  S.demo = () => { S.interactions.push('demo'); bg(demo()); };
  // 引导线与可输入状态同时开启，避免"看到虚线却写不动"的空窗
  W.glyph.trace = true;
  mode('trace'); ui.demo.hidden = false;
  lastInput = clock;
  if (AUTO) { S.interactions.push('auto'); bg(demo()); }

  let nudged = false;
  while (W.trace.stroke < NS) {
    await frame(tk);
    if (!demoing && !nudged && clock - lastInput > 14000) { hint('也可以点下方“看示范”跟着写'); nudged = true; }
    if (!demoing && completed === 0 && clock - lastInput > 26000) { S.interactions.push('auto'); bg(demo()); }
  }

  S.handler = null; S.demo = null; S.finish = null; mode(null); hint(null);
  ui.demo.hidden = true; ui.demo.disabled = false; W.glyph.trace = false;
  if (!S.interactions.includes('demo') && !S.interactions.includes('auto')) S.interactions.push('user');
  window.haqiHanziWritten?.();

  await tween(500 * M, t => { W.glyph.ghost = 1 - t; }, tk);
  await tween(480 * M, t => { W.glyph.stamp = t; }, tk, ease.out);
  Sound.thud(0.15);
  Sound.bell(NOTE.G4, 0.1); Sound.pluck(NOTE.G5, 0.08);
  await caption('写字', '六笔写好了。一个人，一只手，把东西递出去——这就是「传」。', tk);
  await captionDone(tk);
  W.drift = 1;
}

/* ---------- 第六幕 · 词意 ---------- */
async function sWords(tk) {
  publish('sWords');
  progress(5);
  const g0 = { ...GL };
  await tween(1400 * M, t => {
    GL.cy = lerp(g0.cy, portrait ? 400 : 415, t);
    GL.s = lerp(g0.s, portrait ? 2.2 : 2.5, t);
    W.glyph.rays = t;
  }, tk);
  for (let i = 0; i < WORDS.length; i++) {
    W.wordOn = i;
    Sound.pluck(PENTA[4 + i], 0.12);
    bg(tween(550, t => { W.glyph.words = Math.max(W.glyph.words, i + t); }, tk, ease.out));
    await caption(WORDS[i][0], WORDS[i][1], tk);
  }
  await captionDone(tk);
  await caption('词意', '「传」还有一个读音 zhuàn，比如「传记」「自传」——把一个人的故事传下去。', tk);
  await captionDone(tk);
  W.wordOn = -1;
}

/* ---------- 第七幕 · 灯火满谷：环绕缩放与放灯 ---------- */
async function sFinale(tk) {
  publish('sFinale');
  progress(6);
  bg(cam3DTo(CAM3D.finale, 3400 * M, tk));
  await tween(1900 * M, t => { W.glyph.alpha = 1 - t; W.veil = 1 - t; }, tk);
  W.glyph.alpha = 0; W.glyph.words = 0; W.glyph.rays = 0;
  W.dawn = 1; W.village = 1; W.beacon = 1; W.rays3D = 1;
  $('#moodBar').classList.add('on');
  Sound.warm(1);
  await tween(3000 * M, t => { W.lamps = t; }, tk, ease.out);
  Sound.bell(NOTE.C5, 0.09); Sound.bell(NOTE.G5, 0.07);

  await caption('灯火满谷', '一盏灯照不了整座山谷。可只要有人愿意接过去，光就能一直传下去。', tk);
  await captionDone(tk);
  hint('拖动旋转山谷 · 滚轮或双指缩放 · 点击画面放一盏灯');
  mode('orbit');
  setAction('再看一次', () => { Sound.init(); begin(); });

  let dragOrbit = null;
  S.handler = {
    down(wPt, sPt) { dragOrbit = { x0: sPt.x, y0: sPt.y, yaw0: W.orbitYaw, moved: false }; document.body.classList.add('dragging'); },
    move(wPt, sPt) {
      if (!dragOrbit) return;
      const dx = sPt.x - dragOrbit.x0;
      if (Math.abs(dx) > 4 || Math.abs(sPt.y - dragOrbit.y0) > 4) dragOrbit.moved = true;
      W.orbitYaw = dragOrbit.yaw0 + dx * 0.008;
    },
    up(wPt, sPt, cancel) {
      document.body.classList.remove('dragging');
      if (dragOrbit && !dragOrbit.moved && !cancel) {
        W.ripples.push({ x: sPt.x, y: sPt.y, age: 0 });
        W.lamps = Math.min(1, W.lamps + 0.05);
        Sound.pluck(PENTA[(rand() * PENTA.length) | 0], 0.09, 2.2);
      }
      dragOrbit = null;
    },
  };
  window.__chuan.finished = true;
  window.haqiHanziComplete();
}

const SCENES = [sNight, sRelay, sSend, sGlyph, sWrite, sWords, sFinale];

async function begin() {
  stopAll();
  const tk = token = { dead: false };
  capMinEnd = 0;
  resetWorld();
  Object.assign(curCam3D, CAM3D.intro);
  S.handler = null; S.demo = null; S.finish = null; mode(null); setAction(null); hint(null);
  ui.demo.hidden = true; ui.demo.disabled = false; ui.cap.classList.remove('on');
  ui.moods.forEach((b, i) => b.classList.toggle('active', i === 0));
  paused = false;
  $('#pause').setAttribute('aria-pressed', 'false');
  $('#pause').textContent = window.haqiHanziUi ? window.haqiHanziUi('暂停', $('#pause')) : '暂停';
  Sound.wind(false);
  rand = mulberry32(20261201);
  S.interactions = [];
  window.__chuan.interactions = S.interactions;
  window.__chuan.finished = false;
  window.__chuan.state = W;
  publish('sNight');
  try { for (const sc of SCENES) await sc(tk); }
  catch (e) { if (!(e instanceof Cancelled)) console.error(e); }
}

/* ---------- 片头：夜驿剧场前逐笔写出「传」 ---------- */
const intro = { tk: { dead: false } };
function placeIntro() {
  if (intro.tk.dead) return;
  const a = localToScreen(50, 2), b = localToScreen(50, 98);
  const box = $('#intro');
  box.style.setProperty('--gTop', `${a.y - 12}px`);
  box.style.setProperty('--gBottom', `${b.y + 8}px`);
}
async function introPlay(tk) {
  W.courierOn = true; W.carry = 1; W.relayU = 0.32;
  W.lit = [1, 1, 0.55, 0]; W.trailU = 0.62; W.trailGlow = 0.6;
  W.rays3D = 0.85; W.village = 0.5; W.beacon = 0.35; W.dawn = 0.18;
  W.glyph.alpha = 1; W.glyph.m = 2; W.glyph.outline = 0; W.glyph.plate = 0; W.glyph.gold = 1; W.glyph.prog.fill(0);
  await wait(420, tk);
  for (let i = 0; i < NS; i++) {
    await tween(210, t => { W.glyph.prog[i] = t; }, tk, ease.sine);
    await wait(40, tk);
  }
  for (;;) {
    await frame(tk);
    W.glyph.glow = 1 + 0.25 * Math.sin(clock / 680);
  }
}

// 首帧一律先以 2D 起跑：首页永远立即可见、可交互；
// Three.js 到位且 WebGL 可用后，再无缝升级为 3D 剧场，剧情与状态不受影响。
resetWorld();
init3D();
Object.assign(curCam3D, CAM3D.intro);
window.__chuan = {
  scene: 'intro', finished: false, interactions: [], state: W,
  medians: CHUAN.medians, strokes: CHUAN.strokes, strokeNames: KAI.map(k => k.name),
  toScreen, localToScreen, stationScreen, relayScreen,
  completeCurrentStroke() { S.finish?.(); },
  get renderer() { return renderer; },
  get zoom() { return zoomTarget; },
};
resize();
updateView();
addEventListener('resize', () => { resize(); updateView(); placeIntro(); });
requestAnimationFrame(loop);
requestAnimationFrame(() => { updateView(); placeIntro(); });
bg(introPlay(intro.tk));

// 后台加载 Three.js：成功则升级为 3D，超时或失败则保持已可运行的 2D 夜驿。
loadThree().then(ok => {
  if (!ok || renderer) return;
  init3D();
  if (renderer) { updateView(); placeIntro(); }
});

$('#start').addEventListener('click', () => {
  Sound.init(); Sound.pad();
  intro.tk.dead = true;
  $('#intro').classList.add('off');
  document.body.classList.add('started');
  W.glyph.glow = 1;
  begin();
});
$('#replay').addEventListener('click', () => {
  Sound.init();
  $('#intro').classList.add('off');
  document.body.classList.add('started');
  begin();
});
$('#mute').addEventListener('click', e => {
  Sound.init();
  Sound.setMuted(!Sound.muted);
  const btn = e.currentTarget;
  btn.setAttribute('aria-pressed', String(Sound.muted));
  const zh = Sound.muted ? '声音 关' : '声音 开';
  btn.textContent = window.haqiHanziUi ? window.haqiHanziUi(zh, btn) : zh;
});
$('#pause').addEventListener('click', e => {
  paused = !paused;
  const btn = e.currentTarget;
  btn.setAttribute('aria-pressed', String(paused));
  const zh = paused ? '继续' : '暂停';
  btn.textContent = window.haqiHanziUi ? window.haqiHanziUi(zh, btn) : zh;
  if (paused) { W.holding = false; ui.action.classList.remove('holding'); Sound.wind(false); }
  else if (window.__chuan.scene === 'sNight') Sound.wind(true);
  last = null;
});
addEventListener('blur', () => { W.holding = false; ui.action.classList.remove('holding'); });
document.addEventListener('visibilitychange', () => { visible = !document.hidden; last = null; });
addEventListener('pagehide', () => { stopAll(); intro.tk.dead = true; void Sound.ctx?.close().catch(() => {}); }, { once: true });

if (AUTO) {
  $('#intro').classList.add('off');
  document.body.classList.add('started');
  intro.tk.dead = true;
  begin();
}
</script>
</body>

<style>
:root{
  --night:#070a1c;--cream:#f5ead2;--gold:#f4b958;--ember:#e66b38;--muted:#9698ad;

html,body{margin:0;height:100%;overflow:hidden;background:var(--night)}
body{color:var(--cream);font-family:var(--serif);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--gold);outline-offset:4px}
#sampler{position:absolute;width:0;height:0;overflow:hidden}
#view{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

#brand{position:fixed;left:max(16px,env(safe-area-inset-left));top:max(14px,env(safe-area-inset-top));display:flex;align-items:center;gap:10px;

#progress{position:fixed;top:max(16px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;list-style:none;
  margin:0;padding:0;gap:clamp(8px,1.8vw,24px);z-index:10;opacity:0;transition:opacity .8s;pointer-events:none}
#progress::before{content:"";position:absolute;top:2.5px;left:12px;right:12px;height:1px;background:rgba(245,234,210,.16)}
body.started #progress{opacity:1}
#progress li{position:relative;font-family:var(--kai);font-size:13px;color:#72758a;letter-spacing:.08em;padding-top:12px;transition:color .6s;white-space:nowrap}
#progress li::before{content:"";position:absolute;top:0;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:#3a3e56;transition:background .6s,transform .6s,box-shadow .6s}
#progress li.done{color:#bdb298}#progress li.done::before{background:#bdb298}
#progress li.on{color:var(--cream)}#progress li.on::before{background:var(--gold);transform:scale(1.6);box-shadow:0 0 10px 2px rgba(244,185,88,.65)}

#controls{position:fixed;right:max(14px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));display:flex;gap:8px;z-index:12;opacity:0;pointer-events:none;transition:opacity .6s}
body.started #controls{opacity:1;pointer-events:auto}

  border:1px solid rgba(244,185,88,.38);border-radius:4px;padding:6px 8px 6px 12px;cursor:pointer;backdrop-filter:blur(4px)}
#controls button:hover{background:rgba(38,34,44,.85)}

#hint{position:fixed;left:16px;right:16px;margin:0 auto;width:fit-content;max-width:calc(100vw - 32px);box-sizing:border-box;
  top:max(60px,calc(env(safe-area-inset-top) + 46px));text-align:center;color:#ffdc9e;opacity:0;transition:opacity .45s;pointer-events:none;z-index:9;
  padding:7px 20px 8px;border:1px solid rgba(244,185,88,.48);border-radius:22px;background:rgba(10,14,30,.74);backdrop-filter:blur(4px)}
#hint span{font-family:var(--kai);font-size:clamp(16px,2.3vh,20px);letter-spacing:.12em}
#hint.on{opacity:1;animation:breathe 1.8s ease-in-out infinite}

#caption{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translate(-50%,10px);
  width:min(900px,calc(100vw - 24px));box-sizing:border-box;text-align:center;opacity:0;

#capTitle{margin:0 0 8px;font-weight:400;font-family:var(--kai);font-size:clamp(15px,2.2vh,19px);letter-spacing:.42em;margin-left:.42em;color:var(--gold)}

#capText{margin:0;font-family:var(--kai);font-size:clamp(19px,calc(1vw + 1.6vh),28px);line-height:1.7;color:var(--cream);letter-spacing:.06em;min-height:1.7em;
  text-shadow:0 1px 12px rgba(0,0,0,.68)}

.actions button{pointer-events:auto;cursor:pointer;font-family:var(--kai);letter-spacing:.24em;border-radius:4px}

[hidden]{display:none!important}

#intro{position:fixed;inset:0;z-index:20;pointer-events:none;transition:opacity 1s,transform 1s}
#intro.off{opacity:0;transform:scale(1.03)}

.introTop,.introBottom{position:absolute;left:0;right:0;display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 20px}
.introTop{bottom:calc(100% - var(--gTop,140px) + 18px)}
.introBottom{top:calc(var(--gBottom,560px) + 18px);gap:8px}
.tag{display:flex;align-items:center;gap:10px;font-family:var(--kai);font-size:clamp(15px,2.2vh,19px);letter-spacing:.3em;color:var(--gold)}
.tag i{display:block;width:clamp(24px,5vw,60px);height:1px;background:currentColor;opacity:.6}
.pinyin{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:clamp(30px,5.2vh,46px);line-height:1;color:var(--cream);letter-spacing:.06em}
.mean{font-family:var(--kai);font-size:clamp(17px,2.5vh,22px);letter-spacing:.2em;color:#e6d6b2}
.sub{font-family:var(--kai);font-size:clamp(15px,2.1vh,18px);color:#afa596;letter-spacing:.14em;margin:2px 0 0;line-height:1.7}
.btn-main{pointer-events:auto;margin-top:8px;font-family:var(--kai);font-size:clamp(18px,2.6vh,22px);letter-spacing:.4em;padding:10px 24px 10px 32px;
  color:#fff4dc;background:linear-gradient(#d27238,#a4421f);border:1px solid #eb9658;border-radius:4px;cursor:pointer;
  box-shadow:0 6px 22px rgba(220,110,40,.35);transition:transform .2s;animation:btnGlow 2.6s ease-in-out infinite}
.btn-main:hover{transform:translateY(-2px)}
@keyframes btnGlow{50%{box-shadow:0 6px 22px rgba(220,110,40,.35),0 0 0 9px rgba(244,160,74,.12),0 0 44px rgba(255,156,64,.32)}}
.meta{font-size:12px;color:#807b8c;letter-spacing:.14em;margin:0}
.rise{opacity:0;transform:translateY(12px);animation:rise 1s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:var(--d,0s)}
@keyframes rise{to{opacity:1;transform:none}}
@media (max-height:540px){.sub,.meta{display:none}.introBottom{gap:4px}}

#note{position:fixed;left:max(16px,env(safe-area-inset-left));bottom:max(12px,env(safe-area-inset-bottom));font-size:11px;color:#666274;letter-spacing:.12em;z-index:4;pointer-events:none}
body.portrait #brand{display:none}
body.portrait #controls{top:max(44px,calc(env(safe-area-inset-top) + 34px))}
body.portrait #hint{top:max(92px,calc(env(safe-area-inset-top) + 82px))}
body.portrait #note{display:none}
body.portrait #capText{font-size:clamp(18px,4.8vw,22px);line-height:1.62}
body.portrait #progress li{font-size:11px}
@media (max-height:540px){#capText{font-size:17px;line-height:1.5}#caption{padding:8px 14px 6px}.actions{margin-top:6px}}
@media (prefers-reduced-motion: reduce){
  #intro,#caption{transition-duration:.4s}
  #hint.on,.btn-main{animation:none}
  #capText .ch{animation-duration:.25s;animation-delay:0s}
}

<script>
// Haqi H5 protocol v1: independent pages remain usable without a parent.
(()=>{let context=null,written=false,finished=false,serial=0;const callbacks=new Map(),subCache=new Map(),uiCache=new Map(),pending=new Set(),uiNodes=new Map();
const isZh=loc=>!loc||/^zh\b/i.test(loc);
const send=data=>{if(context)parent.postMessage({channel:'haqi-hanzi',version:1,entryId:context.entryId,sessionId:context.sessionId,...data},context.origin);};
const refreshDom=()=>{for(const[el,zh]of uiNodes){if(!el?.isConnected){uiNodes.delete(el);continue;}const tr=!isZh(context?.locale)&&uiCache.get(zh);const next=(tr&&tr!==zh)?tr:zh;if(el.dataset.haqiKind==='seal'){const seal=el.querySelector('.seal');el.textContent=next;if(seal)el.prepend(seal);}else if(el.dataset.haqiKind==='tag'){const i1=document.createElement('i'),i2=document.createElement('i');el.replaceChildren(i1,document.createTextNode(next),i2);}else el.textContent=next;}document.querySelectorAll('[data-haqi-caption]').forEach(el=>renderCaption(el,el.dataset.haqiCaption));};
const flushPending=()=>{if(!context||!pending.size)return;const texts=[...pending];pending.clear();window.haqiHanziTranslate(texts);};
const ensureTexts=texts=>{const need=[];for(const t of texts){const s=typeof t==='string'?t.trim():'';if(s&&(!subCache.has(s)||!uiCache.has(s))&&!pending.has(s)){pending.add(s);need.push(s);}}if(need.length&&context)flushPending();};
const renderCaption=(el,zh)=>{if(!el)return;el.dataset.haqiCaption=zh||'';let sub=el.querySelector('.haqi-sub-trans');if(!zh||isZh(context?.subtitleLocale||context?.locale)){sub?.remove();return;}const tr=subCache.get(zh);if(!tr||tr===zh){sub?.remove();ensureTexts([zh]);return;}if(!sub){sub=document.createElement('span');sub.className='haqi-sub-trans';const host=el.querySelector('#capText')||el;if(host!==el&&host.parentNode===el)host.insertAdjacentElement('afterend',sub);else el.appendChild(sub);}sub.textContent=tr;};
const trackUi=(el,zh,kind='')=>{if(!el||!zh)return;if(kind)el.dataset.haqiKind=kind;uiNodes.set(el,zh);ensureTexts([zh]);};
const scanStatic=()=>{if(!document.body)return;document.querySelectorAll('#start,#replay,#mute,#demo,#action,#progress li,#seasonBar button,#note,.introBottom .mean,.introBottom .sub,.introBottom .meta,.heading .eyebrow,.heading h1,.heading .deck,.edition,.colophon,#glyphLabel,#targets .svg-label').forEach(el=>{const zh=(el.textContent||'').trim();if(zh&&!uiNodes.has(el))trackUi(el,zh);});document.querySelectorAll('#brand,.brand').forEach(el=>{if(uiNodes.has(el))return;const clone=el.cloneNode(true);clone.querySelector?.('.seal')?.remove();const zh=(clone.textContent||'').trim();if(zh)trackUi(el,zh,'seal');});document.querySelectorAll('.introTop .tag,.tag').forEach(el=>{if(uiNodes.has(el))return;const zh=(el.textContent||'').trim();if(zh)trackUi(el,zh,'tag');});refreshDom();};
if(document.readyState==='loading')addEventListener('DOMContentLoaded',scanStatic,{once:true});else scanStatic();
window.haqiHanziWritten=()=>{written=true;send({type:'written'});};
window.haqiHanziComplete=()=>{if(!written){written=true;send({type:'written'});}finished=true;send({type:'completed'});};
window.haqiHanziPrefetch=texts=>ensureTexts(Array.isArray(texts)?texts:[texts]);
window.haqiHanziUi=(zh,el)=>{const s=typeof zh==='string'?zh.trim():'';if(!s)return zh;if(el)trackUi(el,s);else ensureTexts([s]);const tr=!isZh(context?.locale)&&uiCache.get(s);return(tr&&tr!==s)?tr:zh;};
window.haqiHanziCaption=(el,zh)=>{const s=typeof zh==='string'?zh.trim():'';if(s)ensureTexts([s]);renderCaption(el,s);};
window.haqiHanziTranslate=texts=>new Promise(resolve=>{const list=(Array.isArray(texts)?texts:[]).map(t=>typeof t==='string'?t.trim():'').filter(Boolean);if(!context||!list.length){resolve({});return;}const requestId=String(++serial);const timer=setTimeout(()=>{callbacks.delete(requestId);resolve({});},1500);callbacks.set(requestId,msg=>{clearTimeout(timer);const sub=msg?.translations||{},ui=msg?.uiTranslations||sub;for(const[k,v]of Object.entries(sub))if(typeof v==='string'&&v.trim())subCache.set(k,v.trim());for(const[k,v]of Object.entries(ui))if(typeof v==='string'&&v.trim())uiCache.set(k,v.trim());refreshDom();resolve(sub);});send({type:'translate',requestId,texts:list});});
addEventListener('message',event=>{const m=event.data;if(event.source!==parent||parent===window||m?.channel!=='haqi-hanzi'||m.version!==1)return;
if(m.type==='init'&&typeof m.sessionId==='string'&&typeof m.entryId==='string'){if(document.referrer&&event.origin!==new URL(document.referrer).origin)return;context={...m,origin:event.origin};scanStatic();flushPending();refreshDom();if(written)send({type:'written'});if(finished)send({type:'completed'});}
else if(context&&event.origin===context.origin&&m.sessionId===context.sessionId&&m.type==='translations'){callbacks.get(m.requestId)?.(m);callbacks.delete(m.requestId);}});
if(parent!==window)parent.postMessage({channel:'haqi-hanzi',version:1,type:'ready'},'*');})();
</script>

<script>
(() => {
'use strict';

const $ = s => document.querySelector(s);
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const lerpRGB = (a, b, t) => [lerp(a[0], b[0], t) | 0, lerp(a[1], b[1], t) | 0, lerp(a[2], b[2], t) | 0];
const rgb = (c, a = 1) => a >= 0.999 ? `rgb(${c[0]},${c[1]},${c[2]})` : `rgba(${c[0]},${c[1]},${c[2]},${a.toFixed(3)})`;
const smooth = t => { t = clamp(t); return t * t * (3 - 2 * t); };
const bump = (s, c, w) => Math.exp(-(((s - c) / w) ** 2));
const ease = {
  inOut: t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2,
  out: t => 1 - Math.pow(1 - t, 3),
  sine: t => -(Math.cos(Math.PI * t) - 1) / 2,
  lin: t => t,
};
function mulberry32(a) {
  return () => {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const M = reduceMotion ? 0.6 : 1;
let rand = mulberry32(20261018);

/* ---------- 虚拟时钟：页面隐藏时暂停，回来不跳帧 ---------- */
class Cancelled extends Error {}
let clock = 0, DT = 16;
let waiters = [];
let token = { dead: true };
function frame(tk) { return new Promise((res, rej) => waiters.push({ tk, res, rej })); }
async function wait(ms, tk) { const t0 = clock; while (clock - t0 < ms) await frame(tk); }
async function tween(ms, fn, tk, ez = ease.inOut) {
  if (ms <= 0) { fn(1); return; }
  const t0 = clock;
  for (;;) {
    await frame(tk);
    const t = clamp((clock - t0) / ms);
    fn(ez(t));
    if (t >= 1) return;
  }
}
const bg = p => p.catch(e => { if (!(e instanceof Cancelled)) console.error(e); });

/* ---------- 声音：WebAudio 实时合成，不加载外部音频 ---------- */
const NOTE = { D3: 146.83, A3: 220, D4: 293.66, E4: 329.63, Fs4: 369.99, A4: 440, B4: 493.88, D5: 587.33, E5: 659.26, Fs5: 739.99, A5: 880 };
const PENTA = [NOTE.D4, NOTE.E4, NOTE.Fs4, NOTE.A4, NOTE.B4, NOTE.D5, NOTE.E5, NOTE.Fs5, NOTE.A5];
const Sound = {
  ctx: null, master: null, wet: null, noise: null, muted: false, padOn: false, breathG: null, padF: null, waveG: null,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try { this.ctx = new C(); } catch { return; }
    const c = this.ctx;
    this.master = c.createGain();
    this.master.gain.value = this.muted ? 0 : 0.6;
    this.master.connect(c.destination);
    const d = c.createDelay(1); d.delayTime.value = 0.31;
    const fb = c.createGain(); fb.gain.value = 0.36;
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2400;
    this.wet = c.createGain(); this.wet.gain.value = 0.32;
    this.wet.connect(d); d.connect(lp); lp.connect(fb); fb.connect(d); lp.connect(this.master);
    const len = c.sampleRate * 2;
    const buf = c.createBuffer(1, len, c.sampleRate);
    const data = buf.getChannelData(0);
    const r = mulberry32(11);
    for (let i = 0; i < len; i++) data[i] = r() * 2 - 1;
    this.noise = buf;
  },
  setMuted(m) {
    this.muted = m;
    if (this.master) this.master.gain.setTargetAtTime(m ? 0 : 0.6, this.ctx.currentTime, 0.05);
  },
  out(node, wet = true) { node.connect(this.master); if (wet) node.connect(this.wet); },
  pluck(f, vol = 0.16, dur = 2.6) {
    const c = this.ctx; if (!c) return;
    const t = c.currentTime;
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    const lp = c.createBiquadFilter(); lp.type = 'lowpass';
    lp.frequency.setValueAtTime(f * 6, t);
    lp.frequency.exponentialRampToValueAtTime(f * 1.35, t + dur * 0.6);
    lp.connect(g); this.out(g);
    for (const [m, type, a] of [[1, 'triangle', 1], [2.003, 'sine', 0.34], [3.01, 'sine', 0.1]]) {
      const o = c.createOscillator(); o.type = type;
      o.frequency.setValueAtTime(f * m * 1.012, t);
      o.frequency.exponentialRampToValueAtTime(f * m, t + 0.12);
      const og = c.createGain(); og.gain.value = a;
      o.connect(og); og.connect(lp); o.start(t); o.stop(t + dur + 0.05);
    }
  },
  bell(f, vol = 0.1, dur = 3.5) {
    const c = this.ctx; if (!c) return;
    const t = c.currentTime;
    for (const [m, a, dd] of [[1, 1, 1], [2.76, 0.35, 0.5], [5.4, 0.12, 0.25], [0.5, 0.2, 1.2]]) {
      const o = c.createOscillator(); o.type = 'sine'; o.frequency.value = f * m;
      const g = c.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol * a, t + 0.006);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur * dd);
      o.connect(g); this.out(g); o.start(t); o.stop(t + dur * dd + 0.05);
    }
  },
  hiss(dur, freq, vol, q = 0.8, wet = false) {
    const c = this.ctx; if (!c || !this.noise) return;
    const t = c.currentTime;
    const s = c.createBufferSource(); s.buffer = this.noise;
    const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = freq; bp.Q.value = q;
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + Math.min(0.06, dur * 0.3));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(bp); bp.connect(g); this.out(g, wet);
    s.start(t, rand() * 1.5); s.stop(t + dur + 0.05);
  },
  whoosh() {
    const c = this.ctx; if (!c || !this.noise) return;
    const t = c.currentTime;
    const s = c.createBufferSource(); s.buffer = this.noise;
    const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 0.9;
    bp.frequency.setValueAtTime(240, t); bp.frequency.exponentialRampToValueAtTime(1900, t + 0.55);
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.15, t + 0.14); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.15);
    s.connect(bp); bp.connect(g); this.out(g);
    s.start(t); s.stop(t + 1.25);
  },
  chirp(f0 = 880, f1 = 1320) {
    const c = this.ctx; if (!c) return;
    const t = c.currentTime;
    const o = c.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(f1, t + 0.11);
    o.frequency.exponentialRampToValueAtTime(f0 * 0.92, t + 0.24);
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.06, t + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.26);
    o.connect(g); this.out(g, true); o.start(t); o.stop(t + 0.28);
  },
  breath(on) {
    const c = this.ctx; if (!c || !this.noise) return;
    if (!this.breathG) {
      const s = c.createBufferSource(); s.buffer = this.noise; s.loop = true;
      const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 760; bp.Q.value = 0.7;
      this.breathG = c.createGain(); this.breathG.gain.value = 0;
      s.connect(bp); bp.connect(this.breathG); this.out(this.breathG, false); s.start();
    }
    this.breathG.gain.setTargetAtTime(on ? 0.065 : 0, c.currentTime, on ? 0.12 : 0.18);
  },
  pad() {
    const c = this.ctx; if (!c || this.padOn) return;
    this.padOn = true;
    const g = c.createGain(); g.gain.value = 0;
    g.gain.setTargetAtTime(0.042, c.currentTime, 2.5);
    this.padF = c.createBiquadFilter(); this.padF.type = 'lowpass'; this.padF.frequency.value = 360;
    const lfo = c.createOscillator(); lfo.frequency.value = 0.08;
    const lg = c.createGain(); lg.gain.value = 0.014;
    lfo.connect(lg); lg.connect(g.gain); lfo.start();
    for (const [f, type] of [[NOTE.D3 / 2, 'sine'], [NOTE.D3, 'triangle'], [NOTE.A3, 'sine'], [NOTE.D3 * 1.003, 'triangle']]) {
      const o = c.createOscillator(); o.type = type; o.frequency.value = f;
      o.connect(this.padF); o.start();
    }
    this.padF.connect(g); g.connect(this.master);
    // 轻柔海浪潮汐呼吸
    if (this.noise) {
      const ws = c.createBufferSource(); ws.buffer = this.noise; ws.loop = true;
      const wf = c.createBiquadFilter(); wf.type = 'lowpass'; wf.frequency.value = 280;
      this.waveG = c.createGain(); this.waveG.gain.value = 0.018;
      const wlfo = c.createOscillator(); wlfo.frequency.value = 0.14;
      const wlg = c.createGain(); wlg.gain.value = 0.01;
      wlfo.connect(wlg); wlg.connect(this.waveG.gain); wlfo.start();
      ws.connect(wf); wf.connect(this.waveG); this.waveG.connect(this.master); ws.start();
    }
  },
  warm(k) { if (this.padF) this.padF.frequency.setTargetAtTime(360 + 1200 * k, this.ctx.currentTime, 1.5); },
};

/* ---------- 画布与摄影机 ---------- */
const cvs = $('#view'), ctx = cvs.getContext('2d');
let SW = 1, SH = 1, DPR = 1, portrait = false;
const cam = { x: 1000, y: 420, w: 1600, h: 900, pw: 920, pcy: 0.44 };
const CV = { x: 0, y: 0, k: 1, cy: 0 };
const VIEW = {
  intro:   { x: 1000, y: 310, w: 1600, h: 900, pw: 920,  pcy: 0.40 },
  bay:     { x: 960,  y: 500, w: 1650, h: 880, pw: 980,  pcy: 0.50 },
  horizon: { x: 1120, y: 490, w: 1200, h: 720, pw: 740,  pcy: 0.48 },
  rise:    { x: 1100, y: 430, w: 1380, h: 820, pw: 820,  pcy: 0.47 },
  wide:    { x: 1020, y: 460, w: 1820, h: 940, pw: 1120, pcy: 0.52 },
  noon:    { x: 1040, y: 360, w: 1500, h: 860, pw: 880,  pcy: 0.46 },
  glyph:   { x: 1040, y: 310, w: 680,  h: 640, pw: 520,  pcy: 0.40 },
  finale:  { x: 1020, y: 450, w: 1760, h: 920, pw: 1060, pcy: 0.52 },
};
function frameW(v) { return portrait ? (v.pw ?? v.w * 0.62) : v.w; }
function updateView() {
  const usableH = SH * (portrait ? 0.62 : 0.78);
  CV.k = Math.min(SW / frameW(cam), usableH / cam.h);
  CV.cy = SH * (portrait ? cam.pcy : 0.46);
  let dx = 0, dy = 0;
  if (!reduceMotion && W.drift) { dx = Math.sin(clock * 0.00022) * 7 * W.drift; dy = Math.sin(clock * 0.00017 + 1) * 4 * W.drift; }
  CV.x = cam.x + dx; CV.y = cam.y + dy;
}
function setCam(c, px = 1) {
  const k = CV.k;
  c.setTransform(DPR * k, 0, 0, DPR * k, DPR * (SW / 2 - CV.x * px * k), DPR * (CV.cy - CV.y * k));
}
function resetTf(c = ctx) { c.setTransform(DPR, 0, 0, DPR, 0, 0); }
function toWorld(cx, cy) { return { x: (cx - SW / 2) / CV.k + CV.x, y: (cy - CV.cy) / CV.k + CV.y }; }
function toScreen(x, y) { return { x: (x - CV.x) * CV.k + SW / 2, y: (y - CV.y) * CV.k + CV.cy }; }
async function camTo(v, ms, tk, ez = ease.inOut) {
  const from = { x: cam.x, y: cam.y, w: cam.w, h: cam.h, pw: cam.pw ?? cam.w * 0.62, pcy: cam.pcy };
  const to = { x: v.x, y: v.y, w: v.w, h: v.h, pw: v.pw ?? v.w * 0.62, pcy: v.pcy ?? 0.48 };
  await tween(ms, t => { for (const k in to) cam[k] = lerp(from[k], to[k], t); }, tk, ez);
}
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  SW = innerWidth; SH = innerHeight;
  portrait = SW / SH < 0.85;
  document.body.classList.toggle('portrait', portrait);
  cvs.width = Math.round(SW * DPR);
  cvs.height = Math.round(SH * DPR);
}

/* ---------- 世界坐标与晨景要素 ---------- */
const SEA_Y = 555;
const SUN_X = 1140;
const CHILD_X = 720;

const BEACONS = [
  { id: 'birds',   x: 1370, y: 505, name: '礁石上的海鸥' },

  { id: 'flowers', x: 815,  y: 690, name: '岸边的向阳花' },
];
function sunPoint(u) {
  // u: 0 在海平线下半露 (y=572)，1 升至高空 (y=265)
  const t = clamp(u);
  return { x: SUN_X - Math.sin(t * Math.PI * 0.5) * 60, y: lerp(572, 265, t) };
}
function sunScreen() { const p = sunPoint(W.sun.rise); return toScreen(p.x, p.y); }
function beaconSpot(i) { return BEACONS[i]; }
function shoreY(x) {
  const s = smooth((1060 - x) / 680);
  return 745 - s * 135 + 8 * Math.sin(x * 0.008) + 4 * Math.cos(x * 0.019);
}

/* ---------- 天空、远岛、海浪与晨景绘制 ---------- */
function dawnK() { return clamp(W.dawn * 0.35 + W.sun.rise * 0.85); }
function drawSky() {
  resetTf();
  const k = dawnK(), noon = clamp((W.sun.rise - 0.55) / 0.45);
  const topCol = lerpRGB(lerpRGB([5, 8, 26], [34, 48, 96], k), [62, 114, 178], noon);
  const midCol = lerpRGB(lerpRGB([14, 20, 48], [148, 72, 68], k), [128, 172, 214], noon);
  const botCol = lerpRGB(lerpRGB([28, 34, 66], [244, 152, 76], k), [252, 224, 158], noon);
  const g = ctx.createLinearGradient(0, 0, 0, SH);
  g.addColorStop(0, rgb(topCol));
  g.addColorStop(0.46, rgb(midCol));
  g.addColorStop(0.78, rgb(botCol));
  g.addColorStop(1, rgb(lerpRGB([18, 24, 46], [255, 212, 132], k)));
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, SW, SH);

  // 东方海平线破晓霞光
  const sp = sunScreen();
  const glowA = clamp(0.18 + W.dawn * 0.35 + W.sun.rise * 0.5) * W.sun.alpha;
  if (glowA > 0.01) {
    const rad = Math.max(SW, SH) * (0.38 + 0.28 * W.sun.rise);
    const rg = ctx.createRadialGradient(sp.x, sp.y, 0, sp.x, sp.y, rad);
    rg.addColorStop(0, `rgba(255,236,175,${(glowA * 0.85).toFixed(3)})`);
    rg.addColorStop(0.32, `rgba(255,152,72,${(glowA * 0.48).toFixed(3)})`);
    rg.addColorStop(0.68, `rgba(218,82,58,${(glowA * 0.18).toFixed(3)})`);
    rg.addColorStop(1, 'rgba(180,60,50,0)');
    ctx.fillStyle = rg;
    ctx.fillRect(0, 0, SW, SH);
  }
}

function drawStars() {
  const starA = clamp(1 - W.sun.rise * 1.35 - W.dawn * 0.25) * W.stars;
  if (starA <= 0.015) return;
  const t = clock / 1000;
  const shift = -(CV.x * 0.02 * CV.k) % SW;
  resetTf();
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const s of STARS) {
    const a = (0.45 + 0.55 * Math.sin(t * s.f + s.p)) * starA;
    if (a <= 0.02) continue;
    const x = ((s.x * SW + shift) % SW + SW) % SW, y = s.y * SH;
    ctx.fillStyle = `rgba(235,240,255,${(a * 0.85).toFixed(3)})`;
    ctx.beginPath(); ctx.arc(x, y, s.s * 0.8, 0, 6.283); ctx.fill();
    if (s.glint) {
      ctx.strokeStyle = `rgba(220,230,255,${(a * 0.35).toFixed(3)})`; ctx.lineWidth = 0.7;
      ctx.beginPath(); ctx.moveTo(x - 6, y); ctx.lineTo(x + 6, y); ctx.moveTo(x, y - 6); ctx.lineTo(x, y + 6); ctx.stroke();
    }
  }
  ctx.restore();
}

function drawClouds() {
  setCam(ctx, 0.45);
  const k = dawnK(), t = clock / 1000;
  for (let i = 0; i < CLOUDS.length; i++) {
    const c = CLOUDS[i];
    const x = c.x + (reduceMotion ? 0 : Math.sin(t * 0.08 * c.spd + i) * 28);
    const y = c.y;
    const bodyCol = lerpRGB([22, 28, 54], [255, 198, 134], k);
    const rimCol = lerpRGB([40, 48, 82], [255, 240, 196], k);
    ctx.fillStyle = rgb(bodyCol, 0.35 + 0.3 * k);
    ctx.beginPath();
    ctx.ellipse(x, y, c.w * 0.5, c.h * 0.5, 0, 0, 6.283);
    ctx.ellipse(x - c.w * 0.24, y + 6, c.w * 0.32, c.h * 0.38, 0, 0, 6.283);
    ctx.ellipse(x + c.w * 0.26, y + 5, c.w * 0.34, c.h * 0.4, 0, 0, 6.283);
    ctx.fill();
    if (k > 0.1) {
      ctx.strokeStyle = rgb(rimCol, 0.4 * k);
      ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.arc(x, y + 2, c.w * 0.42, 0.15 * Math.PI, 0.85 * Math.PI);
      ctx.stroke();
    }
  }
}

function drawSunDisc() {
  if (W.sun.alpha <= 0.01) return;
  const p = sunPoint(W.sun.rise);
  const r = W.sun.r;
  setCam(ctx);
  ctx.save();
  ctx.globalAlpha = W.sun.alpha;
  // 海平面裁剪：太阳只画在海平线以上（以及散雾后微露的边缘）
  ctx.beginPath();
  ctx.rect(CV.x - SW / CV.k, -1000, SW * 2 / CV.k, SEA_Y + 1002);
  ctx.clip();

  // 外层日冕光晕
  ctx.globalCompositeOperation = 'lighter';
  const haloR = r * (2.6 + 0.8 * W.sun.rise);
  const hg = ctx.createRadialGradient(p.x, p.y, r * 0.2, p.x, p.y, haloR);
  hg.addColorStop(0, 'rgba(255,235,170,.65)');
  hg.addColorStop(0.35, 'rgba(255,156,68,.32)');
  hg.addColorStop(1, 'rgba(255,110,40,0)');
  ctx.fillStyle = hg;
  ctx.beginPath(); ctx.arc(p.x, p.y, haloR, 0, 6.283); ctx.fill();

  // 放射光芒（日出后展开）
  if (W.sun.rise > 0.25) {
    const rayA = smooth((W.sun.rise - 0.25) / 0.65) * 0.32;
    const t = clock / 1000;
    for (let i = 0; i < 12; i++) {
      const ang = i / 12 * 6.283 + (reduceMotion ? 0 : t * 0.06);
      const len = r * (2.2 + 0.5 * Math.sin(i * 2.3 + t));
      const rg = ctx.createLinearGradient(p.x, p.y, p.x + Math.cos(ang) * len, p.y + Math.sin(ang) * len);
      rg.addColorStop(0, `rgba(255,232,170,${rayA.toFixed(3)})`);
      rg.addColorStop(1, 'rgba(255,200,110,0)');
      ctx.fillStyle = rg;
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.arc(p.x, p.y, len, ang - 0.07, ang + 0.07);
      ctx.closePath();
      ctx.fill();
    }
  }

  // 太阳圆盘主体
  ctx.globalCompositeOperation = 'source-over';
  const dg = ctx.createRadialGradient(p.x - r * 0.18, p.y - r * 0.18, r * 0.08, p.x, p.y, r);
  const k = clamp(W.sun.rise);
  dg.addColorStop(0, '#fffdf2');
  dg.addColorStop(0.55, rgb(lerpRGB([255, 190, 108], [255, 232, 156], k)));
  dg.addColorStop(1, rgb(lerpRGB([232, 92, 46], [244, 168, 68], k)));
  ctx.fillStyle = dg;
  ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, 6.283); ctx.fill();

  // 日心充实之光（呼应古文字「日」中间一笔）
  if (W.sun.core > 0.01) {
    ctx.fillStyle = `rgba(255,252,235,${(0.75 * W.sun.core).toFixed(3)})`;
    ctx.beginPath();
    ctx.roundRect(p.x - r * 0.34, p.y - r * 0.07, r * 0.68, r * 0.14, r * 0.07);
    ctx.fill();
  }
  ctx.restore();
}

function drawIslands() {

function drawSea() {
  setCam(ctx);
  const left = CV.x - SW / 2 / CV.k - 200, right = CV.x + SW / 2 / CV.k + 200;
  const k = dawnK(), noon = clamp((W.sun.rise - 0.5) / 0.5);
  const seaTop = lerpRGB(lerpRGB([10, 16, 38], [92, 64, 78], k), [44, 108, 156], noon);
  const seaBot = lerpRGB(lerpRGB([6, 10, 24], [32, 44, 72], k), [22, 68, 112], noon);
  const sg = ctx.createLinearGradient(0, SEA_Y, 0, 920);
  sg.addColorStop(0, rgb(seaTop));
  sg.addColorStop(1, rgb(seaBot));
  ctx.fillStyle = sg;
  ctx.fillRect(left, SEA_Y, right - left, 450);

  // 海平线高光
  ctx.strokeStyle = `rgba(255,214,142,${(0.25 + 0.55 * k).toFixed(3)})`;
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(left, SEA_Y); ctx.lineTo(right, SEA_Y); ctx.stroke();

  // 海面日轮碎金倒影
  const p = sunPoint(W.sun.rise);
  const refA = clamp(0.2 + W.dawn * 0.3 + W.sun.rise * 0.7) * W.sun.alpha * (1 - W.mist * 0.75);
  if (refA > 0.02) {
    const t = clock / 1000;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 24; i++) {
      const u = i / 23;
      const wy = lerp(SEA_Y + 6, 780, u * u);
      const spread = lerp(36, 190, u) * (0.65 + 0.35 * W.sun.rise);
      const sway = reduceMotion ? 0 : Math.sin(t * 2.4 + i * 1.3) * (6 + u * 16);
      const alpha = refA * (1 - u * 0.65) * (0.65 + 0.35 * Math.sin(t * 3.1 + i * 2.1));
      ctx.fillStyle = `rgba(255,208,118,${alpha.toFixed(3)})`;
      ctx.beginPath();
      ctx.roundRect(p.x - spread / 2 + sway, wy, spread, 3 + u * 4.5, 2);
      ctx.fill();
    }
    ctx.restore();
  }

  // 海面轻波纹
  const t = clock / 1000;
  ctx.strokeStyle = `rgba(190,215,245,${(0.12 + 0.16 * k).toFixed(3)})`;
  ctx.lineWidth = 1.5;
  for (let i = 0; i < 18; i++) {
    const rx = 560 + (i * 97) % 1100;
    const ry = SEA_Y + 24 + (i * 43) % 210;
    const w = 28 + (i % 4) * 14;
    const dx = reduceMotion ? 0 : Math.sin(t * 1.1 + i) * 8;
    ctx.beginPath();
    ctx.moveTo(rx + dx - w, ry);
    ctx.quadraticCurveTo(rx + dx, ry - 3, rx + dx + w, ry);
    ctx.stroke();
  }
}

function drawBoat() {
  const b = BEACONS[1], sail = W.beacons[1].lit;
  const k = dawnK(), t = clock / 1000;
  const bob = reduceMotion ? 0 : Math.sin(t * 1.6) * 2.5;
  const x = b.x + sail * 42, y = b.y + bob;
  setCam(ctx);
  ctx.save();
  ctx.translate(x, y);
  // 船身
  const hullCol = rgb(lerpRGB([28, 24, 34], [116, 74, 44], k));
  ctx.fillStyle = hullCol;
  ctx.beginPath();
  ctx.moveTo(-48, 0); ctx.quadraticCurveTo(0, 18, 52, -2);
  ctx.lineTo(38, 12); ctx.quadraticCurveTo(0, 20, -38, 12);
  ctx.closePath(); ctx.fill();
  // 桅杆
  ctx.strokeStyle = rgb(lerpRGB([36, 30, 40], [138, 94, 56], k));
  ctx.lineWidth = 3.5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(4, 2); ctx.lineTo(4, -74); ctx.stroke();
  // 船帆（随唤醒升起饱风）
  const h = lerp(16, 62, sail), billow = lerp(4, 28, sail);
  const sailCol = rgb(lerpRGB([90, 96, 118], [255, 244, 218], clamp(k + sail * 0.4)));
  ctx.fillStyle = sailCol;
  ctx.beginPath();
  ctx.moveTo(6, -70);
  ctx.quadraticCurveTo(6 + billow, -70 + h * 0.45, 6 + billow * 0.75, -70 + h);
  ctx.lineTo(6, -68 + h);
  ctx.closePath(); ctx.fill();

function drawBirds() {
  const lit = W.beacons[0].lit;
  const b = BEACONS[0];
  const k = dawnK(), t = clock / 1000;
  setCam(ctx);
  ctx.save();
  // 未起飞前栖息在礁石上的海鸥剪影，起飞后翱翔于海天
  const col = rgb(lerpRGB([70, 78, 108], [255, 248, 232], clamp(k + lit * 0.5)));
  ctx.strokeStyle = col; ctx.fillStyle = col;
  ctx.lineWidth = 2.6; ctx.lineCap = 'round';
  const offsets = [[-18, -4, 0], [4, -10, 1.2], [22, -2, 2.4]];
  offsets.forEach(([ox, oy, ph], i) => {
    const fly = clamp((lit - i * 0.12) / 0.88);
    if (fly <= 0.02) {
      const px = b.x + ox, py = b.y + oy;
      ctx.beginPath(); ctx.arc(px, py, 4.2, 0, 6.283); ctx.fill();
      ctx.beginPath(); ctx.arc(px + 4, py - 4, 2.6, 0, 6.283); ctx.fill();
    } else {
      const fx = b.x + ox - fly * (160 + i * 55) + (reduceMotion ? 0 : Math.sin(t * 1.4 + ph) * 18);
      const fy = b.y + oy - fly * (150 + i * 28) + (reduceMotion ? 0 : Math.cos(t * 1.8 + ph) * 10);
      const flap = reduceMotion ? 0.4 : Math.sin(t * 6.5 + ph) * 0.7;
      const w = 15 - i * 1.5;
      ctx.beginPath();
      ctx.moveTo(fx - w, fy - w * 0.45 * flap);
      ctx.quadraticCurveTo(fx - w * 0.4, fy - w * 0.35, fx, fy);
      ctx.quadraticCurveTo(fx + w * 0.4, fy - w * 0.35, fx + w, fy - w * 0.45 * flap);
      ctx.stroke();
    }
  });

  for (const fb of W.freeBirds) {
    const age = (clock - fb.t0) / 1000;
    const fx = fb.x + fb.vx * age, fy = fb.y + fb.vy * age + Math.sin(age * 3 + fb.ph) * 8;
    const flap = reduceMotion ? 0.4 : Math.sin(age * 7 + fb.ph) * 0.7;
    const w = 14;
    ctx.strokeStyle = `rgba(255,248,228,${clamp(1 - age / 6).toFixed(3)})`;
    ctx.beginPath();
    ctx.moveTo(fx - w, fy - w * 0.45 * flap);
    ctx.quadraticCurveTo(fx - w * 0.4, fy - w * 0.35, fx, fy);
    ctx.quadraticCurveTo(fx + w * 0.4, fy - w * 0.35, fx + w, fy - w * 0.45 * flap);
    ctx.stroke();
  }
  ctx.restore();
}

function drawShoreAndDial() {

function drawChild() {
  const C = W.child;
  if (C.alpha <= 0.001) return;
  const x = CHILD_X, y = shoreY(CHILD_X) + 2;
  const k = dawnK();
  const cloth = rgb(lerpRGB([36, 46, 74], [64, 92, 136], k));
  const skin = rgb(lerpRGB([140, 110, 92], [224, 174, 136], k));
  const hair = '#181514';
  setCam(ctx);
  ctx.save();
  ctx.globalAlpha = C.alpha;
  const lift = C.lift, lean = C.lean;
  const sh = { x: x + lean * 12, y: y - 78 + lean * 6 };
  const head = { x: sh.x + 4 + lean * 5, y: sh.y - 18 };
  // 双腿站立在礁石台
  ctx.strokeStyle = '#242c44'; ctx.lineWidth = 11; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x - 6, y - 34); ctx.lineTo(x - 10, y); ctx.moveTo(x + 8, y - 34); ctx.lineTo(x + 12, y); ctx.stroke();
  // 身躯与迎风衣摆
  ctx.fillStyle = cloth;
  ctx.beginPath();
  ctx.moveTo(sh.x - 13, sh.y + 4);
  ctx.lineTo(x - 18, y - 28);
  ctx.lineTo(x + 20, y - 28);
  ctx.lineTo(sh.x + 13, sh.y + 4);
  ctx.closePath(); ctx.fill();
  // 头部与发髻
  ctx.fillStyle = skin;
  ctx.beginPath(); ctx.arc(head.x, head.y, 12.5, 0, 6.283); ctx.fill();
  ctx.fillStyle = hair;
  ctx.beginPath(); ctx.arc(head.x - 2, head.y - 2, 13, Math.PI * 0.52, Math.PI * 1.9); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.arc(head.x - 13, head.y - 6, 5.5, 0, 6.283); ctx.fill();
  // 手臂（随托日动作举起）
  const armAng = lerp(0.35, -0.85, lift);
  const hx = sh.x + Math.cos(armAng) * 44, hy = sh.y + Math.sin(armAng) * 44;
  ctx.strokeStyle = cloth; ctx.lineWidth = 9;
  ctx.beginPath(); ctx.moveTo(sh.x + 2, sh.y + 4); ctx.quadraticCurveTo(sh.x + 22, sh.y + 10 - lift * 18, hx, hy); ctx.stroke();
  ctx.fillStyle = skin;
  ctx.beginPath(); ctx.arc(hx, hy, 4.5, 0, 6.283); ctx.fill();

    ctx.strokeStyle = `rgba(255,216,138,${(0.6 * k).toFixed(3)})`;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(head.x + 2, head.y, 12.5, -0.8, 0.8); ctx.stroke();
  }
  ctx.restore();
}

function drawMist() {
  if (W.mist <= 0.01) return;
  setCam(ctx);
  const t = clock / 1000;
  const m = W.mist;
  ctx.save();
  for (let i = 0; i < MIST_BANKS.length; i++) {
    const b = MIST_BANKS[i];
    const part = (1 - m) * b.dir * 260;
    const sway = reduceMotion ? 0 : Math.sin(t * 0.5 + b.ph) * 22;
    const x = b.x + part + sway, y = b.y;
    const g = ctx.createRadialGradient(x, y, 10, x, y, b.w * 0.65);
    g.addColorStop(0, `rgba(68,82,114,${(0.76 * m).toFixed(3)})`);
    g.addColorStop(0.55, `rgba(50,62,92,${(0.45 * m).toFixed(3)})`);
    g.addColorStop(1, 'rgba(36,46,72,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.ellipse(x, y, b.w * 0.65, b.h * 0.7, 0, 0, 6.283);
    ctx.fill();
  }
  // 吹雾时的气流粒子
  for (const p of W.breath) {
    const u = p.life / p.max;
    ctx.fillStyle = `rgba(220,235,255,${(0.32 * Math.sin(Math.PI * u)).toFixed(3)})`;
    ctx.beginPath();
    ctx.arc(lerp(p.x, p.tx, u), lerp(p.y, p.ty, u) - Math.sin(Math.PI * u) * 10, 3 + u * 4, 0, 6.283);
    ctx.fill();
  }
  ctx.restore();
}

function drawInteractiveGuides() {
  setCam(ctx);
  // 托举红日引导圆环与虚线轨迹
  if (W.riseTarget > 0) {
    const p = sunPoint(W.sun.rise), top = sunPoint(1);
    const k = (clock % 1800) / 1800;
    ctx.save();
    ctx.strokeStyle = `rgba(255,214,132,${(0.82 * W.riseTarget).toFixed(3)})`;
    ctx.lineWidth = 2.2 / CV.k;
    ctx.setLineDash([5 / CV.k, 6 / CV.k]);
    ctx.beginPath(); ctx.arc(top.x, top.y, 44 + 5 * Math.sin(k * 6.283), 0, 6.283); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(p.x, p.y - 30); ctx.lineTo(top.x, top.y + 30); ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }
  // 三处晨景唤醒光环
  W.beacons.forEach((b, i) => {
    if (!b.ready || b.lit > 0) return;
    const spot = BEACONS[i];
    const k = (clock % 1600) / 1600;
    const minR = Math.max(36 / CV.k, 34);
    ctx.save();
    ctx.strokeStyle = `rgba(255,210,120,${(0.8 * (1 - k)).toFixed(3)})`;
    ctx.lineWidth = 2.2 / CV.k;
    ctx.beginPath(); ctx.arc(spot.x, spot.y, minR + k * 42, 0, 6.283); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,215,135,.55)';
    ctx.setLineDash([5 / CV.k, 6 / CV.k]);
    ctx.beginPath(); ctx.arc(spot.x, spot.y, minR, 0, 6.283); ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  });
  // 飞向晨景的阳光光束
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const s of W.sparks) {
    s.trail.forEach((q, j) => {
      const a = (j + 1) / s.trail.length;
      ctx.fillStyle = `rgba(255,210,115,${(a * 0.55).toFixed(3)})`;
      ctx.beginPath(); ctx.arc(q.x, q.y, 2.5 + a * 4.5, 0, 6.283); ctx.fill();
    });
    const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, 28);
    g.addColorStop(0, 'rgba(255,248,215,1)');
    g.addColorStop(0.35, 'rgba(255,185,80,.65)');
    g.addColorStop(1, 'rgba(255,130,40,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(s.x, s.y, 28, 0, 6.283); ctx.fill();
  }
  ctx.restore();
}

/* ---------- 字形：古文字（甲骨/金文）与楷书「日」四笔逐点对应 ---------- */
const NSVG = 'http://www.w3.org/2000/svg';
const samplerPath = document.createElementNS(NSVG, 'path');

  return pts;

const PROF = {

// 1. 竖  2. 横折  3. 横（中间短横）  4. 横（封口底横）
const MODERN = [
  { d: 'M30 16 L30 86', p: 'v', w: 5.0, name: '竖' },
  { d: 'M30 16 L70 14 L70 86', p: 'zhe', w: 5.2, name: '横折' },
  { d: 'M32 50 L64 48', p: 'h', w: 4.6, name: '横' },
  { d: 'M31 84 L69 83', p: 'h', w: 4.8, name: '横' },
];
// 古文字（金文/小篆圆廓日形，逐笔与楷书四笔方向一致）：
// 1. 左半圆弧  2. 上右半圆弧  3. 日心一横  4. 底部圆弧封合
const ORACLE = [
  'M36 18 C16 34 16 66 36 82',
  'M36 18 C58 10 82 28 80 54 C79 70 72 78 64 82',
  'M39 50 Q50 47 61 50',
  'M36 82 Q50 88 64 82',
];
const OPTS = ORACLE.map(resample), MPTS = MODERN.map(s => resample(s.d));
const GL = { cx: 1000, cy: 255, s: 3.0 };
function strokePts(i) {
  const m = W.glyph.morph, a = OPTS[i], b = MPTS[i];
  if (m <= 0) return a; if (m >= 1) return b;
  const e = ease.inOut(m);
  return a.map((p, j) => [lerp(p[0], b[j][0], e), lerp(p[1], b[j][1], e)]);
}
function strokeW(i, s) {

  if (P.length < 2) return;

    const a = P[Math.max(0, j - 1)], b = P[Math.min(P.length - 1, j + 1)];
    let tx = b[0] - a[0], ty = b[1] - a[1]; const l = Math.hypot(tx, ty) || 1; tx /= l; ty /= l;
    const s = Math.min(1, (j / (P.length - 1)) * (m / n));

function drawGlyph() {
  const g = W.glyph;

  ctx.save();
  if (g.rays > 0) {
    setCam(ctx);
    ctx.globalCompositeOperation = 'lighter';
    const t = clock / 1000, R = GL.s * 120;
    for (let i = 0; i < 16; i++) {

      const gr = ctx.createRadialGradient(GL.cx, GL.cy, GL.s * 18, GL.cx, GL.cy, R);
      gr.addColorStop(0, `rgba(255,196,105,${(0.085 * g.rays * g.alpha).toFixed(3)})`);
      gr.addColorStop(1, 'rgba(255,160,80,0)');
      ctx.fillStyle = gr;
      ctx.beginPath(); ctx.moveTo(GL.cx, GL.cy); ctx.arc(GL.cx, GL.cy, R, a - w, a + w); ctx.closePath(); ctx.fill();

  ctx.shadowBlur = g.glow * 24 * DPR * Math.min(1.4, CV.k * 1.5);

    if (g.prog[i] <= 0) continue;
    if (g.split > 0) {
      ctx.fillStyle = i === 2
        ? `rgb(255,${lerp(col[1], 162, g.split) | 0},${lerp(col[2], 78, g.split) | 0})`

    }

  }
  ctx.shadowBlur = 0;

    ctx.globalAlpha = g.alpha * g.labels;
    ctx.strokeStyle = 'rgba(255,208,136,.78)'; ctx.lineWidth = 0.55;
    ctx.beginPath();
    ctx.moveTo(78, 16); ctx.lineTo(86, 16); ctx.lineTo(86, 84); ctx.lineTo(78, 84);
    ctx.moveTo(68, 49); ctx.lineTo(86, 49);
    ctx.stroke();
    ctx.font = '9.5px "Kaiti SC","STKaiti","KaiTi",serif'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fff0d0'; ctx.fillText('日轮', 90, 26);
    ctx.fillStyle = '#ffae5c'; ctx.fillText('日心', 90, 49);

  if (g.trace) drawTraceUI(ctx);
  ctx.restore();
  if (g.words > 0) drawWords();
}

function drawTraceUI(c) {

function drawWords() {

function drawConverge() {
  if (!W.converge.length) return;
  setCam(ctx);
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const p of W.converge) {
    const t = clamp((clock - p.t0 - p.delay) / p.dur);
    if (t <= 0 || t >= 1) continue;
    const e = ease.inOut(t);
    const x = lerp(p.sx, p.tx, e) + Math.sin(e * Math.PI) * p.curl;
    const y = lerp(p.sy, p.ty, e) - Math.sin(e * Math.PI) * 36;
    const a = Math.sin(Math.PI * t);
    ctx.fillStyle = `rgba(255,${(185 + 55 * e) | 0},${(95 + 85 * e) | 0},${(a * 0.9).toFixed(3)})`;
    ctx.beginPath(); ctx.arc(x, y, p.s * (1.2 - e * 0.45), 0, 6.283); ctx.fill();
  }
  ctx.restore();
}

function drawVeil() {

  g.addColorStop(1, `rgba(5,7,18,${W.veil})`);

/* ---------- 粒子与主循环 ---------- */
function updateParticles() {
  if (W.blowing && rand() < 32 * (DT / 1000)) {
    const sx = CHILD_X + 18, sy = shoreY(CHILD_X) - 88;
    W.breath.push({ x: sx, y: sy, tx: SUN_X - 120 + rand() * 260, ty: SEA_Y - 120 + rand() * 110, life: 0, max: 650 + rand() * 350 });
  }
  for (const p of W.breath) p.life += DT;
  W.breath = W.breath.filter(p => p.life < p.max);
  W.ripples = W.ripples.filter(rp => clock - rp.t0 < 1400);
  W.freeBirds = W.freeBirds.filter(fb => clock - fb.t0 < 6200);
  for (const s of W.sparks) {
    const t = ease.inOut(clamp((clock - s.t0) / s.ms));
    const cx = (s.from.x + s.to.x) / 2, cy = Math.min(s.from.y, s.to.y) - 140;
    s.x = (1 - t) * (1 - t) * s.from.x + 2 * t * (1 - t) * cx + t * t * s.to.x;
    s.y = (1 - t) * (1 - t) * s.from.y + 2 * t * (1 - t) * cy + t * t * s.to.y;
    s.trail.push({ x: s.x, y: s.y });
    if (s.trail.length > 14) s.trail.shift();
  }
}

let last = null;
function loop(now) {
  if (last == null) last = now;
  DT = Math.min(50, Math.max(0, now - last));
  last = now;
  clock += DT;
  updateParticles();
  render();
  const list = waiters; waiters = [];
  for (const wt of list) { if (wt.tk.dead) wt.rej(new Cancelled()); else wt.res(clock); }
  requestAnimationFrame(loop);
}

const CHAR_MS = 70;

/* ---------- 指针与键盘输入 ---------- */
const S = { handler: null, mode: null, interactions: [] };
let activePointer = null;
cvs.addEventListener('pointerdown', e => {
  if (!e.isPrimary || activePointer != null) return;
  const h = S.handler; if (!h || !h.down) return;
  activePointer = e.pointerId;
  try { cvs.setPointerCapture(e.pointerId); } catch {}
  e.preventDefault();
  h.down(toWorld(e.clientX, e.clientY), e);
});
cvs.addEventListener('pointermove', e => {
  if (e.pointerId !== activePointer) return;
  const h = S.handler; if (!h || !h.move) return;
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
  for (const ev of evs.length ? evs : [e]) h.move(toWorld(ev.clientX, ev.clientY), ev);
});
function pointerEnd(e, cancel) {
  if (e.pointerId !== activePointer) return;
  activePointer = null;
  const h = S.handler;
  if (h && h.up) h.up(toWorld(e.clientX, e.clientY), cancel);
}
cvs.addEventListener('pointerup', e => pointerEnd(e, false));
cvs.addEventListener('pointercancel', e => pointerEnd(e, true));
cvs.addEventListener('lostpointercapture', e => pointerEnd(e, true));
function holdButton(on) { if (S.mode !== 'hold') return; W.holding = on; ui.action.classList.toggle('holding', on); if (on) W.everHeld = true; }
ui.action.addEventListener('pointerdown', e => { if (S.mode === 'hold') { e.preventDefault(); try { ui.action.setPointerCapture(e.pointerId); } catch {} holdButton(true); } });
for (const ev of ['pointerup', 'pointercancel', 'lostpointercapture']) ui.action.addEventListener(ev, () => holdButton(false));
ui.action.addEventListener('keydown', e => { if (S.mode === 'hold' && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); holdButton(true); } });
ui.action.addEventListener('keyup', e => { if (S.mode === 'hold' && (e.key === ' ' || e.key === 'Enter')) holdButton(false); });
ui.action.addEventListener('click', () => { if (S.mode !== 'hold' && actionFn) actionFn(); });
ui.demo.addEventListener('click', () => { if (S.demo) S.demo(); });

  showStroke();
  let samples = null, drag = null, lastInput = clock, demoing = false, completed = 0, invalidHint = 0;
  const prepare = () => { samples = MPTS[W.trace.stroke]; };
  prepare();
  const finishStroke = () => {
    const i = W.trace.stroke;
    W.glyph.prog[i] = 1;
    Sound.pluck(PENTA[i + 1], 0.14, 2);
    W.trace.stroke++;
    completed++;
    if (W.trace.stroke < 4) { prepare(); showStroke(); }
  };
  const tolLocal = () => Math.max(20, 48 / (CV.k * GL.s));
  S.handler = {
    down(p) {
      if (demoing) return;
      lastInput = clock;
      const q = toLocal(p.x, p.y), lastIdx = samples.length - 1, t = tolLocal();
      const earlyMax = Math.max(1, Math.floor(lastIdx * 0.35));
      let startIdx = 0, dStart = Infinity;
      for (let j = 0; j <= earlyMax; j++) {
        const d = Math.hypot(q.x - samples[j][0], q.y - samples[j][1]);
        if (d < dStart) { dStart = d; startIdx = j; }
      }
      const dEnd = Math.hypot(q.x - samples[lastIdx][0], q.y - samples[lastIdx][1]);
      if (dStart > t * 1.75 || dStart > dEnd * 1.15) { hint('从这一笔的橙色光点开始哦'); return; }
      drag = { idx: startIdx, fIdx: startIdx, lastQ: q };
      W.glyph.prog[W.trace.stroke] = drag.idx / N;
      Sound.breath(true);
    },
    move(p) {
      if (!drag) return;
      lastInput = clock;
      const q = toLocal(p.x, p.y), lastIdx = samples.length - 1, t = tolLocal();
      const dx = q.x - drag.lastQ.x, dy = q.y - drag.lastQ.y, stepDist = Math.hypot(dx, dy);
      if (stepDist < 0.001) return;
      const subSteps = Math.max(1, Math.min(10, Math.ceil(stepDist / (t * 0.25))));
      const win = Math.max(24, Math.ceil(lastIdx * 0.55));
      for (let s = 1; s <= subSteps; s++) {
        const pqx = drag.lastQ.x + (dx * s) / subSteps, pqy = drag.lastQ.y + (dy * s) / subSteps;
        let best = drag.idx, bd = Infinity;
        const hi = Math.min(lastIdx, drag.idx + win);
        for (let j = Math.max(0, drag.idx - 2); j <= hi; j++) {
          const d = Math.hypot(pqx - samples[j][0], pqy - samples[j][1]);
          if (d < bd) { bd = d; best = j; }
        }
        if (bd <= t && best > drag.idx) {
          const aIdx = Math.max(0, best - 3), bIdx = Math.min(lastIdx, Math.max(aIdx + 1, best + 4));
          const tx = samples[bIdx][0] - samples[aIdx][0], ty = samples[bIdx][1] - samples[aIdx][1];
          const tLen = Math.hypot(tx, ty) || 1;
          if ((dx * tx + dy * ty) / (stepDist * tLen) >= -0.25) {
            drag.idx = best;
            drag.fIdx = Math.max(drag.fIdx, best);
          }
        }
      }
      if (drag.idx < lastIdx) {
        const segs = [
          [drag.idx, Math.min(lastIdx, drag.idx + Math.max(8, Math.ceil(lastIdx * 0.25)))],
          [Math.min(lastIdx - 1, drag.idx + Math.ceil(lastIdx * 0.2)), Math.min(lastIdx, drag.idx + Math.ceil(lastIdx * 0.55))],
          [drag.idx, lastIdx]
        ];
        for (const [s0, s1] of segs) {
          if (s1 <= s0 || Math.hypot(q.x - samples[s0][0], q.y - samples[s0][1]) > t * 2.6) continue;
          const fx = samples[s1][0] - samples[s0][0], fy = samples[s1][1] - samples[s0][1], fLen = Math.hypot(fx, fy) || 1;
          const proj = (dx * fx + dy * fy) / fLen;
          if (proj > 0 && proj >= stepDist * 0.32) {
            drag.fIdx = Math.min(lastIdx, Math.max(drag.fIdx, drag.idx) + (proj / fLen) * (s1 - s0));
            drag.idx = Math.max(drag.idx, Math.min(lastIdx, Math.round(drag.fIdx)));
            break;
          }
        }
      }
      drag.lastQ = q;
      W.glyph.prog[W.trace.stroke] = drag.idx / N;
    },
    up(p, cancel) {
      Sound.breath(false);
      if (!drag) return;
      const d = drag; drag = null;
      if (!cancel && d.idx >= Math.ceil(N * 0.56)) { finishStroke(); return; }
      const i = W.trace.stroke, from = W.glyph.prog[i];
      bg(tween(260, t => { if (W.trace.stroke === i) W.glyph.prog[i] = from * (1 - t); }, tk));
      if (clock - invalidHint > 400) { hint('顺着笔画走势写到箭头方向就可以啦'); invalidHint = clock; }
    },
  };
  const demo = async () => {
    if (demoing || W.trace.stroke >= 4) return;
    demoing = true; ui.demo.disabled = true; drag = null;
    hint('看光点走过每一笔，你也可以跟着比画');
    while (W.trace.stroke < 4) {
      const i = W.trace.stroke;
      W.glyph.prog[i] = 0;
      await tween(900 * M, t => { W.glyph.prog[i] = t; const pts = MPTS[i]; W.trace.pen = pts[Math.round(t * N)]; }, tk, ease.sine);
      W.trace.pen = null;
      finishStroke();
      await wait(260, tk);
    }
  };
  S.demo = () => { S.interactions.push('demo'); bg(demo()); };
  mode('trace');
  ui.demo.hidden = false;
  lastInput = clock;
  let nudged = false;
  while (W.trace.stroke < 4) {
    await frame(tk);
    if (!demoing && !nudged && clock - lastInput > 14000) { hint('写不出来也没关系，点“看示范”'); nudged = true; }
    if (!demoing && completed === 0 && clock - lastInput > 26000) { S.interactions.push('auto'); bg(demo()); }
  }
  S.handler = null; S.demo = null; mode(null); hint(null);
  ui.demo.hidden = true; ui.demo.disabled = false;
  W.glyph.trace = false;
  if (!S.interactions.includes('demo') && !S.interactions.includes('auto')) S.interactions.push('user');
  window.haqiHanziWritten?.();
  await tween(600, t => { W.glyph.ghost = 1 - t; }, tk);
  Sound.bell(NOTE.D5, 0.11); Sound.bell(NOTE.A5, 0.07);
  await caption('写字', '写好了！日，红日东升的日。', tk);
  await captionDone(tk);
  W.drift = 1;
}

async function sWords(tk) {
  progress(6);
  const g0 = { ...GL };
  await tween(1500 * M, t => { GL.cy = lerp(g0.cy, 250, t); GL.s = lerp(g0.s, 2.9, t); W.glyph.rays = t; }, tk);
  for (let i = 0; i < 3; i++) {
    W.wordOn = i;
    Sound.pluck(PENTA[3 + i], 0.13);
    bg(tween(600, t => { W.glyph.words = Math.max(W.glyph.words, i + t); }, tk, ease.out));
    await caption(WORDS[i][0], WORDS[i][1], tk);
  }
  await captionDone(tk);
  W.wordOn = -1;
}

async function sFinale(tk) {
  progress(6);
  bg(camTo(VIEW.finale, 3800 * M, tk));
  await tween(2000 * M, t => {
    W.glyph.alpha = 1 - t;
    W.veil = 0.88 * (1 - t);
    W.sun.alpha = t;
    W.child.alpha = t;
  }, tk);
  W.glyph = { ...W.glyph, alpha: 0, words: 0, rays: 0 };
  Sound.warm(1);
  await caption('尾声', '每一天清晨，太阳都会准时升起。', tk);
  await caption('尾声', '带着温暖的日光，照亮我们走过的每一个日子。', tk, 700);
  await captionDone(tk);
  const spawnJoy = (x, y) => {
    W.ripples.push({ x, y, t0: clock });
    W.freeBirds.push({ x, y, vx: -55 - rand() * 35, vy: -28 - rand() * 20, ph: rand() * 6, t0: clock });
    Sound.pluck(PENTA[(rand() * PENTA.length) | 0], 0.1, 2.4);
    Sound.chirp(960 + rand() * 240, 1440 + rand() * 260);
  };
  hint('点一点天空或海面，唤起晨光与飞鸟');
  mode('sky');
  setAction('再看一次', () => { Sound.init(); begin(); });
  S.handler = { down(p) { spawnJoy(p.x, p.y); hint(null); } };
  window.__ri.finished = true;
  window.haqiHanziComplete();
}

const SCENES = [sDawn, sMist, sRise, sShine, sNoon, sGlyph, sWrite, sWords, sFinale];

async function begin() {
  token.dead = true;
  const tk = token = { dead: false };
  capMinEnd = 0;
  waiters.forEach(w => w.rej(new Cancelled())); waiters = [];
  resetWorld();
  Object.assign(cam, VIEW.intro);
  S.handler = null; S.demo = null; mode(null); setAction(null); hint(null);
  ui.demo.hidden = true; ui.demo.disabled = false;
  ui.cap.classList.remove('on');
  Sound.breath(false);
  rand = mulberry32(20261018);
  S.interactions = [];
  window.__ri = { interactions: S.interactions, scene: null, finished: false, toScreen, localToScreen, strokes: MPTS, sunPoint, sunScreen, beaconSpot, state: W };
  W.glyph.alpha = 1; W.glyph.prog = [1, 1, 1, 1]; W.glyph.morph = 1;
  try {
    for (const sc of SCENES) { window.__ri.scene = sc.name; await sc(tk); }
  } catch (e) {
    if (!(e instanceof Cancelled)) console.error(e);
  }
}

/* ---------- 片头：夜海星空里写出「日」 ---------- */
const intro = { tk: { dead: false } };
function placeIntro() {
  if (intro.tk.dead) return;
  const a = localToScreen(50, 8), b = localToScreen(50, 92);
  const box = $('#intro');
  box.style.setProperty('--gTop', `${a.y}px`);
  box.style.setProperty('--gBottom', `${b.y}px`);
}
async function introPlay(tk) {
  W.glyph.alpha = 1; W.glyph.morph = 1; W.glyph.prog = [0, 0, 0, 0];
  await wait(650, tk);
  for (let i = 0; i < 4; i++) {
    await tween(420 + MODERN[i].d.length * 10, t => { W.glyph.prog[i] = t; }, tk, ease.sine);
    await wait(100, tk);
  }
  for (;;) {
    await frame(tk);
    W.glyph.glow = 1 + 0.25 * Math.sin(clock / 700);
  }
}

resetWorld();
Object.assign(cam, VIEW.intro);
window.__ri = { interactions: [], scene: 'intro', finished: false, toScreen, localToScreen, strokes: MPTS, sunPoint, sunScreen, beaconSpot, state: W };
resize();
updateView();
addEventListener('resize', () => { resize(); updateView(); placeIntro(); });
requestAnimationFrame(loop);
requestAnimationFrame(() => { updateView(); placeIntro(); });
bg(introPlay(intro.tk));

$('#start').addEventListener('click', () => {
  Sound.init(); Sound.pad();
  intro.tk.dead = true;
  $('#intro').classList.add('off');
  document.body.classList.add('started');
  W.glyph.glow = 1;
  begin();
});
$('#replay').addEventListener('click', () => { Sound.init(); begin(); });
$('#mute').addEventListener('click', e => {
  Sound.setMuted(!Sound.muted);
  const zh = Sound.muted ? '声音 关' : '声音 开';
  e.currentTarget.textContent = window.haqiHanziUi ? window.haqiHanziUi(zh, e.currentTarget) : zh;
});
addEventListener('blur', () => { W.holding = false; ui.action.classList.remove('holding'); });
})();
</script>

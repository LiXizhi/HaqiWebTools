<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>岛屿场景预览</title><base href="../../"><link rel="stylesheet" href="css/adventure.css"><link rel="stylesheet" href="css/adventure_storybook.css"><link rel="stylesheet" href="css/adventure_world_map.css"><link rel="stylesheet" href="tests/fixtures/exploration.css"></head>
<body class="haqi-app">
<header id="preview-tools">
<strong>场景预览</strong>
<label>岛屿<select id="scene-select" disabled></select></label>
<label>区域<select id="region-select" disabled></select></label>
<label>天气<select id="weather-select"><option value="auto">跟随地域</option><option value="none">晴朗</option><option value="snow">降雪</option><option value="sand">沙尘</option><option value="embers">余烬</option><option value="mist">薄雾</option><option value="ash">灰烬</option><option value="motes">萤光</option></select></label>
<button id="zoom-out" aria-label="缩小">−</button><button id="zoom-in" aria-label="放大">＋</button>
<button id="arrival">返回入口</button><button id="preview-map">世界地图</button>
<label class="check"><input id="show-hud" type="checkbox">游戏界面</label>
<label class="check"><input id="pause-weather" type="checkbox">暂停天气</label>
<p id="preview-status" role="status">正在加载场景。测试角色不读写存档。</p>
</header>
<main id="game"><canvas id="world" tabindex="0" aria-label="岛屿场景，点击地面或使用方向键行走"></canvas><div id="hud" hidden></div><div id="overlay"></div><div id="toast" role="status"></div></main>
<script type="module" src="tests/fixtures/exploration.js"></script></body></html>

<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><base href="../../"><meta name="viewport" content="width=device-width,initial-scale=1"><title>标题页角色列表预览</title><link rel="stylesheet" href="css/adventure.css"><link rel="stylesheet" href="css/adventure_storybook.css"><style>html,body{margin:0;height:100%;background:#244b42}#entry{position:relative;height:100%}</style></head><body class="haqi-app"><div id="entry"></div><script type="module">
import {loadResources} from '../../js/adventure_assets.js';
import {renderRoles} from '../../js/view_adventure_roles.js';
import {loadLocaleFiles,configureLocale} from '../../js/locale.js';
const params=new URLSearchParams(location.search);
try{
 const assets=await loadResources();
 const locale=params.get('lang')||'zh-CN';
 if(locale!=='zh-CN')await loadLocaleFiles([locale]);
 configureLocale({locale});
 const roles=[
  {id:'a',save:{name:'小星',level:12,school:'fire',appearance:'girl'}},
  {id:'b',save:{name:'阿青',level:8,school:'life',appearance:'boy'}},
  {id:'c',save:{name:'远行者',level:20,school:'storm',appearance:'boy'}},
  {id:'d',save:{name:'小虎队',level:50,school:'ice',appearance:'boy'}},
  {id:'e',save:{name:'deluca',level:50,school:'fire',appearance:'boy'}},
 ];
 const root=document.querySelector('#entry');
 renderRoles(root,assets,{owner:'',catalog:{roles,activeId:'e'},dirty:false,locale,busy:'',error:'',message:''},{
  secondLocale:locale==='en'?'zh-CN':'en',setLocale(){},setSecondLocale(){},select(){},create(){},login(){},
 });
 await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
 document.documentElement.dataset.fixtureReady='1';
}catch(error){document.documentElement.dataset.fixtureError=error.message;}
</script></body></html>

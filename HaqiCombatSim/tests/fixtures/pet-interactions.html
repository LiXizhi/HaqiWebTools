<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>宠物互动与繁育 · 隔离验收</title>
<style>
*{box-sizing:border-box}body{--pet-size:96px;margin:0;background:#f5ecd8;color:#423828;font:16px/1.6 system-ui,sans-serif}main{max-width:960px;margin:auto;padding:24px}h1{font-size:24px;margin:0 0 6px}p{margin:8px 0}button{font:inherit;border:1px solid #9c8250;border-radius:8px;background:#fff9e8;color:inherit;padding:8px 14px;min-height:48px;cursor:pointer}button:hover{background:#e9e0bc}button:disabled{opacity:.5;cursor:wait}button:focus-visible{outline:3px solid #346750;outline-offset:2px}.primary{background:#28553f;color:#fff}.primary:hover{background:#1d4430}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.scene{position:relative;min-height:340px;border:1px solid #bea675;border-radius:18px;background:linear-gradient(#dfecd1,#bad09f);overflow:hidden}.pets{display:flex;justify-content:space-around;align-items:center;padding:30px 8px;gap:8px}.pet{text-align:center;min-width:88px;flex:1}.sprite{width:var(--pet-size);height:var(--pet-size);background-size:400% 400%;margin:auto;image-rendering:auto;position:relative}.label{font-size:14px}.marks{display:flex;justify-content:center;gap:4px;margin:8px}.marks span{height:8px;width:22px;border-radius:4px;background:#fff8d9}.marks .filled{background:#d26080}.heart{position:absolute;top:5px;left:62px;width:15px;height:15px;background:#dc7398;transform:rotate(-45deg);animation:pulse 1s infinite}.heart:before,.heart:after{content:'';position:absolute;width:15px;height:15px;background:inherit;border-radius:50%}.heart:before{top:-8px;left:0}.heart:after{left:8px;top:0}.playing .sprite{animation:dance 1s infinite}.bubble{display:block;min-height:30px;font-size:14px}.baby{display:inline-flex;flex-direction:column;align-items:center;background:#fff9dc;margin:8px}.baby .sprite{width:calc(var(--pet-size)*var(--pet-scale,.5));height:calc(var(--pet-size)*var(--pet-scale,.5))}.babies{padding:12px;text-align:center;min-height:70px}.panel{background:#fffaf0;border:1px solid #d8c8a4;border-radius:12px;padding:16px;margin-top:16px}#status{display:block;min-height:2em;color:#28553f}#status.error{color:#9b2d20}.small{font-size:13px;color:#6c6555}#bag{display:flex;gap:8px;flex-wrap:wrap}#bag .baby{min-width:100px}progress{max-width:100%}@keyframes pulse{50%{transform:translateY(-8px) rotate(-45deg) scale(1.15)}}@keyframes dance{50%{transform:translateY(-7px) rotate(5deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}@media(max-width:420px){main{padding:12px}.pets{gap:0}body{--pet-size:80px}h1{font-size:21px}.toolbar button{flex:1 1 44%;font-size:14px}.label{font-size:12px}}
.pet:not(.playing) .marks{visibility:hidden}
</style></head><body><main>
<h1>宠物互动与繁育</h1><p>隔离验收：使用独立测试数据库，不读写游戏角色或云端账号。</p>
<p id="clock" class="small"></p>
<div class="toolbar"><button id="play">普通靠近玩耍</button><button id="talk" class="primary">主角与NPC交谈</button><button id="feed">演示分享口粮</button><button id="next">推进一天</button><button id="restore">重新加载当前场景</button><button id="concurrency">验证存储竞争</button></div>
<div class="scene"><div id="pets" class="pets"></div><div id="babies" class="babies"></div></div>
<div class="panel"><strong>战宠背包 · 独立个体</strong><div id="bag"></div></div>
<div class="panel"><output id="status" aria-live="polite">正在加载宠物目录…</output><p class="small">三枚印记不要求连续；当天重复互动不增加。宝宝点击领养，父母各冷却72小时。这里的时间推进和投喂演示仅用于验收，尚未连接正式游戏口粮账本。</p><div id="io" class="small"></div></div>
</main><script type="module" src="./pet-interactions.mjs"></script></body></html>

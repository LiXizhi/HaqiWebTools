<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../../"><title>导师实操验收</title><link rel="stylesheet" href="css/adventure.css"><link rel="stylesheet" href="css/adventure_storybook.css"><link rel="stylesheet" href="css/adventure_dialogue.css"><style>body{background:#42614b}nav{position:fixed;z-index:1000;top:0;left:0;right:0;display:flex;gap:6px;flex-wrap:wrap;background:#fff8e8;padding:4px}nav select{max-width:48%}#status{font-size:12px}</style></head><body class="haqi-app"><nav><select aria-label="导师"></select><select aria-label="学习语言"><option value="ja">日语</option><option value="ko">韩语</option><option value="en">英语</option><option value="zh">中文</option></select><button id="reset">重新开始</button><span id="status">内存验收，不修改玩家存档</span></nav><div id="root"></div><script type="module">
import {loadResources} from './js/adventure_assets.js';
import {createAdventure} from './js/adventure_core.js';
import {renderMentorPractice} from './js/views/adventure/view_panel_modal.js';
import {MENTOR_PRACTICES,createMentorPractice,selectMentorPractice,castMentorPractice} from './js/mentor_practice_core.js';
const assets=await loadResources(),save=createAdventure(assets.content,{name:'导师实操验收'}),root=document.querySelector('#root'),mentor=document.querySelector('[aria-label="导师"]'),language=document.querySelector('[aria-label="学习语言"]');
save.languageLearning.native='zh';
for(const [id,lesson] of Object.entries(MENTOR_PRACTICES)){const option=document.createElement('option');option.value=id;option.textContent=lesson.title;mentor.append(option);}
let lesson,completed=0;
function reset(){lesson=createMentorPractice(assets.dataset,{npcId:Number(mentor.value),seed:29,language:language.value});paint();}
function paint(){renderMentorPractice(root,{assets,save},lesson,{close:()=>root.replaceChildren(),select:key=>{selectMentorPractice(lesson,key);paint();},target:id=>{castMentorPractice(lesson,id);paint();},hint:()=>{lesson.hint=!lesson.hint;paint();},listen:()=>{document.querySelector('#status').textContent='本验收页不请求远程语音；正式任务使用现有朗读服务';},retry:reset,complete:()=>{if(lesson.done){completed++;document.querySelector('#status').textContent='通过次数：'+completed+' · 内存验收';root.replaceChildren();}}});}
mentor.onchange=reset;language.onchange=reset;document.querySelector('#reset').onclick=reset;reset();
</script></body></html>

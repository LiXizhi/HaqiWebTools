<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>邮件第二语言隔离验收</title>
<link rel="stylesheet" href="../../css/adventure.css"><link rel="stylesheet" href="../../css/adventure_storybook.css"><link rel="stylesheet" href="../../css/adventure_social.css">
<style>body{background:#35564a}nav{position:fixed;top:8px;left:8px;z-index:100001;background:#fff7df;padding:8px;color:#354b36;max-width:95%}.social-modal{margin-top:65px}</style>
<body class="haqi-app"><nav><label>第二语言 <select aria-label="第二语言"><option value="ja">日语</option><option value="ko">韩语</option><option value="en">英语</option></select></label> · 隔离界面验收，不连接邮件或 AI 服务 <output aria-live="polite"></output></nav><div id="root"></div>
<script type="module">
import {renderSocial} from '../../js/view_adventure_social.js';
const root=document.querySelector('#root'),language=document.querySelector('select'),receipt=document.querySelector('output');
const state={owner:'isolated-test',mailAvailable:true,mailTab:'compose',friends:[{name:'验收伙伴',userId:'fixture-only'}],mailDraft:'明天一起去森林找靴子吧。',subject:'森林探险',learningTarget:'ja'};
const cb={close:()=>{},refresh:()=>{},mailTab:()=>{},draft:(key,value)=>{state[key]=value;},polish:(_key,kind)=>{receipt.textContent='草稿请求语言：'+(kind==='target'?state.learningTarget:'zh-CN')+'（未调用在线服务）';},sendMail:()=>{receipt.textContent='隔离验收，不发送邮件';}};
function show(){renderSocial(root,state,'mail',cb);}
language.onchange=()=>{state.learningTarget=language.value;receipt.textContent='';show();};show();
</script></body></html>

// Haqi H5 protocol v1: independent pages remain usable without a parent.
(()=>{let context=null,written=false,finished=false,serial=0;const callbacks=new Map(),subCache=new Map(),uiCache=new Map(),pending=new Set(),uiNodes=new Map();
const isZh=loc=>!loc||/^zh\b/i.test(loc);
const send=data=>{if(context)parent.postMessage({channel:'haqi-hanzi',version:1,entryId:context.entryId,sessionId:context.sessionId,...data},context.origin);};
const refreshDom=()=>{for(const[el,zh]of uiNodes){if(!el?.isConnected){uiNodes.delete(el);continue;}const tr=!isZh(context?.locale)&&uiCache.get(zh);const next=(tr&&tr!==zh)?tr:zh;if(el.dataset.haqiKind==='seal'){const seal=el.querySelector('.seal');el.textContent=next;if(seal)el.prepend(seal);}else if(el.dataset.haqiKind==='tag'){const i1=document.createElement('i'),i2=document.createElement('i');el.replaceChildren(i1,document.createTextNode(next),i2);}else el.textContent=next;}document.querySelectorAll('[data-haqi-caption]').forEach(el=>renderCaption(el,el.dataset.haqiCaption));};
const flushPending=()=>{if(!context||!pending.size)return;const texts=[...pending];pending.clear();window.haqiHanziTranslate(texts);};
const ensureTexts=texts=>{const need=[];for(const t of texts){const s=typeof t==='string'?t.trim():'';if(s&&(!subCache.has(s)||!uiCache.has(s))&&!pending.has(s)){pending.add(s);need.push(s);}}if(need.length&&context)flushPending();};
const renderCaption=(el,zh)=>{if(!el)return;el.dataset.haqiCaption=zh||'';let sub=el.querySelector('.haqi-sub-trans');if(!zh||isZh(context?.subtitleLocale||context?.locale)){sub?.remove();return;}const tr=subCache.get(zh);if(!tr||tr===zh){sub?.remove();ensureTexts([zh]);return;}if(!sub){sub=document.createElement('span');sub.className='haqi-sub-trans';const host=el.querySelector('#capText')||el;if(host!==el&&host.parentNode===el)host.insertAdjacentElement('afterend',sub);else el.appendChild(sub);}sub.textContent=tr;};
const trackUi=(el,zh,kind='')=>{if(!el||!zh)return;if(kind)el.dataset.haqiKind=kind;uiNodes.set(el,zh);ensureTexts([zh]);};
const scanStatic=()=>{if(!document.body)return;document.querySelectorAll('#start,#replay,#mute,#pause,#demo,#action,#progress li,#note,.introBottom .mean,.introBottom .sub,.introBottom .meta').forEach(el=>{const zh=(el.textContent||'').trim();if(zh&&!uiNodes.has(el))trackUi(el,zh);});document.querySelectorAll('#brand,.brand').forEach(el=>{if(uiNodes.has(el))return;const clone=el.cloneNode(true);clone.querySelector?.('.seal')?.remove();const zh=(clone.textContent||'').trim();if(zh)trackUi(el,zh,'seal');});document.querySelectorAll('.introTop .tag,.tag').forEach(el=>{if(uiNodes.has(el))return;const zh=(el.textContent||'').trim();if(zh)trackUi(el,zh,'tag');});refreshDom();};
if(document.readyState==='loading')addEventListener('DOMContentLoaded',scanStatic,{once:true});else scanStatic();
window.haqiHanziWritten=()=>{written=true;send({type:'written'});};
window.haqiHanziComplete=()=>{if(!written){written=true;send({type:'written'});}finished=true;send({type:'completed'});};
window.haqiHanziPrefetch=texts=>ensureTexts(Array.isArray(texts)?texts:[texts]);
window.haqiHanziUi=(zh,el)=>{const s=typeof zh==='string'?zh.trim():'';if(!s)return zh;if(el)trackUi(el,s);else ensureTexts([s]);const tr=!isZh(context?.locale)&&uiCache.get(s);return(tr&&tr!==s)?tr:zh;};
window.haqiHanziCaption=(el,zh)=>{const s=typeof zh==='string'?zh.trim():'';if(s)ensureTexts([s]);renderCaption(el,s);};
window.haqiHanziTranslate=texts=>new Promise(resolve=>{const list=(Array.isArray(texts)?texts:[]).map(t=>typeof t==='string'?t.trim():'').filter(Boolean);if(!context||!list.length){resolve({});return;}const requestId=String(++serial);const timer=setTimeout(()=>{callbacks.delete(requestId);resolve({});},1500);callbacks.set(requestId,msg=>{clearTimeout(timer);const sub=msg?.translations||{},ui=msg?.uiTranslations||sub;for(const[k,v]of Object.entries(sub))if(typeof v==='string'&&v.trim())subCache.set(k,v.trim());for(const[k,v]of Object.entries(ui))if(typeof v==='string'&&v.trim())uiCache.set(k,v.trim());refreshDom();resolve(sub);});send({type:'translate',requestId,texts:list});});
addEventListener('message',event=>{const m=event.data;if(event.source!==parent||parent===window||m?.channel!=='haqi-hanzi'||m.version!==1)return;
if(m.type==='init'&&typeof m.sessionId==='string'&&typeof m.entryId==='string'){if(document.referrer&&event.origin!==new URL(document.referrer).origin)return;context={...m,origin:event.origin};scanStatic();flushPending();refreshDom();if(written)send({type:'written'});if(finished)send({type:'completed'});}
else if(context&&event.origin===context.origin&&m.sessionId===context.sessionId&&m.type==='translations'){callbacks.get(m.requestId)?.(m);callbacks.delete(m.requestId);}});
if(parent!==window)parent.postMessage({channel:'haqi-hanzi',version:1,type:'ready'},'*');})();

<script>

const $ = s => document.querySelector(s);
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const TAU = Math.PI * 2;
const ease = {
  inOut: t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2,
  out: t => 1 - Math.pow(1 - t, 3),

  back: t => 1 + 2.1 * Math.pow(t - 1, 3) + 1.1 * Math.pow(t - 1, 2),

function mulberry32(a) {
  return () => {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;

function parseCol(c) {
  if (Array.isArray(c)) return c;

const Q = new URLSearchParams(location.search);

  ctx: null, master: null, noise: null, muted: false,
  init() {

function densify(pts, step = 12) {
  const out = [[pts[0][0], pts[0][1]]];
  for (let i = 1; i < pts.length; i++) {
    const a = pts[i - 1], b = pts[i], d = Math.hypot(b[0] - a[0], b[1] - a[1]);
    const n = Math.max(1, Math.ceil(d / step));
    for (let k = 1; k <= n; k++) out.push([lerp(a[0], b[0], k / n), lerp(a[1], b[1], k / n)]);
  }
  return out;
}
function resampleN(pts, count = 28) {
  const d = densify(pts, 6);
  const lens = [0];
  for (let i = 1; i < d.length; i++) lens.push(lens[i - 1] + Math.hypot(d[i][0] - d[i - 1][0], d[i][1] - d[i - 1][1]));
  const total = lens[lens.length - 1] || 1;
  const out = [];
  for (let k = 0; k < count; k++) {
    const target = (total * k) / (count - 1);
    let idx = 0;
    while (idx < lens.length - 2 && lens[idx + 1] < target) idx++;
    const seg = (lens[idx + 1] - lens[idx]) || 1;
    const f = clamp((target - lens[idx]) / seg);
    out.push([lerp(d[idx][0], d[idx + 1][0], f), lerp(d[idx][1], d[idx + 1][1], f)]);
  }
  return out;
}

  // Arched woven-bamboo bridge over the stream near stone #6 (968, 648)

function drawPathStones() {
  setCam(ctx);
  ctx.save();
  // Soft earthen moss trail beneath stones
  fillPoly(ribbon(PATH, 32), 'rgba(196,178,132,0.28)');
  fillPoly(ribbon(PATH, 16), 'rgba(232,214,168,0.26)');

  // Glowing golden path thread behind the walker
  if (W.step > 0) {
    ctx.save();
    ctx.strokeStyle = 'rgba(255,220,148,0.42)';
    ctx.lineWidth = 15;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(PATH[0].x, PATH[0].y);
    for (let i = 1; i <= W.step; i++) ctx.lineTo(PATH[i].x, PATH[i].y);
    ctx.lineTo(W.walker.x, W.walker.y);
    ctx.stroke();

    ctx.strokeStyle = 'rgba(255,236,184,0.88)';
    ctx.lineWidth = 5.5;
    ctx.setLineDash([3, 14]);
    ctx.stroke();
    ctx.restore();
  }

  // Stone ripples when stepped on
  for (const rp of W.stoneRipples) {
    const u = clamp((clock - rp.t0) / 1100);
    const a = clamp((1 - u) * 0.72, 0, 1);
    ctx.strokeStyle = `rgba(244,216,146,${a.toFixed(3)})`;
    ctx.lineWidth = 2.6;
    ctx.beginPath();
    ctx.ellipse(rp.x, rp.y, 38 + u * 36, 13 + u * 13, -0.08, 0, TAU);
    ctx.stroke();
  }

  // 10 Mossy bluestone slabs
  PATH.forEach((p, i) => {
    const reached = i <= W.step;
    const isNext = i === W.step + 1 && i <= 6 && S.mode === 'walk';
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.fillStyle = 'rgba(16,36,24,0.34)';
    ctx.beginPath(); ctx.ellipse(3, 7, 42, 14.5, -0.06, 0, TAU); ctx.fill();

    ctx.fillStyle = reached ? '#cab88c' : '#778880';
    ctx.beginPath(); ctx.ellipse(0, 0, 39, 13.5, -0.08, 0, TAU); ctx.fill();

    // Jade moss rim on stone edge
    ctx.fillStyle = reached ? 'rgba(96,158,104,0.72)' : 'rgba(62,108,78,0.58)';
    ctx.beginPath(); ctx.ellipse(18, 5, 15, 5.2, 0.1, 0, TAU); ctx.fill();

    // Warm sunlit sheen on reached stone
    ctx.fillStyle = reached ? 'rgba(255,232,172,0.86)' : 'rgba(235,244,238,0.22)';
    ctx.beginPath(); ctx.ellipse(-8, -4, 21, 6, -0.08, 0, TAU); ctx.fill();

    if (isNext && document.body.classList.contains('started')) {
      const t = reduceMotion ? 0.5 : (clock % 1500) / 1500;
      const a = clamp(0.92 - t * 0.48, 0, 1);
      ctx.strokeStyle = `rgba(255,224,150,${a.toFixed(3)})`;
      ctx.lineWidth = 2.8 / CV.k + 1.4;
      ctx.beginPath(); ctx.ellipse(0, -3, 44 + t * 22, 16 + t * 8, -0.08, 0, TAU); ctx.stroke();
      ctx.fillStyle = '#fff5d6';
      ctx.beginPath(); ctx.arc(0, -6, 4.8, 0, TAU); ctx.fill();
    }
    ctx.restore();
  });
  ctx.restore();
}

function drawBambooStalk(b) {
  const ptrPush = clamp(1 - Math.hypot(W.pointer.x - b.x, W.pointer.y - (b.y - b.h * 0.45)) / 260, 0, 1);
  const sway = (reduceMotion ? 0 : Math.sin(clock / 1550 + b.ph) * 4.5) + ptrPush * (W.pointer.x < b.x ? 9 : -9);
  ctx.save();
  ctx.translate(b.x, b.y);
  ctx.scale(b.s, b.s);

  const stalkCol = b.tint > 0.5 ? '#2b6845' : '#245b3c';
  ctx.strokeStyle = stalkCol;
  ctx.lineWidth = 13;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(b.lean * 0.42 + sway, -b.h * 0.55, b.lean + sway * 1.65, -b.h);
  ctx.stroke();

  // Culm highlight
  ctx.strokeStyle = 'rgba(222,242,202,0.34)';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(-3.8, 0);
  ctx.quadraticCurveTo(b.lean * 0.42 + sway - 3.8, -b.h * 0.55, b.lean + sway * 1.65 - 3.8, -b.h);
  ctx.stroke();

  // Bamboo nodes (竹节)
  ctx.strokeStyle = 'rgba(14,40,26,0.65)';
  ctx.lineWidth = 2.2;
  for (let k = 1; k <= 5; k++) {
    const u = k / 6;
    const nx = (b.lean * 0.42 + sway) * 2 * (1 - u) * u + (b.lean + sway * 1.65) * u * u;
    const ny = -b.h * u;
    ctx.beginPath(); ctx.moveTo(nx - 7.5, ny); ctx.lineTo(nx + 7.5, ny); ctx.stroke();
  }

  // Crisp calligraphic bamboo leaves (个字/介字竹叶)
  ctx.strokeStyle = '#3d8253';
  ctx.lineWidth = 2.6;
  for (let k = 0; k < 7; k++) {
    const u = 0.36 + k * 0.09;
    const bx = (b.lean + sway * 1.5) * u;
    const by = -b.h * u;
    const dirn = k % 2 ? 1 : -1;
    const len = 52 + ((k * 29) % 30);
    ctx.beginPath();
    ctx.moveTo(bx, by);
    ctx.quadraticCurveTo(bx + dirn * len * 0.58, by - 10, bx + dirn * len, by + 7);
    ctx.stroke();

    ctx.fillStyle = k % 2 ? 'rgba(84,164,104,0.86)' : 'rgba(54,126,78,0.86)';
    for (const [f, rot] of [[1, 0.52], [0.62, 0.28], [0.82, 0.78]]) {
      ctx.save();
      ctx.translate(bx + dirn * len * f, by + 7 * f);
      ctx.rotate(dirn * rot);
      ctx.beginPath();
      ctx.moveTo(-18, 0);
      ctx.quadraticCurveTo(0, -6.2, 22, 0);
      ctx.quadraticCurveTo(0, 5.6, -18, 0);
      ctx.fill();
      ctx.restore();
    }
  }
  ctx.restore();
}

function drawBamboo(front) {

function drawCurtain() {
  if (W.curtain >= 0.995) return;
  setCam(ctx);
  const c = clamp(W.curtain, 0, 1);
  ctx.save();
  ctx.globalAlpha = clamp(1 - c * 0.94, 0, 1);
  for (let i = 0; i < 16; i++) {
    const side = i < 8 ? -1 : 1;
    const baseX = 315 + i * 24;
    const shift = c * side * (95 + Math.abs(i - 7.5) * 14);
    const topY = 82 + ((i * 53) % 58);
    const sway = reduceMotion ? 0 : Math.sin(clock / 900 + i) * 0.03;
    ctx.save();
    ctx.translate(baseX + shift, topY);
    ctx.rotate((i % 5 - 2) * 0.07 + sway - c * side * 0.38);
    ctx.strokeStyle = '#296341';
    ctx.lineWidth = 6.5;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 336); ctx.stroke();
    ctx.fillStyle = i % 2 ? 'rgba(68,144,92,0.93)' : 'rgba(50,118,74,0.93)';
    for (let k = 0; k < 8; k++) {
      const y = 28 + k * 40, d = k % 2 ? 1 : -1;
      ctx.beginPath(); ctx.ellipse(d * 20, y, 25, 6.8, d * 0.58, 0, TAU); ctx.fill();

}

function drawMistAndMotes() {
  setCam(ctx);
  const a = clamp(0.35 * (1 - W.clear * 0.85), 0, 0.5);
  const t = reduceMotion ? 0 : clock / 1000;
  if (a > 0.015) {
    ctx.save();
    for (let i = 0; i < 9; i++) {
      const x = 250 + ((i * 271) % 1920) + Math.sin(t * 0.16 + i) * 38;
      const y = 290 + (i * 83) % 490;
      const r = 235 + (i % 3) * 62;
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(1, 0.22);
      const g = ctx.createRadialGradient(0, 0, 10, 0, 0, r);
      g.addColorStop(0, `rgba(240,245,232,${a.toFixed(3)})`);
      g.addColorStop(0.65, `rgba(240,245,232,${(a * 0.45).toFixed(3)})`);
      g.addColorStop(1, 'rgba(240,245,232,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill();
      ctx.restore();
    }
    ctx.restore();
  }

  // Floating sunlit motes & fireflies
  ctx.save();
  for (const m of MOTES) {
    const mx = m.x + Math.cos(t * 0.42 + m.p) * 12;
    const my = m.y + Math.sin(t * 0.62 + m.p) * 11;
    const pulse = clamp(0.42 + 0.45 * (0.5 + 0.5 * Math.sin(t * 1.8 + m.p)), 0, 1);
    ctx.fillStyle = `rgba(255,238,190,${pulse.toFixed(3)})`;
    ctx.beginPath(); ctx.arc(mx, my, m.r, 0, TAU); ctx.fill();
  }

  // Falling bamboo dewdrops
  for (const d of W.dews) {
    const u = clamp((clock - d.t0) / 950);
    const dy = d.y + u * u * 165;
    const da = clamp((1 - u) * 0.88, 0, 1);
    ctx.fillStyle = `rgba(220,248,240,${da.toFixed(3)})`;
    ctx.beginPath(); ctx.arc(d.x, dy, 3.2 * (1 - u * 0.35), 0, TAU); ctx.fill();
  }
  ctx.restore();
}

  ctx.fillStyle = '#d8b062';

/* ---------- Glyph Sheet, 3-Stage Evolution, Brush Strokes & Seal ---------- */
function withGlyph(fn) {
  ctx.save();
  const s = GL.size / 1024;
  ctx.translate(GL.x, GL.y);
  ctx.scale(s, s);
  ctx.translate(0, 900);
  ctx.scale(1, -1);
  fn(ctx);
  ctx.restore();
}

function drawPaperSheet() {
  if (W.paper <= 0.01) return;
  setCam(ctx);
  const pad = 42, x = GL.cx - GL.size / 2 - pad, y = GL.cy - GL.size / 2 - pad;
  const w = GL.size + pad * 2, h = GL.size + pad * 2 + 56;
  ctx.save();
  ctx.globalAlpha = clamp(W.paper, 0, 1);
  ctx.fillStyle = 'rgba(10,24,18,0.34)';
  roundRect(x + 8, y + 14, w, h, 20); ctx.fill();

  ctx.fillStyle = sheetPattern || '#f7f1df';
  roundRect(x, y, w, h, 20); ctx.fill();

  ctx.strokeStyle = 'rgba(168,124,74,0.68)';
  ctx.lineWidth = 3;
  roundRect(x, y, w, h, 20); ctx.stroke();

  // Inner red-ochre Mizi-grid (米字格)
  const gx = GL.x, gy = GL.y, gs = GL.size;
  ctx.strokeStyle = 'rgba(182,84,56,0.28)';
  ctx.lineWidth = 2;
  ctx.strokeRect(gx, gy, gs, gs);
  ctx.setLineDash([10, 10]);
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.moveTo(gx + gs / 2, gy); ctx.lineTo(gx + gs / 2, gy + gs);
  ctx.moveTo(gx, gy + gs / 2); ctx.lineTo(gx + gs, gy + gs / 2);
  ctx.moveTo(gx, gy); ctx.lineTo(gx + gs, gy + gs);
  ctx.moveTo(gx + gs, gy); ctx.lineTo(gx, gy + gs);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}

function drawEvolution() {
  const ev = W.evo;
  if (ev.alpha <= 0.01) return;
  setCam(ctx);
  ctx.save();
  ctx.globalAlpha = clamp(ev.alpha, 0, 1);

  // Subtle bronze / bamboo-slip plaque backdrop during ancient script morph
  const pad = 28, bx = GL.x - pad, by = GL.y - pad, bw = GL.size + pad * 2, bh = GL.size + pad * 2;
  const slipMix = clamp(ev.stage, 0, 1);
  ctx.fillStyle = mixCol('#24382e', '#e7d5ad', slipMix);
  roundRect(bx, by, bw, bh, 16); ctx.fill();
  ctx.strokeStyle = mixCol('#7ba88d', '#a67b44', slipMix);
  ctx.lineWidth = 2.6;
  roundRect(bx, by, bw, bh, 16); ctx.stroke();

  if (slipMix > 0.15) {
    ctx.save();
    ctx.globalAlpha = clamp(ev.alpha * slipMix * 0.35, 0, 1);
    ctx.strokeStyle = '#9c733d';
    ctx.lineWidth = 1.4;
    for (let i = 1; i < 8; i++) {
      const sx = bx + (bw * i) / 8;
      ctx.beginPath(); ctx.moveTo(sx, by + 8); ctx.lineTo(sx, by + bh - 8); ctx.stroke();
    }
    ctx.restore();
  }

  // Interpolate polylines: stage 0..1 (Bronze -> Seal), stage 1..2 (Seal -> Kai)
  withGlyph(c => {
    c.lineCap = 'round';
    c.lineJoin = 'round';
    c.lineWidth = lerp(28, 34, clamp(ev.stage, 0, 1));
    for (let i = 0; i < 8; i++) {
      const src = ev.stage < 1 ? MORPH_BRONZE[i] : MORPH_SEAL[i];
      const dst = ev.stage < 1 ? MORPH_SEAL[i] : MORPH_KAI[i];
      const u = ev.stage < 1 ? clamp(ev.stage, 0, 1) : clamp(ev.stage - 1, 0, 1);
      const col = i < 3
        ? mixCol('#e6b96e', '#b04a32', slipMix)
        : mixCol('#9cd4b8', '#2a382e', slipMix);
      c.strokeStyle = col;
      c.beginPath();
      for (let k = 0; k < src.length; k++) {
        const px = lerp(src[k][0], dst[k][0], u);
        const py = lerp(src[k][1], dst[k][1], u);
        if (k === 0) c.moveTo(px, py); else c.lineTo(px, py);
      }
      c.stroke();
    }
  });

  // Stage badge & Shuowen quote
  ctx.font = `${Math.max(22, GL.size * 0.044)}px "Kaiti SC","KaiTi",serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const stageLabel = ev.stage < 0.65 ? '甲骨 / 金文部件 · 左彳（道路）右巠（织机纵经）' : '小篆 · 《说文解字》：“径，步道也。从彳，巠声。”';
  ctx.fillStyle = slipMix > 0.5 ? '#5c3d1e' : '#e8dec2';
  ctx.fillText(stageLabel, GL.cx, GL.y + GL.size + 28);
  ctx.restore();
}

function paintStroke(c, i, q, color) {
  const path = new Path2D(JING.strokes[i]);
  c.fillStyle = color;
  if (q >= 0.999) { c.fill(path); return; }
  if (q <= 0.001) return;
  c.save();
  c.clip(path);
  c.lineWidth = 175;
  c.lineCap = 'round';
  c.lineJoin = 'round';
  c.strokeStyle = color;
  const points = GUIDE[i], count = (points.length - 1) * clamp(q, 0, 1);
  c.beginPath();
  c.moveTo(points[0][0], points[0][1]);
  const full = Math.floor(count);
  for (let j = 1; j <= full; j++) c.lineTo(points[j][0], points[j][1]);
  if (full < points.length - 1) {
    const a = points[full], b = points[full + 1], f = count - full;
    c.lineTo(lerp(a[0], b[0], f), lerp(a[1], b[1], f));
  }
  c.stroke();
  c.restore();
}
function strokeColor(i) { return i < 3 ? '#b04a32' : '#233128'; }

function drawLabels() {

function drawTraceUI() {
  const T = W.trace;
  if (!T || T.stroke >= 8) return;
  const pts = GUIDE[T.stroke];
  withGlyph(c => {
    c.globalAlpha = clamp(W.glyph.alpha, 0, 1);
    c.strokeStyle = '#b6692e';
    c.lineWidth = 11;
    c.setLineDash([28, 20]);
    c.lineCap = 'round';
    c.beginPath();
    c.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) c.lineTo(pts[i][0], pts[i][1]);
    c.stroke();
    c.setLineDash([]);

    const a = pts[Math.max(0, pts.length - 4)], b = pts[pts.length - 1];
    const ang = Math.atan2(b[1] - a[1], b[0] - a[0]);
    c.fillStyle = '#b6692e';
    c.beginPath();
    c.moveTo(b[0] + Math.cos(ang) * 28, b[1] + Math.sin(ang) * 28);
    c.lineTo(b[0] + Math.cos(ang + 2.4) * 22, b[1] + Math.sin(ang + 2.4) * 22);
    c.lineTo(b[0] + Math.cos(ang - 2.4) * 22, b[1] + Math.sin(ang - 2.4) * 22);
    c.closePath();
    c.fill();

    const pulse = reduceMotion ? 0.5 : 0.5 + 0.5 * Math.sin(clock / 220);
    const pa = clamp(0.42 + pulse * 0.42, 0, 1);
    c.fillStyle = `rgba(232,169,82,${pa.toFixed(3)})`;
    c.beginPath(); c.arc(pts[0][0], pts[0][1], 26 + pulse * 10, 0, TAU); c.fill();
    c.fillStyle = '#fff8ec';
    c.beginPath(); c.arc(pts[0][0], pts[0][1], 12, 0, TAU); c.fill();

    if (T.pen) {
      c.fillStyle = '#8b4e20';
      c.beginPath(); c.arc(T.pen[0], T.pen[1], 15, 0, TAU); c.fill();
    }
  });
}

  ctx.fillStyle = '#b43728';
  roundRect(-sz / 2, -sz / 2, sz, sz, 6);

function drawWords() {

    if (a <= 0.01) return;
    const active = W.wordOn === i;
    ctx.globalAlpha = clamp(a * (active ? 1 : 0.45), 0, 1);

function drawGlyph() {
  const g = W.glyph;
  if (g.alpha <= 0.001) return;
  setCam(ctx);
  withGlyph(c => {
    if (g.ghost > 0.01) {
      for (let i = 0; i < 8; i++) {
        if (g.prog[i] >= 0.999) continue;
        const on = g.trace && W.trace && W.trace.stroke === i;
        c.globalAlpha = clamp(g.alpha * g.ghost * (on ? 0.52 : 0.25), 0, 1);
        c.fillStyle = on ? '#e2b684' : '#c8bc9e';
        c.fill(new Path2D(JING.strokes[i]));
      }
    }
    c.globalAlpha = clamp(g.alpha, 0, 1);
    for (let i = 0; i < 8; i++) {
      if (g.prog[i] > 0) {
        const col = g.light ? (i < 3 ? '#eb8f6a' : '#f7f1de') : strokeColor(i);
        paintStroke(c, i, g.prog[i], col);
      }
    }
  });
  if (g.trace) drawTraceUI();
  drawSealStamp();
  drawLabels();
  if (g.words > 0) drawWords();
}

  if (!W.sparks.length) return;

    ctx.arc(p.x + Math.sin(u * 5 + p.seed) * 22, p.y - u * 48, 3.2 + (1 - u) * 3.5, 0, TAU);

}

    g.addColorStop(1, 'rgba(8,22,15,0.42)');

let last = null;
function loop(now) {
  requestAnimationFrame(loop);
  if (last == null) last = now;
  const dt = Math.min(50, Math.max(0, now - last));
  last = now;
  if (!paused && visible) {
    DT = dt;
    clock += dt;
    const batch = waiters;
    waiters = [];
    for (const w of batch) {
      if (w.tk.dead) w.rej(new Cancelled());
      else w.res();
    }
  }
  render();
}

cvs.addEventListener('pointermove', e => {

/* ---------- Forgiving Arc-Length Trend Projection Helper ---------- */
function projectStroke(q, idx, curProg) {
  const pts = GUIDE[idx], lens = GUIDE_LENS[idx], total = lens[lens.length - 1] || 1;
  let bestDist = Infinity, bestArc = curProg * total, bestPt = pts[0];
  for (let i = 0; i < pts.length - 1; i++) {
    const ax = pts[i][0], ay = pts[i][1], bx = pts[i + 1][0], by = pts[i + 1][1];
    const vx = bx - ax, vy = by - ay, seg2 = vx * vx + vy * vy || 1;
    const t = clamp(((q.x - ax) * vx + (q.y - ay) * vy) / seg2);
    const px = ax + vx * t, py = ay + vy * t;
    const d = Math.hypot(q.x - px, q.y - py);
    const arc = lerp(lens[i], lens[i + 1], t);
    // Gentle forward-continuity bias so corners never lock
    const jumpPenalty = Math.max(0, arc / total - (curProg + 0.36)) * 260;
    if (d + jumpPenalty < bestDist) {
      bestDist = d + jumpPenalty;
      bestArc = arc;
      bestPt = [px, py];
    }
  }
  return { dist: bestDist, prog: clamp(bestArc / total), pt: bestPt };
}

/* ---------- Seven Story Scenes ---------- */
async function walkTo(p, target, tk) {
  p.dir = target.x >= p.x ? 1 : -1;
  while (Math.hypot(target.x - p.x, target.y - p.y) > 2) {
    await frame(tk);
    const dx = target.x - p.x, dy = target.y - p.y, dist = Math.hypot(dx, dy) || 1;
    const speed = 255 * DT / 1000;
    p.phase += DT / 84;
    if (dist <= speed) { p.x = target.x; p.y = target.y; }
    else { p.x += (dx / dist) * speed; p.y += (dy / dist) * speed; }
  }
  W.stoneRipples.push({ x: target.x, y: target.y, t0: clock });
  W.dews.push({ x: target.x - 18, y: target.y - 165, t0: clock });
  Sound.knock(W.step);
}

    if (i >= 8) return;
    W.glyph.prog[i] = 1;
    Sound.pluck(PENTA[Math.min(PENTA.length - 1, i)], 0.075);
    W.trace.stroke++;
    completed++;
    W.trace.pen = null;
    if (W.trace.stroke < 8) showStroke();
  };
  S.finish = finishStroke;

  const startTol = 165, trackTol = 195;
  S.handler = {
    down(p) {
      if (demoing || W.trace.stroke >= 8) return;
      lastInput = clock;
      const i = W.trace.stroke, pts = GUIDE[i];
      const q = worldToMmah(p.x, p.y);
      const d0 = Math.hypot(q.x - pts[0][0], q.y - pts[0][1]);
      const proj = projectStroke(q, i, W.glyph.prog[i]);
      if (d0 > startTol && proj.dist > startTol * 0.85) {
        if (clock - invalidHint > 500) {
          hint('先点亮圆点起点，再顺着虚线走');
          invalidHint = clock;
        }
        return;
      }
      drag = { stroke: i, maxProg: Math.max(W.glyph.prog[i], proj.prog * 0.35) };
      W.glyph.prog[i] = drag.maxProg;
      W.trace.pen = proj.pt;
    },
    move(p) {
      if (!drag || demoing) return;
      lastInput = clock;
      const i = drag.stroke;
      if (W.trace.stroke !== i) return;
      const q = worldToMmah(p.x, p.y);
      const proj = projectStroke(q, i, drag.maxProg);
      // Forgiving trend tracking: drifting wide temporarily pauses advancement instead of poisoning the stroke
      if (proj.dist <= trackTol && proj.prog >= drag.maxProg - 0.04) {
        drag.maxProg = Math.max(drag.maxProg, Math.min(drag.maxProg + 0.28, proj.prog));
        W.glyph.prog[i] = drag.maxProg;
        W.trace.pen = proj.pt;
        if (drag.maxProg >= 0.88) {
          drag = null;
          finishStroke();
        }
      }
    },
    up() {
      if (!drag) return;
      const d = drag;
      drag = null;
      const i = d.stroke;
      if (W.trace.stroke !== i) return;
      if (d.maxProg >= 0.78) {
        finishStroke();
        return;
      }
      // Keep partial progress if >35% or gently settle back
      const from = W.glyph.prog[i];
      W.trace.pen = null;
      if (from < 0.32) {
        bg(tween(220, t => { if (W.trace.stroke === i) W.glyph.prog[i] = from * (1 - t); }, tk));
      }
      if (clock - invalidHint > 420) {
        hint('顺着箭头再往前送一点就写好啦');
        invalidHint = clock;
      }
    },
  };

  const demo = async () => {
    if (demoing || W.trace.stroke >= 8) return;
    demoing = true;
    ui.demo.disabled = true;
    drag = null;
    hint('看笔尖走过每一笔');
    while (W.trace.stroke < 8) {
      const i = W.trace.stroke, pts = GUIDE[i];
      W.glyph.prog[i] = 0;
      await tween(680 * M, t => {
        W.glyph.prog[i] = t;
        W.trace.pen = pts[Math.round(t * (pts.length - 1))];
      }, tk, ease.sine);
      W.trace.pen = null;
      finishStroke();
      await wait(130, tk);
    }
  };
  S.demo = () => { S.interactions.push('demo'); bg(demo()); };
  mode('trace');
  ui.demo.hidden = false;

  let nudged = false;
  while (W.trace.stroke < 8) {
    await frame(tk);
    if (!demoing && !nudged && clock - lastInput > idleMs(13000)) {
      hint('不确定笔顺时，可以点下方「示范这一笔」');
      nudged = true;
    }
    if (!demoing && completed === 0 && clock - lastInput > idleMs(24000)) {
      S.interactions.push('auto');
      bg(demo());
    }
  }

  S.handler = null; S.demo = null; S.finish = null;
  mode(null); hint(null);
  ui.demo.hidden = true; ui.demo.disabled = false;
  W.glyph.trace = false;
  if (!S.interactions.includes('demo') && !S.interactions.includes('auto')) S.interactions.push('user');

  // Stamp vermilion seal 「径」 and emit written event
  Sound.stamp();
  await tween(420 * M, t => { W.glyph.ghost = 1 - t; W.glyph.seal = t; }, tk, ease.back);
  W.glyph.seal = 1;
  window.__jing.events.push('written');
  window.haqiHanziWritten?.();
  Sound.bell(NOTE.D5); Sound.bell(NOTE.A4);
  await caption('写字', '写好了。径，就是一步一步走出来的小路。', tk);
  await captionDone(tk);
}

async function sWords(tk) {
  publish('sWords'); progress(5);
  const g0 = { cx: GL.cx, cy: GL.cy, size: GL.size };
  await tween(820 * M, t => {
    placeGlyph(g0.cx, g0.cy - 28 * t, lerp(g0.size, g0.size * 0.85, t));
  }, tk);

  for (let i = 0; i < WORDS.length; i++) {
    W.wordOn = i;
    Sound.pluck(PENTA[i + 2], 0.062);
    const fromMood = W.skyMood, toMood = i === 0 ? 0.6 : (i === 1 ? 1.25 : 1.9);
    bg(tween(540 * M, t => {
      W.glyph.words = Math.max(W.glyph.words, i + t);
      W.skyMood = lerp(fromMood, toMood, t);
    }, tk, ease.out));
    await caption(WORDS[i][0], WORDS[i][1], tk, 220);
    await captionDone(tk);
  }
  W.wordOn = -1;
}

async function sFinale(tk) {
  publish('sFinale'); progress(6);
  W.walker.alpha = 1;
  W.walker.x = 555; W.walker.y = 392; W.walker.dir = 1;
  W.step = 9; W.curtain = 1; W.lamp = 1; W.clear = 1;
  bg(camTo(VIEW.finale, 1550 * M, tk));
  await tween(1150 * M, t => {
    W.glyph.alpha = 1 - t;
    W.paper = 1 - t;
    W.veil = 0.52 * (1 - t);
    W.glyph.words = (1 - t) * 3;
  }, tk);
  W.glyph.alpha = 0; W.paper = 0; W.veil = 0; W.glyph.words = 0;
  W.finale = true;

  Sound.bell(NOTE.G4);
  await caption('余韵', '路原来不在地上，而在迈开的脚下。', tk);
  await caption('余韵', '故事完成，点一点竹林摇落露珠，也可以再看一次。', tk, 180);
  await captionDone(tk);

  hint('点一点竹林，听清风竹露与流萤轻响');
  mode('dew');
  setAction('再看一次', () => { Sound.init(); begin(); });
  let seed = 1;
  S.handler = {
    down(p) {
      seed = (seed + 1) % 97;
      W.sparks.push({ x: p.x, y: p.y, t0: clock, seed });
      W.dews.push({ x: p.x - 14, y: p.y - 24, t0: clock }, { x: p.x + 16, y: p.y - 16, t0: clock });
      Sound.hiss(0.28, 2800, 0.038);
      Sound.pluck(PENTA[Math.abs(Math.round(p.x / 42)) % PENTA.length], 0.055);
      hint(null);
    }
  };

  window.__jing.finished = true;
  window.__jing.events.push('completed');
  window.haqiHanziComplete?.();
  for (;;) await frame(tk);
}

const SCENES = [sGate, sPath, sReveal, sGlyph, sWrite, sWords, sFinale];

function syncTransport() {
  paused = false;
  ui.pause.setAttribute('aria-pressed', 'false');
  labelButton(ui.pause, '暂停');
}

async function begin() {
  stopStory();
  const tk = (token = { dead: false });
  capMinEnd = 0;
  resetWorld();
  Object.assign(cam, VIEW.gate);
  S.handler = null; S.demo = null; S.finish = null;
  mode(null); setAction(null); hint(null);
  ui.demo.hidden = true; ui.demo.disabled = false;
  ui.cap.classList.remove('on');
  syncTransport();
  rand = mulberry32(20261111);
  S.interactions = [];
  window.__jing.events = [];
  publish('sGate');
  try {
    for (const sc of SCENES) await sc(tk);
  } catch (e) {
    if (!(e instanceof Cancelled)) console.error(e);
  }
}

async function introPlay(tk) {
  placeGlyph(1500, 432, portrait ? 260 : 384);
  Object.assign(cam, VIEW.intro);
  W.glyph.alpha = 1;
  W.glyph.ghost = 0.28;
  W.glyph.light = true;
  W.glyph.prog = Array(8).fill(0);
  await wait(360, tk);
  for (let i = 0; i < 8; i++) {
    await tween(480, t => { W.glyph.prog[i] = t; }, tk, ease.sine);
    await wait(80, tk);
  }
  W.glyph.ghost = 0;
  for (;;) await frame(tk);
}

function pose(name) {
  stopStory();
  resetWorld();
  capMinEnd = 0;
  S.handler = null; S.demo = null; S.finish = null;
  mode(null); setAction(null); hint(null);
  ui.demo.hidden = true;
  ui.cap.classList.remove('on');
  document.body.classList.add('started');
  $('#intro').classList.add('off');
  const writeSize = () => (portrait ? 560 : 760);

  if (name === 'intro') {
    document.body.classList.remove('started');
    $('#intro').classList.remove('off');
    placeGlyph(1500, 432, portrait ? 260 : 384);
    Object.assign(cam, VIEW.intro);
    W.glyph.alpha = 1; W.glyph.ghost = 0.2; W.glyph.light = true;
    W.glyph.prog = [1, 1, 1, 1, 1, 0.65, 0, 0];
    publish('intro');
  } else if (name === 'action') {
    Object.assign(cam, VIEW.path);
    W.step = 2; W.walker.x = PATH[2].x; W.walker.y = PATH[2].y; W.clear = 0.25;
    progress(1);
    showCaption('曲径', '小路隐在竹影与溪水之间，只露出几块覆苔青石。');
    setAction('向前走一步', () => {});
    hint('点一点下一块发亮的青石');
    mode('walk');
    publish('action');
  } else if (name === 'reveal') {
    Object.assign(cam, VIEW.reveal);
    W.walker.x = 600; W.walker.y = 430; W.curtain = 0.35; W.lamp = 0.58; W.step = 8; W.clear = 0.32;
    progress(2);
    showCaption('通幽', '小径尽头被垂竹遮住了，竹叶后透出一点暖灯。');
    hint('按住垂竹左右拂开，或点下方按钮');
    mode('curtain');
    publish('reveal');
  } else if (name === 'form') {
    placeGlyph(1200, 540, writeSize());
    Object.assign(cam, VIEW.glyph); cam.x = GL.cx; cam.y = GL.cy;
    W.veil = 0.52; W.paper = 1; W.labels = 1; W.walker.alpha = 0;
    W.glyph.alpha = 1; W.glyph.prog = Array(8).fill(1);
    progress(3);
    showCaption('成字', '左边「彳」像路口左半，表示道路与迈步前行。');
    publish('form');
  } else if (name === 'ghost' || name === 'stroke1' || name === 'done') {
    placeGlyph(1200, 540, writeSize());
    Object.assign(cam, VIEW.glyph); cam.x = GL.cx; cam.y = GL.cy;
    W.veil = 0.52; W.paper = 1; W.walker.alpha = 0; W.glyph.alpha = 1;
    progress(4);
    if (name === 'ghost') {
      W.glyph.ghost = 1; W.glyph.prog = Array(8).fill(0); W.glyph.trace = true;
      W.trace = { stroke: 0, pen: null };
      showCaption('写字', '第 1 笔（撇），共 8 笔。');
      hint('从亮起的起点出发，顺着箭头方向描');
      mode('trace'); ui.demo.hidden = false;
    } else if (name === 'stroke1') {
      W.glyph.ghost = 1; W.glyph.prog = [1, 1, 1, 0, 0, 0, 0, 0]; W.glyph.trace = true;
      W.trace = { stroke: 3, pen: null };
      showCaption('写字', '第 4 笔（横撇），共 8 笔。');
      hint('从亮起的起点出发，顺着箭头方向描');
      mode('trace'); ui.demo.hidden = false;
    } else {
      W.glyph.ghost = 0; W.glyph.seal = 1; W.glyph.prog = Array(8).fill(1);
      showCaption('写字', '写好了。径，就是一步一步走出来的小路。');
    }
    publish(name);
  } else if (name === 'finale') {
    Object.assign(cam, VIEW.finale);
    W.walker.x = 555; W.walker.y = 392; W.curtain = 1; W.lamp = 1; W.clear = 1; W.step = 9; W.finale = true;
    progress(6);
    showCaption('余韵', '路原来不在地上，而在迈开的脚下。');
    publish('finale');
  }
  render();
}

buildPaperTextures();
resetWorld();
Object.assign(cam, VIEW.intro);
window.__jing = {
  interactions: [],
  scene: 'intro',
  finished: false,
  events: [],
  state: W,
  pose,
  medians: JING.medians,
  strokes: JING.strokes,
  toScreen,
  mmahToWorld,
  path: PATH,
  completeCurrentStroke() { S.finish?.(); },
};
resize();
render();
document.documentElement.dataset.fixtureReady = '1';
addEventListener('resize', () => { vignette = null; resize(); render(); });
requestAnimationFrame(loop);

if (AUTO) {
  $('#intro').classList.add('off');
  document.body.classList.add('started');
  begin();
} else {
  bg(introPlay((token = { dead: false })));
}

$('#start').addEventListener('click', () => {
  Sound.init();
  token.dead = true;
  $('#intro').classList.add('off');
  document.body.classList.add('started');
  begin();
});
$('#replay').addEventListener('click', () => {
  Sound.init();
  if (!document.body.classList.contains('started')) {
    $('#intro').classList.add('off');
    document.body.classList.add('started');
  }
  begin();
});
$('#mute').addEventListener('click', () => {
  Sound.init();
  Sound.setMuted(!Sound.muted);
  ui.mute.setAttribute('aria-pressed', String(Sound.muted));
  labelButton(ui.mute, Sound.muted ? '开启声音' : '静音');
});
$('#pause').addEventListener('click', () => {
  paused = !paused;
  ui.pause.setAttribute('aria-pressed', String(paused));
  labelButton(ui.pause, paused ? '继续' : '暂停');
  if (Sound.ctx) void (paused ? Sound.ctx.suspend() : Sound.ctx.resume()).catch(() => {});
});
document.addEventListener('visibilitychange', () => { visible = !document.hidden; last = null; });
addEventListener('pagehide', () => { token.dead = true; void Sound.ctx?.close().catch(() => {}); }, { once: true });
})();
</script>

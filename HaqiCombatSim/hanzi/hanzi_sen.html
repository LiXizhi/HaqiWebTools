<style>

}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg)}
body{color:var(--paper);font-family:var(--serif);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--gold);outline-offset:4px}
#sampler{position:absolute;width:0;height:0;overflow:hidden}
#glView,#inkView{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#glView{z-index:1}
#inkView{z-index:3}
body.hold #inkView{cursor:pointer}
body.drag #inkView{cursor:grab}
body.drag.dragging #inkView{cursor:grabbing}
body.wind #inkView{cursor:ew-resize}
body.trace #inkView{cursor:crosshair}
body.orbit #inkView{cursor:grab}

#progress{position:fixed;top:max(16px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;list-style:none;
  margin:0;padding:0;gap:clamp(8px,1.8vw,22px);z-index:10;opacity:0;transition:opacity .8s;pointer-events:none}
#progress::before{content:"";position:absolute;top:2.5px;left:12px;right:12px;height:1px;background:rgba(242,232,213,.18)}
body.started #progress{opacity:1}
#progress li{position:relative;font-family:var(--kai);font-size:13px;color:#6c7d74;letter-spacing:.08em;padding-top:12px;transition:color .6s;white-space:nowrap}

#progress li.on{color:var(--paper)}#progress li.on::before{background:var(--jade);transform:scale(1.65);box-shadow:0 0 10px 2px rgba(118,200,147,.65)}

#controls{position:fixed;right:max(14px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));display:flex;gap:8px;z-index:12;opacity:0;pointer-events:none;transition:opacity .6s}
body.started #controls{opacity:1;pointer-events:auto}

#seasonBar{position:fixed;left:50%;top:max(58px,calc(env(safe-area-inset-top) + 44px));transform:translateX(-50%);display:flex;gap:8px;z-index:11;opacity:0;pointer-events:none;transition:opacity .5s}
#seasonBar.on{opacity:1;pointer-events:auto}
#seasonBar button{font-family:var(--kai);font-size:13px;letter-spacing:.14em;color:#d8cbb2;background:rgba(12,24,20,.68);
  border:1px solid rgba(233,196,106,.35);border-radius:16px;padding:4px 12px;cursor:pointer;backdrop-filter:blur(4px)}
#seasonBar button.active{color:#102019;background:var(--gold);border-color:var(--gold);font-weight:600}

#hint{position:fixed;left:16px;right:16px;margin:0 auto;width:fit-content;max-width:calc(100vw - 32px);box-sizing:border-box;
  top:max(60px,calc(env(safe-area-inset-top) + 46px));text-align:center;color:#d9f5e3;opacity:0;transition:opacity .45s;pointer-events:none;z-index:9;

#hint.on{opacity:1;animation:breathe 1.8s ease-in-out infinite}

#caption{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translate(-50%,10px);
  width:min(900px,calc(100vw - 24px));box-sizing:border-box;text-align:center;opacity:0;

#capTitle{margin:0 0 8px;font-weight:400;font-family:var(--kai);font-size:clamp(15px,2.2vh,19px);letter-spacing:.42em;margin-left:.42em;color:var(--jade)}

#capText{margin:0;font-family:var(--kai);font-size:clamp(19px,calc(1vw + 1.6vh),28px);line-height:1.7;color:var(--paper);letter-spacing:.06em;min-height:1.7em;

@keyframes inkIn{from{opacity:0;color:transparent;text-shadow:0 0 14px rgba(118,200,147,.9)}50%{opacity:1}to{color:var(--paper);text-shadow:0 1px 12px rgba(0,0,0,.75)}}
@keyframes sealIn{from{opacity:0;letter-spacing:.9em;filter:blur(4px)}to{opacity:1;letter-spacing:.42em;filter:none}}

.actions{margin-top:12px;display:flex;justify-content:center;gap:12px;pointer-events:auto;min-height:38px}
.actions button{font-family:var(--kai);font-size:clamp(15px,2.1vh,18px);letter-spacing:.2em;padding:7px 20px 7px 24px;border-radius:20px;cursor:pointer;
  color:#081611;background:linear-gradient(135deg,#8ce0a8,#52b788);border:none;box-shadow:0 4px 16px rgba(82,183,136,.35);transition:transform .2s,box-shadow .2s}
.actions button:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(82,183,136,.5)}
.actions button.holding{transform:scale(.96);background:linear-gradient(135deg,#e9c46a,#d48c46);color:#1a1208}
#demo{background:rgba(12,26,21,.78);color:var(--paper);border:1px solid rgba(118,200,147,.45);box-shadow:none}
#demo:hover{background:rgba(24,48,38,.9)}

#note{position:fixed;right:max(14px,env(safe-area-inset-right));bottom:max(8px,env(safe-area-inset-bottom));
  font-size:11px;color:rgba(210,200,180,.42);letter-spacing:.08em;z-index:5;pointer-events:none}

#intro{position:fixed;inset:0;z-index:20;pointer-events:none;transition:opacity .9s,transform .9s}
#intro.off{opacity:0;transform:scale(1.04)}
#intro.off *{pointer-events:none!important}
.introTop,.introBottom{position:absolute;left:0;right:0;display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 20px}
.introTop{bottom:calc(100% - var(--gTop,140px) + 12px);gap:6px}
.introBottom{top:calc(var(--gBottom,540px) + 12px);gap:7px}
.introTop .tag{display:flex;align-items:center;gap:10px;font-family:var(--kai);font-size:clamp(14px,2.1vh,18px);letter-spacing:.3em;color:var(--jade)}
.introTop .tag i{display:block;width:clamp(24px,5vw,60px);height:1px;background:currentColor;opacity:.55}
.pinyin{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:clamp(28px,4.8vh,44px);line-height:1;color:var(--paper);letter-spacing:.06em}
.mean{font-family:var(--kai);font-size:clamp(16px,2.4vh,21px);letter-spacing:.22em;color:var(--gold)}
.sub{font-size:clamp(13px,1.9vh,16px);color:#b7c7be;letter-spacing:.1em;margin:2px 0 0;line-height:1.6}
.btn-main{pointer-events:auto;margin-top:6px;font-family:var(--kai);font-size:clamp(18px,2.5vh,22px);letter-spacing:.4em;padding:10px 26px 10px 34px;
  color:#081611;background:linear-gradient(135deg,#8ce0a8,#52b788);border:none;border-radius:24px;cursor:pointer;
  box-shadow:0 6px 20px rgba(82,183,136,.38);transition:transform .2s,box-shadow .2s;animation:btnGlow 2.4s ease-in-out infinite}
.btn-main:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(82,183,136,.5)}
@keyframes btnGlow{50%{box-shadow:0 6px 20px rgba(82,183,136,.38),0 0 0 8px rgba(118,200,147,.14)}}
.meta{font-size:12px;color:#83968c;letter-spacing:.12em;margin:0}
.rise{opacity:0;transform:translateY(12px);animation:rise .85s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:var(--d,0s)}
@keyframes rise{to{opacity:1;transform:none}}

@media (max-width:640px){
  #brand{font-size:12px;letter-spacing:.14em;gap:7px}
  #brand .seal{font-size:13px;padding:4px}
  #progress{top:max(44px,calc(env(safe-area-inset-top) + 34px));gap:10px}
  #progress li{font-size:11px;padding-top:10px}
  #hint{top:max(78px,calc(env(safe-area-inset-top) + 66px));padding:6px 14px}
  #seasonBar{top:max(78px,calc(env(safe-area-inset-top) + 66px))}
  #controls button{font-size:12px;padding:5px 8px}
  #note{display:none}
}
@media (max-height:560px){
  .sub,.meta{display:none}
  .introBottom{gap:4px}
}
@media (prefers-reduced-motion:reduce){
  #hint.on,.btn-main{animation:none}
  #capText .ch{animation-duration:.25s;animation-delay:0s}
}

<script>
// Haqi H5 protocol v1: independent pages remain usable without a parent.
(()=>{let context=null,written=false,finished=false,serial=0;const callbacks=new Map(),subCache=new Map(),uiCache=new Map(),pending=new Set(),uiNodes=new Map();
const isZh=loc=>!loc||/^zh\b/i.test(loc);
const send=data=>{if(context)parent.postMessage({channel:'haqi-hanzi',version:1,entryId:context.entryId,sessionId:context.sessionId,...data},context.origin);};
const refreshDom=()=>{for(const[el,zh]of uiNodes){if(!el?.isConnected){uiNodes.delete(el);continue;}const tr=!isZh(context?.locale)&&uiCache.get(zh);const next=(tr&&tr!==zh)?tr:zh;if(el.dataset.haqiKind==='seal'){const seal=el.querySelector('.seal');el.textContent=next;if(seal)el.prepend(seal);}else if(el.dataset.haqiKind==='tag'){const i1=document.createElement('i'),i2=document.createElement('i');el.replaceChildren(i1,document.createTextNode(next),i2);}else el.textContent=next;}document.querySelectorAll('[data-haqi-caption]').forEach(el=>renderCaption(el,el.dataset.haqiCaption));};
const flushPending=()=>{if(!context||!pending.size)return;const texts=[...pending];pending.clear();window.haqiHanziTranslate(texts);};
const ensureTexts=texts=>{const need=[];for(const t of texts){const s=typeof t==='string'?t.trim():'';if(s&&(!subCache.has(s)||!uiCache.has(s))&&!pending.has(s)){pending.add(s);need.push(s);}}if(need.length&&context)flushPending();};
const renderCaption=(el,zh)=>{if(!el)return;el.dataset.haqiCaption=zh||'';let sub=el.querySelector('.haqi-sub-trans');if(!zh||isZh(context?.subtitleLocale||context?.locale)){sub?.remove();return;}const tr=subCache.get(zh);if(!tr||tr===zh){sub?.remove();ensureTexts([zh]);return;}if(!sub){sub=document.createElement('span');sub.className='haqi-sub-trans';const host=el.querySelector('#capText')||el;if(host!==el&&host.parentNode===el)host.insertAdjacentElement('afterend',sub);else el.appendChild(sub);}sub.textContent=tr;};
const trackUi=(el,zh,kind='')=>{if(!el||!zh)return;if(kind)el.dataset.haqiKind=kind;uiNodes.set(el,zh);ensureTexts([zh]);};
const scanStatic=()=>{if(!document.body)return;document.querySelectorAll('#start,#replay,#mute,#demo,#action,#progress li,#seasonBar button,#note,.introBottom .mean,.introBottom .sub,.introBottom .meta,.heading .eyebrow,.heading h1,.heading .deck,.edition,.colophon,#glyphLabel,#targets .svg-label').forEach(el=>{const zh=(el.textContent||'').trim();if(zh&&!uiNodes.has(el))trackUi(el,zh);});document.querySelectorAll('#brand,.brand').forEach(el=>{if(uiNodes.has(el))return;const clone=el.cloneNode(true);clone.querySelector?.('.seal')?.remove();const zh=(clone.textContent||'').trim();if(zh)trackUi(el,zh,'seal');});document.querySelectorAll('.introTop .tag,.tag').forEach(el=>{if(uiNodes.has(el))return;const zh=(el.textContent||'').trim();if(zh)trackUi(el,zh,'tag');});refreshDom();};
if(document.readyState==='loading')addEventListener('DOMContentLoaded',scanStatic,{once:true});else scanStatic();
window.haqiHanziWritten=()=>{written=true;send({type:'written'});};
window.haqiHanziComplete=()=>{if(!written){written=true;send({type:'written'});}finished=true;send({type:'completed'});};
window.haqiHanziPrefetch=texts=>ensureTexts(Array.isArray(texts)?texts:[texts]);
window.haqiHanziUi=(zh,el)=>{const s=typeof zh==='string'?zh.trim():'';if(!s)return zh;if(el)trackUi(el,s);else ensureTexts([s]);const tr=!isZh(context?.locale)&&uiCache.get(s);return(tr&&tr!==s)?tr:zh;};
window.haqiHanziCaption=(el,zh)=>{const s=typeof zh==='string'?zh.trim():'';if(s)ensureTexts([s]);renderCaption(el,s);};
window.haqiHanziTranslate=texts=>new Promise(resolve=>{const list=(Array.isArray(texts)?texts:[]).map(t=>typeof t==='string'?t.trim():'').filter(Boolean);if(!context||!list.length){resolve({});return;}const requestId=String(++serial);const timer=setTimeout(()=>{callbacks.delete(requestId);resolve({});},1500);callbacks.set(requestId,msg=>{clearTimeout(timer);const sub=msg?.translations||{},ui=msg?.uiTranslations||sub;for(const[k,v]of Object.entries(sub))if(typeof v==='string'&&v.trim())subCache.set(k,v.trim());for(const[k,v]of Object.entries(ui))if(typeof v==='string'&&v.trim())uiCache.set(k,v.trim());refreshDom();resolve(sub);});send({type:'translate',requestId,texts:list});});
addEventListener('message',event=>{const m=event.data;if(event.source!==parent||parent===window||m?.channel!=='haqi-hanzi'||m.version!==1)return;
if(m.type==='init'&&typeof m.sessionId==='string'&&typeof m.entryId==='string'){if(document.referrer&&event.origin!==new URL(document.referrer).origin)return;context={...m,origin:event.origin};scanStatic();flushPending();refreshDom();if(written)send({type:'written'});if(finished)send({type:'completed'});}
else if(context&&event.origin===context.origin&&m.sessionId===context.sessionId&&m.type==='translations'){callbacks.get(m.requestId)?.(m);callbacks.delete(m.requestId);}});
if(parent!==window)parent.postMessage({channel:'haqi-hanzi',version:1,type:'ready'},'*');})();
</script>

    g.gain.exponentialRampToValueAtTime(vol, t + 0.014);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    const lp = c.createBiquadFilter(); lp.type = 'lowpass';
    lp.frequency.setValueAtTime(f * 5.5, t);
    lp.frequency.exponentialRampToValueAtTime(f * 1.25, t + dur * 0.65);
    lp.connect(g); this.out(g);
    for (const [m, type, a] of [[1, 'triangle', 1], [2.002, 'sine', 0.34], [3.01, 'sine', 0.12]]) {
      const o = c.createOscillator(); o.type = type;
      o.frequency.setValueAtTime(f * m * 1.01, t);
      o.frequency.exponentialRampToValueAtTime(f * m, t + 0.1);
      const og = c.createGain(); og.gain.value = a;
      o.connect(og); og.connect(lp); o.start(t); o.stop(t + dur + 0.05);
    }
  },
  bell(f, vol = 0.09, dur = 3.2) {
    const c = this.ctx; if (!c) return;
    const t = c.currentTime;
    for (const [m, a, dd] of [[1, 1, 1], [2.756, 0.32, 0.5], [5.4, 0.11, 0.25], [0.5, 0.2, 1.2]]) {
      const o = c.createOscillator(); o.type = 'sine'; o.frequency.value = f * m;
      const g = c.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol * a, t + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur * dd);
      o.connect(g); this.out(g); o.start(t); o.stop(t + dur * dd + 0.05);
    }
  },
  breeze(dur = 1.4, freq = 900, vol = 0.08) {
    const c = this.ctx; if (!c || !this.noise) return;
    const t = c.currentTime;
    const s = c.createBufferSource(); s.buffer = this.noise;
    const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.2;
    bp.frequency.setValueAtTime(freq * 0.5, t);
    bp.frequency.exponentialRampToValueAtTime(freq * 1.6, t + dur * 0.45);
    bp.frequency.exponentialRampToValueAtTime(freq * 0.7, t + dur);
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + dur * 0.28);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(bp); bp.connect(g); this.out(g, true);
    s.start(t, rand() * 1.2); s.stop(t + dur + 0.05);
  },
  water(on) {
    const c = this.ctx; if (!c || !this.noise) return;
    if (!this.waterG) {
      const s = c.createBufferSource(); s.buffer = this.noise; s.loop = true;
      const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1150; bp.Q.value = 0.85;
      this.waterG = c.createGain(); this.waterG.gain.value = 0;
      s.connect(bp); bp.connect(this.waterG); this.out(this.waterG, true); s.start();
    }
    this.waterG.gain.setTargetAtTime(on ? 0.065 : 0, c.currentTime, on ? 0.12 : 0.2);
  },
  pad() {
    const c = this.ctx; if (!c || this.padOn) return;
    this.padOn = true;
    const g = c.createGain(); g.gain.value = 0;
    g.gain.setTargetAtTime(0.042, c.currentTime, 2.2);
    this.padF = c.createBiquadFilter(); this.padF.type = 'lowpass'; this.padF.frequency.value = 360;
    for (const [f, type] of [[NOTE.C3 / 2, 'sine'], [NOTE.C3, 'triangle'], [NOTE.G3, 'sine'], [NOTE.E4 * 0.5, 'triangle']]) {
      const o = c.createOscillator(); o.type = type; o.frequency.value = f;
      o.connect(this.padF); o.start();
    }
    this.padF.connect(g); g.connect(this.master);
  },
  warm(k) { if (this.padF && this.ctx) this.padF.frequency.setTargetAtTime(360 + 1100 * k, this.ctx.currentTime, 1.4); },
};

function createTreeUnit(scale = 1, isHero = false) {
  const g = new THREE.Group();
  const trunkG = new THREE.Group();
  const mainGeo = new THREE.CylinderGeometry(0.11 * scale, 0.24 * scale, 2.3 * scale, 10);
  mainGeo.translate(0, 1.15 * scale, 0);
  const mainMesh = new THREE.Mesh(mainGeo, matTrunk);
  mainMesh.castShadow = true;
  trunkG.add(mainMesh);

  // 左右迎客松侧枝与侧冠（仅主松带精细侧枝，避免背景松林穿出裸枝）
  const brL = new THREE.Group();
  const brR = new THREE.Group();
  if (isHero) {
    const bGeo = new THREE.CylinderGeometry(0.045 * scale, 0.08 * scale, 0.85 * scale, 8);
    bGeo.translate(0, 0.42 * scale, 0);
    const bMeshL = new THREE.Mesh(bGeo, matTrunk);
    const bCapL = new THREE.Mesh(new THREE.ConeGeometry(0.48 * scale, 0.42 * scale, 8), matFoliage);
    bCapL.position.set(0, 0.82 * scale, 0);
    brL.add(bMeshL, bCapL);
    brL.position.set(0, 1.05 * scale, 0.05 * scale);
    brL.rotation.z = 0.72;
    trunkG.add(brL);

    const bMeshR = new THREE.Mesh(bGeo, matTrunk);
    const bCapR = new THREE.Mesh(new THREE.ConeGeometry(0.5 * scale, 0.44 * scale, 8), matFoliage);
    bCapR.position.set(0, 0.82 * scale, 0);
    brR.add(bMeshR, bCapR);
    brR.position.set(0, 1.02 * scale, 0.05 * scale);
    brR.rotation.z = -0.72;
    trunkG.add(brR);
  }
  g.add(trunkG);

  // 树冠：三层古典水墨青绿松盖
  const crownG = new THREE.Group();
  const layers = [
    { y: 1.95 * scale, r: 1.22 * scale, h: 1.02 * scale, x: 0 },
    { y: 2.58 * scale, r: 0.98 * scale, h: 0.92 * scale, x: -0.08 * scale },
    { y: 3.14 * scale, r: 0.70 * scale, h: 0.80 * scale, x: 0.06 * scale },
  ];
  layers.forEach((l, idx) => {
    const cone = new THREE.ConeGeometry(l.r, l.h, 9);
    const m = new THREE.Mesh(cone, matFoliage);
    m.position.set(l.x, l.y, (idx - 1) * 0.06 * scale);
    m.castShadow = true;
    m.receiveShadow = true;
    crownG.add(m);
  });
  g.add(crownG);

  // 地下根系（对应甲骨文「木」下半部向大地深扎的树根）
  const rootG = new THREE.Group();
  if (isHero) {
    const dirs = [
      new THREE.Vector3(-1.25, -1.45, 0.2),
      new THREE.Vector3(1.28, -1.45, -0.15),
      new THREE.Vector3(-0.52, -1.65, -0.45),
      new THREE.Vector3(0.55, -1.62, 0.42),
    ];
    dirs.forEach(d => {
      const curve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(0, 0.05, 0),
        new THREE.Vector3(d.x * 0.35 * scale, d.y * 0.42 * scale, d.z * 0.4 * scale),
        new THREE.Vector3(d.x * 0.78 * scale, d.y * 0.78 * scale, d.z * 0.8 * scale),
        new THREE.Vector3(d.x * scale, d.y * scale, d.z * scale),
      ]);
      const rGeo = new THREE.TubeGeometry(curve, 12, 0.065 * scale, 6, false);
      const rMesh = new THREE.Mesh(rGeo, matRoot);
      rootG.add(rMesh);
    });
  }
  g.add(rootG);

  g.userData = { trunkG, crownG, rootG, brL, brR, scale, isHero };
  return g;
}

function updateTreeGrowth(tree, growVal, rootVal = growVal, swayAngle = 0, trimRight = 0) {
  const { trunkG, crownG, rootG, brR, isHero } = tree.userData;
  const g = clamp(growVal), r = clamp(rootVal);
  tree.visible = g > 0.005 || r > 0.005;
  if (!tree.visible) return;
  const tg = smooth(clamp(g * 1.25));
  const cg = smooth(clamp((g - 0.22) / 0.78));
  trunkG.scale.set(Math.max(0.001, tg), Math.max(0.001, tg), Math.max(0.001, tg));
  crownG.scale.set(Math.max(0.001, cg), Math.max(0.001, cg), Math.max(0.001, cg));
  rootG.scale.set(Math.max(0.001, r), Math.max(0.001, r), Math.max(0.001, r));
  trunkG.rotation.z = swayAngle;
  crownG.rotation.z = swayAngle * 1.22;
  crownG.position.x = -Math.sin(swayAngle) * 1.3 * tree.userData.scale;
  if (isHero) {
    // 左木谦让右木时，右侧迎客枝（对应「捺」）收敛化为短「点」
    const s = lerp(1, 0.48, trimRight);
    brR.scale.set(s, s, s);
    brR.rotation.z = lerp(-0.72, -0.38, trimRight);
  }
}

function frameW(v) { return portrait ? (v.pw ?? v.w * 0.62) : v.w; }
function updateView() {

  if (!reduceMotion && W.drift) { dx = Math.sin(clock * 0.00022) * 5 * W.drift; dy = Math.sin(clock * 0.00017 + 1) * 3.5 * W.drift; }
  CV.x = cam2D.x + dx; CV.y = cam2D.y + dy;
}
function setCam(c) {

}
function toWorld(cx, cy) { return { x: (cx - SW / 2) / CV.k + CV.x, y: (cy - CV.cy) / CV.k + CV.y }; }

function world3DToScreen(vx, vy, vz) {

  v.applyMatrix4(worldGroup.matrixWorld);

async function cam3DTo(preset, ms, tk, ez = ease.inOut) {

  const to = { ...preset };
  await tween(ms, t => {
    for (const k of ['x', 'y', 'z', 'tx', 'ty', 'tz', 'fov', 'pfov']) curCam3D[k] = lerp(from[k], to[k], t);

}

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  SW = innerWidth; SH = innerHeight;
  portrait = SW / SH < 0.85;
  document.body.classList.toggle('portrait', portrait);
  cvs.width = Math.round(SW * DPR);
  cvs.height = Math.round(SH * DPR);
  if (renderer && camera) {
    renderer.setSize(SW, SH, false);
    camera.aspect = SW / Math.max(1, SH);
    camera.updateProjectionMatrix();
  }
}

/* ---------- 字形：甲骨文「森」与楷书「森」12 笔逐点对应与平滑变形 ---------- */
const NSVG = 'http://www.w3.org/2000/svg';
const samplerPath = document.createElementNS(NSVG, 'path');
$('#sampler').appendChild(samplerPath);
const N = 64;
function resample(d) {
  samplerPath.setAttribute('d', d);
  const len = samplerPath.getTotalLength();
  const pts = [];
  for (let i = 0; i <= N; i++) { const p = samplerPath.getPointAtLength(len * i / N); pts.push([p.x, p.y]); }
  return pts;
}
const PROF = {
  carve: s => 0.38 + 0.62 * Math.pow(Math.sin(Math.PI * s), 0.5),
  h: s => 0.82 + 0.42 * bump(s, 0.04, 0.06) + 0.36 * bump(s, 0.95, 0.05),
  v: s => 0.92 + 0.3 * bump(s, 0.03, 0.05) + 0.14 * bump(s, 0.96, 0.04),
  pie: s => (1.14 - 0.92 * s) + 0.24 * bump(s, 0.03, 0.06),
  na: s => 0.45 + 0.88 * Math.pow(s, 0.65) - 0.35 * clamp((s - 0.86) / 0.14),
  dot: s => 0.5 + 0.82 * Math.sin(Math.PI * Math.min(1, 0.15 + s * 0.8)),
};

// 楷书「森」十二画：上木（1-4）+ 左下木（5-8，末笔捺变点以相让）+ 右下木（9-12）
// 基础「木」笔顺（横、竖、撇、捺）与 Make Me a Hanzi (data/adventure/hanzi/strokes.json) 完全一致
const MODERN = [
  // 上「木」
  { d: 'M30 22 L70 19', p: 'h', w: 4.1, name: '横（上木）' },
  { d: 'M50 8 L50 44', p: 'v', w: 4.3, name: '竖（上木）' },
  { d: 'M48 21 Q36 33 20 42', p: 'pie', w: 4.2, name: '撇（上木）' },
  { d: 'M52 21 Q64 32 80 41', p: 'na', w: 4.3, name: '捺（上木）' },
  // 左下「木」（捺变点）
  { d: 'M14 58 L46 55', p: 'h', w: 3.9, name: '横（左木）' },
  { d: 'M32 45 L32 90', p: 'v', w: 4.2, name: '竖（左木）' },
  { d: 'M30 57 Q21 72 10 85', p: 'pie', w: 4.0, name: '撇（左木）' },
  { d: 'M34 60 Q41 65 45 72', p: 'dot', w: 4.4, name: '点（左木谦让）' },

  { d: 'M70 56 Q80 72 92 85', p: 'na', w: 4.4, name: '捺（右木）' },

// 甲骨文「森」示意：三株「上枝下根」的古木呈品字排列，与楷书 12 笔逐一对应
const ORACLE = [
  // 上古木：上弯枝、主干、左根、右根
  'M33 15 Q50 25 67 15',
  'M50 7 L50 43',
  'M50 28 Q39 36 25 43',
  'M50 28 Q61 36 75 43',
  // 左下古木：上弯枝、主干、左根、右短根
  'M18 52 Q32 61 45 52',
  'M32 45 L32 89',
  'M32 69 Q22 79 12 87',
  'M32 69 Q39 74 44 80',
  // 右下古木：上弯枝、主干、左根、右根
  'M54 52 Q68 61 83 52',
  'M68 45 L68 90',
  'M68 69 Q58 79 48 87',
  'M68 69 Q78 79 89 87',
];
const OPTS = ORACLE.map(resample), MPTS = MODERN.map(s => resample(s.d));
const STROKE_COUNT = MODERN.length;
const GL = { cx: 820, cy: 500, s: 3.5 };

function strokePts(i) {
  const m = W.glyph.morph, a = OPTS[i], b = MPTS[i];
  if (m <= 0) return a; if (m >= 1) return b;
  const e = ease.inOut(m);
  return a.map((p, j) => [lerp(p[0], b[j][0], e), lerp(p[1], b[j][1], e)]);
}
function strokeW(i, s) {
  const m = ease.inOut(W.glyph.morph);
  return lerp(2.6 * PROF.carve(s), MODERN[i].w * PROF[MODERN[i].p](s), m);
}
function brush(c, i, upto) {
  if (upto <= 0) return;
  const pts = strokePts(i);
  const n = pts.length - 1, m = upto * n, mi = Math.floor(m);
  const P = pts.slice(0, mi + 1);
  if (mi < n && m > mi) { const a = pts[mi], b = pts[mi + 1], f = m - mi; P.push([lerp(a[0], b[0], f), lerp(a[1], b[1], f)]); }
  if (P.length < 2) return;
  const Lft = [], Rgt = [];
  for (let j = 0; j < P.length; j++) {
    const a = P[Math.max(0, j - 1)], b = P[Math.min(P.length - 1, j + 1)];
    let tx = b[0] - a[0], ty = b[1] - a[1]; const l = Math.hypot(tx, ty) || 1; tx /= l; ty /= l;
    const s = Math.min(1, (j / (P.length - 1)) * (m / n));
    const w = strokeW(i, s) / 2;
    Lft.push([P[j][0] - ty * w, P[j][1] + tx * w]); Rgt.push([P[j][0] + ty * w, P[j][1] - tx * w]);
  }
  c.beginPath(); c.moveTo(Lft[0][0], Lft[0][1]);
  for (const p of Lft) c.lineTo(p[0], p[1]);
  for (let j = Rgt.length - 1; j >= 0; j--) c.lineTo(Rgt[j][0], Rgt[j][1]);
  c.closePath(); c.fill();
  const e0 = P[0], e1 = P[P.length - 1];
  c.beginPath(); c.arc(e0[0], e0[1], strokeW(i, 0) / 2, 0, 6.283); c.arc(e1[0], e1[1], strokeW(i, Math.min(1, m / n)) / 2, 0, 6.283); c.fill();
}
function glyphCam(c) { setCam(c); c.translate(GL.cx - 50 * GL.s, GL.cy - 50 * GL.s); c.scale(GL.s, GL.s); }
function toLocal(wx, wy) { return { x: (wx - (GL.cx - 50 * GL.s)) / GL.s, y: (wy - (GL.cy - 50 * GL.s)) / GL.s }; }
function localToScreen(lx, ly) { return toScreen(GL.cx + (lx - 50) * GL.s, GL.cy + (ly - 50) * GL.s); }

/* ---------- 关键交互坐标辅助函数（同时服务用户操作与 Playwright 自动化测试） ---------- */
function saplingPoint(u = W.twinMove) {
  const x3d = lerp(4.3, 1.55, clamp(u));
  return world3DToScreen(x3d, 1.5, 0.55);
}
function windPoint(u = 0) {
  const x3d = lerp(-4.2, 4.2, clamp(u));
  const y3d = 2.4 + Math.sin(u * Math.PI) * 1.4;
  return world3DToScreen(x3d, y3d, -0.5);
}
function rootPoint() {
  return world3DToScreen(-1.55, 0.95, 0.6);
}

const WORDS = [
  ['森林', '双木成林，万木汇聚，便成苍翠森林。'],
  ['森郁', '枝叶层层叠叠，林间生机盎然。'],
  ['森罗万象', '飞鸟、流泉与四季万物，皆藏于林海之中。'],
];

function drawGlyphOverlay() {
  const g = W.glyph;
  if (g.alpha <= 0.001) return;
  ctx.save();
  if (g.rays > 0) {
    setCam(ctx);
    ctx.globalCompositeOperation = 'lighter';
    const t = clock / 1000, R = GL.s * 115;
    for (let i = 0; i < 16; i++) {
      const a = i / 16 * 6.283 + t * 0.04, w = 0.05 + 0.025 * Math.sin(t * 0.6 + i * 1.5);
      const gr = ctx.createRadialGradient(GL.cx, GL.cy, GL.s * 18, GL.cx, GL.cy, R);
      gr.addColorStop(0, `rgba(118,200,147,${(0.08 * g.rays * g.alpha).toFixed(3)})`);
      gr.addColorStop(1, 'rgba(118,200,147,0)');
      ctx.fillStyle = gr;
      ctx.beginPath(); ctx.moveTo(GL.cx, GL.cy); ctx.arc(GL.cx, GL.cy, R, a - w, a + w); ctx.closePath(); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  glyphCam(ctx);
  ctx.globalAlpha = g.alpha;
  // 宣纸米字格底衬（描红阶段显现）
  if (g.ghost > 0) {
    ctx.save();
    ctx.globalAlpha = g.alpha * g.ghost * 0.35;
    ctx.strokeStyle = '#74c69d';
    ctx.lineWidth = 0.35;
    ctx.strokeRect(4, 4, 92, 92);
    ctx.setLineDash([1.5, 1.5]);
    ctx.beginPath();
    ctx.moveTo(50, 4); ctx.lineTo(50, 96);
    ctx.moveTo(4, 50); ctx.lineTo(96, 50);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();

    ctx.save();
    ctx.globalAlpha = g.alpha * g.ghost;
    ctx.fillStyle = '#22382e';
    for (let i = 0; i < STROKE_COUNT; i++) brush(ctx, i, 1);
    ctx.restore();
  }

  const m = ease.inOut(g.morph);
  const col = [lerp(233, 242, m) | 0, lerp(196, 234, m) | 0, lerp(106, 213, m) | 0];
  ctx.fillStyle = `rgb(${col})`;
  ctx.shadowColor = `rgba(118,200,147,.85)`;
  ctx.shadowBlur = g.glow * 22 * DPR * Math.min(1.4, CV.k * 1.4);

  for (let i = 0; i < STROKE_COUNT; i++) {
    if (g.prog[i] <= 0) continue;
    if (g.split > 0) {
      // 三木分色展示：上木金翠、左木青碧（第8笔点用朱砂金高亮）、右木苍翠
      if (i === 7) ctx.fillStyle = '#f4a261';
      else if (i < 4) ctx.fillStyle = '#e9c46a';
      else if (i < 8) ctx.fillStyle = '#74c69d';
      else ctx.fillStyle = '#f2e8d5';
    } else {
      ctx.fillStyle = `rgb(${col})`;
    }
    brush(ctx, i, g.prog[i]);
  }
  ctx.shadowBlur = 0;

  if (g.labels > 0) {
    ctx.globalAlpha = g.alpha * g.labels;
    ctx.strokeStyle = 'rgba(233,196,106,.75)';
    ctx.lineWidth = 0.5;
    ctx.beginPath();
    // 右侧大括号标注上「木」与下「林」
    ctx.moveTo(96, 8); ctx.quadraticCurveTo(99, 8, 99, 13); ctx.lineTo(99, 38); ctx.quadraticCurveTo(99, 43, 96, 43);
    ctx.moveTo(96, 48); ctx.quadraticCurveTo(99, 48, 99, 53); ctx.lineTo(99, 86); ctx.quadraticCurveTo(99, 91, 96, 91);
    // 左侧指示线指向左下木第8笔「点」
    ctx.moveTo(3, 66); ctx.lineTo(36, 66);
    ctx.stroke();
    ctx.font = '8px "Kaiti SC","STKaiti","KaiTi",serif';
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'start';
    ctx.fillStyle = '#e9c46a'; ctx.fillText('木（冠顶）', 102, 26);
    ctx.fillStyle = '#74c69d'; ctx.fillText('林（并立）', 102, 70);
    ctx.textAlign = 'end';
    ctx.fillStyle = '#f4a261'; ctx.fillText('捺变点·相让', 1, 66);
    ctx.textAlign = 'start';
  }
  if (g.trace) drawTraceUI(ctx);
  ctx.restore();
  if (g.words > 0) drawWords();
}

function drawTraceUI(c) {
  const T = W.trace;
  if (T.stroke >= STROKE_COUNT) return;
  const pts = MPTS[T.stroke];
  c.globalAlpha = W.glyph.alpha;
  c.strokeStyle = 'rgba(138,224,168,.88)';
  c.lineWidth = 0.65;
  c.setLineDash([1.6, 1.6]);
  c.beginPath(); c.moveTo(pts[0][0], pts[0][1]);
  for (const p of pts) c.lineTo(p[0], p[1]);
  c.stroke();
  c.setLineDash([]);

  const a = pts[N - 3], b = pts[N];
  const ang = Math.atan2(b[1] - a[1], b[0] - a[0]);
  c.fillStyle = 'rgba(138,224,168,.9)';
  c.beginPath();
  c.moveTo(b[0] + Math.cos(ang) * 2.3, b[1] + Math.sin(ang) * 2.3);
  c.lineTo(b[0] + Math.cos(ang + 2.5) * 2.3, b[1] + Math.sin(ang + 2.5) * 2.3);
  c.lineTo(b[0] + Math.cos(ang - 2.5) * 2.3, b[1] + Math.sin(ang - 2.5) * 2.3);
  c.fill();

  const [sx, sy] = pts[0];
  const pulse = 0.5 + 0.5 * Math.sin(clock / 210);
  c.fillStyle = `rgba(233,196,106,${(0.28 * pulse).toFixed(3)})`;
  c.beginPath(); c.arc(sx, sy, 3.5 + pulse * 1.6, 0, 6.283); c.fill();
  c.fillStyle = '#e9c46a';
  c.beginPath(); c.arc(sx, sy, 2.1, 0, 6.283); c.fill();
  c.font = '600 4.6px "PingFang SC","Helvetica Neue",sans-serif';
  c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillStyle = '#fff3d1';
  c.fillText(String(T.stroke + 1), sx - 5.2, sy - 3.5);
  c.textAlign = 'start';

  if (T.pen) {
    c.fillStyle = '#fff8e6';
    c.shadowColor = 'rgba(118,200,147,.95)';
    c.shadowBlur = 12 * DPR;
    c.beginPath(); c.arc(T.pen[0], T.pen[1], 2.0, 0, 6.283); c.fill();
    c.shadowBlur = 0;
  }
}

function drawWords() {
  setCam(ctx);
  const g = W.glyph;
  const y = GL.cy + GL.s * 50 + 66, gap = 190;
  ctx.font = '40px "Kaiti SC","STKaiti","KaiTi",serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  WORDS.forEach(([w], i) => {
    const a = clamp(g.words - i) * g.alpha;
    if (a <= 0) return;
    const on = W.wordOn === i;
    ctx.globalAlpha = a * (on ? 1 : 0.58);
    ctx.fillStyle = on ? '#e9c46a' : '#d8e8de';
    ctx.shadowColor = 'rgba(118,200,147,.8)';
    ctx.shadowBlur = on ? 16 * DPR : 0;
    ctx.fillText(w, GL.cx + (i - 1) * gap, y + (1 - clamp(g.words - i)) * 12);
  });
  ctx.shadowBlur = 0; ctx.globalAlpha = 1; ctx.textAlign = 'start';
}

function drawInteractiveGuides() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  // 第一幕：浇水光环提示
  if (W.waterPrompt > 0.01) {
    const p = rootPoint();
    const pulse = (clock % 1500) / 1500;
    ctx.strokeStyle = `rgba(144,224,239,${(0.75 * (1 - pulse) * W.waterPrompt).toFixed(3)})`;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(p.x, p.y, 26 + pulse * 36, 0, 6.283); ctx.stroke();
    ctx.strokeStyle = `rgba(233,196,106,${(0.65 * W.waterPrompt).toFixed(3)})`;
    ctx.setLineDash([5, 6]);
    ctx.beginPath(); ctx.arc(p.x, p.y, 28, 0, 6.283); ctx.stroke();
    ctx.setLineDash([]);
  }
  // 第二幕：拖动第二株树苗到孤木旁的引导虚线
  if (W.twinTarget > 0.01) {
    const p0 = saplingPoint(W.twinMove);
    const p1 = saplingPoint(1);
    ctx.strokeStyle = `rgba(118,200,147,${(0.55 * W.twinTarget).toFixed(3)})`;
    ctx.lineWidth = 2; ctx.setLineDash([6, 6]);
    ctx.beginPath(); ctx.moveTo(p0.x, p0.y); ctx.lineTo(p1.x, p1.y); ctx.stroke();
    ctx.beginPath(); ctx.arc(p1.x, p1.y, 28, 0, 6.283); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = `rgba(233,196,106,${(0.85 * W.twinTarget).toFixed(3)})`;
    ctx.beginPath(); ctx.arc(p0.x, p0.y, 8, 0, 6.283); ctx.fill();
  }
  // 第三幕：吹拂春风的流光轨迹提示
  if (W.windTarget > 0.01) {
    ctx.strokeStyle = `rgba(233,196,106,${(0.55 * W.windTarget).toFixed(3)})`;
    ctx.lineWidth = 2.2; ctx.setLineDash([7, 7]);
    ctx.beginPath();
    for (let i = 0; i <= 20; i++) {
      const q = windPoint(i / 20);
      if (i === 0) ctx.moveTo(q.x, q.y); else ctx.lineTo(q.x, q.y);
    }
    ctx.stroke(); ctx.setLineDash([]);
    const head = windPoint((clock % 2200) / 2200);
    ctx.fillStyle = `rgba(138,224,168,${(0.85 * W.windTarget).toFixed(3)})`;
    ctx.beginPath(); ctx.arc(head.x, head.y, 7, 0, 6.283); ctx.fill();
  }
  // 2D 飘散灵气粒子与汇聚笔画粒子
  if (W.converge.length) {
    setCam(ctx);
    ctx.globalCompositeOperation = 'lighter';
    for (const p of W.converge) {
      const t = clamp((clock - p.t0 - p.delay) / p.dur);
      if (t <= 0 || t >= 1) continue;
      const e = ease.inOut(t);
      const x = lerp(p.sx, p.tx, e) + Math.sin(e * Math.PI) * p.curl;
      const y = lerp(p.sy, p.ty, e) - Math.sin(e * Math.PI) * 35;
      const a = Math.sin(Math.PI * t);
      ctx.fillStyle = `rgba(138,224,168,${(a * 0.9).toFixed(3)})`;
      ctx.beginPath(); ctx.arc(x, y, p.s * (1.2 - e * 0.4), 0, 6.283); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
  }
  if (W.spirits.length) {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.globalCompositeOperation = 'lighter';
    for (const sp of W.spirits) {
      const a = clamp(1 - sp.age / 3800);
      ctx.fillStyle = `rgba(233,196,106,${(a * 0.85).toFixed(3)})`;
      ctx.beginPath(); ctx.arc(sp.x + Math.sin(sp.age / 320 + sp.p) * 14, sp.y, 4.5, 0, 6.283); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
  }
}

function render3D() {
  if (!renderer || !scene || !camera) return;
  const t = clock / 1000;
  const season = SEASONS[W.season] || SEASONS[0];

  // 更新材质颜色与荒漠->青绿过渡
  const lushC = new THREE.Color(season.groundSand).lerp(new THREE.Color(season.groundLush), smooth(W.lush));
  matGround.color.copy(lushC);
  matGround.opacity = lerp(1.0, 0.36, W.xray);
  matUnder.opacity = lerp(0.92, 0.55, W.xray);
  rootLight.intensity = W.xray * 3.5 + W.tree0Root * 1.6;

  const leafTarget = new THREE.Color(season.leafA).lerp(new THREE.Color(season.leafB), 0.35 + 0.25 * Math.sin(t * 0.8));
  matFoliage.color.copy(leafTarget);
  matRay.color.set(season.ray);
  matRay.opacity = W.rays3D * (0.11 + 0.03 * Math.sin(t * 1.4));
  scene.fog.color.set(season.fog);

  // 更新三棵主松状态
  const windSway0 = W.storm * (0.28 + 0.12 * Math.sin(t * 7.5)) * (1 - W.twinBond * 0.72) + Math.sin(t * 1.4) * 0.025;
  const windSway1 = W.storm * (0.14 + 0.06 * Math.sin(t * 7.2 + 1)) * (1 - W.twinBond * 0.55) + Math.sin(t * 1.4 + 1.2) * 0.025;
  updateTreeGrowth(heroTrees[0], W.tree0Grow, W.tree0Root, windSway0, W.leftTrim);

  heroTrees[1].position.x = lerp(4.3, 1.55, smooth(W.twinMove));
  updateTreeGrowth(heroTrees[1], W.tree1Grow, W.tree1Grow, windSway1, 0);

  updateTreeGrowth(heroTrees[2], W.tree2Grow, W.tree2Grow, Math.sin(t * 1.2 + 2) * 0.02, 0);

  // 更新漫山遍野背景松林
  for (const bt of bgTrees) {
    const localG = clamp((W.forestWave - bt.userData.delay * 0.65) / 0.35);
    updateTreeGrowth(bt, localG, 0, Math.sin(t * 1.5 + bt.position.x) * 0.02, 0);
  }

  // 种子与浇灌水柱
  seedMesh.visible = W.seedAlpha > 0.01;
  seedMesh.scale.setScalar(Math.max(0.01, W.seedAlpha * (1 + 0.12 * Math.sin(t * 4))));
  seedMesh.rotation.y = t * 1.5;
  waterStream.material.opacity = W.watering ? 0.55 + 0.2 * Math.sin(t * 18) : 0;

  // 少年动作
  boyGroup.position.x = lerp(-2.95, -2.55, W.tree0Grow);
  boyGroup.rotation.z = W.watering ? -0.14 : (W.storm * 0.12 * (1 - W.twinBond));

  // 飞鸟环绕
  birds.forEach(b => {
    b.visible = W.birds > 0.05;
    if (!b.visible) return;
    const d = b.userData;
    const a = t * d.speed + d.phase;
    b.position.set(Math.cos(a) * d.rad, d.y + Math.sin(t * 2 + d.phase) * 0.25, Math.sin(a) * d.rad - 1.5);
    b.rotation.y = -a;
    const flap = Math.sin(t * 9 + d.phase) * 0.45;
    d.wL.rotation.z = flap;
    d.wR.rotation.z = -flap;
  });

  // 粒子飘动（风沙或森林灵气）
  if (particleSys) {
    const arr = particleSys.geometry.attributes.position.array;
    const vx = (W.storm * 0.16 + 0.015) * (DT / 16);
    const vy = (W.lush > 0.5 ? 0.015 : -0.01) * (DT / 16);
    for (let i = 0; i < arr.length; i += 3) {
      arr[i] += vx;
      arr[i + 1] += vy;
      if (arr[i] > 12) arr[i] = -12;
      if (arr[i + 1] > 8) arr[i + 1] = -1;
      if (arr[i + 1] < -1.5) arr[i + 1] = 7.5;
    }
    particleSys.geometry.attributes.position.needsUpdate = true;
    particleSys.material.color.set(W.lush > 0.4 ? season.ray : '#d4a373');
  }

  // 相机位置与终幕环绕旋转
  const yaw = W.orbitYaw + (!reduceMotion && W.drift ? Math.sin(t * 0.25) * 0.04 : 0);
  worldGroup.rotation.y = yaw;
  camera.fov = portrait ? curCam3D.pfov : curCam3D.fov;
  camera.updateProjectionMatrix();
  camera.position.set(curCam3D.x, curCam3D.y, curCam3D.z);
  camera.lookAt(curCam3D.tx, curCam3D.ty, curCam3D.tz);

  renderer.render(scene, camera);
}

function render() {
  updateView();
  render3D();

  const w = cvs.width, h = cvs.height;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, w, h);

  // 如果 WebGL 未启用，绘制优雅的保底水墨山林背景
  if (!renderer) {
    const g = ctx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, '#081813'); g.addColorStop(1, '#1c3b2e');
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  }

  // 成字与描红阶段的半透明水墨夜幕遮罩
  if (W.veil > 0.001) {
    ctx.fillStyle = `rgba(6,14,11,${(W.veil * 0.76).toFixed(3)})`;
    ctx.fillRect(0, 0, w, h);
  }

  drawInteractiveGuides();
  drawGlyphOverlay();
}

let last = null;
function loop(now) {
  if (last == null) last = now;
  DT = Math.min(50, Math.max(0, now - last));
  last = now;
  clock += DT;
  for (const sp of W.spirits) { sp.age += DT; sp.y -= DT * 0.032; }
  W.spirits = W.spirits.filter(sp => sp.age < 3800);
  render();
  const list = waiters; waiters = [];
  for (const wt of list) { if (wt.tk.dead) wt.rej(new Cancelled()); else wt.res(clock); }
  requestAnimationFrame(loop);
}

/* ---------- UI 字幕与输入绑定 ---------- */
const ui = {

};
const CHAR_MS = 65;
let capMinEnd = 0;
function span(cls, text) { const s = document.createElement('span'); if (cls) s.className = cls; s.textContent = text; return s; }
function showCaption(title, text) {
  ui.capT.textContent = window.haqiHanziUi ? window.haqiHanziUi(title, ui.capT) : title;
  ui.capP.replaceChildren(...[...text].map((c, i) => { const s = span('ch', c); s.style.setProperty('--i', i); return s; }));

}
async function caption(title, text, tk, hold = 0) {
  window.haqiHanziPrefetch?.([title, text]);

  const n = [...text].length;
  capMinEnd = clock + Math.max(reduceMotion ? 1200 : n * CHAR_MS + 1100, n * 135) + 500 + hold;
}
async function captionDone(tk) { while (clock < capMinEnd) await frame(tk); }
function hint(text) {
  if (text) { const s = span('', ''); s.textContent = window.haqiHanziUi ? window.haqiHanziUi(text, s) : text; ui.hint.replaceChildren(s); ui.hint.classList.add('on'); }
  else ui.hint.classList.remove('on');
}
function progress(i) { ui.prog.forEach((li, j) => { li.classList.toggle('on', j === i); li.classList.toggle('done', j < i); }); }
function mode(m) {

  if (m) document.body.classList.add(m);

}
let actionFn = null;
function setAction(label, fn) {
  actionFn = fn;
  if (label) { ui.action.textContent = window.haqiHanziUi ? window.haqiHanziUi(label, ui.action) : label; ui.action.hidden = false; } else ui.action.hidden = true;
  ui.action.classList.remove('holding');
}

const S = { handler: null, mode: null, interactions: [] };
let activePointer = null;
cvs.addEventListener('pointerdown', e => {
  if (!e.isPrimary || activePointer != null) return;
  const h = S.handler; if (!h || !h.down) return;
  activePointer = e.pointerId;
  try { cvs.setPointerCapture(e.pointerId); } catch {}
  e.preventDefault();
  h.down(toWorld(e.clientX, e.clientY), { x: e.clientX, y: e.clientY }, e);
});
cvs.addEventListener('pointermove', e => {
  if (e.pointerId !== activePointer) return;
  const h = S.handler; if (!h || !h.move) return;
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
  for (const ev of evs.length ? evs : [e]) h.move(toWorld(ev.clientX, ev.clientY), { x: ev.clientX, y: ev.clientY }, ev);
});
function pointerEnd(e, cancel) {
  if (e.pointerId !== activePointer) return;
  activePointer = null;
  const h = S.handler;
  if (h && h.up) h.up(toWorld(e.clientX, e.clientY), { x: e.clientX, y: e.clientY }, cancel);
}
cvs.addEventListener('pointerup', e => pointerEnd(e, false));
cvs.addEventListener('pointercancel', e => pointerEnd(e, true));
cvs.addEventListener('lostpointercapture', e => pointerEnd(e, true));

function holdButton(on) {
  if (S.mode !== 'hold') return;
  W.holding = on;
  ui.action.classList.toggle('holding', on);
  if (on) W.everHeld = true;
}
ui.action.addEventListener('pointerdown', e => {
  if (S.mode === 'hold') { e.preventDefault(); try { ui.action.setPointerCapture(e.pointerId); } catch {} holdButton(true); }
});
for (const ev of ['pointerup', 'pointercancel', 'lostpointercapture']) ui.action.addEventListener(ev, () => holdButton(false));
ui.action.addEventListener('click', () => { if (S.mode !== 'hold' && actionFn) actionFn(); });
ui.demo.addEventListener('click', () => { if (S.demo) S.demo(); });
ui.seasons.forEach(btn => {

    ui.seasons.forEach(b => b.classList.toggle('active', b === btn));

});

function spawnConverge() {
  const list = [];
  const r = mulberry32(88);
  const treeScreens = [
    world3DToScreen(0, 3.6, -2.1),
    world3DToScreen(-1.55, 2.1, 0.6),
    world3DToScreen(1.55, 2.1, 0.55),
  ];
  for (let i = 0; i < STROKE_COUNT; i++) {
    const tIdx = Math.floor(i / 4);
    const src = treeScreens[tIdx];
    const wSrc = toWorld(src.x, src.y);
    for (let j = 0; j <= N; j += 4) {
      const [lx, ly] = OPTS[i][j];
      list.push({
        sx: wSrc.x + (r() - 0.5) * 70,
        sy: wSrc.y + (r() - 0.5) * 70,
        tx: GL.cx + (lx - 50) * GL.s,
        ty: GL.cy + (ly - 50) * GL.s,
        delay: r() * 750 + i * 75,
        dur: 1200 + r() * 500,
        s: 1.5 + r() * 2.0,
        curl: (r() - 0.5) * 95,
        t0: clock,
      });
    }
  }
  W.converge = list;
}

async function sWrite(tk) {
  progress(5);
  await caption('写字', '「森」一共十二笔，由三个「木」组成。跟着光点写一写。', tk);

    W.glyph.prog = W.glyph.prog.map(() => 1 - t);
    W.glyph.ghost = t;
  }, tk);
  W.glyph.prog.fill(0);
  W.glyph.trace = true;
  W.trace = { stroke: 0, pen: null };
  W.drift = 0;

  const names = MODERN.map(s => s.name);
  const showStroke = () => {
    capMinEnd = 0;
    showCaption('写字', `第 ${W.trace.stroke + 1} / ${STROKE_COUNT} 笔 · ${names[W.trace.stroke]}`);
    hint(W.trace.stroke === 7 ? '注意：左下木第四笔是「点」，把位置让给右边的木' : '从金色光点起笔，顺着虚线写到箭头处');
  };
  await captionDone(tk);
  showStroke();

  let samples = null, drag = null, lastInput = clock, demoing = false, completed = 0, invalidHint = 0;
  const prepare = () => { samples = MPTS[W.trace.stroke]; };
  prepare();
  const finishStroke = () => {
    const i = W.trace.stroke;
    W.glyph.prog[i] = 1;
    Sound.pluck(PENTA[i % PENTA.length], 0.13, 2.0);
    W.trace.stroke++;
    completed++;
    if (W.trace.stroke < STROKE_COUNT) {
      prepare();
      showStroke();
    } else if (!demoing && !S.interactions.includes('demo') && !S.interactions.includes('auto')) {
      S.interactions.push('user');
    }
  };
  const tolLocal = () => Math.max(7.5, 24 / (CV.k * GL.s));
  S.handler = {
    down(p) {
      if (demoing) return;
      lastInput = clock;
      const q = toLocal(p.x, p.y);
      if (Math.hypot(q.x - samples[0][0], q.y - samples[0][1]) > tolLocal() * 1.35) {
        hint('从这一笔的金色光点开始写哦');
        return;
      }
      drag = { idx: 0, bad: false };
    },
    move(p) {
      if (!drag) return;
      lastInput = clock;
      const q = toLocal(p.x, p.y);
      let best = drag.idx, bd = Infinity;
      for (let j = Math.max(0, drag.idx - 3); j < Math.min(samples.length, drag.idx + 16); j++) {
        const d = Math.hypot(q.x - samples[j][0], q.y - samples[j][1]);
        if (d < bd) { bd = d; best = j; }
      }
      if (bd > tolLocal()) { drag.bad = true; return; }
      if (drag.bad) return;
      drag.idx = Math.max(drag.idx, best);
      W.glyph.prog[W.trace.stroke] = drag.idx / N;
    },
    up(p, sPt, cancel) {
      if (!drag) return;
      const d = drag; drag = null;
      if (!cancel && !d.bad && d.idx >= N - 4) { finishStroke(); return; }
      const i = W.trace.stroke, from = W.glyph.prog[i];
      bg(tween(240, t => { if (W.trace.stroke === i) W.glyph.prog[i] = from * (1 - t); }, tk));
      if (clock - invalidHint > 400) {
        hint(d.bad ? '偏离虚线啦，从金色光点重新写这一笔' : '把这一笔一直写到箭头终点');
        invalidHint = clock;
      }
    },
  };

  const demo = async () => {
    if (demoing || W.trace.stroke >= STROKE_COUNT) return;
    demoing = true; ui.demo.disabled = true; drag = null;
    hint('看光点示范每一笔的顺序与避让');
    while (W.trace.stroke < STROKE_COUNT) {
      const i = W.trace.stroke;
      W.glyph.prog[i] = 0;
      await tween(550 * M, t => {
        W.glyph.prog[i] = t;
        const pts = MPTS[i];
        W.trace.pen = pts[Math.round(t * N)];
      }, tk, ease.sine);
      W.trace.pen = null;
      finishStroke();
      await wait(140, tk);
    }
  };
  S.demo = () => { S.interactions.push('demo'); bg(demo()); };
  mode('trace');
  ui.demo.hidden = false;
  lastInput = clock;
  let nudged = false;
  while (W.trace.stroke < STROKE_COUNT) {
    await frame(tk);
    if (!demoing && !nudged && clock - lastInput > 14000) { hint('也可以点下方“看示范”跟着写'); nudged = true; }
    if (!demoing && completed === 0 && clock - lastInput > 26000) { S.interactions.push('auto'); bg(demo()); }
  }
  S.handler = null; S.demo = null; mode(null); hint(null);
  ui.demo.hidden = true; ui.demo.disabled = false;
  W.glyph.trace = false;
  window.haqiHanziWritten?.();
  await tween(600, t => { W.glyph.ghost = 1 - t; }, tk);
  Sound.bell(NOTE.C5, 0.11); Sound.bell(NOTE.G5, 0.08);
  await caption('写字', '写好了！三木成森，苍翠满山。', tk);
  await captionDone(tk);
  W.drift = 1;
}

async function sWords(tk) {
  const g0 = { ...GL };
  await tween(1400 * M, t => { GL.cy = lerp(g0.cy, 455, t); GL.s = lerp(g0.s, 2.9, t); W.glyph.rays = t; }, tk);
  for (let i = 0; i < WORDS.length; i++) {
    W.wordOn = i;
    Sound.pluck(PENTA[4 + i], 0.12);
    bg(tween(550, t => { W.glyph.words = Math.max(W.glyph.words, i + t); }, tk, ease.out));
    await caption(WORDS[i][0], WORDS[i][1], tk);
  }
  await captionDone(tk);
  W.wordOn = -1;
}

async function sFinale(tk) {
  progress(6);
  bg(cam3DTo(CAM3D.finale, 3600 * M, tk));
  await tween(2000 * M, t => {
    W.glyph.alpha = 1 - t;
    W.veil = 1 - t;
  }, tk);
  W.glyph = { ...W.glyph, alpha: 0, words: 0, rays: 0 };
  $('#seasonBar').classList.add('on');

  await caption('森罗万象', '每一片浩瀚的森林，都始于泥土里那一颗不肯放弃的种子。', tk);
  await captionDone(tk);
  hint('左右拖动旋转 3D 森林山峦 · 点击画面升起森林萤火');
  mode('orbit');
  setAction('再看一次', () => { Sound.init(); begin(); });

  let dragOrbit = null;
  S.handler = {
    down(wPt, sPt) {
      dragOrbit = { x0: sPt.x, yaw0: W.orbitYaw, moved: false };
    },
    move(wPt, sPt) {
      if (!dragOrbit) return;
      const dx = sPt.x - dragOrbit.x0;
      if (Math.abs(dx) > 4) dragOrbit.moved = true;
      W.orbitYaw = dragOrbit.yaw0 + dx * 0.008;
    },
    up(wPt, sPt) {
      if (dragOrbit && !dragOrbit.moved) {
        W.spirits.push({ x: sPt.x, y: sPt.y, age: 0, p: rand() * 6.28 });
        Sound.pluck(PENTA[(rand() * PENTA.length) | 0], 0.09, 2.2);
      }
      dragOrbit = null;
      hint(null);
    },
  };
  window.__sen.finished = true; window.haqiHanziComplete();
}

const SCENES = [sBarren, sSprout, sTwin, sForest, sGlyph, sWrite, sWords, sFinale];

async function begin() {
  token.dead = true;
  const tk = token = { dead: false };
  capMinEnd = 0;
  waiters.forEach(w => w.rej(new Cancelled())); waiters = [];
  resetWorld();
  Object.assign(curCam3D, CAM3D.intro);
  S.handler = null; S.demo = null; mode(null); setAction(null); hint(null);
  ui.demo.hidden = true; ui.demo.disabled = false;
  ui.cap.classList.remove('on');
  ui.seasons.forEach((b, idx) => b.classList.toggle('active', idx === 0));
  Sound.water(false);
  rand = mulberry32(20261015);
  S.interactions = [];
  window.__sen = {
    interactions: S.interactions, scene: null, finished: false,
    toScreen, localToScreen, strokes: MPTS, saplingPoint, windPoint, rootPoint, state: W,
  };
  W.glyph.alpha = 1; W.glyph.prog.fill(1); W.glyph.morph = 1;
  try {
    for (const sc of SCENES) { window.__sen.scene = sc.name; await sc(tk); }
  } catch (e) {
    if (!(e instanceof Cancelled)) console.error(e);
  }
}

/* ---------- 片头：3D 水墨山谷前逐笔写出「森」 ---------- */
const intro = { tk: { dead: false } };
function placeIntro() {
  if (intro.tk.dead) return;
  const a = localToScreen(50, 2), b = localToScreen(50, 96);
  const box = $('#intro');
  box.style.setProperty('--gTop', `${a.y - 12}px`);
  box.style.setProperty('--gBottom', `${b.y + 8}px`);
}
async function introPlay(tk) {
  W.glyph.alpha = 1; W.glyph.morph = 1; W.glyph.prog.fill(0);
  W.lush = 0.65; W.tree0Grow = 1; W.tree1Grow = 1; W.twinMove = 1; W.tree2Grow = 1; W.forestWave = 0.7;
  await wait(450, tk);
  for (let i = 0; i < STROKE_COUNT; i++) {
    await tween(190, t => { W.glyph.prog[i] = t; }, tk, ease.sine);
    await wait(35, tk);
  }
  for (;;) {
    await frame(tk);
    W.glyph.glow = 1 + 0.25 * Math.sin(clock / 680);
  }
}

init3D();
resetWorld();
Object.assign(curCam3D, CAM3D.intro);
window.__sen = {
  interactions: [], scene: 'intro', finished: false,
  toScreen, localToScreen, strokes: MPTS, saplingPoint, windPoint, rootPoint, state: W,
};
resize();
updateView();
addEventListener('resize', () => { resize(); updateView(); placeIntro(); });
requestAnimationFrame(loop);
requestAnimationFrame(() => { updateView(); placeIntro(); });
bg(introPlay(intro.tk));

$('#start').addEventListener('click', () => {
  Sound.init(); Sound.pad();
  intro.tk.dead = true;
  $('#intro').classList.add('off');
  document.body.classList.add('started');
  W.glyph.glow = 1;
  begin();
});
$('#replay').addEventListener('click', () => { Sound.init(); begin(); });
$('#mute').addEventListener('click', e => {
  Sound.setMuted(!Sound.muted);
  const zh = Sound.muted ? '声音 关' : '声音 开';
  e.currentTarget.textContent = window.haqiHanziUi ? window.haqiHanziUi(zh, e.currentTarget) : zh;
});
addEventListener('blur', () => { W.holding = false; ui.action.classList.remove('holding'); });
</script>

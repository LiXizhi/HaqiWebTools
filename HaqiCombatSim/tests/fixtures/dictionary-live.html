<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>字典真实服务验收</title><link rel="stylesheet" href="../../css/adventure.css"><link rel="stylesheet" href="../../css/adventure_storybook.css"><link rel="stylesheet" href="../../css/dictionary.css"><style>body{margin:0;background:#315c49;color:#fff}main{max-width:680px;margin:5vh auto;padding:24px;line-height:1.8}button{margin:6px}#overlay:not(:empty){position:fixed;inset:0;display:grid;place-items:center;background:#173d35b8;z-index:10}#scope{position:fixed;bottom:0;padding:6px;background:#fff9e9;color:#244f3b;z-index:20;font-size:12px}#status{white-space:pre-wrap}</style></head><body class="haqi-app"><main><h1>字典真实服务验收</h1><p>使用游戏现有 Keepwork 模型和语音接口。练习、加成和复习记录只保存在本页面内存，刷新后清空，不读取或写入玩家存档。</p><button id="check">检查已有登录</button><button id="login">登录 Keepwork</button><button id="zh" disabled>体验中文</button><button id="en" disabled>体验英文</button><p id="status" role="status">尚未连接。登录后可以检验小老师、情境题、朗读与可选语音输入。</p><p>建议检查：让小老师解释 help 与 help me 的用法；用自己的句子回答情境题；尝试词和例句朗读；在等待或录音时返回页面。模型回答需要人工核对，不以接口成功代替教学质量验收。</p></main><div id="overlay"></div><p id="scope">隔离验收：练习记录仅在内存；真实模型与语音请求使用当前登录账号。</p><script type="module" src="dictionary-live.js"></script></body></html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>魔法哈奇 · 2D 冒险</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/game.css">
</head>
<body class="game">
<div id="app">
  <canvas id="game" aria-label="哈奇小镇"></canvas>
  <section id="title" class="screen">
    <div class="title-card">
      <p class="eyebrow">Haqi 2D · 哈奇小镇</p>
      <h1>魔法哈奇</h1>
      <p>基于哈奇 <code>config/Aries</code> 的世界、NPC、任务与怪物数据，以及共享的确定性战斗内核。像素画像自绘，地图与卡面来自 CDN 原始美术。</p>
      <div id="title-continue" hidden></div>
      <form id="create" class="create-form" autocomplete="off">
        <label class="label">名字 <input id="create-name" maxlength="12" placeholder="小哈奇"></label>
        <div class="label">学派</div>
        <div id="create-school" class="pick-row" role="radiogroup"></div>
        <div class="label">形象</div>
        <div id="create-gender" class="pick-row" role="radiogroup">
          <button type="button" class="pick" data-gender="boy" aria-pressed="true"><canvas width="48" height="64" data-preview="boy"></canvas><span>男孩</span></button>
          <button type="button" class="pick" data-gender="girl" aria-pressed="false"><canvas width="48" height="64" data-preview="girl"></canvas><span>女孩</span></button>
        </div>
        <div class="row">
          <button type="submit" class="primary" id="create-start">开始冒险</button>
          <label class="button quiet">导入存档<input id="import-profile" type="file" accept="application/json" hidden></label>
          <a class="button quiet" href="HaqiCombatEmulator.html">战斗模拟器</a>
        </div>
      </form>
      <p id="title-status" class="muted">正在加载数据…</p>
    </div>
  </section>
  <div id="hud" hidden>
    <div id="status" class="panel-lite">
      <img id="status-school" class="school-icon" alt="">
      <div class="status-text">
        <div class="row spread"><strong id="status-name"></strong><span id="status-level" class="pill"></span></div>
        <div class="bar hp"><span id="status-hp"></span><em id="status-hp-text"></em></div>
        <div class="bar exp"><span id="status-exp"></span><em id="status-exp-text"></em></div>
        <div id="status-money" class="money"></div>
      </div>
    </div>
    <div id="menu-bar">
      <button data-menu="journal" title="任务 (J)">任务</button>
      <button data-menu="inventory" title="背包 (I)">背包</button>
      <button data-menu="deck" title="卡组 (B)">卡组</button>
      <button data-menu="map" title="地图 (M)">地图</button>
      <button data-menu="system" title="系统">系统</button>
    </div>
    <aside id="tracker" class="panel-lite"></aside>
    <div id="hint" hidden></div>
    <div id="world-name" class="pill"></div>
  </div>
  <section id="dialog" class="dialog" hidden>
    <div class="dialog-portrait"><canvas id="dialog-portrait" width="96" height="96"></canvas></div>
    <div class="dialog-body">
      <div class="dialog-name" id="dialog-name"></div>
      <div class="dialog-text" id="dialog-text"></div>
      <div class="dialog-buttons" id="dialog-buttons"></div>
    </div>
  </section>
  <section id="battle-ui" hidden>
    <div id="battle-top" class="row spread"><span id="battle-turn" class="pill"></span><span id="battle-hint"></span></div>
    <div id="battle-log"></div>
    <div id="battle-hand"></div>
    <div id="battle-actions" class="row"><button id="battle-pass">跳过回合</button><button id="battle-flee" class="quiet">逃跑</button></div>
    <div id="battle-result" class="panel" hidden></div>
  </section>
  <section id="modal" hidden><div class="modal-card"><div class="modal-head"><h2 id="modal-title"></h2><button id="modal-close" class="quiet">关闭</button></div><div id="modal-body"></div></div></section>
  <div id="toasts"></div>
  <div id="notice" class="notice" hidden></div>
</div>
<script type="module" src="js/game/main.js"></script>
</body>
</html>

<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>地球世界隔离验收</title><base href="../../">
<link rel="stylesheet" href="../../css/adventure.css"><link rel="stylesheet" href="../../css/adventure_storybook.css"><link rel="stylesheet" href="../../css/adventure_world_map.css"><link rel="stylesheet" href="../../css/adventure_earth.css">
<body class="haqi-app"><canvas id="world" tabindex="0"></canvas><div id="overlay"></div><div style="position:fixed;top:8px;left:8px;z-index:4;display:flex;gap:6px;flex-wrap:wrap;max-width:95vw" id="tools"></div><output id="result" style="position:fixed;bottom:40px;left:4px;z-index:5;background:#fff8e7;color:#234;padding:8px;max-width:95vw">正在加载隔离场景…</output>
<script type="module">
import {createEarthWalkProbe} from '../../tests/fixtures/earth-walk-probe.js';
import {performanceDiagnostics as perf} from '../../js/performance_diagnostics.js';
import {restorePveBattle,playPveRound} from '../../js/combat_pve_core.js';
import {SimpleBot} from '../../js/combat_policy_core.js';
import {loadResources} from '../../js/adventure_assets.js';
import {createAdventure,beginEncounter,recordDecision,settleEncounter} from '../../js/adventure_core.js';
import {createWorld,movePosition,invalidateWorldObjects,nearestInteraction} from '../../js/adventure_world_core.js';
import {createRenderer} from '../../js/adventure_renderer.js';
import {gearScoreV2} from '../../js/combat_formulas_core.js';
import {playerSpec} from '../../js/adventure_core.js';
import {createEarthService} from '../../js/adventure_earth.js';
import {earthNearest,earthGeo,earthChapterEvent,distanceToRoad} from '../../js/adventure_earth_core.js';
import {earthCityStory,earthCityChapterProgress,earthCityQuestOffers,applyEarthCityQuest} from '../../js/adventure_earth_city_config_core.js';
import {renderEarthAtlas,renderEarthLoading,renderEarthStory} from '../../js/view_adventure_earth.js';
import {renderMaps} from '../../js/view_adventure_maps.js';
import {createIslandSocial} from '../../js/adventure_social_controller.js';
import {createRuntimeStore} from '../../js/adventure_runtime_store.js';

const output=document.querySelector('#result'),root=document.querySelector('#overlay'),canvas=document.querySelector('#world'),tools=document.querySelector('#tools');
let environmentGraphics={particles:true,trails:true,earthLight:'day',earthWeather:'clear'},requests=[],panel=false,atlasView=null,keys=new Set(),now=0,walkProbe=null,dragTarget=null,longProbe=null,longResolve=null,lastLongResult=null;
const assets=await loadResources(p=>output.textContent=p.label),save=createAdventure(assets.content,{name:'地球隔离验收'}),service=createEarthService({content:assets.content,getPlayerLevel:()=>save?.level||1,getPlayerPower:()=>gearScoreV2(playerSpec(save,assets.content)),registerImage:assets.registerImage,releaseImage:assets.releaseImage,prepareAssets:target=>assets.prepareEarthScene(target,save),fetcher:(url,options)=>{requests.push(url);return fetch(url,options);}});
let world=createWorld('camp',assets.content,save);const renderer=createRenderer(canvas,assets);
const social=createIslandSocial({arenaStore:createRuntimeStore({indexedDB:null}),getState:()=>({save,world,assets,paused:panel,locked:panel}),getOwner:()=>null,onChange:()=>{},onPersist:()=>{},onOpen:()=>{},onClose:()=>{},toast:t=>output.textContent=t});
function report(text){output.textContent=text+' · 地球请求 '+requests.length+' · 缓存 '+Math.round(service.cache.bytes/1024)+' KB';}
function close(){panel=false;atlasView?.dispose();atlasView=null;root.replaceChildren();root.className='overlay';canvas.focus();}
async function travel(geo){try{const p=await service.prepare(geo);world=p.world;save.zone='earth';save.position=p.position;assets.content.earthWorld=world;world.onObjectsChanged=(change={})=>{invalidateWorldObjects(world,change);if(!change.wildOnly&&change.socialChanged!==false)void social.refreshEarth();};close();await assets.warmScenery(world);await assets.warmNearby(world,save);await social.enter();report(`抵达 ${geo.lon}, ${geo.lat}；居民 ${world.npcs.length}；建筑 ${world.buildings.length}；怪物 ${world.encounters.length}`);}catch(e){report(e.stack);}}
async function atlas(){panel=true;renderEarthLoading(root,{close});try{const data=await service.atlas();atlasView=renderEarthAtlas(root,data,{close,switchWorld:id=>id==='earth'?atlas():showMap('world'),viewport:b=>service.viewport(b),travel});report('浏览地图：没有加载城市人物或任务');}catch(e){report(e.stack);}}
function showMap(view='local'){panel=true;renderMaps(root,world,{assets,save,socialActors:social.actors},{close,draw:(c,o)=>renderer.minimap(c,world,save,o),travel:()=>{},teleport:()=>{},teleportToPosition:()=>{},switchMap:showMap,switchWorld:id=>id==='earth'?atlas():showMap('world')},view);report('当前地图：不加载地球数据');}
function chooser(){if(world.isEarth)void atlas();else showMap();}
async function story(){
 const npc=world.npcs.filter(n=>n.earthNpc).sort((a,b)=>Math.hypot(a.x-save.position.x,a.y-save.position.y)-Math.hypot(b.x-save.position.x,b.y-save.position.y))[0];
 if(!npc){report('请靠近城市居民');return;}
 const data=await service.story(),narrative=earthCityStory(save,data.city,npc);panel=true;
 renderEarthStory(root,{...data,assets,npc,story:narrative,progress:earthCityChapterProgress(save,data.quests),questOffers:earthCityQuestOffers(save,data.city,npc.id)},{close,advance:()=>{earthChapterEvent(save,data.quests,narrative.event);close();report('章节进度 '+earthCityChapterProgress(save,data.quests).step);},choose:c=>{if(c.correct){earthChapterEvent(save,data.quests,narrative.event);close();}report(c.reply);},quest:offer=>{applyEarthCityQuest(save,data.city,npc.id,offer.quest.id,offer.kind);report(offer.kind==='complete'?offer.quest.completion:offer.kind==='talk'?offer.objective.reply:offer.quest.description);void story();},practice:()=>report('学习交互在正式入口复用语音聊天'),go:atlas});
}
async function defense(){await travel({lon:114.55,lat:22.62});const e=world.encounters.find(e=>e.chapterEvent==='defense');if(!e)throw Error('防御目标不可用');beginEncounter(save,assets.content,e.id);const battle=restorePveBattle(assets.dataset,assets.content,save.pendingEncounter),bot=new SimpleBot();while(!battle.finished){const action=bot.pick(battle,battle.sides.near[0]);playPveRound(battle,action);recordDecision(save,action);}settleEncounter(save,assets.content,battle);report('防御演练 '+battle.winner+'；章节进度 '+save.earthProgress?.step);}
function probeDrag(){probeWalk();if(walkProbe){walkProbe.drag=true;dragTarget={x:canvas.clientWidth*.8,y:renderer.worldToScreen(save.position).y};report('拖动跟随采样中，持续8秒');}}
function probeWalk(){if(walkProbe||!world.isEarth)return;walkProbe={start:performance.now(),position:{...save.position},frames:[],draws:[],travelled:0};keys.add('ArrowRight');report('步行采样中，持续 8 秒');setTimeout(()=>{keys.delete('ArrowRight');const probe=walkProbe;walkProbe=null;dragTarget=null;const sorted=probe.frames.sort((a,b)=>a-b),draws=probe.draws.sort((a,b)=>a-b);report(`${probe.drag?"拖动":"步行"}采样：位移 ${Math.round(Math.hypot(save.position.x-probe.position.x,save.position.y-probe.position.y))}；累计行走 ${Math.round(probe.travelled)}；帧间隔 P95 ${Math.round(sorted[Math.floor(sorted.length*.95)]||0)}ms；绘制 P95 ${(draws[Math.floor(draws.length*.95)]||0).toFixed(2)}ms；`+JSON.stringify(world.surfaceStats));},8000);}
for(const [label,action] of [['附近道路',()=>{const r=world.paths.find(r=>r.connection);if(!r){report('附近没有城市连线');return;}const p=earthNearest(world,(r.a.x+r.b.x)/2,(r.a.y+r.b.y)/2);if(p)save.position=p;report('城市公路：'+r.id);}],['步行采样',probeWalk],['拖动采样',probeDrag],['打开地图',chooser],['进入深圳',()=>travel({lon:114.0579,lat:22.5431})],['野怪草地',async()=>{if(!world.isEarth)await travel({lon:113.9904,lat:22.532});const spawn=(world.wildSpawns||[]).reduce((best,s)=>!best||Math.hypot(s.position.x-save.position.x,s.position.y-save.position.y)<Math.hypot(best.position.x-save.position.x,best.position.y-save.position.y)?s:best,null);if(!spawn){report('当前已加载地形没有可通行的野怪草地');return;}save.position={...spawn.position};service.updateVisible(save.position,{x:save.position.x-500,y:save.position.y-400,w:1000,h:800},0);report('已定位附近野怪草地，角色仅在内存');}],['野怪状态',()=>report(`野怪候选 ${world.wildSpawns?.length||0}；活动 ${world.wildActors?.length||0}；可见 ${world.encounters.filter(e=>e.sceneState?.opacity>.2&&!e.sceneState.retiring).length}；`+JSON.stringify(world.encounters.filter(e=>e.sceneState).map(e=>({name:e.monster.name,level:e.monster.level,power:e.monster.gearScore,opacity:Math.round(e.sceneState.opacity*100)/100}))))],['地表状态',()=>report(JSON.stringify(world.surfaceStats||{}))],['深圳湾',()=>travel({lon:113.9904,lat:22.532})],['蛇口',()=>travel({lon:113.9139,lat:22.483})],['华强北',()=>travel({lon:114.0864,lat:22.543})],['大鹏',()=>travel({lon:114.521,lat:22.594})],['防御演练',defense],['纽约',()=>travel({lon:-73.985,lat:40.758})],['交谈',()=>void story()]]){const b=document.createElement('button');b.textContent=label;b.onclick=()=>Promise.resolve(action()).catch(e=>report(e.stack));tools.append(b);}
const residents=document.createElement('select');residents.setAttribute('aria-label','选择深圳居民');residents.innerHTML='<option value="">选择居民</option><option value="990001">林澄</option><option value="990005">陈梅</option><option value="990006">黄磊</option><option value="990007">亚历克斯</option><option value="990008">玛雅</option>';residents.onchange=async()=>{if(!world.city){report('请先进入深圳');return;}const npc=world.city.npcs.find(n=>n.id===Number(residents.value));if(npc){await travel(npc);await story();}};tools.append(residents);
for(const [key,label,options] of [['earthLight','光照',['auto','day','dusk','night']],['earthWeather','天气',['auto','clear','rain','snow','fog','sand','off']]]){const select=document.createElement('select');select.setAttribute('aria-label',label);for(const value of options){const option=document.createElement('option');option.value=value;option.textContent=({auto:'自动',day:'白昼',dusk:'黄昏',night:'夜晚',clear:'晴朗',rain:'下雨',snow:'下雪',fog:'薄雾',sand:'风沙',off:'关闭'})[value];select.append(option);}select.value=environmentGraphics[key];select.onchange=()=>{environmentGraphics[key]=select.value;report(label+'：'+select.selectedOptions[0].textContent);};tools.append(select);}
const ambientStats=document.createElement('button');ambientStats.textContent='环境状态';ambientStats.onclick=()=>report(JSON.stringify(renderer.environmentStats()));tools.append(ambientStats);
addEventListener('keydown',e=>keys.add(e.key));addEventListener('keyup',e=>keys.delete(e.key));
function frame(t){const frameStarted=performance.now();perf.frame(t,!panel);if(walkProbe&&now)walkProbe.frames.push(t-now);const dt=Math.min(.05,(t-now)/1000||0);now=t;if(!panel){let dx=Number(keys.has('ArrowRight'))-Number(keys.has('ArrowLeft')),dy=Number(keys.has('ArrowDown'))-Number(keys.has('ArrowUp'));if(dragTarget){const target=renderer.screenToWorld(dragTarget.x,dragTarget.y),x=target.x-save.position.x,y=target.y-save.position.y,distance=Math.hypot(x,y);dx=distance>6?x/distance:0;dy=distance>6?y/distance:0;}if(walkProbe&&!walkProbe.drag){let road=walkProbe.road;if(!road)road=world.paths.filter(r=>distanceToRoad(save.position,r)<r.width/2).sort((a,b)=>distanceToRoad(save.position,a)-distanceToRoad(save.position,b))[0];if(road&&Math.hypot(road.b.x-save.position.x,road.b.y-save.position.y)<8){road=world.paths.find(r=>r.id!==road.id&&Math.hypot(r.a.x-road.b.x,r.a.y-road.b.y)<1)||road;}walkProbe.road=road;if(road){const length=Math.hypot(road.b.x-road.a.x,road.b.y-road.a.y);dx=(road.b.x-road.a.x)/length;dy=(road.b.y-road.a.y)/length;}}if(longProbe){const d=longProbe.direction(save.position,dt);dx=d.x;dy=d.y;}if(dx||dy){const previous=save.position;save.position=movePosition(world,save.position,dx*210*dt,dy*210*dt);if(longProbe)longProbe.moved(previous,save.position,t);if(walkProbe)walkProbe.travelled+=Math.hypot(save.position.x-previous.x,save.position.y-previous.y);}if(world.isEarth){service.update(save.position,t);service.updateVisible(save.position,renderer.viewRect(),dt);}const socialStart=performance.now();social.step(dt,{view:renderer.viewRect()});perf.record("earth-social-frame",performance.now()-socialStart);const drawStart=performance.now();renderer.render(world,save,t,{graphics:environmentGraphics,socialActors:social.actors,moving:!!(dx||dy)});perf.record("earth-draw",performance.now()-drawStart);if(walkProbe)walkProbe.draws.push(performance.now()-drawStart);if(longProbe&&longProbe.done(t)){lastLongResult={...longProbe.result(save.position),stream:service.streamStats};longProbe=null;longResolve(lastLongResult);report(JSON.stringify(lastLongResult.diagnostics));}}perf.record("earth-frame-work",performance.now()-frameStarted);requestAnimationFrame(frame);}
window.earthWalkingQA={travel,get world(){return world;},save,service,renderer,social,requests,get result(){return lastLongResult;},start(options={}){if(longProbe)throw Error('已有步行采样');if(!world.isEarth)throw Error('请先进入地球');close();keys.clear();perf.reset();longProbe=createEarthWalkProbe(world,save.position,options);return new Promise(resolve=>longResolve=resolve);}};
for(const [label,seconds] of [['连续步行3分钟',180],['往返10分钟',600]]){const b=document.createElement('button');b.textContent=label;b.onclick=()=>void window.earthWalkingQA.start({seconds});tools.append(b);}
await assets.warmScenery(world);report('启动完成：地球请求必须为零');requestAnimationFrame(frame);
</script></body></html>

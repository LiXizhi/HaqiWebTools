<script>
// Haqi H5 protocol v1: independent pages remain usable without a parent.
(()=>{let context=null,written=false,finished=false,serial=0;const callbacks=new Map(),subCache=new Map(),uiCache=new Map(),pending=new Set(),uiNodes=new Map();
const isZh=loc=>!loc||/^zh\b/i.test(loc);
const send=data=>{if(context)parent.postMessage({channel:'haqi-hanzi',version:1,entryId:context.entryId,sessionId:context.sessionId,...data},context.origin);};
const refreshDom=()=>{for(const[el,zh]of uiNodes){if(!el?.isConnected){uiNodes.delete(el);continue;}const tr=!isZh(context?.locale)&&uiCache.get(zh);const next=(tr&&tr!==zh)?tr:zh;if(el.dataset.haqiKind==='seal'){const seal=el.querySelector('.seal');el.textContent=next;if(seal)el.prepend(seal);}else if(el.dataset.haqiKind==='tag'){const i1=document.createElement('i'),i2=document.createElement('i');el.replaceChildren(i1,document.createTextNode(next),i2);}else el.textContent=next;}document.querySelectorAll('[data-haqi-caption]').forEach(el=>renderCaption(el,el.dataset.haqiCaption));};
const flushPending=()=>{if(!context||!pending.size)return;const texts=[...pending];pending.clear();window.haqiHanziTranslate(texts);};
const ensureTexts=texts=>{const need=[];for(const t of texts){const s=typeof t==='string'?t.trim():'';if(s&&(!subCache.has(s)||!uiCache.has(s))&&!pending.has(s)){pending.add(s);need.push(s);}}if(need.length&&context)flushPending();};
const renderCaption=(el,zh)=>{if(!el)return;el.dataset.haqiCaption=zh||'';let sub=el.querySelector('.haqi-sub-trans');if(!zh||isZh(context?.subtitleLocale||context?.locale)){sub?.remove();return;}const tr=subCache.get(zh);if(!tr||tr===zh){sub?.remove();ensureTexts([zh]);return;}if(!sub){sub=document.createElement('span');sub.className='haqi-sub-trans';const host=el.querySelector('#capText')||el;if(host!==el&&host.parentNode===el)host.insertAdjacentElement('afterend',sub);else el.appendChild(sub);}sub.textContent=tr;};
const trackUi=(el,zh,kind='')=>{if(!el||!zh)return;if(kind)el.dataset.haqiKind=kind;uiNodes.set(el,zh);ensureTexts([zh]);};
const scanStatic=()=>{if(!document.body)return;document.querySelectorAll('#start,#replay,#mute,#pause,#demo,#action,#progress li,#note,.introBottom .mean,.introBottom .sub,.introBottom .meta').forEach(el=>{const zh=(el.textContent||'').trim();if(zh&&!uiNodes.has(el))trackUi(el,zh);});document.querySelectorAll('#brand,.brand').forEach(el=>{if(uiNodes.has(el))return;const clone=el.cloneNode(true);clone.querySelector?.('.seal')?.remove();const zh=(clone.textContent||'').trim();if(zh)trackUi(el,zh,'seal');});document.querySelectorAll('.introTop .tag,.tag').forEach(el=>{if(uiNodes.has(el))return;const zh=(el.textContent||'').trim();if(zh)trackUi(el,zh,'tag');});refreshDom();};
if(document.readyState==='loading')addEventListener('DOMContentLoaded',scanStatic,{once:true});else scanStatic();
window.haqiHanziWritten=()=>{written=true;send({type:'written'});};
window.haqiHanziComplete=()=>{if(!written){written=true;send({type:'written'});}finished=true;send({type:'completed'});};
window.haqiHanziPrefetch=texts=>ensureTexts(Array.isArray(texts)?texts:[texts]);
window.haqiHanziUi=(zh,el)=>{const s=typeof zh==='string'?zh.trim():'';if(!s)return zh;if(el)trackUi(el,s);else ensureTexts([s]);const tr=!isZh(context?.locale)&&uiCache.get(s);return(tr&&tr!==s)?tr:zh;};
window.haqiHanziCaption=(el,zh)=>{const s=typeof zh==='string'?zh.trim():'';if(s)ensureTexts([s]);renderCaption(el,s);};
window.haqiHanziTranslate=texts=>new Promise(resolve=>{const list=(Array.isArray(texts)?texts:[]).map(t=>typeof t==='string'?t.trim():'').filter(Boolean);if(!context||!list.length){resolve({});return;}const requestId=String(++serial);const timer=setTimeout(()=>{callbacks.delete(requestId);resolve({});},1500);callbacks.set(requestId,msg=>{clearTimeout(timer);const sub=msg?.translations||{},ui=msg?.uiTranslations||sub;for(const[k,v]of Object.entries(sub))if(typeof v==='string'&&v.trim())subCache.set(k,v.trim());for(const[k,v]of Object.entries(ui))if(typeof v==='string'&&v.trim())uiCache.set(k,v.trim());refreshDom();resolve(sub);});send({type:'translate',requestId,texts:list});});
addEventListener('message',event=>{const m=event.data;if(event.source!==parent||parent===window||m?.channel!=='haqi-hanzi'||m.version!==1)return;
if(m.type==='init'&&typeof m.sessionId==='string'&&typeof m.entryId==='string'){if(document.referrer&&event.origin!==new URL(document.referrer).origin)return;context={...m,origin:event.origin};scanStatic();flushPending();refreshDom();if(written)send({type:'written'});if(finished)send({type:'completed'});}
else if(context&&event.origin===context.origin&&m.sessionId===context.sessionId&&m.type==='translations'){callbacks.get(m.requestId)?.(m);callbacks.delete(m.requestId);}});
if(parent!==window)parent.postMessage({channel:'haqi-hanzi',version:1,type:'ready'},'*');})();
</script>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const mix = (a, b, t) => ({ x: lerp(a.x, b.x, t), y: lerp(a.y, b.y, t) });
const ease = { inOut: t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2, out: t => 1 - Math.pow(1 - t, 3), sine: t => -(Math.cos(Math.PI * t) - 1) / 2, lin: t => t };
function mulberry32(a){return()=>{a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const Q = new URLSearchParams(location.search);
const FAST = Q.has('fast') ? 0.05 : 1;
const AUTO = Q.has('auto');
const M = reduceMotion ? 0.55 : 1;
let rand = mulberry32(20261024);
class Cancelled extends Error {}
let clock = 0, DT = 16, paused = false, visible = true;
let waiters = [];

const bg = p => p.catch(e => { if (!(e instanceof Cancelled)) console.error(e); });

/* ---------- sound: WebAudio only ---------- */
const NOTE = { G3:196, D4:293.66, E4:329.63, G4:392, A4:440, B4:493.88, D5:587.33, E5:659.26, G5:783.99 };
const PENTA = [NOTE.D4, NOTE.E4, NOTE.G4, NOTE.A4, NOTE.B4, NOTE.D5, NOTE.E5];
const Sound = {
  ctx:null, master:null, noise:null, muted:false,
  init(){ if(this.ctx){if(this.ctx.state==='suspended')this.ctx.resume();return;} const C=window.AudioContext||window.webkitAudioContext; if(!C)return; try{this.ctx=new C();}catch{return;} this.master=this.ctx.createGain(); this.master.gain.value=this.muted?0:0.5; this.master.connect(this.ctx.destination); const len=this.ctx.sampleRate, buf=this.ctx.createBuffer(1,len,this.ctx.sampleRate), d=buf.getChannelData(0), r=mulberry32(7); for(let i=0;i<len;i++)d[i]=r()*2-1; this.noise=buf; },
  setMuted(v){this.muted=v;if(this.master)this.master.gain.value=v?0:0.5;},

  pluck(f,g=0.07){this.tone(f,0.45,'triangle',g);},
  bell(f){this.tone(f,0.8,'sine',0.045);},

};

/* ---------- canvas & camera ---------- */
const cvs = $('#view'), ctx = cvs.getContext('2d');
let SW=1, SH=1, DPR=1, portrait=false;

const CV = { x:0, y:0, k:1, cy:0 };
const VIEW = {
  intro:{x:1500,y:620,w:1500,h:900,pw:820,pcy:0.42},
  gate:{x:1880,y:800,w:980,h:720,pw:620,pcy:0.40},
  path:{x:1400,y:700,w:1380,h:880,pw:720,pcy:0.40},
  reveal:{x:680,y:450,w:920,h:680,pw:580,pcy:0.38},
  glyph:{x:1200,y:540,w:1320,h:1120,pw:820,pcy:0.38},
  finale:{x:760,y:500,w:1380,h:880,pw:780,pcy:0.44},
};
function frameW(v){return portrait?(v.pw??v.w*0.62):v.w;}
function updateView(){ const usableH=SH*(portrait?0.62:0.78); CV.k=Math.min(SW/frameW(cam),usableH/cam.h); CV.cy=SH*cam.pcy; CV.x=cam.x; CV.y=cam.y; }
function setCam(c){ const k=CV.k; c.setTransform(DPR*k,0,0,DPR*k,DPR*(SW/2-CV.x*k),DPR*(CV.cy-CV.y*k)); }
function resetTf(c=ctx){c.setTransform(DPR,0,0,DPR,0,0);}
function toWorld(cx,cy){return{x:(cx-SW/2)/CV.k+CV.x,y:(cy-CV.cy)/CV.k+CV.y};}

async function camTo(v,ms,tk,ez=ease.inOut){ const from={x:cam.x,y:cam.y,w:cam.w,h:cam.h,pw:cam.pw??cam.w*0.62,pcy:cam.pcy}; const to={x:v.x,y:v.y,w:v.w,h:v.h,pw:v.pw??v.w*0.62,pcy:v.pcy??0.46}; await tween(ms,t=>{for(const k in to)cam[k]=lerp(from[k],to[k],t);},tk,ez); }

function densify(pts,step=14){ const out=[[pts[0][0],pts[0][1]]]; for(let i=1;i<pts.length;i++){ const a=pts[i-1],b=pts[i],d=Math.hypot(b[0]-a[0],b[1]-a[1]),n=Math.max(1,Math.ceil(d/step)); for(let k=1;k<=n;k++)out.push([a[0]+(b[0]-a[0])*k/n,a[1]+(b[1]-a[1])*k/n]); } return out; }
const GUIDE = JING.medians.map(p=>densify(p));

const W = {};
function resetWorld(){
  W.walker = { x:PATH[0].x, y:PATH[0].y, dir:-1, phase:0, s:1.5, alpha:1 };
  W.step = 0;               // stones reached (targets are PATH[1..6])
  W.curtain = 0;            // 0 shut .. 1 parted
  W.clear = 0;              // mist cleared
  W.lamp = 0;
  W.veil = 0; W.paper = 0; W.labels = 0;
  W.glyph = { alpha:0, ghost:0, prog:Array(8).fill(0), trace:false, words:0, light:false };
  W.trace = null; W.wordOn = -1; W.finale = false; W.sparks = [];
  placeGlyph(1200, 300, portrait?240:320);
}

/* ---------- drawing ---------- */
function ribbon(pts,half){ const L=[],R=[]; for(let i=0;i<pts.length;i++){ const a=pts[Math.max(0,i-1)],b=pts[Math.min(pts.length-1,i+1)]; let tx=b.x-a.x,ty=b.y-a.y; const len=Math.hypot(tx,ty)||1; tx/=len;ty/=len; L.push([pts[i].x-ty*half,pts[i].y+tx*half]); R.push([pts[i].x+ty*half,pts[i].y-tx*half]); } return L.concat(R.reverse()); }
function fillPoly(pts,color){ ctx.beginPath(); pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.closePath(); ctx.fillStyle=color; ctx.fill(); }
function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

  ctx.fillStyle=g; ctx.fillRect(0,0,SW,SH);
  const sun=toScreen(520,240);
  const rg=ctx.createRadialGradient(sun.x,sun.y,8,sun.x,sun.y,Math.max(SW,SH)*0.55);
  rg.addColorStop(0,`rgba(255,240,200,${0.35+W.clear*0.5})`); rg.addColorStop(0.3,`rgba(240,205,140,${0.10+W.clear*0.16})`); rg.addColorStop(1,'rgba(240,205,140,0)');

}

function drawPathStones(){
  setCam(ctx);
  // a faint earthen way under the stones, so the route reads as ground, not floating marks
  fillPoly(ribbon(PATH,30),'rgba(196,178,132,.30)');
  fillPoly(ribbon(PATH,15),'rgba(226,208,164,.28)');
  // the walked way glows behind the walker
  if(W.step>0){
    ctx.save(); ctx.strokeStyle='rgba(255,214,150,.75)'; ctx.lineWidth=7; ctx.lineCap='round'; ctx.setLineDash([2,16]);
    ctx.beginPath(); ctx.moveTo(PATH[0].x,PATH[0].y);
    for(let i=1;i<=W.step;i++) ctx.lineTo(PATH[i].x,PATH[i].y);
    ctx.lineTo(W.walker.x,W.walker.y); ctx.stroke(); ctx.restore();
  }
  PATH.forEach((p,i)=>{
    const reached=i<=W.step, isNext=i===W.step+1 && i<=6;
    ctx.save(); ctx.translate(p.x,p.y);
    ctx.fillStyle='rgba(20,40,28,.3)'; ctx.beginPath(); ctx.ellipse(3,7,40,14,0,0,6.283); ctx.fill();
    ctx.fillStyle=reached?'#cbb98d':'#7d8b84';
    ctx.beginPath(); ctx.ellipse(0,0,38,13,-0.08,0,6.283); ctx.fill();
    ctx.fillStyle=reached?'rgba(255,226,160,.85)':'rgba(255,255,255,.22)';
    ctx.beginPath(); ctx.ellipse(-8,-4,20,6,-0.08,0,6.283); ctx.fill();
    if(isNext && document.body.classList.contains('started')){
      const t=reduceMotion?0.5:(clock%1500)/1500;
      ctx.strokeStyle=`rgba(255,222,150,${0.95-t*0.4})`; ctx.lineWidth=3/CV.k+1.4;
      ctx.beginPath(); ctx.ellipse(0,-4,44+t*20,17+t*7,-0.08,0,6.283); ctx.stroke();
      ctx.fillStyle='#fff3d0'; ctx.beginPath(); ctx.arc(0,-6,4.5,0,6.283); ctx.fill();
    }
    ctx.restore();
  });
}
function drawBambooStalk(b){
  const sway=reduceMotion?0:Math.sin(clock/1600+b.ph)*4;
  ctx.save(); ctx.translate(b.x,b.y); ctx.scale(b.s,b.s);
  ctx.strokeStyle='#2e6b47'; ctx.lineWidth=13; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(0,0); ctx.quadraticCurveTo(b.lean*0.4+sway,-b.h*0.55,b.lean+sway*1.6,-b.h); ctx.stroke();
  ctx.strokeStyle='rgba(220,240,200,.35)'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(-4,0); ctx.quadraticCurveTo(b.lean*0.4+sway-4,-b.h*0.55,b.lean+sway*1.6-4,-b.h); ctx.stroke();
  ctx.strokeStyle='rgba(16,44,30,.6)'; ctx.lineWidth=2;
  for(let k=1;k<=4;k++){ const y=-b.h*k/5; ctx.beginPath(); ctx.moveTo(-7,y); ctx.lineTo(7,y); ctx.stroke(); }
  ctx.strokeStyle='#3f8455'; ctx.lineWidth=3;
  for(let k=0;k<7;k++){
    const y=-b.h*(0.38+k*0.09), dirn=k%2?1:-1, len=54+((k*29)%30);
    const bx=b.lean*(0.4+k*0.09);
    ctx.beginPath(); ctx.moveTo(bx,y);
    ctx.quadraticCurveTo(bx+dirn*len*0.6,y-10,bx+dirn*len,y+8); ctx.stroke();
    ctx.fillStyle=k%2?'rgba(84,164,104,.85)':'rgba(58,128,80,.85)';
    for(const sgn of [1,0.55]){
      ctx.beginPath(); ctx.ellipse(bx+dirn*len*sgn,y+8*sgn,21*sgn+6,6,dirn*0.55,0,6.283); ctx.fill();
    }
  }
  ctx.restore();
}
function drawBamboo(front){
  setCam(ctx);
  for(const b of BAMBOO){ if(Boolean(b.front)===front) drawBambooStalk(b); }

function drawCurtain(){
  if(W.curtain>=0.99) return;
  setCam(ctx);
  const c=W.curtain;
  ctx.save(); ctx.globalAlpha=1-c*0.92;
  // a hanging screen of bamboo leaves hiding the pavilion clearing
  for(let i=0;i<14;i++){
    const x=330+i*26 - c*(i%2?150:-40), topY=90+((i*53)%60);
    ctx.save(); ctx.translate(x,topY); ctx.rotate((i%5-2)*0.09 - c*0.5*(i%2?1:-0.4));
    ctx.strokeStyle='#2e6b47'; ctx.lineWidth=7; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,330); ctx.stroke();
    ctx.fillStyle='rgba(64,138,88,.92)';
    for(let k=0;k<7;k++){ const y=30+k*44, d=k%2?1:-1; ctx.beginPath(); ctx.ellipse(d*20,y,24,7,d*0.6,0,6.283); ctx.fill(); }
    ctx.restore();

}
function drawMist(){
  setCam(ctx);
  const a=0.34*(1-W.clear*0.85);
  if(a<=0.02) return;
  const t=reduceMotion?0:clock/1000;
  ctx.save();
  for(let i=0;i<9;i++){
    const x=260+((i*271)%1900)+Math.sin(t*0.16+i)*36, y=300+(i*83)%480, r=230+(i%3)*60;
    ctx.save(); ctx.translate(x,y); ctx.scale(1,0.22);
    const g=ctx.createRadialGradient(0,0,10,0,0,r);
    g.addColorStop(0,`rgba(240,244,232,${a})`); g.addColorStop(0.65,`rgba(240,244,232,${a*0.45})`); g.addColorStop(1,'rgba(240,244,232,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,r,0,6.283); ctx.fill();
    ctx.restore();

}
function drawMotes(){
  setCam(ctx); const t=reduceMotion?0:clock/1000;

function drawWalker(){
  const p=W.walker; if(p.alpha<=0.02) return;
  setCam(ctx); ctx.save(); ctx.globalAlpha=p.alpha; ctx.translate(p.x,p.y); ctx.scale(p.s,p.s);
  const bob=reduceMotion?0:Math.sin(p.phase+clock/460)*2;
  ctx.translate(0,bob);

  const face=p.dir||-1, step=reduceMotion?0:Math.sin(p.phase*2)*7;
  ctx.strokeStyle='#2c2118'; ctx.lineWidth=5.4; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(face*3,-34); ctx.lineTo(face*15-step*0.2,3); ctx.moveTo(face*-2,-32); ctx.lineTo(face*-7+step,2); ctx.stroke();
  ctx.fillStyle='#f2e3c8'; ctx.beginPath(); ctx.ellipse(face*15-step*0.2,3,6.6,3.4,0,0,6.283); ctx.ellipse(face*-7+step,2,5.6,3,0,0,6.283); ctx.fill();

  ctx.fillStyle='#2f6f6a'; ctx.beginPath(); ctx.moveTo(-17,-80); ctx.lineTo(-21,-30); ctx.quadraticCurveTo(0,-16,21,-30); ctx.lineTo(15,-80); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#e9d9ae'; ctx.fillRect(-15,-56,28,5.5);
  ctx.fillStyle='#245450'; ctx.fillRect(face>0?-2:-7, -78, 9, 46);

  ctx.fillStyle='#241c16'; ctx.beginPath(); ctx.arc(face*7,-96,1.7,0,6.283); ctx.fill();
  ctx.fillStyle='#d9b264'; ctx.beginPath(); ctx.ellipse(face*1,-108,27,8.5,0,0,6.283); ctx.fill();
  ctx.beginPath(); ctx.moveTo(face*1-16,-108); ctx.quadraticCurveTo(face*1,-124,face*1+16,-108); ctx.closePath(); ctx.fill();
  ctx.restore();
}
function withGlyph(fn){ ctx.save(); const s=GL.size/1024; ctx.translate(GL.x,GL.y); ctx.scale(s,s); ctx.translate(0,900); ctx.scale(1,-1); fn(ctx); ctx.restore(); }
function paintStroke(c,i,q,color){
  const path=new Path2D(JING.strokes[i]);
  c.fillStyle=color;
  if(q>=1){ c.fill(path); return; }
  if(q<=0) return;
  c.save(); c.clip(path); c.lineWidth=170; c.lineCap='round'; c.lineJoin='round'; c.strokeStyle=color;
  const points=GUIDE[i], count=(points.length-1)*q;
  c.beginPath(); c.moveTo(points[0][0],points[0][1]);
  for(let j=1;j<=Math.floor(count);j++) c.lineTo(points[j][0],points[j][1]);
  const k=Math.floor(count);
  if(k<points.length-1){ const a=points[k],b=points[k+1],f=count-k; c.lineTo(a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f); }
  c.stroke(); c.restore();
}
function strokeColor(i){ return i<3 ? '#b04a32' : '#26332a'; }
function drawPaper(){

}

function drawTraceUI(){
  const T=W.trace; if(!T||T.stroke>=8) return;
  const pts=GUIDE[T.stroke];
  withGlyph(c=>{

  } else if(name==='ghost'||name==='stroke1'||name==='done'){
    placeGlyph(1200,540,writeSize()); Object.assign(cam,VIEW.glyph); cam.x=GL.cx; cam.y=GL.cy;
    W.veil=0.55; W.paper=1; W.walker.alpha=0; W.glyph.alpha=1; progress(4);
    if(name==='ghost'){ W.glyph.ghost=1; W.glyph.prog=Array(8).fill(0); W.glyph.trace=true; W.trace={stroke:0,pen:null}; showCaption('写字','第 1 笔，共 8 笔。'); hint('从亮起的起点开始，慢慢跟着走。'); mode('trace'); ui.demo.hidden=false; }
    else if(name==='stroke1'){ W.glyph.ghost=1; W.glyph.prog=[1,1,1,0,0,0,0,0]; W.glyph.trace=true; W.trace={stroke:3,pen:null}; showCaption('写字','第 4 笔，共 8 笔。'); hint('从亮起的起点开始，慢慢跟着走。'); mode('trace'); ui.demo.hidden=false; }
    else { W.glyph.ghost=0; W.glyph.prog=Array(8).fill(1); showCaption('写字','写好了。径，是脚走出来的小路。'); }
    publish(name);
  } else if(name==='finale'){
    Object.assign(cam,VIEW.finale); W.walker.x=560; W.walker.y=392; W.curtain=1; W.lamp=1; W.clear=1; W.step=8; W.finale=true;
    progress(5); showCaption('余韵','路原来不在地上，是在脚下。'); publish('finale');
  }
  render();
}
resetWorld();
Object.assign(cam,VIEW.intro);
window.__jing={ interactions:[], scene:'intro', finished:false, events:[], state:W, pose, medians:JING.medians, strokes:JING.strokes, toScreen, mmahToWorld, path:PATH, completeCurrentStroke(){ S.finish?.(); } };
resize(); render();
document.documentElement.dataset.fixtureReady='1';
addEventListener('resize',()=>{ resize(); render(); });
requestAnimationFrame(loop);
bg(introPlay(token={dead:false}));
$('#start').addEventListener('click',()=>{ Sound.init(); token.dead=true; $('#intro').classList.add('off'); document.body.classList.add('started'); begin(); });
$('#replay').addEventListener('click',()=>{ Sound.init(); if(!document.body.classList.contains('started')){ $('#intro').classList.add('off'); document.body.classList.add('started'); } begin(); });
$('#mute').addEventListener('click',()=>{ Sound.init(); Sound.setMuted(!Sound.muted); ui.mute.setAttribute('aria-pressed',String(Sound.muted)); labelButton(ui.mute,Sound.muted?'开启声音':'静音'); });
$('#pause').addEventListener('click',()=>{ paused=!paused; ui.pause.setAttribute('aria-pressed',String(paused)); labelButton(ui.pause,paused?'继续':'暂停'); if(Sound.ctx)void(paused?Sound.ctx.suspend():Sound.ctx.resume()).catch(()=>{}); });
document.addEventListener('visibilitychange',()=>{ visible=!document.hidden; last=null; });
addEventListener('pagehide',()=>{ token.dead=true; void Sound.ctx?.close().catch(()=>{}); },{once:true});
})();
</script>

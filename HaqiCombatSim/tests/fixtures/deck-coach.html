<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>第二语言配卡提示验收</title><link rel="stylesheet" href="../../css/adventure.css"><link rel="stylesheet" href="../../css/adventure_storybook.css">
<body class="haqi-app"><label>验收语言 <select id="target"><option value="ja">日语</option><option value="ko">韩语</option><option value="en">英语</option></select></label><div id="result" role="status"></div><div id="root"></div><script type="module">
import {loadResources} from '../../js/adventure_assets.js';
import * as A from '../../js/adventure_core.js';
import {renderPanel} from '../../js/view_adventure.js';
// Isolated in memory. No player storage, cloud requests, rewards or mastery writes.
const base=document.createElement('base');base.href=new URL('../../',location.href).href;document.head.append(base);
const assets=await loadResources(),save=A.createAdventure(assets.content,{name:'配卡验收'});
save.xp=assets.content.progression.xpThresholds[8];A.syncProgression(save,assets.content);
save.inventory[24003]=1;A.applyAction(save,assets.content,{type:'equip',itemId:24003});
for(const row of A.availableCardLessons(save,assets.content))save.cards[row.key]=1;
A.applyAction(save,assets.content,{type:'deck',deck:[{key:'Fire_SingleAttack_Level0_120_adv',count:1}]});
save.quests[63012]={accepted:true,claimed:false,progress:{}};
const root=document.querySelector('#root'),target=document.querySelector('#target'),result=document.querySelector('#result');
function paint(){save.languageLearning.target=target.value;renderPanel(root,'deck',{assets,save,shopView:{}},{close:()=>{root.replaceChildren();result.textContent='卡包已保存';},action:value=>A.applyAction(save,assets.content,value),panel:()=>{}});}
target.onchange=paint;paint();
</script></body></html>

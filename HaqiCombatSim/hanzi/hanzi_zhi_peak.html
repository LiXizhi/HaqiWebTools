<style>

<script>
// Haqi H5 protocol v1: independent pages remain usable without a parent.
(()=>{let context=null,written=false,finished=false,serial=0;const callbacks=new Map(),subCache=new Map(),uiCache=new Map(),pending=new Set(),uiNodes=new Map();

const send=data=>{if(context)parent.postMessage({channel:'haqi-hanzi',version:1,entryId:context.entryId,sessionId:context.sessionId,...data},context.origin);};
const refreshDom=()=>{for(const[el,zh]of uiNodes){if(!el?.isConnected){uiNodes.delete(el);continue;}const tr=!isZh(context?.locale)&&uiCache.get(zh);const next=(tr&&tr!==zh)?tr:zh;if(el.dataset.haqiKind==='seal'){const seal=el.querySelector('.seal');el.textContent=next;if(seal)el.prepend(seal);}else if(el.dataset.haqiKind==='tag'){const i1=document.createElement('i'),i2=document.createElement('i');el.replaceChildren(i1,document.createTextNode(next),i2);}else el.textContent=next;}document.querySelectorAll('[data-haqi-caption]').forEach(el=>renderCaption(el,el.dataset.haqiCaption));};
const flushPending=()=>{if(!context||!pending.size)return;const texts=[...pending];pending.clear();window.haqiHanziTranslate(texts);};
const ensureTexts=texts=>{const need=[];for(const t of texts){const s=typeof t==='string'?t.trim():'';if(s&&(!subCache.has(s)||!uiCache.has(s))&&!pending.has(s)){pending.add(s);need.push(s);}}if(need.length&&context)flushPending();};
const renderCaption=(el,zh)=>{if(!el)return;el.dataset.haqiCaption=zh||'';let sub=el.querySelector('.haqi-sub-trans');if(!zh||isZh(context?.subtitleLocale||context?.locale)){sub?.remove();return;}const tr=subCache.get(zh);if(!tr||tr===zh){sub?.remove();ensureTexts([zh]);return;}if(!sub){sub=document.createElement('span');sub.className='haqi-sub-trans';const host=el.querySelector('#capText')||el;if(host!==el&&host.parentNode===el)host.insertAdjacentElement('afterend',sub);else el.appendChild(sub);}sub.textContent=tr;};
const trackUi=(el,zh,kind='')=>{if(!el||!zh)return;if(kind)el.dataset.haqiKind=kind;uiNodes.set(el,zh);ensureTexts([zh]);};
const scanStatic=()=>{if(!document.body)return;document.querySelectorAll('#start,#replay,#mute,#pause,#demo,#action,#progress li,#note,.introBottom .mean,.introBottom .sub,.introBottom .meta').forEach(el=>{const zh=(el.textContent||'').trim();if(zh&&!uiNodes.has(el))trackUi(el,zh);});document.querySelectorAll('#brand,.brand').forEach(el=>{if(uiNodes.has(el))return;const clone=el.cloneNode(true);clone.querySelector?.('.seal')?.remove();const zh=(clone.textContent||'').trim();if(zh)trackUi(el,zh,'seal');});document.querySelectorAll('.introTop .tag,.tag').forEach(el=>{if(uiNodes.has(el))return;const zh=(el.textContent||'').trim();if(zh)trackUi(el,zh,'tag');});refreshDom();};
if(document.readyState==='loading')addEventListener('DOMContentLoaded',scanStatic,{once:true});else scanStatic();
window.haqiHanziWritten=()=>{written=true;send({type:'written'});};
window.haqiHanziComplete=()=>{if(!written){written=true;send({type:'written'});}finished=true;send({type:'completed'});};
window.haqiHanziPrefetch=texts=>ensureTexts(Array.isArray(texts)?texts:[texts]);
window.haqiHanziUi=(zh,el)=>{const s=typeof zh==='string'?zh.trim():'';if(!s)return zh;if(el)trackUi(el,s);else ensureTexts([s]);const tr=!isZh(context?.locale)&&uiCache.get(s);return(tr&&tr!==s)?tr:zh;};
window.haqiHanziCaption=(el,zh)=>{const s=typeof zh==='string'?zh.trim():'';if(s)ensureTexts([s]);renderCaption(el,s);};
window.haqiHanziTranslate=texts=>new Promise(resolve=>{const list=(Array.isArray(texts)?texts:[]).map(t=>typeof t==='string'?t.trim():'').filter(Boolean);if(!context||!list.length){resolve({});return;}const requestId=String(++serial);const timer=setTimeout(()=>{callbacks.delete(requestId);resolve({});},1500);callbacks.set(requestId,msg=>{clearTimeout(timer);const sub=msg?.translations||{},ui=msg?.uiTranslations||sub;for(const[k,v]of Object.entries(sub))if(typeof v==='string'&&v.trim())subCache.set(k,v.trim());for(const[k,v]of Object.entries(ui))if(typeof v==='string'&&v.trim())uiCache.set(k,v.trim());refreshDom();resolve(sub);});send({type:'translate',requestId,texts:list});});
addEventListener('message',event=>{const m=event.data;if(event.source!==parent||parent===window||m?.channel!=='haqi-hanzi'||m.version!==1)return;
if(m.type==='init'&&typeof m.sessionId==='string'&&typeof m.entryId==='string'){if(document.referrer&&event.origin!==new URL(document.referrer).origin)return;context={...m,origin:event.origin};scanStatic();flushPending();refreshDom();if(written)send({type:'written'});if(finished)send({type:'completed'});}
else if(context&&event.origin===context.origin&&m.sessionId===context.sessionId&&m.type==='translations'){callbacks.get(m.requestId)?.(m);callbacks.delete(m.requestId);}});
if(parent!==window)parent.postMessage({channel:'haqi-hanzi',version:1,type:'ready'},'*');})();

    const sea = c.createBufferSource(); sea.buffer = buf; sea.loop = true;
    const slp = c.createBiquadFilter(); slp.type = 'lowpass'; slp.frequency.value = 480;
    this.seaGain = c.createGain(); this.seaGain.gain.value = 0.022;
    sea.connect(slp); slp.connect(this.seaGain); this.seaGain.connect(this.master);
    sea.start();
  },
  setMuted(v) {
    this.muted = v;
    if (this.master && this.ctx) this.master.gain.setTargetAtTime(v ? 0 : 0.68, this.ctx.currentTime, 0.06);
  },
  stoneRise(idx = 0) {
    if (!this.ctx || this.muted) return;
    const c = this.ctx, t = c.currentTime;
    const o = c.createOscillator(), g = c.createGain();
    o.type = 'triangle';
    o.frequency.setValueAtTime(92 + idx * 24, t);
    o.frequency.exponentialRampToValueAtTime(145 + idx * 32, t + 0.45);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.18, t + 0.05);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.9);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + 0.95);
    this.surf(0.7, 0.055);
  },
  templeBell(freq = NOTE.G4, vol = 0.11) {
    if (!this.ctx || this.muted) return;
    const c = this.ctx, t = c.currentTime;
    for (const [r, a, d] of [[1, 1, 2.8], [2.0, 0.4, 2.0], [2.76, 0.25, 1.3]]) {
      const o = c.createOscillator(), g = c.createGain();
      o.type = 'sine'; o.frequency.value = freq * r;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(vol * a, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.connect(g); g.connect(this.master);
      o.start(t); o.stop(t + d + 0.04);
    }
  },
  pluck(freq, vol = 0.12, dur = 1.6) {
    if (!this.ctx || this.muted) return;
    const c = this.ctx, t = c.currentTime;
    for (const [m, a, tp] of [[1, 1, 'triangle'], [2, 0.35, 'sine']]) {
      const o = c.createOscillator(), g = c.createGain();
      o.type = tp; o.frequency.value = freq * m;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(vol * a, t + 0.014);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur / m);
      o.connect(g); g.connect(this.master);
      o.start(t); o.stop(t + dur + 0.04);
    }
  },
  eagle() {
    if (!this.ctx || this.muted) return;
    const c = this.ctx, t = c.currentTime;
    const o = c.createOscillator(), g = c.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(1480, t);
    o.frequency.exponentialRampToValueAtTime(980, t + 0.42);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.055, t + 0.04);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.46);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + 0.5);
  },
  surf(dur = 0.65, vol = 0.045, freq = 900) {
    if (!this.ctx || !this.noise || this.muted) return;
    const c = this.ctx, t = c.currentTime;
    const s = this.createNoise(c);
    const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = freq; bp.Q.value = 0.85;
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.12);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(bp); bp.connect(g); g.connect(this.master);
    this.nCursor = (this.nCursor + 0.27) % 1.2;
    s.start(t, this.nCursor); s.stop(t + dur + 0.05);
  },
  createNoise(c) { const s = c.createBufferSource(); s.buffer = this.noise; return s; },
};

function densify(pts, step) {
  const out = [[pts[0][0], pts[0][1]]];
  for (let i = 1; i < pts.length; i++) {
    const a = pts[i - 1], b = pts[i];
    const n = Math.max(1, Math.ceil(Math.hypot(b[0] - a[0], b[1] - a[1]) / step));
    for (let k = 1; k <= n; k++) out.push([lerp(a[0], b[0], k / n), lerp(a[1], b[1], k / n)]);
  }
  return out;
}
function resamplePoly(pts, count = 64) {
  const d = [0];
  for (let i = 1; i < pts.length; i++) d.push(d[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
  const total = d[d.length - 1] || 1, out = [];
  let j = 0;
  for (let i = 0; i <= count; i++) {
    const target = total * i / count;
    while (j < d.length - 2 && d[j + 1] < target) j++;
    const seg = (d[j + 1] - d[j]) || 1, f = clamp((target - d[j]) / seg);
    out.push([lerp(pts[j][0], pts[j + 1][0], f), lerp(pts[j][1], pts[j + 1][1], f)]);
  }
  return out;
}
function bezierChain(segs) {
  const pts = [];
  for (const s of segs) {
    for (let i = 0; i <= 20; i++) {
      const t = i / 20, u = 1 - t;
      if (s.length === 4) {
        pts.push([
          u * u * u * s[0][0] + 3 * u * u * t * s[1][0] + 3 * u * t * t * s[2][0] + t * t * t * s[3][0],
          u * u * u * s[0][1] + 3 * u * u * t * s[1][1] + 3 * u * t * t * s[2][1] + t * t * t * s[3][1],
        ]);
      } else pts.push([lerp(s[0][0], s[1][0], t), lerp(s[0][1], s[1][1], t)]);
    }
  }
  return resamplePoly(pts, 64);
}

  ctx.quadraticCurveTo(1220, 530, 1680, 575);
  ctx.quadraticCurveTo(2050, 470, 2360, seaBase);
  ctx.closePath(); ctx.fill();

  // 左部西嶂三峰（对应「山」字三竖耸立！）
  setCam(ctx, 0.94);
  for (const pk of W.peaks) {
    if (pk.rise > 0.01) {
      const curTop = lerp(seaBase + 30, pk.topY, ease.out(pk.rise));
      drawAxeCutPeak(pk.x, curTop, pk.w, seaBase + 25, W.dawn);
    }
    // 拔山互动海面金脉提示
    if (W.riseUI > 0.02 && pk.rise < 0.1) {
      const p = reduceMotion ? 0.5 : 0.5 + 0.5 * Math.sin(clock * 0.0042 + pk.i * 1.5);
      ctx.strokeStyle = `rgba(242,196,104,${(W.riseUI * (0.45 + 0.45 * p)).toFixed(3)})`;
      ctx.lineWidth = 2.4;
      ctx.beginPath(); ctx.ellipse(pk.x, seaBase - 24, 52 + p * 14, 16 + p * 5, 0, 0, TAU); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(pk.x, seaBase - 14); ctx.lineTo(pk.x, seaBase - 78 - p * 16); ctx.stroke();
    }
  }

  // 右部东崖巨嶂与山巅层台古寺（对应「寺」字层横与立柱！）
  setCam(ctx, 1.02);
  if (W.east.rise > 0.01) {
    const eTop = lerp(seaBase + 40, EAST_CRAG.topY + 68, ease.out(W.east.rise));
    drawAxeCutPeak(EAST_CRAG.x, eTop, EAST_CRAG.w, seaBase + 30, W.dawn * 0.9);

    // 崖顶重檐古台（「寺」意象：稳固台基 + 飞檐立柱 + 晨光烽灯）
    ctx.save();
    ctx.translate(EAST_CRAG.x - 12, eTop + 6);
    // 两层稳固石台基（呼应「寺」中部两道长横）
    ctx.fillStyle = '#c8baa0';
    ctx.fillRect(-68, -6, 136, 12);
    ctx.fillRect(-52, -20, 104, 14);
    ctx.strokeStyle = '#3b332a'; ctx.lineWidth = 1.4;
    ctx.strokeRect(-68, -6, 136, 12);
    // 朱漆立柱
    ctx.strokeStyle = '#8f3022'; ctx.lineWidth = 5;
    for (const lx of [-34, -10, 14, 34]) {
      ctx.beginPath(); ctx.moveTo(lx, -20); ctx.lineTo(lx, -64); ctx.stroke();
    }
    // 两重飞檐（呼应「寺」上部横竖结构）
    for (const [ry, rw] of [[-62, 74], [-86, 54]]) {
      ctx.fillStyle = '#1b2b34';
      ctx.beginPath();
      ctx.moveTo(0, ry - 24);
      ctx.quadraticCurveTo(rw * 0.55, ry - 6, rw, ry + 2);
      ctx.lineTo(-rw, ry + 2);
      ctx.quadraticCurveTo(-rw * 0.55, ry - 6, 0, ry - 24);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#dfb562'; ctx.lineWidth = 1.6; ctx.stroke();
    }
    // 刹顶与烽灯金光
    ctx.strokeStyle = '#ebbf68'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(0, -110); ctx.lineTo(0, -128); ctx.stroke();
    if (W.east.beacon > 0.02) {
      const bgG = ctx.createRadialGradient(0, -44, 3, 0, -44, 88 * W.east.beacon);
      bgG.addColorStop(0, `rgba(255,242,192,${(0.9 * W.east.beacon).toFixed(3)})`);
      bgG.addColorStop(1, 'rgba(242,168,72,0)');
      ctx.fillStyle = bgG;
      ctx.beginPath(); ctx.arc(0, -44, 88 * W.east.beacon, 0, TAU); ctx.fill();
    }
    ctx.restore();
  }
  if (W.standUI > 0.02) {
    const p = reduceMotion ? 0.5 : 0.5 + 0.5 * Math.sin(clock * 0.004);
    ctx.strokeStyle = `rgba(246,204,114,${(W.standUI * (0.45 + 0.45 * p)).toFixed(3)})`;
    ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.arc(EAST_CRAG.x - 12, 330, 56 + p * 14, 0, TAU); ctx.stroke();
  }
}

function drawSeaWavesAndEagles() {
  // 峡谷穿云苍鹰
  setCam(ctx, 0.9);
  for (const eg of W.eagles) {
    if (eg.a <= 0.01) continue;
    const flap = reduceMotion ? 0.2 : Math.sin(clock * 0.006 + eg.ph) * 9;
    ctx.save();
    ctx.globalAlpha = eg.a;
    ctx.translate(eg.x, eg.y);
    ctx.scale(eg.s, eg.s);
    ctx.strokeStyle = '#14191e'; ctx.lineWidth = 3.2; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-24, -6 + flap);
    ctx.quadraticCurveTo(-10, -12, 0, 0);
    ctx.quadraticCurveTo(10, -12, 24, -6 + flap);
    ctx.stroke();
    ctx.restore();
  }

  // 马远《水图》层叠怒涛与银白浪爪（前景视差）
  const t = reduceMotion ? 0 : clock * 0.0024;
  const rows = [
    { y: 662, amp: 16, sp: 1.0, col1: '#233b48', col2: '#162832', px: 0.96 },
    { y: 708, amp: 22, sp: 1.35, col1: '#2d4b59', col2: '#182c38', px: 1.04 },
    { y: 762, amp: 28, sp: 1.7, col1: '#375a68', col2: '#14242e', px: 1.12 },
  ];
  rows.forEach((R, idx) => {
    setCam(ctx, R.px);
    const wg = ctx.createLinearGradient(0, R.y - 35, 0, R.y + 180);
    wg.addColorStop(0, mixCol(R.col1, '#8c6b4f', W.dawn * 0.35));
    wg.addColorStop(1, R.col2);
    ctx.fillStyle = wg;
    ctx.beginPath();
    ctx.moveTo(-100, 960);
    for (let x = -100; x <= 2600; x += 48) {
      const wy = R.y + Math.sin(x * 0.009 + t * R.sp + idx * 1.4) * R.amp + Math.cos(x * 0.021 - t * 0.8) * (R.amp * 0.4);
      ctx.lineTo(x, wy);
    }
    ctx.lineTo(2600, 960);
    ctx.closePath();
    ctx.fill();

    // 浪尖卷雪勾线与晨曦碎金
    ctx.strokeStyle = mixCol('#dce6e8', '#fae2b0', W.dawn * 0.55);
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    for (let x = 80; x <= 2320; x += 140) {
      const wy = R.y + Math.sin(x * 0.009 + t * R.sp + idx * 1.4) * R.amp;
      ctx.moveTo(x - 28, wy + 5);
      ctx.quadraticCurveTo(x, wy - 7, x + 26, wy + 3);
    }
    ctx.stroke();
  });

  // 拍崖飞沫水珠
  setCam(ctx, 1);
  for (const sp of W.sprays) {
    const u = clamp((clock - sp.t0) / sp.dur);
    ctx.fillStyle = `rgba(244,248,248,${((1 - u) * 0.82).toFixed(3)})`;
    ctx.beginPath(); ctx.arc(sp.x, sp.y, sp.r * (1 - u * 0.4), 0, TAU); ctx.fill();
  }
}

/* ---------- 字源演进、石碑小篆宣纸底板、九笔描红与词意 ---------- */
function glyphCam() {
  setCam(ctx, 1);
  ctx.translate(GL.cx, GL.cy);
  ctx.scale(GL.s, GL.s);
  ctx.translate(-50, -50);
}
function toLocal(wx, wy) { return { x: (wx - GL.cx) / GL.s + 50, y: (wy - GL.cy) / GL.s + 50 }; }
function withMmah(fn) {
  ctx.save();
  ctx.scale(100 / 1024, 100 / 1024);
  ctx.translate(0, 900); ctx.scale(1, -1);
  fn();
  ctx.restore();
}
function strokePts(i) {
  const m = W.glyph.m;
  if (m <= 0) return OPTS[i];
  if (m >= 2) return KPTS[i];
  const [a, b, e] = m < 1 ? [OPTS[i], SPTS[i], ease.inOut(m)] : [SPTS[i], KPTS[i], ease.inOut(m - 1)];
  return a.map((p, j) => [lerp(p[0], b[j][0], e), lerp(p[1], b[j][1], e)]);
}
function strokeW(i, s) {
  const m = W.glyph.m;
  if (m <= 1) return lerp(2.8 * PROF.carve(s), 3.6 * PROF.seal(s), ease.inOut(clamp(m)));
  return lerp(3.6 * PROF.seal(s), KAI[i].w * PROF[KAI[i].p](s), ease.inOut(clamp(m - 1)));
}
function brush(c, i, upto) {
  if (upto <= 0.001) return;
  const pts = strokePts(i);
  const n = pts.length - 1, m = upto * n, mi = Math.floor(m);
  const P = pts.slice(0, mi + 1);
  if (mi < n && m > mi) { const a = pts[mi], b = pts[mi + 1], f = m - mi; P.push([lerp(a[0], b[0], f), lerp(a[1], b[1], f)]); }
  if (P.length < 2) return;
  const Lp = [], Rp = [];
  for (let j = 0; j < P.length; j++) {
    const a = P[Math.max(0, j - 1)], b = P[Math.min(P.length - 1, j + 1)];
    let tx = b[0] - a[0], ty = b[1] - a[1]; const l = Math.hypot(tx, ty) || 1; tx /= l; ty /= l;
    const s = Math.min(1, (j / (P.length - 1)) * (m / n));
    const w = strokeW(i, s) / 2;
    Lp.push([P[j][0] - ty * w, P[j][1] + tx * w]);
    Rp.push([P[j][0] + ty * w, P[j][1] - tx * w]);
  }
  c.beginPath(); c.moveTo(Lp[0][0], Lp[0][1]);
  for (const p of Lp) c.lineTo(p[0], p[1]);
  for (let j = Rp.length - 1; j >= 0; j--) c.lineTo(Rp[j][0], Rp[j][1]);
  c.closePath(); c.fill();
  const e0 = P[0], e1 = P[P.length - 1];
  c.beginPath();
  c.arc(e0[0], e0[1], strokeW(i, 0) / 2, 0, TAU);
  c.arc(e1[0], e1[1], strokeW(i, Math.min(1, m / n)) / 2, 0, TAU);
  c.fill();
}
function paintStroke(i, q) {
  if (q <= 0) return;
  const path = ZHI_PATHS[i];
  if (q >= 1) { ctx.fill(path); return; }
  ctx.save();
  ctx.clip(path);
  ctx.lineWidth = 175; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.strokeStyle = ctx.fillStyle;
  const pts = MMD[i], count = (pts.length - 1) * q, k = Math.floor(count);
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (let j = 1; j <= k && j < pts.length; j++) ctx.lineTo(pts[j][0], pts[j][1]);
  if (k < pts.length - 1) {
    const a = pts[k], b = pts[k + 1], f = count - k;
    ctx.lineTo(lerp(a[0], b[0], f), lerp(a[1], b[1], f));
  }
  ctx.stroke();
  ctx.restore();
}

function drawPlates(a, m) {
  const stele = a * (1 - smooth(m * 1.3));
  const slip = a * smooth(m * 2.2 - 0.5) * (1 - smooth((m - 1.15) * 2.2));
  const paper = a * smooth((m - 1.25) * 2.2);
  if (stele > 0.01) {
    // 苍黑摩崖石碑拓片底板
    ctx.save(); ctx.globalAlpha = stele;
    const g = ctx.createRadialGradient(45, 38, 8, 50, 50, 76);
    g.addColorStop(0, '#2c363c'); g.addColorStop(0.7, '#1d252a'); g.addColorStop(1, '#141a1e');
    ctx.fillStyle = g;
    ctx.fillRect(-6, -6, 112, 112);
    ctx.strokeStyle = '#c89e52'; ctx.lineWidth = 1.2;
    ctx.strokeRect(-6, -6, 112, 112);
    ctx.restore();
  }
  if (slip > 0.01) {
    ctx.save(); ctx.globalAlpha = slip;
    for (const [x0, w, f] of [[-22, 42, 0.45], [24, 52, 1], [80, 42, 0.45]]) {
      ctx.globalAlpha = slip * f;
      const g = ctx.createLinearGradient(x0, 0, x0 + w, 0);
      g.addColorStop(0, '#c8a96e'); g.addColorStop(0.5, '#e7d2a0'); g.addColorStop(1, '#bd9c61');
      ctx.fillStyle = g; ctx.fillRect(x0, -8, w, 116);
    }
    ctx.restore();
  }
  if (paper > 0.01) {
    ctx.save(); ctx.globalAlpha = paper;
    ctx.fillStyle = 'rgba(20,24,28,0.16)'; ctx.fillRect(-5, -4, 114, 114);
    ctx.fillStyle = '#fbf5e8'; ctx.fillRect(-8, -8, 116, 116);
    ctx.strokeStyle = '#b5402c'; ctx.lineWidth = 1.2; ctx.strokeRect(-8, -8, 116, 116);
    ctx.strokeStyle = 'rgba(181,64,44,0.26)'; ctx.lineWidth = 0.5;
    ctx.setLineDash([2, 2]);
    ctx.beginPath();
    ctx.moveTo(50, -8); ctx.lineTo(50, 108);
    ctx.moveTo(-8, 50); ctx.lineTo(108, 50);
    ctx.moveTo(-8, -8); ctx.lineTo(108, 108);
    ctx.moveTo(108, -8); ctx.lineTo(-8, 108);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }
}

function drawLabels() {
  const g = W.glyph;
  if (g.labels <= 0.01) return;
  ctx.save();
  ctx.globalAlpha = g.alpha * g.labels;
  ctx.font = '5.8px "Kaiti SC","STKaiti","KaiTi",serif';
  ctx.textBaseline = 'middle';
  const leftT = window.haqiHanziUi ? window.haqiHanziUi('山 · 高峰耸立') : '山 · 高峰耸立';
  const rightT = window.haqiHanziUi ? window.haqiHanziUi('寺 · 读音线索') : '寺 · 读音线索';
  if (portrait) {
    ctx.textAlign = 'center';
    ctx.fillStyle = '#254a44'; ctx.fillText(leftT, 50, 2);
    ctx.fillStyle = '#b5402c'; ctx.fillText(rightT, 50, 100);
  } else {
    ctx.textAlign = 'right'; ctx.fillStyle = '#254a44'; ctx.fillText(leftT, -12, 46);
    ctx.textAlign = 'left'; ctx.fillStyle = '#b5402c'; ctx.fillText(rightT, 112, 54);
  }
  ctx.restore();
}

function drawTraceUI() {
  const T = W.trace;
  if (!W.glyph.trace || T.stroke >= NS) return;
  const pts = MLD[T.stroke];
  ctx.save();
  ctx.globalAlpha = W.glyph.alpha;
  ctx.strokeStyle = 'rgba(181,64,44,0.86)'; ctx.lineWidth = 0.68; ctx.setLineDash([1.6, 1.7]);
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (const p of pts) ctx.lineTo(p[0], p[1]);
  ctx.stroke(); ctx.setLineDash([]);

  const a = pts[Math.max(0, pts.length - 3)], b = pts[pts.length - 1];
  const ang = Math.atan2(b[1] - a[1], b[0] - a[0]);
  ctx.fillStyle = 'rgba(181,64,44,0.9)';
  ctx.beginPath();
  ctx.moveTo(b[0] + Math.cos(ang) * 2.5, b[1] + Math.sin(ang) * 2.5);
  ctx.lineTo(b[0] + Math.cos(ang + 2.5) * 2.3, b[1] + Math.sin(ang + 2.5) * 2.3);
  ctx.lineTo(b[0] + Math.cos(ang - 2.5) * 2.3, b[1] + Math.sin(ang - 2.5) * 2.3);
  ctx.fill();

  const [sx, sy] = pts[0];
  const pulse = reduceMotion ? 0.6 : 0.5 + 0.5 * Math.sin(clock / 220);
  ctx.fillStyle = `rgba(181,64,44,${(0.24 * pulse).toFixed(3)})`;
  ctx.beginPath(); ctx.arc(sx, sy, 3.6 + pulse * 1.5, 0, TAU); ctx.fill();
  ctx.fillStyle = '#b5402c';
  ctx.beginPath(); ctx.arc(sx, sy, 2.1, 0, TAU); ctx.fill();
  ctx.font = '600 5px system-ui,sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(String(T.stroke + 1), sx - 5.6, sy - 3.6);
  ctx.textAlign = 'start';

  if (T.pen) {
    ctx.fillStyle = '#fff9ee';
    ctx.shadowColor = 'rgba(235,191,104,0.95)'; ctx.shadowBlur = 11 * DPR;
    ctx.beginPath(); ctx.arc(T.pen[0], T.pen[1], 2.1, 0, TAU); ctx.fill();
    ctx.shadowBlur = 0;
  }
  ctx.restore();
}

function drawStamp(a) {
  if (a <= 0.01) return;
  const s = lerp(1.45, 1, ease.out(a));
  ctx.save();
  ctx.translate(96, 96); ctx.scale(s, s); ctx.rotate(-0.05);
  ctx.globalAlpha = W.glyph.alpha * Math.min(1, a * 1.5);
  ctx.fillStyle = '#b5402c';
  ctx.fillRect(-10.5, -10.5, 21, 21);
  ctx.translate(-8, -8); ctx.scale(0.16, 0.16);
  ctx.fillStyle = '#faf3e4';
  withMmah(() => { for (const p of ZHI_PATHS) ctx.fill(p); });
  ctx.restore();
}

const WORDS = [
  ['耸峙', '高大的山峰直插云霄，稳稳耸峙在天地之间。'],
  ['对峙', '两座奇峰隔着云海面对面站立，就叫双峰对峙。'],
  ['山岛竦峙', '“水何澹澹，山岛竦峙”——东汉诗人曹操写下大海中山岛高高耸立的壮观景象。'],
];

function drawWords() {
  setCam(ctx, 1);
  const g = W.glyph;
  const y = GL.cy + GL.s * 60 + 50, size = portrait ? 34 : 42, gap = portrait ? size * 0.95 : size * 1.3;
  ctx.font = `${size}px "Kaiti SC","STKaiti","KaiTi",serif`;
  ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  const shown = WORDS.map(([w]) => window.haqiHanziUi ? window.haqiHanziUi(w) : w);
  const widths = shown.map(s => ctx.measureText(s).width);
  let x = GL.cx - (widths.reduce((a, b) => a + b, 0) + gap * (shown.length - 1)) / 2;
  shown.forEach((s, i) => {
    const a = clamp(g.words - i) * g.alpha;
    if (a > 0) {
      const on = W.wordOn === i;
      ctx.globalAlpha = a * (on ? 1 : 0.52);
      ctx.fillStyle = on ? '#b5402c' : '#221e1a';
      ctx.fillText(s, x, y + (1 - clamp(g.words - i)) * 14);
    }
    x += widths[i] + gap;
  });
  ctx.globalAlpha = 1; ctx.textAlign = 'start';
}

function drawGlyph() {
  const g = W.glyph;
  if (g.alpha <= 0.001) return;
  ctx.save();
  glyphCam();
  if (g.plate > 0.01) drawPlates(g.alpha * g.plate, g.m);
  if (g.ghost > 0.01) {
    ctx.save();
    ctx.globalAlpha = g.alpha * g.ghost;
    ctx.fillStyle = '#ddd0b6';
    withMmah(() => { for (let i = 0; i < NS; i++) if (g.prog[i] < 0.99) ctx.fill(ZHI_PATHS[i]); });
    ctx.restore();
  }
  if (g.outline < 0.99) {
    ctx.save();
    ctx.globalAlpha = g.alpha * (1 - g.outline);
    const steleGold = 1 - smooth(g.m * 1.35);
    const inkCol = mixCol('#2f261e', '#1a1c1e', smooth(g.m - 0.8));
    ctx.fillStyle = mixCol(inkCol, '#f2cc78', steleGold);
    for (let i = 0; i < NS; i++) brush(ctx, i, g.prog[i]);
    ctx.restore();
  }
  if (g.outline > 0.01) {
    ctx.save();
    ctx.globalAlpha = g.alpha * g.outline;
    withMmah(() => {
      for (let i = 0; i < NS; i++) {
        ctx.fillStyle = g.labels > 0.1 ? (i < 3 ? '#254a44' : '#b5402c') : '#1c1e20';
        paintStroke(i, g.prog[i]);
      }
    });
    ctx.restore();
  }
  drawLabels();
  drawTraceUI();
  drawStamp(g.stamp);
  ctx.restore();
  if (g.words > 0.01) drawWords();
}

function drawVeil() {
  if (W.veil <= 0.001) return;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = `rgba(244,238,224,${W.veil.toFixed(3)})`;
  ctx.fillRect(0, 0, SW, SH);
}

/* ---------- 帧更新与渲染 ---------- */
let introPt = null;
function updateParticles() {
  for (const sp of W.sprays) {
    sp.x += sp.vx * DT * 0.05;
    sp.y += sp.vy * DT * 0.05;
    sp.vy += 0.08 * DT * 0.05;
  }
  W.sprays = W.sprays.filter(sp => clock - sp.t0 < sp.dur);

  if (W.eagles[0].a > 0.01 && !reduceMotion) {
    W.eagles.forEach((eg, i) => {
      const a = clock * 0.0005 + i * 1.2;
      eg.x = 1230 + Math.cos(a) * (175 + i * 45);
      eg.y = 295 + Math.sin(a * 1.5) * 32 + i * 24;
    });
  }

  if (W.intro) {
    W.dawn = 0.88;
    W.peaks.forEach(p => { p.rise = 1; });
    W.east.rise = 1; W.east.beacon = 0.85;
    W.eagles.forEach(e => { e.a = 0.85; });
    const targetOrbit = introPt ? clamp((introPt.x / SW - 0.5) * 2, -1, 1) : (reduceMotion ? 0 : Math.sin(clock * 0.0006) * 0.65);
    cam.orbitX += (targetOrbit - cam.orbitX) * Math.min(1, DT / 240);
  } else {
    cam.orbitX *= 0.92;
  }
}

function render() {
  updateView();
  const w = cvs.width, h = cvs.height;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;

  drawSeaSky();
  drawTwinMountains();
  drawSeaWavesAndEagles();
  drawVeil();
  drawGlyph();

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(hempC, 0, 0);
  if (!vignette || vignette.w !== w || vignette.h !== h) {
    const g = ctx.createRadialGradient(w / 2, h * 0.45, Math.min(w, h) * 0.35, w / 2, h * 0.45, Math.hypot(w, h) * 0.65);
    g.addColorStop(0, 'rgba(10,16,20,0)');
    g.addColorStop(1, 'rgba(10,16,20,0.38)');
    vignette = { w, h, g };
  }
  ctx.fillStyle = vignette.g;
  ctx.fillRect(0, 0, w, h);
}

let last = null;
function loop(now) {
  requestAnimationFrame(loop);
  if (last == null) last = now;
  const dt = Math.min(50, Math.max(0, now - last));
  last = now;
  if (visible) {
    DT = dt;
    clock += dt;
    updateParticles();
    const list = waiters; waiters = [];
    for (const wt of list) { if (wt.tk.dead) wt.rej(new Cancelled()); else wt.res(clock); }
  }
  render();
}

/* ---------- 字幕与交互控制 ---------- */
const ui = {
  cap: $('#caption'), capT: $('#capTitle'), capP: $('#capText'),
  hint: $('#hint'), action: $('#action'), demo: $('#demo'),
  prog: [...document.querySelectorAll('#progress li')],
};
const CHAR_MS = 65;
let capMinEnd = 0;
function span(cls, text) { const s = document.createElement('span'); if (cls) s.className = cls; s.textContent = text; return s; }
function showCaption(title, text) {
  ui.capT.textContent = window.haqiHanziUi ? window.haqiHanziUi(title, ui.capT) : title;
  ui.capP.replaceChildren(...[...text].map((c, i) => { const s = span('ch', c); s.style.setProperty('--i', i); return s; }));
  window.haqiHanziCaption?.(ui.cap, text);
  ui.cap.classList.remove('on'); void ui.cap.offsetWidth; ui.cap.classList.add('on');
}
async function caption(title, text, tk, hold = 0) {
  window.haqiHanziPrefetch?.([title, text]);
  while (clock < capMinEnd) await frame(tk);
  ui.cap.classList.remove('on');
  await wait(340, tk);
  showCaption(title, text);
  const n = [...text].length;
  capMinEnd = clock + (Math.max(reduceMotion ? 1300 : n * CHAR_MS + 1200, n * 140) + 520 + hold) * FAST;
}
async function captionDone(tk) { while (clock < capMinEnd) await frame(tk); }
function hint(text) {
  if (text) {
    const s = span('', '');
    s.textContent = window.haqiHanziUi ? window.haqiHanziUi(text, s) : text;
    ui.hint.replaceChildren(s); ui.hint.classList.add('on');
  } else ui.hint.classList.remove('on');
}
function progress(i) { ui.prog.forEach((li, j) => { li.classList.toggle('on', j === i); li.classList.toggle('done', j < i); }); }
function mode(m) { document.body.classList.remove('rise', 'stand', 'trace', 'wave'); if (m) document.body.classList.add(m); S.mode = m; }
let actionFn = null;
function setAction(label, fn) {
  actionFn = fn;
  if (label) {
    ui.action.textContent = window.haqiHanziUi ? window.haqiHanziUi(label, ui.action) : label;
    ui.action.hidden = false;
  } else ui.action.hidden = true;
}
function stopAll() {
  token.dead = true;
  const list = waiters; waiters = [];
  for (const wt of list) wt.rej(new Cancelled());
}

const S = { handler: null, demo: null, finish: null, mode: null, interactions: [] };
let activePid = null;
addEventListener('pointermove', e => { if (W.intro) introPt = { x: e.clientX, y: e.clientY }; });
cvs.addEventListener('pointerdown', e => {
  if (!e.isPrimary || activePid != null) return;
  const h = S.handler; if (!h || !h.down) return;
  activePid = e.pointerId;
  try { cvs.setPointerCapture(e.pointerId); } catch {}
  e.preventDefault();
  h.down(toWorld(e.clientX, e.clientY), e);
});
cvs.addEventListener('pointermove', e => {
  if (e.pointerId !== activePid) return;
  const h = S.handler; if (!h || !h.move) return;
  const list = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  for (const ev of (list.length ? list : [e])) h.move(toWorld(ev.clientX, ev.clientY), ev);
});
function endPtr(e, cancel) {
  if (e.pointerId !== activePid) return;
  activePid = null;
  S.handler?.up?.(toWorld(e.clientX, e.clientY), cancel);
}
cvs.addEventListener('pointerup', e => endPtr(e, false));
cvs.addEventListener('pointercancel', e => endPtr(e, true));
cvs.addEventListener('lostpointercapture', e => endPtr(e, true));
cvs.addEventListener('keydown', e => {
  if (e.code !== 'Space' && e.code !== 'Enter') return;
  if (e.repeat) return;
  e.preventDefault();
  if (S.mode === 'trace' && S.demo) S.demo();
  else if (actionFn) actionFn();
});
ui.action.addEventListener('click', () => { if (actionFn) actionFn(); });
ui.demo.addEventListener('click', () => { if (S.demo) S.demo(); });

function publish(sc) { window.__zhiPeak.scene = sc; window.__zhiPeak.interactions = S.interactions; window.__zhiPeak.state = W; }

/* ---------- 七幕剧情 ---------- */
async function sSea(tk) {
  publish('sSea');
  progress(0);
  setPaperMode(false);
  W.intro = false;
  W.dawn = 0;
  W.peaks.forEach(p => { p.rise = 0; });
  W.east.rise = 0; W.east.beacon = 0;
  W.eagles.forEach(e => { e.a = 0; });
  bg(camTo(VIEW.sea, 2400 * M, tk));
  Sound.surf(1.4, 0.055, 780);
  await caption('沧海', '大海波涛翻涌，海风从苍茫的水面上呼啸而过。', tk);
  await caption('沧海', '什么能在大风大浪里，稳稳地立住呢？', tk, 280);
  await captionDone(tk);
}

async function sRise(tk) {
  publish('sRise');
  progress(1);
  bg(camTo(VIEW.rise, 1800 * M, tk));
  bg(tween(600, t => { W.riseUI = t; }, tk));
  hint('点一点海面发亮的石脉，唤醒三座奇峰破浪耸立');
  mode('rise');

  let risen = 0, lastAct = clock;
  const raisePeak = (pk, how) => {
    if (!pk || pk.rise > 0.05) return;
    lastAct = clock;
    risen++;
    S.interactions.push(how);
    Sound.stoneRise(pk.i);
    spawnSpray(pk.x, 675, 24);
    bg(tween(880 * M, t => { pk.rise = t; }, tk, ease.out));
  };
  const raiseNext = how => {
    const order = [W.peaks[1], W.peaks[0], W.peaks[2]];
    const next = order.find(p => p.rise <= 0.05);
    if (next) raisePeak(next, how);
  };
  setAction('拔起一座奇峰', () => raiseNext('button'));
  S.handler = {
    down(p) {
      const hit = W.peaks.find(pk => pk.rise <= 0.05 && Math.abs(p.x - pk.x) < 120);
      if (hit) raisePeak(hit, 'tap'); else raiseNext('tap');
    },
  };

  while (risen < 3) {
    await frame(tk);
    if (clock - lastAct > (AUTO ? 450 : 8200)) raiseNext('auto');
  }
  S.handler = null; setAction(null); mode(null); hint(null); W.riseUI = 0;
  await wait(700 * M, tk);
  await caption('耸立', '千尺苍崖破浪而出！巨浪拍碎成雪，山峰却纹丝不动。', tk, 320);
  await captionDone(tk);
}

async function sStand(tk) {
  publish('sStand');
  progress(2);
  bg(camTo(VIEW.stand, 1900 * M, tk));
  await tween(1200 * M, t => { W.east.rise = t; }, tk, ease.out);
  spawnSpray(EAST_CRAG.x, 675, 22);
  Sound.stoneRise(2);

  bg(tween(550, t => { W.standUI = t; }, tk));
  await caption('对峙', '峡谷对面，另一座危崖高台也屹立在海雾里。', tk);
  hint('点亮东崖高台的晨曦烽灯，看双峰隔海对峙');
  mode('stand');

  let lit = false, lastAct = clock;
  const finishStand = how => {
    if (lit) return;
    lit = true;
    S.interactions.push(how);
  };
  setAction('点亮山巅晨光', () => finishStand('button'));
  S.handler = { down() { finishStand('tap'); } };

  while (!lit) {
    await frame(tk);
    if (clock - lastAct > (AUTO ? 420 : 8000)) finishStand('auto');
  }
  S.handler = null; setAction(null); mode(null); hint(null); W.standUI = 0;

  Sound.templeBell(NOTE.G4, 0.13);
  Sound.eagle();
  await tween(2000 * M, t => {
    W.east.beacon = t;
    W.dawn = t;
    W.eagles.forEach(e => { e.a = t * 0.9; });
  }, tk);
  await caption('对峙', '红日跃出峡口，两座高峰隔着云涛稳稳相对——这就叫「峙」。', tk, 420);
  await captionDone(tk);
}

async function sGlyph(tk) {
  publish('sGlyph');
  progress(3);
  GL.cx = 1200; GL.cy = 462; GL.s = 3.35;
  bg(camTo(VIEW.glyph, 2000 * M, tk));

  W.glyph = { alpha: 1, m: 0, prog: Array(NS).fill(0), outline: 0, plate: 0, labels: 0, ghost: 0, stamp: 0, words: 0, trace: false };
  setPaperMode(true);
  await tween(2200 * M, t => {
    W.veil = 0.95 * t;
    W.glyph.plate = t;
    for (let i = 0; i < NS; i++) W.glyph.prog[i] = clamp(t * 1.4 - i * 0.05);
  }, tk);
  W.glyph.prog.fill(1);
  Sound.templeBell(NOTE.D5, 0.09);
  await caption('字源部件', '左边是三峰耸立的「山」，右边是层台端立、提示读音的「寺」。', tk, 420);
  await captionDone(tk);

  Sound.surf(1.8, 0.024, 1500);
  await tween(2500 * M, t => { W.glyph.m = t; }, tk, ease.lin);
  Sound.pluck(NOTE.E5, 0.11);
  await caption('小篆结构', '左「山」挺拔，右「寺」平稳，合成高高耸立的「峙」。', tk, 450);
  await captionDone(tk);

  Sound.surf(1.8, 0.024, 1750);
  await tween(2500 * M, t => { W.glyph.m = 1 + t; }, tk, ease.lin);
  await tween(550, t => { W.glyph.outline = t; }, tk);
  bg(tween(700, t => { W.glyph.labels = t; }, tk));
  Sound.templeBell(NOTE.G5, 0.075);
  await caption('楷书', '曹操《观沧海》写下名句：“水何澹澹，山岛竦峙。”', tk, 520);
  await captionDone(tk);
  await tween(500, t => { W.glyph.labels = 1 - t; }, tk);
}

async function sWrite(tk) {
  publish('sWrite');
  progress(4);
  await caption('写字', '「峙」一共九笔，先写左边的山，再写右边的寺。', tk);
  await tween(800, t => { W.glyph.prog = W.glyph.prog.map(() => 1 - t); W.glyph.ghost = t; }, tk);
  W.glyph.prog = Array(NS).fill(0);
  W.glyph.trace = true; W.trace = { stroke: 0, pen: null };

  const showStroke = () => {
    capMinEnd = 0;
    showCaption('写字', `第 ${W.trace.stroke + 1} 笔，共 ${NS} 笔。`);
    hint(`${KAI[W.trace.stroke].name}：从红点起笔，顺着虚线写`);
  };
  await captionDone(tk);
  showStroke();

  let samples = MLD[0], drag = null, lastInput = clock, demoing = false, completed = 0, invalidHint = 0;
  const finishStroke = () => {
    const i = W.trace.stroke;
    if (i >= NS) return;
    W.glyph.prog[i] = 1;
    Sound.pluck(PENTA[i % PENTA.length], 0.12, 1.4);
    W.trace.stroke++;
    W.trace.pen = null;
    completed++;
    if (W.trace.stroke < NS) { samples = MLD[W.trace.stroke]; showStroke(); }
  };
  S.finish = finishStroke;
  const tolLocal = () => Math.max(20, 48 / (CV.k * GL.s));

  S.handler = {
    down(p) {
      if (demoing || W.trace.stroke >= NS) return;
      lastInput = clock;
      const q = toLocal(p.x, p.y), t = tolLocal();
      const lastPt = samples[samples.length - 1];
      const dEnd = Math.hypot(q.x - lastPt[0], q.y - lastPt[1]);
      let startIdx = -1, bestD = Infinity;
      const startLimit = Math.max(1, Math.floor(samples.length * 0.35));
      for (let j = 0; j < startLimit; j++) {
        const d = Math.hypot(q.x - samples[j][0], q.y - samples[j][1]);
        if (d < bestD) { bestD = d; startIdx = j; }
      }
      if (bestD > t * 1.75 || (bestD > dEnd * 1.15 && dEnd < t * 1.2)) {
        if (clock - invalidHint > 500) { hint('从这一笔的红点开始哦'); invalidHint = clock; }
        return;
      }
      drag = { idx: startIdx, fIdx: startIdx, lastQ: q };
      W.glyph.prog[W.trace.stroke] = drag.idx / (samples.length - 1);
      W.trace.pen = samples[drag.idx];
    },
    move(p) {
      if (!drag) return;
      lastInput = clock;
      const q = toLocal(p.x, p.y), t = tolLocal();
      const prev = drag.lastQ || q;
      const distMove = Math.hypot(q.x - prev.x, q.y - prev.y);
      const steps = Math.max(1, Math.min(8, Math.ceil(distMove / 4)));
      const lastIdx = samples.length - 1;
      for (let s = 1; s <= steps; s++) {
        const u = s / steps, sx = lerp(prev.x, q.x, u), sy = lerp(prev.y, q.y, u);
        const win = Math.max(18, Math.ceil(lastIdx * 0.55));
        let best = drag.idx, bd = Infinity;
        for (let j = Math.max(0, drag.idx - 2); j <= Math.min(lastIdx, drag.idx + win); j++) {
          const d = Math.hypot(sx - samples[j][0], sy - samples[j][1]);
          if (d < bd) { bd = d; best = j; }
        }
        if (bd <= t * 1.35 && best >= drag.idx) {
          const a = samples[drag.idx], b = samples[best];
          const mvx = q.x - prev.x, mvy = q.y - prev.y, svx = b[0] - a[0], svy = b[1] - a[1];
          if (best === drag.idx || distMove < 0.5 || (mvx * svx + mvy * svy) >= -0.25 * distMove * Math.hypot(svx, svy)) {
            drag.idx = best; drag.fIdx = Math.max(drag.fIdx || 0, best);
          }
        }
      }
      if (distMove > 0.4 && drag.idx < lastIdx) {
        const curIdx = Math.min(lastIdx - 1, drag.idx);
        const lookIdx = Math.min(lastIdx, curIdx + Math.max(6, Math.ceil(lastIdx * 0.18)));
        const tx = samples[lookIdx][0] - samples[curIdx][0], ty = samples[lookIdx][1] - samples[curIdx][1];
        const tLen = Math.hypot(tx, ty) || 1;
        const forwardProj = ((q.x - prev.x) * tx + (q.y - prev.y) * ty) / tLen;
        const curD = Math.hypot(q.x - samples[curIdx][0], q.y - samples[curIdx][1]);
        if (forwardProj > 0.15 && curD <= t * 2.6) {
          let totalLen = 0;
          for (let j = 1; j <= lastIdx; j++) totalLen += Math.hypot(samples[j][0] - samples[j - 1][0], samples[j][1] - samples[j - 1][1]);
          const avgSeg = Math.max(0.6, totalLen / lastIdx);
          drag.fIdx = Math.min(lastIdx, Math.max(drag.fIdx || drag.idx, drag.idx) + (forwardProj / avgSeg) * 1.25);
          drag.idx = Math.max(drag.idx, Math.floor(drag.fIdx));
        }
      }
      drag.lastQ = q;
      W.glyph.prog[W.trace.stroke] = drag.idx / lastIdx;
      W.trace.pen = samples[drag.idx];
    },
    up(p, cancel) {
      if (!drag) return;
      const d = drag; drag = null; W.trace.pen = null;
      const lastIdx = samples.length - 1;
      const needIdx = Math.min(lastIdx - 2, Math.max(3, Math.ceil(lastIdx * 0.56)));
      if (!cancel && d.idx >= needIdx) { finishStroke(); return; }
      const i = W.trace.stroke, from = W.glyph.prog[i];
      bg(tween(260, t => { if (W.trace.stroke === i) W.glyph.prog[i] = from * (1 - t); }, tk));
      if (clock - invalidHint > 400) { hint('顺着虚线方向写到箭头附近即可'); invalidHint = clock; }
    },
  };

  const demo = async () => {
    if (demoing || W.trace.stroke >= NS) return;
    demoing = true; ui.demo.disabled = true; drag = null;
    hint('看笔尖光点走过每一笔');
    while (W.trace.stroke < NS) {
      const i = W.trace.stroke, pts = MLD[i];
      W.glyph.prog[i] = 0;
      await tween(720 * M, t => { W.glyph.prog[i] = t; W.trace.pen = pts[Math.round(t * (pts.length - 1))]; }, tk, ease.sine);
      W.trace.pen = null;
      finishStroke();
      await wait(160, tk);
    }
  };
  S.demo = () => { S.interactions.push('demo'); bg(demo()); };
  mode('trace'); ui.demo.hidden = false;
  if (AUTO) { S.interactions.push('auto'); bg(demo()); }

  let nudged = false;
  while (W.trace.stroke < NS) {
    await frame(tk);
    if (!demoing && !nudged && clock - lastInput > 14000) { hint('写不出来也没关系，点“看示范”'); nudged = true; }
    if (!demoing && completed === 0 && clock - lastInput > 26000) { S.interactions.push('auto'); bg(demo()); }
  }

  S.handler = null; S.demo = null; S.finish = null; mode(null); hint(null);
  ui.demo.hidden = true; ui.demo.disabled = false; W.glyph.trace = false;
  if (!S.interactions.includes('demo') && !S.interactions.includes('auto')) S.interactions.push('user');
  window.__zhiPeak.events.push('written');
  window.haqiHanziWritten?.();

  await tween(500, t => { W.glyph.ghost = 1 - t; }, tk);
  await tween(480, t => { W.glyph.stamp = t; }, tk, ease.out);
  Sound.templeBell(NOTE.G4, 0.11); Sound.pluck(NOTE.G5, 0.08);
  await caption('写字', '写好了！峙，双峰对峙的峙。', tk);
  await captionDone(tk);
}

async function sWords(tk) {
  publish('sWords');
  progress(5);
  const g0 = { ...GL };
  await tween(1000 * M, t => {
    GL.cy = lerp(g0.cy, g0.cy - 28, t);
    GL.s = lerp(g0.s, 2.84, t);
    W.veil = lerp(0.95, 0.72, t);
  }, tk);

  for (let i = 0; i < WORDS.length; i++) {
    const pCap = caption(WORDS[i][0], WORDS[i][1], tk);
    await wait(340, tk);
    W.wordOn = i;
    Sound.pluck(PENTA[3 + i], 0.13);
    if (i === 1) bg(tween(900 * M, t => { W.wordMood = t; }, tk));
    if (i === 2) bg(tween(900 * M, t => { W.wordMood = 1 + t; }, tk));
    bg(tween(600, t => { W.glyph.words = Math.max(W.glyph.words, i + t); }, tk, ease.out));
    await pCap;
    await captionDone(tk);
  }
  W.wordOn = -1;
}

async function sFinale(tk) {
  publish('sFinale');
  progress(6);
  setPaperMode(false);
  bg(camTo(VIEW.finale, 2800 * M, tk));
  await tween(2000 * M, t => {
    W.glyph.alpha = 1 - t;
    W.veil = 0.72 * (1 - t);
    W.wordMood = lerp(2, 0.1, t);
  }, tk);
  W.glyph = { ...W.glyph, alpha: 0, words: 0 };
  Sound.templeBell(NOTE.D5, 0.09);

  await caption('余韵', '海浪来去不息，双峰依旧稳稳立在晨光与云涛之间。', tk, 400);
  await captionDone(tk);

  hint('点一点沧海或峡口，激起千堆雪浪与苍鹰长鸣');
  mode('wave');
  setAction('再看一次', () => { Sound.init(); begin(); });
  S.handler = {
    down(p) {
      if (p.y > 520) {
        spawnSpray(clamp(p.x, 620, 1780), 675, 24);
        Sound.surf(0.7, 0.055);
      } else {
        Sound.eagle();
        Sound.templeBell(NOTE.G4, 0.08);
      }
      hint(null);
    },
  };
  window.__zhiPeak.finished = true;
  window.__zhiPeak.events.push('completed');
  window.haqiHanziComplete();
  for (;;) await frame(tk);
}

const SCENES = [sSea, sRise, sStand, sGlyph, sWrite, sWords, sFinale];

async function begin() {
  stopAll();
  const tk = token = { dead: false };
  capMinEnd = 0;
  resetWorld();
  W.intro = false;
  setPaperMode(false);
  Object.assign(cam, VIEW.sea);
  S.handler = null; S.demo = null; S.finish = null; mode(null); setAction(null); hint(null);
  ui.demo.hidden = true; ui.demo.disabled = false; ui.cap.classList.remove('on');
  rand = mulberry32(20261115);
  S.interactions = [];
  window.__zhiPeak.events = []; window.__zhiPeak.finished = false;
  publish('sSea');
  try { for (const sc of SCENES) await sc(tk); }
  catch (e) { if (!(e instanceof Cancelled)) console.error(e); }
}

async function introPlay(tk) {
  W.intro = true;
  Object.assign(cam, VIEW.intro);
  for (;;) await frame(tk);
}

resetWorld();
Object.assign(cam, VIEW.intro);
window.__zhiPeak = {
  scene: 'intro', finished: false, events: [], interactions: [], state: W,
  medians: ZHI_PEAK.medians, strokes: ZHI_PEAK.strokes, toScreen,
  completeCurrentStroke() { S.finish?.(); },
};
resize();
render();
addEventListener('resize', () => { resize(); render(); });
requestAnimationFrame(loop);
bg(introPlay(token = { dead: false }));

$('#start').addEventListener('click', () => {
  Sound.init();
  $('#intro').classList.add('off');
  document.body.classList.add('started');
  begin();
});
$('#replay').addEventListener('click', () => {
  Sound.init();
  $('#intro').classList.add('off');
  document.body.classList.add('started');
  begin();
});
$('#mute').addEventListener('click', e => {
  Sound.init();
  Sound.setMuted(!Sound.muted);
  const btn = e.currentTarget;
  btn.setAttribute('aria-pressed', String(Sound.muted));
  const zh = Sound.muted ? '开启声音' : '静音';
  btn.textContent = window.haqiHanziUi ? window.haqiHanziUi(zh, btn) : zh;
});
document.addEventListener('visibilitychange', () => { visible = !document.hidden; last = null; });
addEventListener('pagehide', () => { stopAll(); void Sound.ctx?.close().catch(() => {}); }, { once: true });

if (AUTO) {
  $('#intro').classList.add('off');
  document.body.classList.add('started');
  begin();
}
})();
</script>

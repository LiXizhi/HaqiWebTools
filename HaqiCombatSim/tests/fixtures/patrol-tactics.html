<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../../"><title>巡夜战术隔离验收</title><link rel="stylesheet" href="css/adventure.css"><link rel="stylesheet" href="css/adventure_storybook.css"></head>
<body class="haqi-app"><main id="root">正在加载；仅使用内存角色，不读写用户存档。</main><script type="module">
import {loadResources} from '../../js/adventure_assets.js';
import * as A from '../../js/adventure_core.js';
import * as P from '../../js/combat_pve_core.js';
import {dungeonTacticsMonsters} from '../../js/dungeon_tactics_core.js';
import {renderBattle,updateBattlePetHint} from '../../js/views/adventure/view_battle_layer.js';
import {createRenderer} from '../../js/adventure/renderer/scene_renderer.js';
const root=document.querySelector('#root');
try{
 const assets=await loadResources(progress=>{root.textContent=`${progress.label} ${progress.detail||''}`;}),params=new URLSearchParams(location.search),examiner=params.has('examiner'),save=A.createAdventure(assets.content,{name:examiner?'终考验收':'巡夜验收',school:'ice',seed:23});
 document.title=examiner?'十级终考隔离验收':'巡夜战术隔离验收';
 if(!examiner)await assets.dungeons.load('journey:first-watch');
 save.xp=assets.content.progression.xpThresholds[examiner?9:4];A.syncProgression(save,assets.content);save.deck=A.recommendedDeck(save,assets.content);save.zone=examiner?'forest': 'journey:first-watch';
 const d=examiner?null:assets.content.dungeons.find(d=>d.id===save.zone),index=Math.max(0,Math.min(3,Number(params.get('wave'))||0)),arena=d?.arenas[index];
 const monsters=examiner?[assets.content.monsters['death-scout']]:dungeonTacticsMonsters(arena.monsterIds.map(id=>assets.content.monsters[id]),{dungeonTacticsVersion:2,dungeonTacticsId:d.id,encounterId:arena.id});
 document.documentElement.dataset.fixtureTactic=JSON.stringify(examiner?{id:'death-scout',round:1}:{id:d.id,arena:arena.id,count:monsters.length,tactic:monsters[0]?.dungeonTactic||null});
 const battle=P.createPveBattle({dataset:assets.dataset,player:A.playerSpec(save,assets.content),monsters,seed:23,threatRulesVersion:5}),renderer=createRenderer(document.createElement('canvas'),assets);
 let selected=null,discarded=[];
 const step=action=>{P.playPveRound(battle,{...action,discardSeqs:discarded});selected=null;discarded=[];paint();};
 const paint=()=>renderBattle(root,{assets,save,battle,selected,discarded,animating:false,soundEnabled:false},{sound(){},pass:()=>step({pass:true}),select:pick=>{selected=pick;paint();},reselect:()=>{selected=null;paint();},target:id=>selected&&step({...selected,targetId:id}),discard:seq=>{discarded.push(seq);selected=null;paint();},toggleRunes(){},togglePetCards(){},swipePlay:pick=>{selected=pick;paint();},retreat:()=>{root.textContent='已退出；未保存角色。';},finish:()=>{root.textContent='本波验收结束；未保存角色。';}});
 await assets.warmBattle(battle);paint();
 const frame=time=>{const canvas=root.querySelector('#battle-canvas');if(canvas){canvas.battlePositions=renderer.renderBattle(canvas,battle,save,time);updateBattlePetHint(root,battle,save,assets.content,canvas);}requestAnimationFrame(frame);};
 requestAnimationFrame(frame);document.documentElement.dataset.fixtureReady='1';
}catch(error){root.textContent=error.stack;}
</script></body></html>

<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>语言字典 · 隔离验证</title><link rel="stylesheet" href="../../css/adventure.css"><link rel="stylesheet" href="../../css/adventure_storybook.css"><link rel="stylesheet" href="../../css/dictionary.css"><style>body{margin:0;background:#315c49}#qa{position:fixed;bottom:0;z-index:99;background:white;padding:4px}#overlay{position:fixed;inset:0}</style></head><body class="haqi-app"><div id="overlay" class="overlay visible"></div><output id="qa">加成 0</output><script type="module">
import {createDictionary} from '../../js/adventure_dictionary.js';
import {createDictionaryStore} from '../../js/dictionary_store.js';
import {restoreVisibleFocus} from '../../js/view_adventure_controls.js';
const q=new URLSearchParams(location.search),state={owner:(q.has('crossLanguage')||q.has('contextRetry')||q.has('modelFailure')||q.has('pendingTutor')||q.has('recordLifecycle')||q.has('tutorFormatRepair')||q.has('tutorRecovery')||q.has('tutorFormatting')||q.has('streamingTutor'))?'fixture-model':null,role:q.get('role')||'fixture',stage:'world',content:{},save:{seed:3,languageLearning:{}}};
const launcher=q.has('focusReturn')?document.createElement('button'):null;if(launcher){launcher.className='dictionary-launch';launcher.textContent='打开字典';document.body.prepend(launcher);launcher.focus();}
let finishAudio,tutorCalls=0;
const durableStore=createDictionaryStore();let lastDurable,failedCompletion=false;
let delayedWriting=false;
const delaySpelling=q.has('delayedSpellingFeedback');
const storage=(q.has('delayedWritingFeedback')||delaySpelling)?{async update(key,reduce){const value=await durableStore.update(key,reduce);if(!delayedWriting&&(delaySpelling?value.state.languages.en?.entries.hello?.errors:value.state.languages.zh?.entries.ri?.errors)){delayedWriting=true;document.querySelector('#qa').dataset[delaySpelling?'spellingSave':'writingSave']='pending';await new Promise(r=>setTimeout(r,1500));document.querySelector('#qa').dataset[delaySpelling?'spellingSave':'writingSave']='settled';}return value;}}:q.has('saveFailure')?{async update(key,reduce){
 if(lastDurable&&!failedCompletion){const state=structuredClone(lastDurable),result=reduce(state);if(result?.eligible){failedCompletion=true;return {state,result,persisted:false};}}
 const value=await durableStore.update(key,reduce);lastDurable=structuredClone(value.state);return value;
}}:durableStore;
const dictionary=createDictionary({storage,root:document.querySelector('#overlay'),getState:()=>state,now:()=>new Date(2026,9,16+Number(q.get('day')||0),12).getTime(),onClose:()=>{dictionary.close();document.querySelector('#qa').textContent='已返回冒险';if(launcher){document.querySelector('#overlay').classList.remove('visible');restoreVisibleFocus(launcher,document.querySelector('.dictionary-launch'));}},onRewards:()=>{},onLegacy:()=>{},onBuff:(buff)=>{state.save.dailyLanguageBuff=structuredClone(buff);document.querySelector('#qa').textContent='加成 '+buff.events.length;},voice:{start:async()=>{if(!q.has('recordLifecycle'))throw Error('fixture microphone unavailable');},finish:async()=> 'Hello, my friend.',judge:async(messages,signal,options)=>{if(q.has('tutorFormatRepair')){document.querySelector('#qa').dataset.tutorCalls=String(++tutorCalls);if(tutorCalls===1){options?.onReply?.('不完整的预览');return q.has('missingTranslation')?{entryId:'hello',reply:'见面问好。',example:'Hello, Tom.',translation:'',question:''}:'broken JSON';}await new Promise(r=>setTimeout(r,1500));return {entryId:'hello',reply:'整理好的讲解',example:'Hello!',translation:'你好！',question:''};}if(q.has('pendingTutor'))return new Promise((resolve,reject)=>signal.addEventListener('abort',()=>reject(Error('cancelled')),{once:true}));const request=JSON.parse(messages[1].content);if(q.has('crossLanguage')){document.querySelector('#qa').dataset.tutorCalls=String(++tutorCalls);return request.question.startsWith('不用英语')?{entryId:request.entryId,reply:'这里的月表示月份。',example:'一月是一年的第一个月。',translation:'',question:''}:{entryId:request.entryId,reply:'月份可以说month。',example:'one month',translation:'一个月',question:''};}if(q.has('streamingTutor')){options?.onReply?.('先用 Hello 问好');await new Promise(r=>setTimeout(r,1500));options?.onReply?.('先用 Hello 问好，再说名字。');return {entryId:request.entryId,reply:'先用 **Hello** 问好，再说名字。',example:'Hello, my friend.',translation:'你好，我的朋友。',question:''};}if(q.has('tutorFormatting'))return {entryId:request.entryId,reply:'先说 **Hello**，再接 `my friend`。\n文字 <img src=x onerror=alert(1)> 保持原样，未闭合 ** 和单个 * 也保留。',example:'Hello, my friend.',translation:'你好，我的朋友。',question:''};if(q.has('tutorRecovery')){if(++tutorCalls===1)throw Error('temporary tutor failure');return {entryId:request.entryId,reply:'可以说 Hello, friend.',example:'Hello, friend.',translation:'你好，朋友。',question:''};}if(request.answer!==undefined){if(q.has('contextRetry'))return {entryId:request.entryId,correct:request.answer==='Hello!',evidence:request.answer==='Hello!'?'Hello':'',feedback:request.answer==='Hello!'?'这是见面时的问候。':'试着用 hello 向新朋友问好。'};throw Error('fixture model timeout');}return {entryId:request.entryId,question:'请用 '+request.word+' 向朋友打招呼。'};},cancel:async()=>{finishAudio?.();finishAudio=null;},speak:async(text,locale,signal,character,options)=>{document.querySelector('#qa').dataset.playbackRate=String(options?.playbackRate??1);document.querySelector('#qa').dataset.spokenLocale=locale;if(q.has('audioPending'))return new Promise(resolve=>{finishAudio=resolve;if(q.has('audioPhase'))setTimeout(()=>options?.onPlaying?.(),1000);});throw Error('fixture offline');}}});
document.addEventListener('visibilitychange',()=>{if(document.hidden)dictionary.suspend();});
await dictionary.open(q.get('language')||'en',q.get('entry'));
if(q.get('focusReturn')==='repaint'&&launcher){const replacement=launcher.cloneNode(true);launcher.replaceWith(replacement);}
</script></body></html>

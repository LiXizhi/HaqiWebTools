<script>
// Haqi H5 protocol v1: independent pages remain usable without a parent.
(()=>{let context=null,written=false,finished=false,serial=0;const callbacks=new Map(),subCache=new Map(),uiCache=new Map(),pending=new Set(),uiNodes=new Map();
const isZh=loc=>!loc||/^zh\b/i.test(loc);
const send=data=>{if(context)parent.postMessage({channel:'haqi-hanzi',version:1,entryId:context.entryId,sessionId:context.sessionId,...data},context.origin);};
const refreshDom=()=>{for(const[el,zh]of uiNodes){if(!el?.isConnected){uiNodes.delete(el);continue;}const tr=!isZh(context?.locale)&&uiCache.get(zh);const next=(tr&&tr!==zh)?tr:zh;if(el.dataset.haqiKind==='seal'){const seal=el.querySelector('.seal');el.textContent=next;if(seal)el.prepend(seal);}else if(el.dataset.haqiKind==='tag'){const i1=document.createElement('i'),i2=document.createElement('i');el.replaceChildren(i1,document.createTextNode(next),i2);}else el.textContent=next;}document.querySelectorAll('[data-haqi-caption]').forEach(el=>renderCaption(el,el.dataset.haqiCaption));};
const flushPending=()=>{if(!context||!pending.size)return;const texts=[...pending];pending.clear();window.haqiHanziTranslate(texts);};
const ensureTexts=texts=>{const need=[];for(const t of texts){const s=typeof t==='string'?t.trim():'';if(s&&(!subCache.has(s)||!uiCache.has(s))&&!pending.has(s)){pending.add(s);need.push(s);}}if(need.length&&context)flushPending();};
const renderCaption=(el,zh)=>{if(!el)return;el.dataset.haqiCaption=zh||'';let sub=el.querySelector('.haqi-sub-trans');if(!zh||isZh(context?.subtitleLocale||context?.locale)){sub?.remove();return;}const tr=subCache.get(zh);if(!tr||tr===zh){sub?.remove();ensureTexts([zh]);return;}if(!sub){sub=document.createElement('span');sub.className='haqi-sub-trans';const host=el.querySelector('#capText')||el;if(host!==el&&host.parentNode===el)host.insertAdjacentElement('afterend',sub);else el.appendChild(sub);}sub.textContent=tr;};
const trackUi=(el,zh,kind='')=>{if(!el||!zh)return;if(kind)el.dataset.haqiKind=kind;uiNodes.set(el,zh);ensureTexts([zh]);};
const scanStatic=()=>{if(!document.body)return;document.querySelectorAll('#start,#replay,#mute,#pause,#demo,#action,#progress li,#note,.introBottom .mean,.introBottom .sub,.introBottom .meta').forEach(el=>{const zh=(el.textContent||'').trim();if(zh&&!uiNodes.has(el))trackUi(el,zh);});document.querySelectorAll('#brand,.brand').forEach(el=>{if(uiNodes.has(el))return;const clone=el.cloneNode(true);clone.querySelector?.('.seal')?.remove();const zh=(clone.textContent||'').trim();if(zh)trackUi(el,zh,'seal');});document.querySelectorAll('.introTop .tag,.tag').forEach(el=>{if(uiNodes.has(el))return;const zh=(el.textContent||'').trim();if(zh)trackUi(el,zh,'tag');});refreshDom();};
if(document.readyState==='loading')addEventListener('DOMContentLoaded',scanStatic,{once:true});else scanStatic();
window.haqiHanziWritten=()=>{written=true;send({type:'written'});};
window.haqiHanziComplete=()=>{if(!written){written=true;send({type:'written'});}finished=true;send({type:'completed'});};
window.haqiHanziPrefetch=texts=>ensureTexts(Array.isArray(texts)?texts:[texts]);
window.haqiHanziUi=(zh,el)=>{const s=typeof zh==='string'?zh.trim():'';if(!s)return zh;if(el)trackUi(el,s);else ensureTexts([s]);const tr=!isZh(context?.locale)&&uiCache.get(s);return(tr&&tr!==s)?tr:zh;};
window.haqiHanziCaption=(el,zh)=>{const s=typeof zh==='string'?zh.trim():'';if(s)ensureTexts([s]);renderCaption(el,s);};
window.haqiHanziTranslate=texts=>new Promise(resolve=>{const list=(Array.isArray(texts)?texts:[]).map(t=>typeof t==='string'?t.trim():'').filter(Boolean);if(!context||!list.length){resolve({});return;}const requestId=String(++serial);const timer=setTimeout(()=>{callbacks.delete(requestId);resolve({});},1500);callbacks.set(requestId,msg=>{clearTimeout(timer);const sub=msg?.translations||{},ui=msg?.uiTranslations||sub;for(const[k,v]of Object.entries(sub))if(typeof v==='string'&&v.trim())subCache.set(k,v.trim());for(const[k,v]of Object.entries(ui))if(typeof v==='string'&&v.trim())uiCache.set(k,v.trim());refreshDom();resolve(sub);});send({type:'translate',requestId,texts:list});});
addEventListener('message',event=>{const m=event.data;if(event.source!==parent||parent===window||m?.channel!=='haqi-hanzi'||m.version!==1)return;
if(m.type==='init'&&typeof m.sessionId==='string'&&typeof m.entryId==='string'){if(document.referrer&&event.origin!==new URL(document.referrer).origin)return;context={...m,origin:event.origin};scanStatic();flushPending();refreshDom();if(written)send({type:'written'});if(finished)send({type:'completed'});}
else if(context&&event.origin===context.origin&&m.sessionId===context.sessionId&&m.type==='translations'){callbacks.get(m.requestId)?.(m);callbacks.delete(m.requestId);}});
if(parent!==window)parent.postMessage({channel:'haqi-hanzi',version:1,type:'ready'},'*');})();
</script>

<script>
(() => {
'use strict';

const $ = s => document.querySelector(s);
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const mix = (a, b, t) => ({ x: lerp(a.x, b.x, t), y: lerp(a.y, b.y, t) });
const ease = {
  inOut: t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2,
  out: t => 1 - Math.pow(1 - t, 3),
  sine: t => -(Math.cos(Math.PI * t) - 1) / 2,
  lin: t => t,
};
function mulberry32(a) {
  return () => {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const QUERY = new URLSearchParams(location.search);
const FAST = QUERY.has('fast') ? 0.05 : 1;
const AUTO = QUERY.has('auto');
const M = reduceMotion ? 0.55 : 1;
let rand = mulberry32(20261024);

class Cancelled extends Error {}
let clock = 0, DT = 16, paused = false, visible = true;
let waiters = [];
let token = { dead: true };
function frame(tk) { return new Promise((res, rej) => waiters.push({ tk, res, rej })); }
async function wait(ms, tk) { ms *= FAST; const t0 = clock; while (clock - t0 < ms) await frame(tk); }
async function tween(ms, fn, tk, ez = ease.inOut) {
  ms *= FAST;
  if (ms <= 0) { fn(1); return; }
  const t0 = clock;
  for (;;) {
    await frame(tk);
    const t = clamp((clock - t0) / ms);
    fn(ez(t));
    if (t >= 1) return;

}
const bg = p => p.catch(e => { if (!(e instanceof Cancelled)) console.error(e); });

const NOTE = { C4: 261.63, E4: 329.63, G4: 392, A4: 440, C5: 523.25, E5: 659.25, G5: 784 };
const PENTA = [NOTE.C4, NOTE.E4, NOTE.G4, NOTE.A4, NOTE.C5, NOTE.E5];
const Sound = {
  ctx: null, master: null, muted: false,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try { this.ctx = new C(); } catch { return; }
    this.master = this.ctx.createGain();
    this.master.gain.value = this.muted ? 0 : 0.5;
    this.master.connect(this.ctx.destination);
    try {
      const len = this.ctx.sampleRate * 2;
      const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const data = buf.getChannelData(0);
      let rng = mulberry32(11);
      for (let i = 0; i < len; i++) data[i] = (rng() * 2 - 1) * 0.35;
      const src = this.ctx.createBufferSource(); src.buffer = buf; src.loop = true;
      const f = this.ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 280;
      const g = this.ctx.createGain(); g.gain.value = 0.01;

  },
  setMuted(v) { this.muted = v; if (this.master) this.master.gain.value = v ? 0 : 0.5; },

    try {
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();

      g.gain.setValueAtTime(0, this.ctx.currentTime);
      g.gain.linearRampToValueAtTime(gain, this.ctx.currentTime + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur);
      o.connect(g); g.connect(this.master); o.start(); o.stop(this.ctx.currentTime + dur + 0.02);
    } catch { /* Sound is optional. */ }
  },
  rustle() { this.tone(NOTE.A4, 0.12, 'triangle', 0.03); this.tone(NOTE.E5, 0.18, 'sine', 0.02); },
  catch() { this.tone(NOTE.C5, 0.22, 'sine', 0.05); this.tone(NOTE.G5, 0.42, 'triangle', 0.03); },
  pluck(freq, gain = 0.07) { this.tone(freq, 0.36, 'triangle', gain); },
  bell(freq) { this.tone(freq, 0.7, 'sine', 0.045); },
};

const cvs = $('#view'), ctx = cvs.getContext('2d');
let SW = 1, SH = 1, DPR = 1, portrait = false;
const cam = { x: 820, y: 600, w: 1500, h: 900, pw: 820, pcy: 0.34 };
const CV = { x: 0, y: 0, k: 1, cy: 0 };
const VIEW = {
  intro:  { x: 820, y: 600, w: 1480, h: 900, pw: 820, pcy: 0.34 },
  wait:   { x: 800, y: 590, w: 1280, h: 840, pw: 760, pcy: 0.34 },
  action: { x: 900, y: 530, w: 980, h: 700, pw: 640, pcy: 0.40 },
  catch:  { x: 880, y: 540, w: 980, h: 720, pw: 660, pcy: 0.36 },
  glyph:  { x: 880, y: 560, w: 1240, h: 1080, pw: 820, pcy: 0.36 },
  finale: { x: 700, y: 640, w: 1360, h: 900, pw: 780, pcy: 0.38 },
};
function frameW(v) { return portrait ? (v.pw ?? v.w * 0.62) : v.w; }
function updateView() {
  const usableH = SH * (portrait ? 0.60 : 0.76);
  CV.k = Math.min(SW / frameW(cam), usableH / cam.h);
  CV.cy = SH * cam.pcy;
  CV.x = cam.x; CV.y = cam.y;
}
function setCam(c) {
  const k = CV.k;

function densify(pts, step = 12) {
  const out = [[pts[0][0], pts[0][1]]];
  for (let i = 1; i < pts.length; i++) {
    const a = pts[i - 1], b = pts[i];
    const d = Math.hypot(b[0] - a[0], b[1] - a[1]);
    const n = Math.max(1, Math.ceil(d / step));

function paintStroke(c, i, q) {
  const path = new Path2D(SHOU.strokes[i]);

  c.save();
  c.clip(path);
  c.lineWidth = 170;
  c.lineCap = 'round';
  c.lineJoin = 'round';
  c.strokeStyle = c.fillStyle;
  const points = GUIDE[i];
  const count = (points.length - 1) * q;
  c.beginPath();
  c.moveTo(points[0][0], points[0][1]);
  for (let j = 1; j <= Math.floor(count); j++) c.lineTo(points[j][0], points[j][1]);
  const k = Math.floor(count);
  if (k < points.length - 1) {
    const a = points[k], b = points[k + 1], f = count - k;
    c.lineTo(a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f);
  }
  c.stroke();
  c.restore();
}

function drawTraceUI() {
  const T = W.trace;

  const pts = GUIDE[T.stroke];
  withGlyph(c => {
    c.globalAlpha = W.glyph.alpha;

    c.lineWidth = 10;
    c.setLineDash([26, 20]);
    c.lineCap = 'round';

    const a = pts[Math.max(0, pts.length - 4)], b = pts[pts.length - 1];

    c.fillStyle = '#c46a42';
    c.beginPath();

    c.lineTo(b[0] + Math.cos(ang + 2.5) * 20, b[1] + Math.sin(ang + 2.5) * 20);
    c.lineTo(b[0] + Math.cos(ang - 2.5) * 20, b[1] + Math.sin(ang - 2.5) * 20);
    c.fill();

    c.beginPath();

      c.fill();
    }
  });

function drawGlyph() {
  const g = W.glyph;
  if (g.alpha <= 0.001 && g.ghost <= 0.001) return;
  setCam(ctx);
  withGlyph(c => {
    if (g.ghost > 0.01) {
      for (let i = 0; i < STROKE_N; i++) {
        if (g.prog[i] >= 1) continue;
        const on = g.trace && W.trace && W.trace.stroke === i;
        c.globalAlpha = Math.max(g.alpha, 0.35) * g.ghost * (on ? 0.55 : 0.32);
        c.fillStyle = on ? '#f0c8b0' : '#e7c4b0';
        c.fill(new Path2D(SHOU.strokes[i]));
      }
    }
    c.globalAlpha = g.alpha;
    c.fillStyle = '#2c211c';
    for (let i = 0; i < STROKE_N; i++) if (g.prog[i] > 0) paintStroke(c, i, g.prog[i]);
  });
  if (g.trace) drawTraceUI();
  drawLabels();
  if (g.words > 0) drawWords();
}

function updateMotion() {
  W.sparks = W.sparks.filter(s => clock - s.t0 < 900);
  if (W.spinKick > 0) W.spinKick = Math.max(0, W.spinKick - DT / 500);
}

let last = null;
function loop(now) {
  if (last == null) last = now;
  const dt = Math.min(50, Math.max(0, now - last));
  last = now;
  if (!paused && visible) {
    DT = dt;
    clock += dt;
    updateMotion();
    const batch = waiters;
    waiters = [];
    for (const w of batch) {
      if (w.tk.dead) w.rej(new Cancelled());
      else w.res();
    }
  }
  render();
  requestAnimationFrame(loop);
}

  showCaption(title, text);
  const n = [...text].length;
  capMinEnd = clock + (Math.max(reduceMotion ? 900 : n * CHAR_MS + 900, n * 120) + 420 + hold) * FAST;
}
async function captionDone(tk) { while (clock < capMinEnd) await frame(tk); }
function hint(text) {
  if (text) {
    const s = span('', '');
    s.textContent = window.haqiHanziUi ? window.haqiHanziUi(text, s) : text;
    ui.hint.replaceChildren(s); ui.hint.classList.add('on');
  } else { ui.hint.classList.remove('on'); ui.hint.replaceChildren(); }
}
function progress(i) {
  ui.prog.forEach((li, j) => { li.classList.toggle('on', j === i); li.classList.toggle('done', j < i); });
}
function mode(m) {
  document.body.classList.remove('trace', 'reach');
  if (m) document.body.classList.add(m);
  S.mode = m;
}
let actionFn = null;
function setAction(label, fn) {
  actionFn = fn;
  if (label) { ui.action.textContent = window.haqiHanziUi ? window.haqiHanziUi(label, ui.action) : label; ui.action.hidden = false; }
  else ui.action.hidden = true;
}
function labelButton(el, zh) {
  el.textContent = window.haqiHanziUi ? window.haqiHanziUi(zh, el) : zh;
}
function stopStory() {
  token.dead = true;
  const pending = waiters;
  waiters = [];
  for (const w of pending) w.rej(new Cancelled());
}

const S = { handler: null, demo: null, mode: null, interactions: [], finish: null };
let activePointer = null;
cvs.addEventListener('pointerdown', e => {
  if (paused || !e.isPrimary || activePointer != null) return;
  const h = S.handler; if (!h || !h.down) return;
  activePointer = e.pointerId;
  try { cvs.setPointerCapture(e.pointerId); } catch { /* Pointer capture is optional. */ }
  e.preventDefault();
  h.down(toWorld(e.clientX, e.clientY), e);
});
cvs.addEventListener('pointermove', e => {
  if (paused || e.pointerId !== activePointer) return;
  const h = S.handler; if (!h || !h.move) return;
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
  for (const ev of evs.length ? evs : [e]) h.move(toWorld(ev.clientX, ev.clientY), ev);
});
function pointerEnd(e, cancel) {
  if (e.pointerId !== activePointer) return;
  activePointer = null;
  const h = S.handler;
  if (h && h.up) h.up(toWorld(e.clientX, e.clientY), cancel);
}
cvs.addEventListener('pointerup', e => pointerEnd(e, false));
cvs.addEventListener('pointercancel', e => pointerEnd(e, true));
cvs.addEventListener('lostpointercapture', e => pointerEnd(e, true));
cvs.addEventListener('keydown', e => {
  if (paused) return;
  if (e.code !== 'Space' && e.code !== 'Enter') return;
  if (e.repeat) return;
  e.preventDefault();
  if (S.mode === 'trace' && S.demo) S.demo();
  else if (actionFn) actionFn();
});
ui.action.addEventListener('click', () => { if (!paused && actionFn) actionFn(); });
ui.demo.addEventListener('click', () => { if (!paused && S.demo) S.demo(); });

function publish(scene) {
  window.__shou.scene = scene;
  window.__shou.interactions = S.interactions;
  window.__shou.state = W;
  window.__shou.finished = window.__shou.finished && scene === 'sFinale';
}

function writeSize() { return portrait ? 680 : 900; }

async function sIntro(tk) {
  publish('sIntro');
  progress(0);
  Object.assign(cam, VIEW.wait);
  bg(camTo(VIEW.wait, 900 * M, tk));
  await caption('初见', '一片叶子转着圈，快要落到水里。', tk);
  await captionDone(tk);
}

async function sReach(tk) {
  publish('sReach');
  progress(1);
  await camTo(VIEW.action, 900 * M, tk);
  W.guide = true;
  mode('reach');
  hint('点一点伸出去的手，或按下面的按钮。');
  let how = null;
  const t0 = clock;
  setAction('伸手接住它', () => { if (!how) how = 'user'; });
  S.handler = {
    down(p) {
      if (how) return;
      const palm = palmWorld();
      const leaf = leafWorld();
      if (near(p, palm.x, palm.y, 110) || near(p, leaf.x, leaf.y, 100) || near(p, W.child.x, W.child.y - 40, 130)) how = 'user';
      else hint('叶子快落到水里了，快伸手。');
    },
  };
  while (!how) {
    await frame(tk);
    if (AUTO) how = 'user';
    else if (clock - t0 > 12000) how = 'auto';
  }
  S.interactions.push(how);
  S.handler = null;
  setAction(null);
  hint(null);
  W.guide = false;
  progress(2);
  bg(caption('变化', '手掌轻轻打开，叶子稳稳落下来。', tk));
  bg(camTo(VIEW.catch, 1000 * M, tk));
  Sound.rustle();
  await tween(700 * M, t => { W.reach = ease.out(t); }, tk);
  await tween(520 * M, t => { W.open = lerp(0.12, 1, ease.out(t)); }, tk);
  Sound.catch();
  await tween(680 * M, t => { W.caught = ease.out(t); W.ripple = 1 - t * 0.65; }, tk);
  W.sparks.push({ x: palmWorld().x, y: palmWorld().y - 20, t0: clock });
  mode(null);
  await wait(420, tk);
  await captionDone(tk);
}

async function sGlyph(tk) {
  publish('sGlyph');
  progress(3);
  W.reach = 1;
  W.open = 1;
  W.caught = 1;
  W.anchor = palmWorld();
  const endSize = writeSize();
  centerGlyphOnAnchor(200, W.anchor);
  await caption('成字', '看着手掌和手指，慢慢认出“手”。', tk);
  W.morphAlpha = 1;
  W.morph = 0;
  W.glyph.ghost = 0;
  W.glyph.alpha = 0;
  W.glyph.prog = [0, 0, 0, 0];
  await tween(1500 * M, t => {
    const size = lerp(200, endSize, t);
    centerGlyphOnAnchor(size, W.anchor);
    W.morph = t;
    W.glyph.ghost = t;
    W.paper = t;
    W.veil = 0.52 * t;
    W.handAlpha = 1 - t;
    W.child.alpha = 1 - t * 0.85;
    W.friend.alpha = 1 - t;
    cam.x = GL.cx;
    cam.y = GL.cy - size * 0.04;
    cam.w = lerp(640, VIEW.glyph.w, t);
    cam.h = lerp(560, VIEW.glyph.h, t);
    cam.pw = lerp(520, VIEW.glyph.pw, t);
  }, tk);
  W.glyph.alpha = 1;
  await tween(360, t => { W.morphAlpha = 1 - t; }, tk);
  Sound.bell(NOTE.G4);
  for (let i = 0; i < STROKE_N; i++) {
    await tween(1000 * M, t => { W.glyph.prog[i] = t; }, tk, ease.sine);
    await caption('成字', STROKE_LINES[i], tk, 80);
    Sound.pluck(PENTA[i + 1], 0.05);
  }
  W.glyph.prog = [1, 1, 1, 1];
  bg(tween(500, t => { W.labels = t; }, tk));
  await caption('成字', '画面是联想，笔画是今天的规范字形。', tk);
  await captionDone(tk);
  Sound.bell(NOTE.C5);
}

async function sWrite(tk) {
  publish('sWrite');
  progress(4);
  W.labels = 0;
  W.child.alpha = 0;
  W.friend.alpha = 0;
  W.handAlpha = 0;
  await caption('写字', '顺着亮起的笔画，慢慢写下这个字。', tk);
  await tween(700, t => {
    for (let i = 0; i < STROKE_N; i++) W.glyph.prog[i] = 1 - t;
    W.glyph.ghost = t;
  }, tk);
  W.glyph.prog = [0, 0, 0, 0];
  W.glyph.trace = true;
  W.trace = { stroke: 0, pen: null };
  const showStroke = () => {
    capMinEnd = 0;
    const n = W.trace.stroke + 1;
    showCaption('写字', `第 ${n} 笔，共 ${STROKE_N} 笔。`);
    hint('从亮起的起点开始，慢慢跟着走。');
  };
  await captionDone(tk);
  showStroke();
  let samples = GUIDE[0], drag = null, lastInput = clock, demoing = false, completed = 0, invalidHint = 0;
  const prepare = () => { samples = GUIDE[W.trace.stroke]; };
  const finishStroke = () => {
    const i = W.trace.stroke;
    if (i >= STROKE_N) return;
    W.glyph.prog[i] = 1;
    Sound.pluck(PENTA[i % PENTA.length], 0.08);
    W.trace.stroke++;
    completed++;
    W.trace.pen = null;
    if (W.trace.stroke < STROKE_N) { prepare(); showStroke(); }
  };
  S.finish = finishStroke;
  const tol = () => 64;
  S.handler = {
    down(p) {
      if (demoing || W.trace.stroke >= STROKE_N) return;
      lastInput = clock;
      const q = worldToMmah(p.x, p.y);
      if (Math.hypot(q.x - samples[0][0], q.y - samples[0][1]) > tol() * 1.6) {
        if (clock - invalidHint > 500) { hint('从亮起的起点开始，慢慢跟着走。'); invalidHint = clock; }
        return;
      }
      drag = { idx: 0, bad: false };
    },
    move(p) {
      if (!drag) return;
      lastInput = clock;
      const q = worldToMmah(p.x, p.y);
      let best = drag.idx, bd = Infinity;
      for (let j = Math.max(0, drag.idx - 2); j < Math.min(samples.length, drag.idx + 18); j++) {
        const d = Math.hypot(q.x - samples[j][0], q.y - samples[j][1]);
        if (d < bd) { bd = d; best = j; }
      }
      if (bd > tol()) { drag.bad = true; return; }
      if (drag.bad) return;
      drag.idx = Math.max(drag.idx, best);
      W.glyph.prog[W.trace.stroke] = drag.idx / (samples.length - 1);
      W.trace.pen = samples[drag.idx];
    },
    up() {
      if (!drag) return;
      const d = drag; drag = null;
      if (!d.bad && d.idx >= samples.length - 4) { finishStroke(); return; }
      const i = W.trace.stroke, from = W.glyph.prog[i];
      bg(tween(240, t => { if (W.trace.stroke === i) W.glyph.prog[i] = from * (1 - t); }, tk));
      if (clock - invalidHint > 400) { hint('这一笔还没到终点，再试一次。'); invalidHint = clock; }
    },
  };
  const demo = async () => {
    if (demoing || W.trace.stroke >= STROKE_N) return;
    demoing = true; ui.demo.disabled = true; drag = null;
    hint('看光点走过每一笔');
    while (W.trace.stroke < STROKE_N) {
      const i = W.trace.stroke;
      const pts = GUIDE[i];
      W.glyph.prog[i] = 0;
      await tween(860 * M, t => {
        W.glyph.prog[i] = t;
        W.trace.pen = pts[Math.round(t * (pts.length - 1))];
      }, tk, ease.sine);
      W.trace.pen = null;
      finishStroke();
      await wait(140, tk);
    }
  };
  S.demo = () => { S.interactions.push('demo'); bg(demo()); };
  mode('trace');
  ui.demo.hidden = false;
  if (AUTO) { S.interactions.push('auto'); bg(demo()); }
  let nudged = false;
  while (W.trace.stroke < STROKE_N) {
    await frame(tk);
    if (!demoing && !nudged && clock - lastInput > 14000) { hint('写不出来也没关系，点下面的示范。'); nudged = true; }
    if (!demoing && completed === 0 && clock - lastInput > 26000) { S.interactions.push('auto'); bg(demo()); }
  }
  S.handler = null; S.demo = null; S.finish = null; mode(null); hint(null);
  ui.demo.hidden = true; ui.demo.disabled = false;
  W.glyph.trace = false;
  if (!S.interactions.includes('demo') && !S.interactions.includes('auto')) S.interactions.push('user');
  window.__shou.events.push('written');
  window.haqiHanziWritten?.();
  await tween(500, t => { W.glyph.ghost = 1 - t; }, tk);
  Sound.bell(NOTE.C5); Sound.bell(NOTE.G4);
  await caption('写字', '写好了。手掌接住了叶子，笔画也留在纸上。', tk);
  await captionDone(tk);
}

async function sWords(tk) {
  publish('sWords');
  progress(5);
  const g0 = { cx: GL.cx, cy: GL.cy, size: GL.size };
  await tween(800 * M, t => { centerGlyphOnAnchor(lerp(g0.size, g0.size * 0.82, t), W.anchor); }, tk);
  for (let i = 0; i < WORDS.length; i++) {
    W.wordOn = i;
    Sound.pluck(PENTA[i + 2], 0.06);
    bg(tween(500, t => { W.glyph.words = Math.max(W.glyph.words, i + t); }, tk, ease.out));
    await caption(WORDS[i][0], WORDS[i][1], tk);
  }
  await captionDone(tk);
  W.wordOn = -1;
}

async function sFinale(tk) {
  publish('sFinale');
  progress(5);
  W.child.alpha = 1;
  W.friend.alpha = 1;
  W.handAlpha = 1;
  W.child.x = CHILD_HOME.x;
  W.child.y = CHILD_HOME.y;
  W.friend.x = FRIEND_HOME.x;
  W.friend.y = FRIEND_HOME.y;
  W.reach = 1;
  W.open = 1;
  W.caught = 1;
  W.friend.face = 1;
  bg(camTo(VIEW.finale, 1400 * M, tk));
  await tween(1100 * M, t => {
    W.glyph.alpha = 1 - t;
    W.paper = 1 - t;
    W.veil = 0.52 * (1 - t);
    W.glyph.words = 1 - t;
    W.labels = 1 - t;
    W.friend.x = lerp(FRIEND_HOME.x, CHILD_HOME.x - 210, t);
    W.hold = t;
    W.reach = lerp(1, 0.35, t);
  }, tk);
  W.glyph.alpha = 0; W.paper = 0; W.veil = 0; W.glyph.words = 0; W.labels = 0;
  W.finale = true;
  W.friend.face = 1;
  W.child.face = 1;
  Sound.bell(NOTE.E4);
  await caption('余韵', '手可以接住叶子，也可以牵住朋友。', tk);
  await caption('余韵', '故事完成，可以重播。', tk, 200);
  await captionDone(tk);
  hint('点一点水面，看叶子再转一圈');
  mode('reach');
  setAction('再看一次', () => { Sound.init(); begin(); });
  S.handler = {
    down(p) {
      W.sparks.push({ x: p.x, y: p.y, t0: clock });
      W.spinKick = 4;
      W.ripple = 1;
      Sound.rustle();
      hint(null);
    },
  };
  window.__shou.finished = true;
  window.__shou.events.push('completed');
  window.haqiHanziComplete();
  for (;;) await frame(tk);
}

const SCENES = [sIntro, sReach, sGlyph, sWrite, sWords, sFinale];

function syncTransport() {
  paused = false;
  ui.pause.setAttribute('aria-pressed', 'false');
  labelButton(ui.pause, '暂停');
}
async function begin() {
  stopStory();
  const tk = token = { dead: false };
  capMinEnd = 0;
  resetWorld();
  Object.assign(cam, VIEW.wait);
  S.handler = null; S.demo = null; S.finish = null; mode(null); setAction(null); hint(null);
  ui.demo.hidden = true; ui.demo.disabled = false;
  ui.cap.classList.remove('on');
  syncTransport();
  rand = mulberry32(20261024);
  S.interactions = [];
  window.__shou.events = [];
  window.__shou.finished = false;
  publish('sIntro');
  try {
    for (const sc of SCENES) await sc(tk);
  } catch (e) {
    if (!(e instanceof Cancelled)) console.error(e);
  }
}

async function introPlay(tk) {
  Object.assign(cam, VIEW.intro);
  W.reach = 0;
  W.open = 0.16;
  W.caught = 0;
  for (;;) {
    await frame(tk);
    const u = reduceMotion ? 0.2 : (Math.sin(clock / 900) + 1) / 2;
    W.open = 0.1 + u * 0.12;
  }
}

function showWriteBase() {
  const size = writeSize();
  W.anchor = { x: 880, y: 540 };
  centerGlyphOnAnchor(size, W.anchor);
  Object.assign(cam, VIEW.glyph);
  cam.x = GL.cx; cam.y = GL.cy;
  W.child.alpha = 0;
  W.friend.alpha = 0;
  W.handAlpha = 0;
  W.veil = 0.55;
  W.paper = 1;
  W.glyph.alpha = 1;
  W.reach = 1;
  W.open = 1;
  W.caught = 1;
  progress(4);
}

function pose(name) {
  stopStory();
  resetWorld();
  capMinEnd = 0;
  S.handler = null; S.demo = null; mode(null); setAction(null); hint(null);
  ui.demo.hidden = true;
  ui.cap.classList.remove('on');
  document.body.classList.add('started');
  $('#intro').classList.add('off');
  const size = writeSize();
  if (name === 'intro') {
    document.body.classList.remove('started');
    $('#intro').classList.remove('off');
    Object.assign(cam, VIEW.intro);
    W.reach = 0;
    W.open = 0.18;
    publish('intro');
  } else if (name === 'action') {
    Object.assign(cam, VIEW.action);
    W.reach = 0.46;
    W.open = 0.2;
    W.guide = true;
    progress(1);
    showCaption('初见', '一片叶子转着圈，快要落到水里。');
    setAction('伸手接住它', () => {});
    hint('点一点伸出去的手，或按下面的按钮。');
    mode('reach');
    publish('action');
  } else if (name === 'catch') {
    Object.assign(cam, VIEW.catch);
    W.reach = 1;
    W.open = 1;
    W.caught = 1;
    W.ripple = 0.25;
    progress(2);
    showCaption('变化', '手掌轻轻打开，叶子稳稳落下来。');
    publish('catch');
  } else if (name === 'morph') {
    W.reach = 1; W.open = 1; W.caught = 1;
    W.anchor = palmWorld();
    centerGlyphOnAnchor(size * 0.72, W.anchor);
    Object.assign(cam, VIEW.glyph);
    cam.x = GL.cx; cam.y = GL.cy;
    W.morph = 0.45;
    W.morphAlpha = 1;
    W.glyph.ghost = 0.45;
    W.glyph.alpha = 0;
    W.glyph.prog = [0, 0, 0, 0];
    W.paper = 0.45;
    W.veil = 0.24;
    W.handAlpha = 0;
    progress(3);
    showCaption('成字', '看着手掌和手指，慢慢认出“手”。');
    publish('morph');
  } else if (name === 'form') {
    W.reach = 1; W.open = 1; W.caught = 1;
    W.anchor = { x: 880, y: 520 };
    centerGlyphOnAnchor(size, W.anchor);
    Object.assign(cam, VIEW.glyph);
    cam.x = GL.cx; cam.y = GL.cy;
    W.child.alpha = 0;
    W.friend.alpha = 0;
    W.handAlpha = 0;
    W.morph = 1;
    W.morphAlpha = 0;
    W.veil = 0.5;
    W.paper = 1;
    W.labels = 1;
    W.glyph.alpha = 1;
    W.glyph.ghost = 0;
    W.glyph.prog = [1, 1, 1, 1];
    progress(3);
    showCaption('成字', '看着手掌和手指，慢慢认出“手”。');
    publish('form');
  } else if (name === 'ghost' || name === 'stroke1' || name === 'stroke2' || name === 'stroke3' || name === 'stroke4' || name === 'done') {
    showWriteBase();
    const prog = [0, 0, 0, 0];
    if (name === 'ghost') {
      W.glyph.ghost = 1; W.glyph.prog = prog; W.glyph.trace = true;
      W.trace = { stroke: 0, pen: null };
      showCaption('写字', '第 1 笔，共 4 笔。');
      hint('从亮起的起点开始，慢慢跟着走。');
      mode('trace');
      ui.demo.hidden = false;
    } else if (name === 'stroke1' || name === 'stroke2' || name === 'stroke3') {
      const n = Number(name.slice(-1));
      for (let i = 0; i < n; i++) prog[i] = 1;
      W.glyph.ghost = 1; W.glyph.prog = prog; W.glyph.trace = true;
      W.trace = { stroke: n, pen: null };
      showCaption('写字', `第 ${n + 1} 笔，共 4 笔。`);
      hint('从亮起的起点开始，慢慢跟着走。');
      mode('trace');
      ui.demo.hidden = false;
    } else if (name === 'stroke4') {
      W.glyph.ghost = 0.12; W.glyph.prog = [1, 1, 1, 1]; W.glyph.trace = false;
      showCaption('写字', '第 4 笔，共 4 笔。');
    } else {
      W.glyph.ghost = 0; W.glyph.prog = [1, 1, 1, 1]; W.glyph.trace = false;
      showCaption('写字', '写好了。手掌接住了叶子，笔画也留在纸上。');
    }
    publish(name);
  } else if (name === 'finale') {
    W.child.alpha = 1;
    W.friend.alpha = 1;
    W.handAlpha = 1;
    W.friend.x = CHILD_HOME.x - 210;
    W.reach = 0.35;
    W.open = 1;
    W.caught = 1;
    W.hold = 1;
    W.finale = true;
    Object.assign(cam, VIEW.finale);
    progress(5);
    showCaption('余韵', '手可以接住叶子，也可以牵住朋友。');
    publish('finale');
  }
  render();
}

resetWorld();
window.__shou = {
  interactions: [], scene: 'intro', finished: false, events: [],
  state: W, pose, medians: SHOU.medians, strokes: SHOU.strokes,
  toScreen, mmahToWorld, palmWorld, leafWorld,
  completeCurrentStroke() { S.finish?.(); },
};
resize();
const poseName = QUERY.get('pose');
if (poseName) pose(poseName);
else {
  Object.assign(cam, VIEW.intro);
  render();
  bg(introPlay(token = { dead: false }));
}
document.documentElement.dataset.fixtureReady = '1';
addEventListener('resize', () => { resize(); render(); });
requestAnimationFrame(loop);

$('#start').addEventListener('click', () => {
  Sound.init();
  token.dead = true;
  $('#intro').classList.add('off');
  document.body.classList.add('started');
  begin();
});
$('#replay').addEventListener('click', () => { Sound.init(); begin(); });
$('#mute').addEventListener('click', () => {
  Sound.init();
  Sound.setMuted(!Sound.muted);
  ui.mute.setAttribute('aria-pressed', String(Sound.muted));
  labelButton(ui.mute, Sound.muted ? '开启声音' : '静音');
});
$('#pause').addEventListener('click', () => {
  paused = !paused;
  ui.pause.setAttribute('aria-pressed', String(paused));
  labelButton(ui.pause, paused ? '继续' : '暂停');
  if (Sound.ctx) void (paused ? Sound.ctx.suspend() : Sound.ctx.resume()).catch(() => {});
});
document.addEventListener('visibilitychange', () => { visible = !document.hidden; last = null; });
addEventListener('pagehide', () => { token.dead = true; void Sound.ctx?.close().catch(() => {}); }, { once: true });
if (AUTO && !poseName) $('#start').click();
})();

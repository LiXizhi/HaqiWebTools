<main><h1>魔法星 · VIP 1～16级</h1><p>魔法星会绕行、轻快换位，落后时加速追上主人。点击画布让主角走过去，或开启自动跑动；下方可选等级。</p><div class="preview"><canvas id="preview" width="360" height="250"></canvas></div><button id="pause">暂停摇摆</button><p id="status">正在加载图集…</p><div id="levels"></div><p><a href="../../assets/adventure/effects/magic-star-vip-levels-16.webp" download>下载4×4透明WebP图集</a></p></main>
<script type="module">
const url='../../assets/adventure/effects/magic-star-vip-levels-16.webp',image=new Image();image.src=url;await image.decode();
const bytes=(await (await fetch(url)).arrayBuffer()).byteLength;
let selected=1,paused=false,time=0,last=0;const reduce=matchMedia('(prefers-reduced-motion: reduce)');

const pause=document.getElementById('pause');pause.onclick=()=>{paused=!paused;pause.textContent=paused?'继续摇摆':'暂停摇摆';};
import {createStarFollower} from '/js/adventure_star_motion_core.js';
import {drawMagicStar} from '/js/adventure_star.js';
import {loadResources} from '/js/adventure_assets.js';

let automatic=false;
const canvas=document.getElementById('preview'),run=document.createElement('button');run.textContent='主角跑动';run.onclick=()=>{automatic=!automatic;run.textContent=automatic?'主角停下':'主角跑动';target.x=owner.x;target.y=owner.y;};document.getElementById('pause').after(run);
canvas.style.touchAction='none';canvas.onclick=e=>{automatic=false;run.textContent='主角跑动';const r=canvas.getBoundingClientRect();target.x=Math.max(65,Math.min(295,(e.clientX-r.left)*360/r.width));target.y=Math.max(125,Math.min(210,(e.clientY-r.top)*250/r.height));};

if(!paused){time+=dt*1000;if(automatic){target.x=180+Math.sin(time/900)*112;target.y=177+Math.sin(time/1400)*22;}const dx=target.x-owner.x,dy=target.y-owner.y,d=Math.hypot(dx,dy),step=Math.min(d,230*dt);if(d){owner.x+=dx/d*step;owner.y+=dy/d*step;}follower.step({x:owner.x,y:owner.y-66},time,{reducedMotion:reduce.matches});}
c.clearRect(0,0,360,250);if(!follower.state.front)drawMagicStar(c,follower.state,assets,selected);assets.tile(c,'sprites',8,owner.x-34,owner.y-78,68,78);if(follower.state.front)drawMagicStar(c,follower.state,assets,selected);c.fillStyle='#e3f5ff';c.textAlign='center';c.font='14px sans-serif';c.fillText(`VIP ${selected}`,180,239);requestAnimationFrame(frame);}
document.getElementById('status').textContent=`${image.width}×${image.height} · ${bytes.toLocaleString()} 字节（小于32KB）· 16个静态等级外观`;
requestAnimationFrame(frame);
</script></html>
